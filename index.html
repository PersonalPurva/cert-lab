Map to a framework","scenario":"Pick three CIS Controls (or NIST CSF functions) and give one action your org would take for each.","hints":[],"steps":["# e.g. NIST CSF: Identify -> asset inventory","#                Protect -> MFA + patching","#                Detect  -> central logging/SIEM"],"verify":["each function has a concrete action"]}]},{"day":25,"course":"5 Program","title":"Risk management","objective":"Apply risk-management concepts and calculations.","questions":[{"type":"mcq","q":"What is \"risk\" in security terms?","options":["The likelihood of a threat exploiting a vulnerability and the resulting impact","Any change to a system","A type of malware","A firewall rule"],"answer":0,"explain":"Risk = likelihood x impact, roughly."},{"type":"mcq","q":"The four risk-response strategies are:","options":["Accept, Avoid, Transfer, Mitigate","Ignore, Delete, Encrypt, Backup","Detect, Deter, Delay, Deny","Buy, Sell, Hold, Trade"],"answer":0,"explain":"Transfer often means buying insurance; mitigate means adding controls."},{"type":"mcq","q":"Buying cyber-insurance is an example of risk:","options":["Transference","Avoidance","Acceptance","Mitigation"],"answer":0,"explain":"You shift the financial impact to a third party."},{"type":"mcq","q":"\"Residual risk\" is:","options":["The risk that remains after controls are applied","The risk before any controls","Risk that was transferred","Zero always"],"answer":0,"explain":"You cannot usually reach zero; leadership accepts the residual."},{"type":"mcq","q":"SLE x ARO equals:","options":["ALE (Annualized Loss Expectancy)","Residual risk","RPO","The asset value"],"answer":0,"explain":"Single Loss Expectancy x Annual Rate of Occurrence = expected yearly loss."},{"type":"mcq","q":"If an asset is worth $10,000 and an incident destroys 50% of it, the SLE is:","options":["$5,000","$10,000","$2,500","$500"],"answer":0,"explain":"SLE = Asset Value x Exposure Factor = 10,000 x 0.5."},{"type":"mcq","q":"A \"risk register\" is:","options":["A living document listing risks, owners, and treatment status","A firewall log","A backup index","A password vault"],"answer":0,"explain":"It tracks each risk from identification to closure."},{"type":"mcq","q":"Qualitative risk analysis uses:","options":["Ratings like high/medium/low rather than exact numbers","Only dollar figures","Packet captures","Hash values"],"answer":0,"explain":"Quantitative analysis uses numbers (SLE/ALE); qualitative uses judgment scales."}],"labs":[{"title":"Calculate ALE","scenario":"A server worth $20,000 faces a flood that would destroy 25% of it, expected once every 4 years. Compute SLE, ARO, and ALE.","hints":[],"steps":["# SLE = 20000 x 0.25 = $5,000","# ARO = 1/4 = 0.25 per year","# ALE = SLE x ARO = 5000 x 0.25 = $1,250 per year"],"verify":["a control costing < $1,250/yr that removes this risk is justified"]},{"title":"Build a mini risk register","scenario":"Add three risks for a web app, each with likelihood, impact, response strategy, and owner.","hints":[],"steps":["# SQLi -> High/High -> Mitigate (WAF+prepared stmts) -> Dev lead","# DDoS -> Med/High -> Transfer/Mitigate (CDN scrubbing) -> Ops","# lost laptop -> Med/Med -> Mitigate (FDE+MDM) -> IT"],"verify":["each row is complete and actionable"]}]},{"day":26,"course":"5 Program","title":"Third-party and vendor risk","objective":"Manage supply-chain and third-party risk.","questions":[{"type":"mcq","q":"Why assess third-party vendors' security?","options":["Their weaknesses can become your breach (supply-chain risk)","To lower their prices","It is only about quality","Vendors are always safe"],"answer":0,"explain":"A vendor with access to your data extends your attack surface."},{"type":"mcq","q":"An SLA (Service Level Agreement) defines:","options":["The measurable service levels a vendor must meet (e.g., uptime)","The encryption algorithm","The vendor's staff names","A firewall rule"],"answer":0,"explain":"Include security requirements and penalties in the SLA."},{"type":"mcq","q":"An MOU/MOA is:","options":["A (often non-binding) agreement outlining intentions between parties","A malware type","A network protocol","A backup standard"],"answer":0,"explain":"It sets expectations before a formal contract."},{"type":"mcq","q":"A BPA (Business Partners Agreement) governs:","options":["The relationship and responsibilities between business partners","Only pricing","Only encryption","Physical security"],"answer":0,"explain":"It clarifies liability, data handling, and responsibilities."},{"type":"mcq","q":"\"Right to audit\" clauses let you:","options":["Verify a vendor's security controls yourself or via a third party","Delete the vendor's data","Change their prices","Access their staff records"],"answer":0,"explain":"Without it, you rely only on the vendor's word."},{"type":"mcq","q":"A SOC 2 report tells you:","options":["How well a vendor's controls meet security/availability criteria","The vendor's revenue","The vendor's IP addresses","Your own risk score"],"answer":0,"explain":"It is independent assurance about a service provider's controls."},{"type":"mcq","q":"\"Vendor lock-in\" is a risk because:","options":["It makes leaving a provider costly/difficult, reducing your options","It improves security","It lowers cost always","It is a malware type"],"answer":0,"explain":"Consider exit strategy and data portability up front."},{"type":"mcq","q":"End-of-life (EOL) hardware/software from a vendor means:","options":["No more security updates, so risk rises over time","Faster performance","Free support","Better security"],"answer":0,"explain":"Plan replacement before EOL; isolate if you cannot."}],"labs":[{"title":"Vendor security questionnaire","scenario":"Write five questions you would ask a SaaS vendor before storing customer data with them.","hints":[],"steps":["# Where is data stored, and is it encrypted at rest/in transit?","# Do you have SOC 2 / ISO 27001? Can we see it?","# How do you handle breach notification and in what timeframe?","# What is your access control and MFA posture for staff?","# What is our data export/deletion process on exit?"],"verify":["the answers would materially change your decision"]},{"title":"Assess supply-chain risk","scenario":"For a software dependency your app pulls from the internet, list three controls to reduce supply-chain risk.","hints":[],"steps":["# pin exact versions + verify checksums/signatures","# use a private/proxy registry and scan dependencies for CVEs","# review before upgrading; monitor for compromised packages"],"verify":["a poisoned update would be caught before deployment"]}]},{"day":27,"course":"5 Program","title":"Audits, assessments and testing","objective":"Compare security assessments, audits and testing types.","questions":[{"type":"mcq","q":"A vulnerability scan differs from a penetration test because it:","options":["Identifies weaknesses but does not exploit them","Actively exploits and pivots","Is always manual","Requires physical access"],"answer":0,"explain":"A pen test goes further and proves impact by exploiting."},{"type":"mcq","q":"\"Black box\" penetration testing means the tester:","options":["Has no prior internal knowledge of the target","Has full source and credentials","Only tests physically","Works for the attacker"],"answer":0,"explain":"White box = full knowledge; gray box = partial."},{"type":"mcq","q":"The \"rules of engagement\" in a pen test define:","options":["Scope, timing, allowed techniques, and contacts — the authorized boundaries","The attacker's tools only","The firewall config","The backup plan"],"answer":0,"explain":"Testing outside the authorized scope can be illegal."},{"type":"mcq","q":"An internal audit's main purpose is to:","options":["Independently verify that controls exist and work as intended","Attack production","Sell products","Replace the SOC"],"answer":0,"explain":"Audits check compliance with policy/standards."},{"type":"mcq","q":"\"Attestation\" in an audit is:","options":["A formal statement that controls were reviewed and meet criteria","A password","A scan result","A backup"],"answer":0,"explain":"Often provided to customers as assurance."},{"type":"mcq","q":"A \"red team\" exercise:","options":["Simulates a real adversary to test detection and response, not just find bugs","Fixes vulnerabilities","Writes policy","Runs backups"],"answer":0,"explain":"The \"blue team\" defends; \"purple\" is the two collaborating."},{"type":"mcq","q":"Why do a \"bug bounty\" program?","options":["To pay external researchers to responsibly report vulnerabilities","To attack competitors","To avoid patching","To sell data"],"answer":0,"explain":"It widens your testing pool under defined rules."},{"type":"mcq","q":"A compliance scan checks systems against:","options":["A required standard/benchmark (e.g., PCI DSS, CIS)","Random settings","The attacker's wishlist","Nothing"],"answer":0,"explain":"It reports gaps you must remediate for compliance."},{"type":"cmd","q":"Run an authorized vulnerability-style scan of your lab host with nmap scripts.","accept":["nmap -sV --script vuln localhost"],"explain":"Authorized targets only; interpret results and prioritize by severity + exposure."}],"labs":[{"title":"Plan a penetration test","scenario":"Draft the rules of engagement for testing a single web app: scope, window, allowed/forbidden actions, and emergency contact.","hints":[],"steps":["# scope: app.example.com only, no DoS, no social engineering","# window: Sat 00:00-06:00; test account provided","# forbidden: data destruction, pivoting to other systems","# contact: on-call number to stop the test immediately"],"verify":["the ROE keeps the test legal and safe"]},{"title":"Compare assessment types","scenario":"In one line each, distinguish vulnerability scan, penetration test, audit, and red-team exercise.","hints":[],"steps":["# vuln scan: automated find weaknesses (no exploit)","# pen test: exploit to prove impact within scope","# audit: verify controls vs standard/policy","# red team: adversary simulation to test detection/response"],"verify":["you can pick the right one for a given goal"]}]},{"day":28,"course":"4 Operations","title":"Automation, orchestration and secure ops","objective":"Apply automation to security operations securely.","questions":[{"type":"mcq","q":"A key benefit of automation in security operations is:","options":["Consistent, fast, repeatable responses that reduce human error","Removing all humans","Making systems slower","Avoiding documentation"],"answer":0,"explain":"Playbooks in SOAR auto-triage and contain common incidents."},{"type":"mcq","q":"A risk of over-automation is:","options":["A flawed script can cause damage at scale, quickly","Nothing; automation is always safe","Slower response","More manual work"],"answer":0,"explain":"Guardrails, approvals, and testing keep automation safe."},{"type":"mcq","q":"Storing secrets (API keys, passwords) in code is bad because:","options":["Anyone with the code gets the secret; use a secrets manager instead","It runs faster","It is required","It encrypts them"],"answer":0,"explain":"Use a vault and inject secrets at runtime."},{"type":"mcq","q":"\"Idempotent\" automation means:","options":["Running it repeatedly yields the same safe end state","It runs only once ever","It changes something each run","It cannot fail"],"answer":0,"explain":"Configuration tools like Ansible aim for idempotency."},{"type":"mcq","q":"CI/CD security (\"shift left\") means:","options":["Adding security testing early in the development pipeline","Testing only after release","Skipping tests","Moving servers left"],"answer":0,"explain":"Catch flaws before production with SAST/DAST and dependency scans."},{"type":"mcq","q":"A \"least-privilege\" service account for automation should:","options":["Have only the permissions the task needs, and be monitored","Be a domain admin","Have no logging","Be shared by everyone"],"answer":0,"explain":"Over-privileged automation accounts are prime targets."},{"type":"mcq","q":"Why sign your scripts/artifacts in a pipeline?","options":["To ensure integrity and that only trusted code runs (supply-chain defense)","To make them run faster","To hide the code","To skip testing"],"answer":0,"explain":"Signature verification stops tampered artifacts from deploying."},{"type":"cmd","q":"Store a secret in an environment variable for a script instead of hard-coding it (lab).","accept":["export API_KEY=\"$(cat ~/.secrets/api_key)\""],"explain":"Better: use a real secrets manager; never commit secrets to Git."}],"labs":[{"title":"Automate a safe check","scenario":"Write a short script that checks disk usage and alerts (logs) if over 80%, and make it idempotent.","hints":[],"steps":["printf '#!/bin/bash\\nu=$(df --output=pcent / | tail -1 | tr -dc 0-9)\\n[ \"$u\" -gt 80 ] && logger \"DISK WARN ${u}%%\"\\n' > /usr/local/bin/diskwatch","chmod 755 /usr/local/bin/diskwatch","/usr/local/bin/diskwatch; journalctl -n 3 | grep -i \"DISK WARN\" || echo \"under 80%\""],"verify":["running it twice does not cause harm"]},{"title":"Find hard-coded secrets","scenario":"Scan a code directory for likely secrets before committing.","hints":[],"steps":["grep -rEn '(password|api[_-]?key|secret|token)\\s*=\\s*[\"'\"'\"'][^\"'\"'\"']+' ./src 2>/dev/null | head"],"verify":["you can spot secrets that should move to a vault"]}]},{"day":29,"course":"4 Operations","title":"Endpoint and email security","objective":"Protect endpoints and email against modern threats.","questions":[{"type":"mcq","q":"EDR (Endpoint Detection and Response) provides:","options":["Continuous monitoring, detection, and response on endpoints","Only signature antivirus","Disk encryption only","A firewall"],"answer":0,"explain":"EDR sees behavior and enables remote investigation/containment."},{"type":"mcq","q":"How does EDR differ from traditional antivirus?","options":["It focuses on behavior/telemetry and response, not just known-signature files","It only scans on demand","It cannot quarantine","It has no logging"],"answer":0,"explain":"AV catches known malware; EDR catches suspicious behavior and enables hunting."},{"type":"mcq","q":"SPF, DKIM and DMARC together help:","options":["Verify email sender authenticity and reduce spoofing/phishing","Encrypt attachments","Speed up email","Back up mailboxes"],"answer":0,"explain":"SPF authorizes senders, DKIM signs messages, DMARC sets policy + reporting."},{"type":"mcq","q":"Application allow-listing on endpoints:","options":["Blocks unknown executables from running","Allows any download","Encrypts the disk","Is the same as antivirus"],"answer":0,"explain":"Strong against unknown malware, but needs upkeep."},{"type":"mcq","q":"\"Sandboxing\" a suspicious attachment means:","options":["Detonating it in an isolated environment to observe behavior safely","Deleting it","Encrypting it","Emailing it back"],"answer":0,"explain":"Email gateways and EDR use sandboxes to catch unknown malware."},{"type":"mcq","q":"A key control against ransomware on endpoints is:","options":["EDR + least privilege + tested offline backups + patching","Only antivirus","Disabling the firewall","Sharing admin rights"],"answer":0,"explain":"Layered defenses reduce both the chance and the impact."},{"type":"mcq","q":"\"Host-based intrusion prevention\" (HIPS) does what?","options":["Blocks malicious behavior on the endpoint itself","Filters the whole network","Encrypts email","Manages patches"],"answer":0,"explain":"Complements EDR and host firewall."},{"type":"mcq","q":"Email attachment \"content disarm and reconstruction\" (CDR):","options":["Strips active content and rebuilds a safe version of the file","Encrypts the email","Blocks all attachments","Signs the message"],"answer":0,"explain":"It removes macros/scripts while keeping the document usable."},{"type":"cmd","q":"On Linux, check a downloaded file's type before opening it, to avoid disguised executables.","accept":["file downloaded_invoice.pdf"],"explain":"If \"PDF\" is actually an executable or script, do not run it."}],"labs":[{"title":"Configure email authentication (concept)","scenario":"Write the DNS records (conceptually) for SPF, DKIM and DMARC for example.com and say what each does.","hints":[],"steps":["# SPF (TXT): v=spf1 include:_spf.provider.com -all   (authorize senders)","# DKIM (TXT): selector._domainkey ... p=<public key>  (sign messages)","# DMARC (TXT): v=DMARC1; p=quarantine; rua=mailto:dmarc@example.com  (policy+reports)"],"verify":["you can explain how the three work together"]},{"title":"Endpoint hardening quick win","scenario":"On a Linux endpoint, ensure automatic security updates are considered and the firewall is on, and verify.","hints":[],"steps":["systemctl is-active firewalld || echo \"enable firewall\"","dnf install -y dnf-automatic 2>/dev/null; systemctl enable --now dnf-automatic.timer 2>/dev/null || true"],"verify":["firewall is active and update automation is considered"]}]},{"day":30,"course":"Exam","title":"Security+ exam-day strategy","objective":"Approach the SY0-701 exam and its performance-based questions.","questions":[{"type":"mcq","q":"How many questions and how long is the SY0-701 exam (approx)?","options":["Up to 90 questions in 90 minutes","200 questions in 4 hours","50 questions in 30 minutes","Unlimited time"],"answer":0,"explain":"It mixes multiple-choice and performance-based questions (PBQs)."},{"type":"mcq","q":"What is the SY0-701 passing score?","options":["750 on a scale of 100-900","210 out of 300","70 percent flat","800 out of 1000"],"answer":0,"explain":"It is scaled, so it is not a simple percentage."},{"type":"mcq","q":"Performance-based questions (PBQs) usually ask you to:","options":["Perform a task or solve a scenario (drag-drop, configure, analyze output)","Only pick A-D","Write an essay","Draw on paper"],"answer":0,"explain":"Many test-takers skip PBQs first, then return with remaining time."},{"type":"mcq","q":"A good strategy for a hard PBQ early in the exam is:","options":["Flag it, move on, and return after answering the quick multiple-choice items","Spend 20 minutes on it immediately","Guess and never return","Leave the exam"],"answer":0,"explain":"Bank the easy points first; PBQs can eat your clock."},{"type":"mcq","q":"When two answers look correct, choose the one that is:","options":["BEST/MOST secure and most directly addresses the question asked","Longest","First alphabetically","Most technical-sounding"],"answer":0,"explain":"CompTIA wants the best answer, not just a correct-sounding one."},{"type":"mcq","q":"\"MOST likely\" and \"BEST\" in a question mean you should:","options":["Rank the options and pick the strongest fit, even if others are partly right","Pick any correct-looking one","Pick the cheapest","Skip the question"],"answer":0,"explain":"These keywords signal more than one option is plausible."},{"type":"mcq","q":"If you do not know an answer, you should:","options":["Eliminate wrong options, then make your best guess (no penalty for guessing)","Leave it blank","Pick C always","Report a bug"],"answer":0,"explain":"There is no penalty, so never leave a blank."},{"type":"mcq","q":"The best way to be ready for PBQs is to:","options":["Practice hands-on tasks (firewall rules, log reading, hardening) beforehand","Memorize definitions only","Watch videos only","Skip labs"],"answer":0,"explain":"That is exactly why the Labs and command drills in this app matter."}],"labs":[{"title":"Full timed review","scenario":"Take a 90-question, 90-minute mixed quiz across all five domains. Flag anything you are unsure of and review only those at the end.","hints":[],"steps":["# Quiz tab -> 50+ questions, all domains, timed mentally","# note weak domains and drill them next"],"verify":["you score 750-equivalent (about 83%+) consistently"]},{"title":"Domain weak-spot sweep","scenario":"Use the weak-spots quiz mode until you have no domain below 80%.","hints":[],"steps":["# Quiz -> \"My weak spots\" -> repeat"],"verify":["every domain is at or above 80%"]},{"title":"PBQ dry run","scenario":"Do three Labs from different domains under a timer (log analysis, firewall/hardening, crypto) to simulate PBQs.","hints":[],"steps":["# Labs tab -> pick one ops, one architecture, one threats lab","# do them without revealing steps first"],"verify":["you can complete a scenario task without hints"]}]}]},{"id":"pentest","name":"CompTIA Pentest+ (PT0-003)","exam":"CompTIA PenTest+ · PT0-003 · authorized testing only","short":"Pentest+","days":[{"day":1,"course":"1 Engagement","title":"Authorization and rules of engagement","objective":"Understand why written authorization defines a legal, ethical engagement.","questions":[{"type":"mcq","q":"What single document makes a penetration test legal?","options":["Written authorization (a signed contract / statement of work) from the asset owner","A verbal \"go ahead\" from a manager","A public bug-bounty logo","The tester's certification"],"answer":0,"explain":"Without signed authorization scoping the work, testing systems is illegal, no matter your intent."},{"type":"mcq","q":"The Rules of Engagement (ROE) primarily define:","options":["Scope, timing, permitted techniques, and points of contact","The tester's salary","The exploit code to use","The client's marketing plan"],"answer":0,"explain":"ROE keep the engagement inside legal and safe boundaries."},{"type":"mcq","q":"\"Scope\" in an engagement specifies:","options":["Exactly which systems, networks, and applications may be tested","The color of the report","The tester's tools only","The client's revenue"],"answer":0,"explain":"Anything outside scope is off-limits, even if you find a way in."},{"type":"mcq","q":"Why include an emergency contact and a \"stop\" procedure in the ROE?","options":["So the client can halt testing immediately if something breaks or an incident occurs","To bill more hours","To slow the test","It is optional trivia"],"answer":0,"explain":"A live production issue must be stoppable within minutes."},{"type":"mcq","q":"\"Get out of jail free\" letter refers to:","options":["Written authorization the tester carries proving the work is sanctioned","A real legal immunity from all laws","A bug-bounty payout","A phishing template"],"answer":0,"explain":"It documents permission; it does not excuse illegal acts outside scope."},{"type":"mcq","q":"Which is usually explicitly FORBIDDEN unless specifically authorized?","options":["Denial-of-service, social engineering, and physical intrusion","Reading the scope document","Writing the report","Using an approved scanner in scope"],"answer":0,"explain":"High-impact techniques require explicit written permission."},{"type":"mcq","q":"A \"target of evaluation\" list exists so that:","options":["Testers only touch approved hosts and avoid third-party/shared systems","The client can hide assets","Testers can scan the whole internet","Nobody is accountable"],"answer":0,"explain":"Cloud/shared hosting often requires the provider's permission too."},{"type":"mcq","q":"Testing a cloud-hosted app usually also requires:","options":["Awareness of the provider's testing policy and possibly their authorization","Nothing extra","Only the client's word","A public IP list"],"answer":0,"explain":"Some providers require notification; DoS is typically banned."}],"labs":[{"title":"Draft rules of engagement","scenario":"Write a one-page ROE for testing a single web app in a lab: scope, schedule, allowed and forbidden techniques, data-handling, and stop procedure.","hints":[],"steps":["# In scope: app.lab.local and its API only","# Window: weekdays 18:00-22:00; test accounts provided","# Forbidden: DoS, phishing real staff, pivoting outside scope","# Data: findings stored encrypted, deleted after report accepted","# Stop: call/msg the named contact; testing pauses immediately"],"verify":["the ROE would keep the engagement legal and safe"]},{"title":"Scope validation","scenario":"Given a target list, describe how you confirm each IP/host is actually owned by the client and in scope before touching it.","hints":["WHOIS and client confirmation both matter."],"steps":["whois <target-ip> | grep -iE 'org|netname'","# cross-check against the client-provided authorized asset list","# exclude any shared/third-party ranges; get written OK for cloud"],"verify":["no out-of-scope or third-party asset is tested"]},{"title":"Handle an out-of-scope discovery","scenario":"During a test you find a path into a system NOT in scope. Write the correct steps.","hints":[],"steps":["# 1 stop; do not access the out-of-scope system","# 2 document what you found and how","# 3 notify the client contact promptly","# 4 continue only if scope is formally amended in writing"],"verify":["you never touched the out-of-scope asset"]}]},{"day":2,"course":"1 Engagement","title":"Methodologies and frameworks","objective":"Compare penetration-testing methodologies and standards.","questions":[{"type":"mcq","q":"The typical penetration-test phases are:","options":["Planning, Reconnaissance, Scanning/Enumeration, Exploitation, Post-exploitation, Reporting","Exploit, Report, Plan","Scan, Delete, Bill","Recon, Ransom, Recover"],"answer":0,"explain":"A structured methodology keeps the test thorough and repeatable."},{"type":"mcq","q":"MITRE ATT&CK is used by testers to:","options":["Map real adversary tactics and techniques to plan and describe attacks","Buy exploits","Encrypt reports","Replace the ROE"],"answer":0,"explain":"ATT&CK gives a shared language of TTPs for both red and blue teams."},{"type":"mcq","q":"The Cyber Kill Chain describes:","options":["The stages of an attack from reconnaissance to actions on objectives","A firewall ruleset","A backup process","A patch cycle"],"answer":0,"explain":"Understanding the chain helps you emulate and disrupt attacks."},{"type":"mcq","q":"OSSTMM, PTES and NIST 800-115 are:","options":["Penetration-testing/assessment methodologies and standards","Exploit frameworks","Malware families","Programming languages"],"answer":0,"explain":"They guide consistent, defensible testing."},{"type":"mcq","q":"\"OWASP Testing Guide / Top 10\" is most relevant to:","options":["Web application security testing","Wireless cracking","Physical security","Mainframe testing"],"answer":0,"explain":"The OWASP Top 10 lists the most critical web app risks."},{"type":"mcq","q":"What is the difference between a red team and a standard pen test?","options":["Red teaming emulates a real adversary to test detection/response, often stealthy and goal-based","Red teams only write reports","They are identical","Red teams never get authorization"],"answer":0,"explain":"A standard pen test aims for coverage; red teaming aims for realism and objectives."},{"type":"mcq","q":"\"Assumed breach\" testing starts from:","options":["The premise that an attacker already has some foothold (e.g., a workstation)","Zero access and zero knowledge","Physical access only","The report phase"],"answer":0,"explain":"It focuses on lateral movement and detection rather than initial access."},{"type":"mcq","q":"Why document your methodology in the report?","options":["So findings are reproducible and the client understands coverage and limits","To increase page count","To hide techniques","It is not needed"],"answer":0,"explain":"Reproducibility and transparency build trust and let the client re-test fixes."}],"labs":[{"title":"Map an attack to ATT&CK","scenario":"For a phishing-to-foothold scenario, list one technique per kill-chain stage and its ATT&CK-style label.","hints":[],"steps":["# Recon: gather emails (OSINT)","# Delivery: phishing email (T1566)","# Exploitation: user runs macro (T1204)","# Install: persistence via scheduled task (T1053)","# C2: beacon to attacker server (T1071)","# Actions: collect + exfil data (T1005/T1041)"],"verify":["each stage has a plausible technique"]},{"title":"Choose a methodology","scenario":"For (a) a web app assessment and (b) a full-scope red team, name the most fitting methodology/framework and why.","hints":[],"steps":["# (a) OWASP Testing Guide + PTES -> thorough web coverage","# (b) MITRE ATT&CK + assumed breach -> realistic adversary emulation"],"verify":["each choice fits the goal"]}]},{"day":3,"course":"2 Recon","title":"Passive reconnaissance and OSINT","objective":"Gather information without touching the target directly.","questions":[{"type":"mcq","q":"Passive reconnaissance means:","options":["Collecting information without directly interacting with the target's systems","Scanning every port","Exploiting a service","Brute forcing logins"],"answer":0,"explain":"OSINT (open-source intelligence) uses public data, so it is low-risk and stealthy."},{"type":"mcq","q":"WHOIS lookups can reveal:","options":["Domain registration details, registrar, and sometimes contacts/name servers","The admin password","Open ports","Running services"],"answer":0,"explain":"Much contact data is now privacy-protected, but registrar and NS often show."},{"type":"mcq","q":"DNS enumeration can reveal:","options":["Subdomains, mail servers, and name servers of a domain","The server's CPU model","User passwords","Physical location precisely"],"answer":0,"explain":"Records like A, MX, NS, TXT, CNAME are useful map-building data."},{"type":"mcq","q":"\"Google dorking\" refers to:","options":["Using advanced search operators to find exposed files, logins, or info","Hacking Google","A DNS attack","A scanning tool"],"answer":0,"explain":"e.g. site:, filetype:, intitle: reveal unintentionally public content."},{"type":"mcq","q":"Why is OSINT valuable early in an engagement?","options":["It builds the attack surface picture without alerting the target","It exploits systems directly","It is illegal","It replaces scanning"],"answer":0,"explain":"You learn domains, emails, tech stack, and employees quietly."},{"type":"mcq","q":"Certificate transparency logs are useful because they:","options":["List issued certificates, often revealing subdomains","Contain private keys","Show open ports","Store passwords"],"answer":0,"explain":"crt.sh and similar reveal hostnames from public CT logs."},{"type":"mcq","q":"Social media OSINT helps a tester by:","options":["Revealing employees, roles, tech used, and phishing pretext material","Providing exploits","Showing open ports","Cracking hashes"],"answer":0,"explain":"Job posts often leak the exact technologies in use."},{"type":"cmd","q":"Look up the DNS name servers and mail servers for a domain you are authorized to assess.","accept":["dig example.com NS","dig example.com MX","host -t NS example.com"],"explain":"Passive query of public DNS; no direct contact with the target's servers."}],"labs":[{"title":"Build a passive footprint","scenario":"For an authorized domain, gather: registrar, name servers, MX records, and any subdomains from public sources — without scanning the target.","hints":[],"steps":["whois example.com | grep -iE 'registrar|name server'","dig example.com NS +short; dig example.com MX +short","dig example.com TXT +short","# subdomains from CT logs (crt.sh) reviewed in a browser"],"verify":["you have a passive map with zero packets sent to the target hosts"]},{"title":"OSINT email/user harvest (authorized)","scenario":"Describe how you would ethically collect likely employee email formats for an authorized social-engineering test.","hints":[],"steps":["# find the email pattern (first.last@domain) from public sources","# list roles from public job posts / company site","# only use within the authorized social-engineering scope"],"verify":["you have a pretext list without contacting the target infra"]},{"title":"Reduce your own footprint","scenario":"Explain two ways an organization can limit what OSINT reveals about it.","hints":[],"steps":["# privacy-protect WHOIS; minimize info in job posts","# review CT logs/subdomains for unintended exposure; remove metadata from public files"],"verify":["each measure shrinks the public attack surface"]}]},{"day":4,"course":"2 Recon","title":"Active scanning with Nmap","objective":"Discover hosts, ports and services on authorized targets.","questions":[{"type":"mcq","q":"Active reconnaissance differs from passive because it:","options":["Directly interacts with target systems (and can be detected)","Uses only public data","Is always illegal","Never sends packets"],"answer":0,"explain":"Scanning is active; run it only on authorized, in-scope targets."},{"type":"mcq","q":"A TCP SYN scan (-sS) is often preferred because it:","options":["Is fast and does not complete the full handshake (\"half-open\")","Is the only scan type","Requires no privileges","Completes every connection"],"answer":0,"explain":"It is stealthier and quick; needs raw-socket privileges."},{"type":"mcq","q":"Nmap's -sV flag does what?","options":["Detects service and version information on open ports","Scans UDP only","Runs exploits","Hides the scan"],"answer":0,"explain":"Version detection helps match services to known vulnerabilities."},{"type":"mcq","q":"Nmap's -O flag attempts to:","options":["Fingerprint the target operating system","Open a shell","Disable the firewall","Crack passwords"],"answer":0,"explain":"OS detection uses TCP/IP stack behavior."},{"type":"mcq","q":"Which Nmap option runs the default script set for extra discovery?","options":["-sC (or --script=default)","-sn","-Pn","-F"],"answer":0,"explain":"NSE scripts add banner grabbing, vuln checks, and enumeration."},{"type":"mcq","q":"Nmap's -Pn tells Nmap to:","options":["Skip host discovery and treat the host as online","Ping only","Scan UDP","Print help"],"answer":0,"explain":"Useful when ICMP is blocked but you know the host is up (and in scope)."},{"type":"mcq","q":"A UDP scan (-sU) is slower because:","options":["UDP is connectionless, so open/filtered states are ambiguous and need timeouts","UDP has more ports","It runs exploits","It is encrypted"],"answer":0,"explain":"Still important: DNS, SNMP, and DHCP live on UDP."},{"type":"mcq","q":"Nmap timing template -T4 vs -T1: -T4 is:","options":["Faster/more aggressive; -T1 is slower/stealthier","Slower","Encrypted","UDP-only"],"answer":0,"explain":"Slower timing reduces detection and load on fragile targets."},{"type":"cmd","q":"Do a service/version scan of a single authorized lab host, top ports only.","accept":["nmap -sV -F 192.168.56.10","nmap -sV --top-ports 100 192.168.56.10"],"explain":"Authorized, in-scope targets only. -F scans the 100 most common ports."}],"labs":[{"title":"Full discovery workflow (authorized lab)","scenario":"On your own lab network, discover live hosts, then scan one host for open ports, services, versions and OS.","hints":[],"steps":["nmap -sn 192.168.56.0/24            # host discovery","nmap -sS -sV -O 192.168.56.10       # ports + versions + OS","nmap -sC -p- 192.168.56.10          # default scripts, all ports"],"verify":["you have a list of services and likely OS for one host"]},{"title":"Save and compare scans","scenario":"Run a scan, save it, change something on the lab host, rescan, and diff to detect changes.","hints":[],"steps":["nmap -sV -oA scan1 192.168.56.10","# (open/close a service on the lab host)","nmap -sV -oA scan2 192.168.56.10","ndiff scan1.xml scan2.xml"],"verify":["you can see exactly which ports/services changed"]},{"title":"Targeted UDP check","scenario":"Check a few important UDP services on an authorized host and explain why UDP results are less certain.","hints":[],"steps":["nmap -sU -p 53,161,123 192.168.56.10","# open|filtered means no reply -- could be open or dropped"],"verify":["you can interpret open|filtered correctly"]}]},{"day":5,"course":"2 Recon","title":"Enumeration of services","objective":"Enumerate specific services to gather actionable detail.","questions":[{"type":"mcq","q":"\"Enumeration\" goes beyond scanning by:","options":["Actively extracting detailed info (users, shares, versions, config) from services","Only listing open ports","Only pinging hosts","Reading public data"],"answer":0,"explain":"It turns \"port 445 open\" into \"these shares and users exist.\""},{"type":"mcq","q":"SMB enumeration on port 445 can reveal:","options":["Shares, users, and OS details (when misconfigured)","The BIOS password","Encryption keys","Physical location"],"answer":0,"explain":"Tools query shares and null sessions where allowed."},{"type":"mcq","q":"Enumerating a web server's directories/files is called:","options":["Content discovery / directory brute-forcing","Port scanning","OS fingerprinting","Sniffing"],"answer":0,"explain":"Wordlist tools find hidden endpoints like /admin or /backup."},{"type":"mcq","q":"Banner grabbing retrieves:","options":["Service identification strings that hint at software and version","User passwords","The firewall config","The source code"],"answer":0,"explain":"Versions map to known CVEs."},{"type":"mcq","q":"SNMP with a default community string (\"public\") can leak:","options":["System info, interfaces, running processes, and sometimes config","Nothing","Only the hostname","The admin password directly"],"answer":0,"explain":"Default/read community strings are a common misconfiguration."},{"type":"mcq","q":"Enumerating DNS with a zone transfer (AXFR) succeeds when:","options":["A misconfigured name server allows anyone to pull all records","DNS is encrypted","The firewall is off","Always"],"answer":0,"explain":"A successful AXFR dumps the whole zone — a finding in itself."},{"type":"mcq","q":"LDAP enumeration can reveal:","options":["Directory users, groups, and organizational structure","The kernel version","Wi-Fi keys","Disk layout"],"answer":0,"explain":"Anonymous binds sometimes expose the directory."},{"type":"mcq","q":"Why enumerate thoroughly before exploiting?","options":["Precise detail makes exploitation reliable and reduces noise/damage","To waste time","To skip authorization","To avoid the report"],"answer":0,"explain":"Good enumeration is what separates a pro from a script kiddie."},{"type":"cmd","q":"Enumerate hidden web directories on an authorized target with a wordlist.","accept":["gobuster dir -u http://192.168.56.10 -w /usr/share/wordlists/dirb/common.txt","ffuf -u http://192.168.56.10/FUZZ -w /usr/share/wordlists/dirb/common.txt"],"explain":"Authorized targets only. Review responses (200/301/403) for interesting paths."}],"labs":[{"title":"Enumerate a web server (authorized lab)","scenario":"On a lab web host, identify the server software, discover directories, and note any interesting endpoints.","hints":[],"steps":["nmap -sV -p 80,443 192.168.56.10","whatweb http://192.168.56.10 2>/dev/null || curl -sI http://192.168.56.10","gobuster dir -u http://192.168.56.10 -w /usr/share/wordlists/dirb/common.txt -q"],"verify":["you have a list of endpoints worth investigating"]},{"title":"Enumerate SMB (authorized lab)","scenario":"On a lab host with SMB, list shares and (if allowed) users, and note misconfigurations.","hints":[],"steps":["nmap -p445 --script smb-enum-shares,smb-os-discovery 192.168.56.10","smbclient -L //192.168.56.10 -N 2>/dev/null"],"verify":["you can list shares and identify anonymous access if present"]},{"title":"Try a DNS zone transfer","scenario":"Against an authorized name server, attempt an AXFR and record whether it (insecurely) succeeds.","hints":[],"steps":["dig AXFR example.com @ns1.example.com","# success = misconfiguration finding; failure = properly restricted"],"verify":["you can state whether the zone transfer was allowed"]}]},{"day":6,"course":"3 Vulnerability","title":"Vulnerability scanning","objective":"Run and interpret automated vulnerability scans.","questions":[{"type":"mcq","q":"A vulnerability scanner works by:","options":["Checking targets against a database of known weaknesses and misconfigurations","Exploiting every finding","Only pinging hosts","Guessing passwords"],"answer":0,"explain":"It reports likely issues; a tester then validates them."},{"type":"mcq","q":"\"Authenticated\" (credentialed) scanning gives:","options":["Deeper, more accurate results by logging in to check patch levels/config","Only external results","No extra value","Faster but blind results"],"answer":0,"explain":"Credentialed scans find missing patches unauthenticated scans cannot see."},{"type":"mcq","q":"A \"false positive\" from a scanner is:","options":["A reported vulnerability that is not actually exploitable/present","A missed real vulnerability","A confirmed exploit","A network error"],"answer":0,"explain":"Validation (manual testing) separates real issues from noise."},{"type":"mcq","q":"CVSS base score ranges roughly as:","options":["0.0-10.0, with higher meaning more severe","1-100","A-F letter grades","0-5 only"],"answer":0,"explain":"9.0-10.0 is Critical; context (exposure) still matters for real risk."},{"type":"mcq","q":"A CVE identifier is:","options":["A unique ID for a publicly known vulnerability (e.g., CVE-2024-1234)","A scanner brand","An exploit kit","A patch number"],"answer":0,"explain":"CVEs let everyone reference the same flaw."},{"type":"mcq","q":"Why avoid running an aggressive scanner against fragile production systems?","options":["It can crash unstable services or cause outages","It is always safe","Scanners never cause load","It speeds them up"],"answer":0,"explain":"Coordinate timing and intensity in the ROE; some hosts need gentle scans."},{"type":"mcq","q":"Scanner output should be:","options":["Validated and prioritized before it goes in the report","Pasted raw as the final report","Ignored","Deleted"],"answer":0,"explain":"Raw scan dumps are not a professional deliverable."},{"type":"mcq","q":"\"Compliance scanning\" checks systems against:","options":["A benchmark/standard (e.g., CIS, PCI DSS)","The attacker's wishlist","Random settings","Nothing"],"answer":0,"explain":"It reports configuration gaps for a specific requirement set."},{"type":"cmd","q":"Run an authorized Nmap NSE vulnerability check against a lab host.","accept":["nmap --script vuln 192.168.56.10"],"explain":"NSE vuln scripts are a lightweight starting point; validate anything flagged."}],"labs":[{"title":"Scan, then validate (authorized lab)","scenario":"Run a vuln scan on a lab host, pick one finding, and manually confirm whether it is real.","hints":[],"steps":["nmap -sV --script vuln 192.168.56.10 -oN vulnscan.txt","# pick e.g. an outdated service; check its real version banner","nc 192.168.56.10 <port>            # grab banner to confirm version"],"verify":["you classified the finding as confirmed or false positive"]},{"title":"Prioritize findings","scenario":"Given four findings with CVSS 9.8 (internet-facing), 7.5 (internal), 5.0 (needs local access), 3.1 (info), put them in remediation order and justify.","hints":[],"steps":["# 9.8 internet-facing first (severe + exposed)","# 7.5 internal next","# 5.0 local-access lower","# 3.1 informational last"],"verify":["order reflects severity AND exposure"]},{"title":"Reduce false positives","scenario":"Describe two ways to make scan results more accurate and trustworthy.","hints":[],"steps":["# use authenticated/credentialed scans","# manually validate high-impact findings before reporting"],"verify":["your report would contain confirmed, prioritized issues"]}]},{"day":7,"course":"3 Vulnerability","title":"Analyzing and prioritizing findings","objective":"Turn raw findings into risk-ranked, actionable results.","questions":[{"type":"mcq","q":"Real-world risk of a vulnerability depends on:","options":["Severity AND exposure/exploitability AND business impact","CVSS score alone","The scanner brand","The number of findings"],"answer":0,"explain":"A critical CVE on an isolated box may rank below a medium on an internet-facing app."},{"type":"mcq","q":"\"Chaining\" vulnerabilities means:","options":["Combining several lower-severity issues to achieve a high-impact result","Locking findings together","Encrypting the report","Scanning in a loop"],"answer":0,"explain":"e.g., info leak + weak password + misconfig = full compromise."},{"type":"mcq","q":"Why map findings to business impact?","options":["It helps leadership prioritize fixes by what actually matters to the business","To inflate the report","To hide technical detail","It is unnecessary"],"answer":0,"explain":"\"This exposes customer PII\" motivates action more than a raw CVSS number."},{"type":"mcq","q":"An \"attack path\" in a report shows:","options":["The steps from initial access to the objective, so defenders can break the chain","The tester's schedule","The firewall brand","The client's budget"],"answer":0,"explain":"Visualizing the path highlights the cheapest place to add a control."},{"type":"mcq","q":"A finding's \"remediation\" section should be:","options":["Specific, actionable guidance to fix or mitigate the issue","A restatement of the finding","Blank","The exploit code only"],"answer":0,"explain":"Tell the client exactly what to change."},{"type":"mcq","q":"Which finding likely deserves the highest priority?","options":["An unauthenticated remote code execution on an internet-facing server","A verbose error message on an internal test box","A missing security header on an internal page","An outdated copyright year"],"answer":0,"explain":"Unauthenticated + RCE + exposed = maximum urgency."},{"type":"mcq","q":"Why avoid only listing \"critical\" findings?","options":["Chained lows/mediums and quick wins also matter to the client's risk","Lows are never useful","Clients only read criticals","It saves time"],"answer":0,"explain":"A good report covers the full picture with clear priorities."},{"type":"mcq","q":"\"Risk acceptance\" by the client means:","options":["They knowingly choose to live with a residual risk rather than fix it now","The tester ignores the finding","The risk disappears","The finding was a false positive"],"answer":0,"explain":"Document accepted risks and who accepted them."}],"labs":[{"title":"Rank a findings list","scenario":"Given five mixed findings, assign each a priority (P1-P4) using severity, exposure, and impact, and write a one-line justification each.","hints":[],"steps":["# P1: internet-facing auth-bypass leading to data access","# P2: internal service with known RCE (needs foothold)","# P3: weak TLS config internal","# P4: informational banner disclosure"],"verify":["priorities reflect real risk, not raw CVSS alone"]},{"title":"Write an attack-path narrative","scenario":"Chain three findings into one attack path from external to sensitive data, and identify the single control that best breaks it.","hints":[],"steps":["# exposed admin panel -> default creds -> file upload -> data access","# best break point: remove/authenticate the admin panel + MFA"],"verify":["one well-placed control stops the whole chain"]},{"title":"Write a remediation","scenario":"For \"SQL injection in the login form,\" write a clear, specific remediation the developers can act on.","hints":[],"steps":["# use parameterized queries/prepared statements for all DB access","# validate/allow-list input; least-privilege DB account; WAF as defense-in-depth"],"verify":["a developer could fix it from your text alone"]}]},{"day":8,"course":"4 Exploitation","title":"Exploitation fundamentals and Metasploit","objective":"Safely validate vulnerabilities on authorized targets.","questions":[{"type":"mcq","q":"In a pen test, the point of exploitation is to:","options":["Demonstrate real impact of a vulnerability within the authorized scope","Cause maximum damage","Keep access forever","Skip the report"],"answer":0,"explain":"You prove risk, then document and clean up."},{"type":"mcq","q":"What is a \"proof of concept\" (PoC)?","options":["A demonstration that a vulnerability is genuinely exploitable","A marketing slide","A scanner report","A patch"],"answer":0,"explain":"A PoC turns a theoretical finding into a confirmed one."},{"type":"mcq","q":"In Metasploit, a \"payload\" is:","options":["The code that runs on the target after a successful exploit (e.g., a shell)","The vulnerability itself","The scanner","The report"],"answer":0,"explain":"Payloads can be a simple shell or a fuller agent, per authorization."},{"type":"mcq","q":"A \"reverse shell\" connects:","options":["From the target back to the tester's listener","From the tester to the target only","Two targets together","Nothing"],"answer":0,"explain":"Useful when the target cannot accept inbound connections (bind shell does the opposite)."},{"type":"mcq","q":"Why prefer a low-impact PoC over a destructive exploit?","options":["You prove the risk without harming the client's systems or data","Destruction is required","It is faster to destroy","Clients prefer outages"],"answer":0,"explain":"\"Do no harm\" is core to professional testing."},{"type":"mcq","q":"Before running an exploit, a professional tester:","options":["Confirms the target is in scope and understands the exploit's impact","Runs it blindly","Skips authorization","Disables logging first"],"answer":0,"explain":"Know what the exploit does so you do not cause an outage."},{"type":"mcq","q":"A \"staged\" vs \"stageless\" payload differs in:","options":["Whether the payload is delivered in stages or all at once","The exploit used","The target OS","The report format"],"answer":0,"explain":"Staged payloads are smaller initially; stageless are self-contained."},{"type":"mcq","q":"After a successful PoC, the tester should:","options":["Document evidence, timestamps, and clean up any artifacts left behind","Leave backdoors","Delete client data","Keep persistent access secretly"],"answer":0,"explain":"Remove test accounts, files, and implants; record everything."},{"type":"cmd","q":"In Metasploit, search for a module matching a service you are authorized to test.","accept":["search vsftpd","search type:exploit name:smb"],"explain":"Read the module's description and impact before use; authorized lab targets only."}],"labs":[{"title":"Validate a known-vuln lab box (authorized)","scenario":"On a deliberately vulnerable lab VM (e.g., Metasploitable), confirm one vulnerability with a low-impact PoC and capture evidence.","hints":[],"steps":["# identify the service/version with nmap -sV","msfconsole -q","# search <service> ; use <module> ; set RHOSTS <lab-ip> ; check (if supported)","# run a benign PoC; screenshot proof; then clean up"],"verify":["you have evidence a real vulnerability is exploitable, with no lasting damage"]},{"title":"Set up a listener safely","scenario":"Explain and set up a reverse-shell listener on your attacker VM for an authorized test, and how you would tear it down afterward.","hints":[],"steps":["# nc -lvnp 4444    (or msf multi/handler)","# after PoC: close the listener, remove any dropped files on target"],"verify":["the listener works and you can cleanly stop it"]},{"title":"Document a PoC","scenario":"Write the fields your PoC evidence must include for the report.","hints":[],"steps":["# target host/IP, timestamp, vulnerability + CVE, steps taken","# screenshot/output proof, impact demonstrated, cleanup performed"],"verify":["another tester could reproduce it from your notes"]}]},{"day":9,"course":"4 Exploitation","title":"Password attacks","objective":"Test authentication strength on authorized systems.","questions":[{"type":"mcq","q":"\"Offline\" password cracking means:","options":["Cracking captured password hashes without contacting the live system","Guessing on the login page","Phishing","Sniffing plaintext"],"answer":0,"explain":"Offline attacks avoid lockouts and are limited only by compute and hash strength."},{"type":"mcq","q":"A dictionary attack uses:","options":["A wordlist of likely passwords","Every possible combination","Only numbers","The password hash as input to nothing"],"answer":0,"explain":"Wordlists (e.g., rockyou) plus rules cover most weak passwords."},{"type":"mcq","q":"Why does a strong, slow hash (bcrypt/argon2) with salt resist cracking?","options":["Salting stops precomputation and slow hashing limits guesses per second","It hides the login page","It encrypts the network","It blocks all users"],"answer":0,"explain":"Fast unsalted hashes (MD5) crack far quicker."},{"type":"mcq","q":"\"Password spraying\" avoids lockouts by:","options":["Trying one common password across many accounts","Trying many passwords on one account","Using no passwords","Cracking hashes offline"],"answer":0,"explain":"It stays under per-account lockout thresholds."},{"type":"mcq","q":"Hashcat vs John the Ripper: hashcat is known for:","options":["GPU-accelerated cracking of many hash types","Only online attacks","Being a scanner","Sniffing traffic"],"answer":0,"explain":"Both crack hashes; hashcat leverages GPUs heavily."},{"type":"mcq","q":"\"Pass-the-hash\" lets an attacker:","options":["Authenticate using a captured hash without knowing the plaintext","Reset the password","Crack the hash faster","Encrypt the hash"],"answer":0,"explain":"It abuses protocols that accept the hash as proof."},{"type":"mcq","q":"A good defense a tester recommends against these attacks is:","options":["MFA, strong salted hashing, lockout/rate limiting, and long passphrases","Shorter passwords","Reusing passwords","Disabling logging"],"answer":0,"explain":"Report the fix, not just the finding."},{"type":"mcq","q":"Why must password testing stay within scope and ROE?","options":["Lockouts and account access can disrupt real users and cross legal lines","It never affects users","Passwords are public","It is unrelated to scope"],"answer":0,"explain":"Coordinate spraying/lockout thresholds with the client."},{"type":"cmd","q":"Crack a provided lab hash file with a wordlist using John (authorized lab).","accept":["john --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt","hashcat -m 0 hashes.txt /usr/share/wordlists/rockyou.txt"],"explain":"Only crack hashes you are authorized to test; -m 0 is raw MD5 in hashcat."}],"labs":[{"title":"Crack lab hashes and report impact","scenario":"Given a lab hash file, identify the hash type, crack the weak ones, and write the remediation.","hints":[],"steps":["# identify: hashid <hash>   or  john will guess the format","john --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt","john --show hashes.txt","# remediation: enforce passphrases + MFA, use bcrypt/argon2 with salt"],"verify":["you cracked the weak passwords and gave a real fix"]},{"title":"Demonstrate spraying safely (lab)","scenario":"On an authorized lab directory, describe a low-and-slow spray that respects lockout policy, and the detection a defender would use.","hints":[],"steps":["# one common password across accounts, spaced to avoid lockout","# defender detects: many failed logins for different users from one source"],"verify":["your approach avoids locking real accounts and is detectable"]},{"title":"Recommend authentication hardening","scenario":"List five controls that would have stopped the password attacks you demonstrated.","hints":[],"steps":["# MFA everywhere; long passphrases; account lockout + rate limiting","# salted slow hashing (bcrypt/argon2); ban breached passwords"],"verify":["each control maps to an attack you performed"]}]},{"day":10,"course":"4 Exploitation","title":"Web application attacks","objective":"Test common web vulnerabilities on authorized apps.","questions":[{"type":"mcq","q":"SQL injection is possible when:","options":["User input is concatenated into a database query without parameterization","The site uses HTTPS","Passwords are hashed","The server is patched"],"answer":0,"explain":"Prepared statements are the primary fix."},{"type":"mcq","q":"Cross-site scripting (XSS) lets an attacker:","options":["Run script in a victim's browser via unsanitized output","Read the server's disk","Crash the database","Bypass the firewall"],"answer":0,"explain":"Output encoding and CSP mitigate it."},{"type":"mcq","q":"The difference between stored and reflected XSS is:","options":["Stored is saved on the server and served to many; reflected bounces off a single request","Stored is client-side only","They are identical","Reflected is always worse"],"answer":0,"explain":"Stored XSS can hit every viewer of a page."},{"type":"mcq","q":"\"IDOR\" (Insecure Direct Object Reference) occurs when:","options":["Changing an ID in a request exposes another user's data due to missing authorization checks","The database is encrypted","The URL is HTTPS","Input is validated"],"answer":0,"explain":"Enforce object-level authorization on every request."},{"type":"mcq","q":"CSRF (Cross-Site Request Forgery) tricks a browser into:","options":["Sending an authenticated request the user did not intend","Reading server files","Cracking passwords","Scanning ports"],"answer":0,"explain":"Anti-CSRF tokens and SameSite cookies defend against it."},{"type":"mcq","q":"\"SSRF\" (Server-Side Request Forgery) abuses a server to:","options":["Make requests to internal systems the attacker cannot reach directly","Read the client's disk","Crack a hash","Sniff Wi-Fi"],"answer":0,"explain":"Often used to reach cloud metadata endpoints; validate/allow-list outbound URLs."},{"type":"mcq","q":"A proxy tool like Burp Suite / OWASP ZAP is used to:","options":["Intercept, inspect and modify HTTP requests between browser and app","Scan Wi-Fi","Crack hashes on a GPU","Manage DNS"],"answer":0,"explain":"It is the core tool for manual web testing."},{"type":"mcq","q":"\"Command injection\" happens when:","options":["User input is passed to a system shell without sanitization","The app uses cookies","HTTPS is enabled","The DB is patched"],"answer":0,"explain":"Avoid shelling out with user input; use safe APIs and allow-lists."},{"type":"cmd","q":"Fuzz a web parameter for hidden values on an authorized target with ffuf.","accept":["ffuf -u 'http://192.168.56.10/page?id=FUZZ' -w /usr/share/wordlists/dirb/common.txt"],"explain":"Authorized targets only; watch response codes/sizes for anomalies."}],"labs":[{"title":"Test a login form (authorized lab)","scenario":"On a deliberately vulnerable lab app (e.g., DVWA/Juice Shop), test the login for SQL injection and document the result and fix.","hints":[],"steps":["# intercept the request in Burp/ZAP","# try   ' OR '1'='1' --    in the username (lab only)","# if it bypasses auth: confirm, screenshot, then write the fix","# fix: parameterized queries + input validation + least-privilege DB user"],"verify":["you demonstrated (or ruled out) SQLi and gave remediation"]},{"title":"Find IDOR (authorized lab)","scenario":"On a lab app, change a resource ID in a request and check whether you can view another user's data.","hints":[],"steps":["# log in as user A, note a URL like /account?id=1001","# change to id=1002 -- if you see user B's data, that's IDOR","# fix: enforce per-object authorization server-side"],"verify":["you either found IDOR or confirmed proper authorization"]},{"title":"Map to OWASP Top 10","scenario":"For three vulnerabilities you tested, name the OWASP Top 10 category and one defense each.","hints":[],"steps":["# SQLi -> A03 Injection -> parameterized queries","# broken access (IDOR) -> A01 Broken Access Control -> server-side authz","# XSS -> A03 Injection (XSS) -> output encoding + CSP"],"verify":["each maps to a category and a concrete defense"]}]},{"day":11,"course":"4 Exploitation","title":"Network-based attacks","objective":"Test network protocols and services on authorized targets.","questions":[{"type":"mcq","q":"An on-path (MITM) position lets a tester:","options":["Observe and potentially modify traffic between two hosts (authorized lab only)","Only read public data","Crack hashes offline","Patch systems"],"answer":0,"explain":"Demonstrates the risk of unencrypted protocols; do it only in scope."},{"type":"mcq","q":"Why is a service using plaintext (Telnet, FTP, HTTP) a finding?","options":["Credentials and data can be captured by anyone on the path","It is faster","It is encrypted","It is required"],"answer":0,"explain":"Recommend encrypted replacements (SSH, SFTP, HTTPS)."},{"type":"mcq","q":"SMB relay attacks abuse:","options":["Authentication being relayed to another host that trusts it","DNS caching","TLS certificates","Password length"],"answer":0,"explain":"SMB signing and disabling legacy auth mitigate relay."},{"type":"mcq","q":"\"LLMNR/NBT-NS poisoning\" works because:","options":["Windows falls back to these name-resolution protocols that attackers can answer","DNS is encrypted","The firewall is off","SMB is disabled"],"answer":0,"explain":"Disabling LLMNR/NBT-NS removes this local-network attack path."},{"type":"mcq","q":"A key defense a tester recommends against sniffing is:","options":["Encrypt everything in transit (TLS/IPsec) and segment the network","Longer passwords only","Faster switches","Disabling logging"],"answer":0,"explain":"Encryption makes captured traffic useless."},{"type":"mcq","q":"SNMP write access with a default community string could allow:","options":["Changing device configuration (a serious finding)","Nothing","Only reading uptime","Faster polling"],"answer":0,"explain":"Recommend SNMPv3 with auth+privacy and no default strings."},{"type":"mcq","q":"Why coordinate any DoS-style test carefully?","options":["It can take down production; usually it is out of scope unless explicitly authorized","It never causes harm","It is always allowed","It is required in every test"],"answer":0,"explain":"Most engagements forbid DoS."},{"type":"mcq","q":"Network segmentation limits a tester (and attacker) by:","options":["Preventing easy movement between zones after a foothold","Encrypting disks","Blocking phishing","Speeding the network"],"answer":0,"explain":"You then report where segmentation is missing."},{"type":"cmd","q":"On an authorized lab, capture traffic on an interface to show a plaintext-protocol finding.","accept":["sudo tcpdump -i eth0 -A 'tcp port 21 or tcp port 23 or tcp port 80'"],"explain":"Lab/authorized networks only. Shows why encrypted protocols matter."}],"labs":[{"title":"Demonstrate a plaintext-credential finding (lab)","scenario":"On your isolated lab, capture a Telnet or FTP login and show the credentials in the clear, then write the remediation.","hints":[],"steps":["sudo tcpdump -i eth0 -A 'tcp port 21' -c 100 -w ftp.pcap","# log into the lab FTP; then read the capture for USER/PASS","# remediation: replace FTP with SFTP/FTPS; disable plaintext services"],"verify":["you captured credentials in a lab and recommended encryption"]},{"title":"Identify name-resolution exposure (concept)","scenario":"Explain how LLMNR/NBT-NS poisoning captures hashes on a Windows LAN and the two settings that stop it.","hints":[],"steps":["# attacker answers broadcast name queries, victim sends auth to attacker","# fixes: disable LLMNR (GPO) + disable NBT-NS on adapters; enable SMB signing"],"verify":["you can describe the attack and its mitigations"]},{"title":"Recommend network hardening","scenario":"List four network-layer recommendations from a test that captured plaintext and saw flat networking.","hints":[],"steps":["# encrypt all protocols (SSH/SFTP/HTTPS/LDAPS)","# segment with VLANs + firewall between zones","# disable LLMNR/NBT-NS; enable SMB signing","# SNMPv3 only, no default community strings"],"verify":["each recommendation ties to an observed weakness"]}]},{"day":12,"course":"4 Exploitation","title":"Wireless security testing","objective":"Test Wi-Fi security on networks you own or are authorized to assess.","questions":[{"type":"mcq","q":"Testing Wi-Fi requires:","options":["Ownership or explicit written authorization for that specific network","Just being nearby","A public SSID","No permission"],"answer":0,"explain":"Attacking others' Wi-Fi (deauth/injection) is illegal."},{"type":"mcq","q":"WEP is a finding because it:","options":["Uses a broken cipher/IV scheme that can be cracked quickly","Is too new","Uses WPA3","Requires a certificate"],"answer":0,"explain":"Recommend WPA2-AES at minimum, ideally WPA3."},{"type":"mcq","q":"Capturing a WPA2 handshake lets a tester:","options":["Attempt offline cracking of the passphrase (authorized network only)","Read live traffic instantly","Bypass WPA3","Change the SSID"],"answer":0,"explain":"Strong passphrases make offline cracking impractical."},{"type":"mcq","q":"An \"evil twin\" attack demonstrates the risk of:","options":["Users connecting to a rogue AP impersonating a trusted SSID","Strong encryption","Wired networks","DNSSEC"],"answer":0,"explain":"Recommend 802.1X/WPA3 and client validation."},{"type":"mcq","q":"Monitor mode on a wireless adapter is needed to:","options":["Capture raw 802.11 frames for analysis (authorized testing)","Speed up the internet","Encrypt traffic","Assign IPs"],"answer":0,"explain":"Not all adapters support it; an external adapter is often required."},{"type":"mcq","q":"WPS is a finding because:","options":["Its PIN can be brute-forced to recover the Wi-Fi passphrase","It is encrypted end to end","It uses WPA3","It disables Wi-Fi"],"answer":0,"explain":"Recommend disabling WPS."},{"type":"mcq","q":"WPA2-Enterprise (802.1X) improves security by:","options":["Authenticating each user via RADIUS instead of a shared key","Hiding the SSID","Using WEP","Removing passwords"],"answer":0,"explain":"Per-user credentials are revocable without changing everyone's key."},{"type":"mcq","q":"The best remediation after a Wi-Fi assessment is often:","options":["WPA3 (or WPA2-AES), a strong passphrase, disable WPS, and separate guest/IoT VLANs","Hide the SSID only","MAC filtering only","Lower the signal"],"answer":0,"explain":"Layer real controls, not obscurity."},{"type":"cmd","q":"List nearby wireless networks and their security in your own area (lawful discovery).","accept":["nmcli device wifi list"],"explain":"Note which use WEP/WPA vs WPA2/WPA3; only test networks you own/are authorized for."}],"labs":[{"title":"Assess your own lab Wi-Fi","scenario":"On a Wi-Fi network you OWN, document the security type, whether WPS is on, and recommend improvements.","hints":[],"steps":["nmcli device wifi list","# check the router admin page: encryption type, WPS state, firmware version","# recommend: WPA3/WPA2-AES, disable WPS, strong passphrase, guest VLAN"],"verify":["you produced a mini wireless assessment for your own network"]},{"title":"Explain handshake cracking resistance","scenario":"Explain why a 20-character random passphrase makes WPA2 handshake cracking impractical.","hints":[],"steps":["# offline cracking speed x keyspace = infeasible time for long random keys","# weak/dictionary passphrases fall quickly; length + randomness win"],"verify":["you can justify the passphrase recommendation with reasoning"]},{"title":"Rogue AP defense","scenario":"List how an enterprise detects and prevents rogue/evil-twin APs.","hints":[],"steps":["# wireless IDS/WIPS monitoring for unknown BSSIDs/SSIDs","# 802.1X so clients validate the network (mutual auth)","# user training + managed device profiles"],"verify":["each control addresses rogue/evil-twin risk"]}]},{"day":13,"course":"4 Exploitation","title":"Cloud and container attacks","objective":"Test cloud and container weaknesses (authorized accounts).","questions":[{"type":"mcq","q":"A common cloud misconfiguration finding is:","options":["Publicly readable/writable storage buckets exposing data","Encrypted backups","MFA enabled","Least privilege"],"answer":0,"explain":"Check bucket ACLs/policies first; public data is a frequent breach source."},{"type":"mcq","q":"Over-privileged IAM roles are dangerous because:","options":["A compromised credential inherits far more access than needed","They speed up the cloud","They are encrypted","They cannot be abused"],"answer":0,"explain":"Least privilege limits blast radius."},{"type":"mcq","q":"The cloud \"metadata service\" (e.g., 169.254.169.254) can be abused via SSRF to:","options":["Retrieve temporary credentials/role tokens from a vulnerable server","Read the client's laptop","Crack Wi-Fi","Patch the server"],"answer":0,"explain":"IMDSv2 and blocking SSRF mitigate this."},{"type":"mcq","q":"A \"container escape\" finding means:","options":["Breaking out of a container to the host, undermining isolation","Deleting a container","Scaling containers","A billing issue"],"answer":0,"explain":"Non-root containers, seccomp/AppArmor, and no privileged mode reduce it."},{"type":"mcq","q":"Hard-coded secrets in a container image or repo are a finding because:","options":["Anyone with the image/code obtains the credentials","They run faster","They are encrypted","They are required"],"answer":0,"explain":"Use a secrets manager and scan images/repos."},{"type":"mcq","q":"Why enumerate cloud IAM during an authorized cloud test?","options":["To find excessive permissions and privilege-escalation paths","To increase the bill","To disable logging","It is not useful"],"answer":0,"explain":"Misconfigured trust/role chaining enables escalation."},{"type":"mcq","q":"\"Shared responsibility\" affects testing because:","options":["Some layers belong to the provider and are out of scope","Everything is the tester's to attack","Nothing is testable","The provider tests for you"],"answer":0,"explain":"Stay within the customer-owned layers unless the provider authorizes more."},{"type":"mcq","q":"A key remediation after a cloud test is often:","options":["Least-privilege IAM, block public storage, enable logging/monitoring, use IMDSv2","Make buckets public","Remove MFA","Disable logging"],"answer":0,"explain":"Report concrete, provider-specific fixes."},{"type":"cmd","q":"List storage buckets in an authorized cloud account to review exposure.","accept":["aws s3 ls"],"explain":"Then check each bucket's public-access block and policy; authorized accounts only."}],"labs":[{"title":"Audit cloud storage exposure (authorized)","scenario":"In an authorized cloud account, find any publicly accessible storage and write the fix.","hints":[],"steps":["aws s3 ls","# for each bucket: check public access block + bucket policy + ACL","# fix: enable \"block public access\", tighten policy, enable access logging"],"verify":["you identified exposure (or confirmed none) and gave a fix"]},{"title":"Review IAM for least privilege (concept)","scenario":"Describe how you would find an over-privileged role and what you would recommend.","hints":[],"steps":["# enumerate roles/policies; look for wildcard \"*\" actions/resources","# recommend scoping to specific actions/resources + MFA + short sessions"],"verify":["you can spot and remediate an over-privileged role"]},{"title":"Harden a container (checklist)","scenario":"Give five hardening steps for a container found running as root and privileged.","hints":[],"steps":["# run as non-root USER; drop --privileged; add seccomp/AppArmor profile","# minimal base image; no secrets baked in; scan image for CVEs"],"verify":["the container no longer breaks host isolation easily"]}]},{"day":14,"course":"4 Exploitation","title":"Social engineering and physical","objective":"Test the human and physical layers under authorization.","questions":[{"type":"mcq","q":"Social-engineering tests are only ethical when:","options":["Explicitly authorized in the ROE with agreed limits and care for staff wellbeing","The tester feels like it","The target is a competitor","Never"],"answer":0,"explain":"Scope who, how, and what is off-limits (no real HR harm)."},{"type":"mcq","q":"A phishing simulation measures:","options":["How many users click/report, to improve training and controls","The firewall speed","The database size","The Wi-Fi range"],"answer":0,"explain":"The goal is improvement, not punishment."},{"type":"mcq","q":"A \"pretext\" is:","options":["A believable cover story used to gain trust or access","An exploit","A scanner","A payload"],"answer":0,"explain":"e.g., posing as IT support during an authorized test."},{"type":"mcq","q":"Tailgating (piggybacking) during a physical test demonstrates:","options":["Weak physical access control (following staff through secure doors)","Strong security","A network flaw","A crypto weakness"],"answer":0,"explain":"Recommend mantraps, badge discipline, and awareness."},{"type":"mcq","q":"\"Baiting\" with a dropped USB tests whether:","options":["Staff plug in unknown devices, enabling code execution","The network is fast","The disk is encrypted","The firewall works"],"answer":0,"explain":"Recommend disabling autorun and USB controls + training."},{"type":"mcq","q":"Why capture metrics (click rate, report rate) in a phishing test?","options":["To baseline and measure improvement over time","To embarrass users","To bill more","It is not needed"],"answer":0,"explain":"Report rate rising is a good sign of a security-aware culture."},{"type":"mcq","q":"The strongest defense a tester recommends against social engineering is:","options":["Ongoing awareness training plus verification procedures and MFA","A faster firewall","Longer cables","Disabling email"],"answer":0,"explain":"People are the target, so empower and train them."},{"type":"mcq","q":"Vishing (voice phishing) in an authorized test might attempt to:","options":["Convince staff to reveal info or reset credentials over the phone","Scan ports","Crack hashes","Sniff Wi-Fi"],"answer":0,"explain":"Recommend callback verification and identity checks."}],"labs":[{"title":"Design a phishing simulation","scenario":"Plan an authorized phishing test: pretext, target group, success metric, and the safeguards to avoid harm.","hints":[],"steps":["# pretext: \"IT password reset\"; group: 50 staff","# metric: click rate + report rate; landing page = training, not real capture","# safeguards: no real credential capture, opt-out for sensitive roles, debrief"],"verify":["the test improves security without harming staff"]},{"title":"Physical access walkthrough (concept)","scenario":"List the physical weaknesses you would check on an authorized on-site test and one fix each.","hints":[],"steps":["# tailgating -> mantrap + badge discipline","# unlocked server room -> access control + camera","# exposed network jacks -> port security/NAC","# dropped-USB susceptibility -> disable autorun + training"],"verify":["each observation has a matching control"]},{"title":"Write the awareness recommendation","scenario":"After a phishing test with a 30% click rate, write the improvement plan.","hints":[],"steps":["# targeted training for repeat clickers; simulated phishing quarterly","# easy \"report phishing\" button; MFA to blunt credential theft","# measure report rate as the key success metric"],"verify":["the plan raises reporting and lowers clicks over time"]}]},{"day":15,"course":"5 Post-exploit","title":"Establishing a foothold and situational awareness","objective":"Understand what to do immediately after gaining authorized access.","questions":[{"type":"mcq","q":"The first goal after gaining a foothold (authorized) is usually:","options":["Situational awareness: who am I, where am I, what can I reach","Delete logs","Install ransomware","Leave immediately"],"answer":0,"explain":"Enumerate the local host and network before acting."},{"type":"mcq","q":"\"whoami\" and checking privileges tells you:","options":["The account context and whether you have elevated rights","The client's budget","The exploit used","The firewall brand"],"answer":0,"explain":"It guides whether you need privilege escalation next."},{"type":"mcq","q":"Local enumeration after foothold includes checking:","options":["Users, groups, running services, scheduled tasks, and network connections","Only the wallpaper","The BIOS version only","Nothing"],"answer":0,"explain":"You look for escalation and pivot opportunities."},{"type":"mcq","q":"Why enumerate network reachability from the foothold?","options":["To find internal hosts/services you can now reach for lateral movement","To slow the network","To encrypt traffic","It is not useful"],"answer":0,"explain":"The foothold changes what is reachable versus from outside."},{"type":"mcq","q":"\"Living off the land\" means:","options":["Using built-in system tools to avoid dropping detectable malware","Farming","Using only custom exploits","Physical access"],"answer":0,"explain":"It reduces footprint and evades signature detection."},{"type":"mcq","q":"Why document every command run during post-exploitation?","options":["For the report, reproducibility, and to enable full cleanup","To bill more","To hide activity","It is optional"],"answer":0,"explain":"A clear log lets the client verify and remediate."},{"type":"mcq","q":"Checking scheduled tasks/cron after foothold helps find:","options":["Privilege-escalation and persistence opportunities (and existing malware)","The Wi-Fi password","The report template","Nothing"],"answer":0,"explain":"Writable scripts run by root/SYSTEM are classic escalation paths."},{"type":"mcq","q":"A professional limits post-exploitation activity to:","options":["What is necessary to demonstrate impact within scope","Everything possible","Destroying data","Permanent backdoors"],"answer":0,"explain":"Prove risk, then stop and document."},{"type":"cmd","q":"On a Linux foothold, quickly gather who you are and your privileges (authorized lab).","accept":["id","whoami"],"explain":"Follow with sudo -l to see what you may run as root."}],"labs":[{"title":"Local enumeration script (lab)","scenario":"On an authorized Linux foothold, gather user, privileges, sudo rights, listening services, and cron jobs, saving output for the report.","hints":[],"steps":["id > enum.txt; whoami >> enum.txt","sudo -l >> enum.txt 2>&1","ss -tulpn >> enum.txt","cat /etc/crontab /etc/cron.d/* 2>/dev/null >> enum.txt"],"verify":["you have a situational-awareness snapshot for the report"]},{"title":"Find internal reachability","scenario":"From the foothold, identify other reachable internal hosts/services (authorized scope only).","hints":[],"steps":["ip route; ip neigh","for h in 10.0.0.{1..20}; do (ping -c1 -W1 $h >/dev/null && echo \"$h up\") & done; wait"],"verify":["you have a short list of reachable internal hosts in scope"]},{"title":"Plan the next step","scenario":"Based on enumeration showing you are a low-priv user with a writable root cron script, write your intended next action and why.","hints":[],"steps":["# target: the writable script executed by root -> privilege escalation","# action: demonstrate PoC escalation, capture proof, then clean up"],"verify":["your plan is scoped, justified, and reversible"]}]},{"day":16,"course":"5 Post-exploit","title":"Privilege escalation (Linux)","objective":"Escalate privileges on authorized Linux systems and report fixes.","questions":[{"type":"mcq","q":"A classic Linux privilege-escalation check is:","options":["Finding SUID binaries that can be abused (GTFOBins)","Reading the MOTD","Checking the wallpaper","Pinging the gateway"],"answer":0,"explain":"find / -perm -4000 lists SUID binaries to review."},{"type":"mcq","q":"\"sudo -l\" is useful because it shows:","options":["Which commands the current user may run as root, some abusable","The root password","The kernel version","The firewall rules"],"answer":0,"explain":"A misconfigured NOPASSWD entry can be an instant escalation."},{"type":"mcq","q":"A writable script executed by root (e.g., via cron) allows:","options":["Escalation by inserting commands that run with root privileges","Nothing","Only reading files","Faster boot"],"answer":0,"explain":"Recommend correct ownership/permissions on scheduled scripts."},{"type":"mcq","q":"An outdated kernel can allow escalation via:","options":["A known local kernel exploit","A web vulnerability","A phishing email","A Wi-Fi attack"],"answer":0,"explain":"Patching and least privilege are the fixes."},{"type":"mcq","q":"\"Path hijacking\" escalation abuses:","options":["A privileged program calling a binary by name with an attacker-controlled PATH","DNS","TLS","The GUI"],"answer":0,"explain":"Use absolute paths and a clean environment in privileged scripts."},{"type":"mcq","q":"Weak file permissions on /etc/shadow or a con
