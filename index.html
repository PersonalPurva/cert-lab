q","q":"What does LVM-VDO provide?","options":["Inline deduplication and compression, so a volume stores more logical data than physical space","Encryption at rest","Network replication","Faster boot"],"answer":0,"explain":"VDO is ideal for backups/VM images with lots of repeated data."},{"type":"mcq","q":"Where does LVM keep automatic backups of volume-group metadata?","options":["/etc/lvm/backup (current) and /etc/lvm/archive (historical)","/var/lib/lvm","/boot/lvm","/root/lvm"],"answer":0,"explain":"These let you restore a VG's metadata after accidental damage."},{"type":"mcq","q":"Which command restores a volume group's metadata from an LVM backup file?","options":["vgcfgrestore","vgimport","vgchange -a y","pvcreate"],"answer":0,"explain":"Pair it with vgcfgbackup, which writes the current metadata to a file."},{"type":"mcq","q":"To physically move a volume group's disks to another system, you first:","options":["Deactivate its LVs and run vgexport, then vgimport on the new host","Run pvremove","Delete /etc/lvm","Reformat the disks"],"answer":0,"explain":"vgexport marks the VG as movable; vgimport reactivates it elsewhere."},{"type":"cmd","q":"Create a Stratis pool named mypool from the disk /dev/vdb.","accept":["stratis pool create mypool /dev/vdb"],"explain":"Install stratisd/stratis-cli and enable stratisd first."},{"type":"cmd","q":"Create a Stratis filesystem named data in the pool mypool.","accept":["stratis filesystem create mypool data"],"explain":"It appears at /dev/stratis/mypool/data."},{"type":"cmd","q":"Back up the current metadata of volume group vgdata to a file.","accept":["vgcfgbackup vgdata","vgcfgbackup -f /root/vgdata.meta vgdata"],"explain":"By default it writes to /etc/lvm/backup/vgdata."}],"labs":[{"title":"Stratis pool and filesystem at boot","scenario":"Install Stratis, build a pool on a spare disk, create a filesystem, and mount it persistently at /mnt/stratis.","hints":[],"steps":["dnf install -y stratisd stratis-cli","systemctl enable --now stratisd","stratis pool create mypool /dev/vdb","stratis filesystem create mypool data","mkdir -p /mnt/stratis","echo '/dev/stratis/mypool/data /mnt/stratis xfs defaults,x-systemd.requires=stratisd.service 0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["stratis filesystem list; findmnt /mnt/stratis; reboot and re-check"]},{"title":"Grow a Stratis pool","scenario":"Add a second disk to your Stratis pool and confirm the extra capacity appears.","hints":[],"steps":["stratis pool add-data mypool /dev/vdc","stratis pool list"],"verify":["the pool's total size increased with no downtime"]},{"title":"Deduplication with LVM-VDO","scenario":"Create a VDO volume, format and mount it, write duplicate data, and show that physical usage stays low.","hints":[],"steps":["lvcreate --type vdo -n vdolv -L 10G -V 30G vgdata","mkfs.xfs -K /dev/vgdata/vdolv && mkdir -p /mnt/vdo && mount /dev/vgdata/vdolv /mnt/vdo","for i in $(seq 1 5); do cp /root/bigfile /mnt/vdo/copy$i; done","lvs -o+vdo_used_size,data_percent vgdata"],"verify":["logical data far exceeds the physical space actually used"]},{"title":"Recover a damaged volume group","scenario":"Back up vgdata's metadata, \"accidentally\" remove an LV, then restore the metadata from the archive.","hints":[],"steps":["vgcfgbackup vgdata","lvs vgdata      # note an LV to sacrifice, e.g. lvtest","lvremove -y /dev/vgdata/lvtest","ls /etc/lvm/archive/ | grep vgdata      # find the pre-removal archive","vgcfgrestore -f /etc/lvm/archive/vgdata_XXXXX.vg vgdata"],"verify":["lvs vgdata shows lvtest restored (reactivate with vgchange -ay vgdata)"]}]},{"day":54,"course":"RH134","title":"Advanced SELinux: troubleshooting denials","objective":"Read AVC denials and generate custom policy with audit2allow.","questions":[{"type":"mcq","q":"Where are SELinux AVC (access-vector-cache) denials logged?","options":["/var/log/audit/audit.log","/var/log/selinux","/var/log/messages only","/etc/selinux/denials"],"answer":0,"explain":"Search them with ausearch; if auditd is off they may appear in the journal/messages."},{"type":"mcq","q":"Which command searches the audit log for recent AVC denials?","options":["ausearch -m AVC -ts recent","journalctl -u selinux","getenforce -a","sestatus -v"],"answer":0,"explain":"-m AVC filters the message type; -ts recent limits the time window."},{"type":"mcq","q":"What does audit2why do?","options":["Explains WHY an SELinux denial happened (often suggesting a boolean or context fix)","Turns SELinux off","Deletes the denial","Relabels the filesystem"],"answer":0,"explain":"It reads denials and gives human-readable reasons."},{"type":"mcq","q":"What does `audit2allow -a -M mymod` produce?","options":["A loadable policy module (mymod.pp) that allows the denied actions","A firewall rule","A new user","A relabel script"],"answer":0,"explain":"You then load it with `semodule -i mymod.pp`."},{"type":"mcq","q":"Before writing a custom module for a denial, you should first check whether:","options":["A boolean or a correct file/port label already fixes it (the preferred solution)","SELinux should be disabled","The kernel needs patching","The service should run as root"],"answer":0,"explain":"Custom modules are a last resort; labels and booleans fix most issues."},{"type":"mcq","q":"The setroubleshoot tool `sealert -a /var/log/audit/audit.log` gives you:","options":["Plain-language analysis of denials with suggested fixes","A list of open ports","A firewall report","A backup of the policy"],"answer":0,"explain":"Install setroubleshoot-server to get sealert and desktop alerts."},{"type":"mcq","q":"Putting one domain into \"permissive\" (e.g. httpd_t) while keeping the rest enforcing is done with:","options":["semanage permissive -a httpd_t","setenforce 0","setsebool -P httpd_permissive on","systemctl mask selinux"],"answer":0,"explain":"This logs (but allows) only that domain's denials — great for targeted troubleshooting."},{"type":"cmd","q":"Show recent SELinux denials from the audit log.","accept":["ausearch -m AVC -ts recent","ausearch -m avc -ts recent"],"explain":"Add `| audit2why` to see the reason for each denial."},{"type":"cmd","q":"Generate and name a policy module \"myweb\" from all current denials.","accept":["audit2allow -a -M myweb"],"explain":"Review the generated myweb.te before loading myweb.pp."},{"type":"cmd","q":"Load a compiled SELinux policy module named myweb.pp.","accept":["semodule -i myweb.pp"],"explain":"List loaded modules with `semodule -l`; remove with `semodule -r myweb`."}],"labs":[{"title":"Diagnose and fix a real denial (label first)","scenario":"Serve a file that has the wrong context so httpd is denied, find the denial, understand it, and fix it the RIGHT way (relabel, not a custom module).","hints":[],"steps":["echo hi > /root/index.html && mv /root/index.html /var/www/html/","curl -s http://localhost/ | head        # 403","ausearch -m AVC -ts recent | audit2why","restorecon -v /var/www/html/index.html"],"verify":["curl http://localhost/ now returns the content"]},{"title":"Custom module as a last resort","scenario":"Create a denial that no boolean fixes (e.g. a service writing to an unusual path), capture it, and build+load a custom module — after confirming no label/boolean solves it.","hints":[],"steps":["# trigger the denial, then:","ausearch -m AVC -ts recent","ausearch -m AVC -ts recent | audit2allow -m custom      # review .te first","ausearch -m AVC -ts recent | audit2allow -M custom","semodule -i custom.pp"],"verify":["the action is now allowed and semodule -l shows \"custom\""]},{"title":"Targeted permissive domain","scenario":"Put httpd_t into permissive mode to collect all its denials for a misbehaving app without weakening the rest of the system, then remove it afterward.","hints":[],"steps":["semanage permissive -a httpd_t","getenforce      # still Enforcing overall","# reproduce the app behavior, collect denials with ausearch","semanage permissive -d httpd_t"],"verify":["only httpd_t was permissive; the rest stayed enforcing"]},{"title":"Use sealert for a guided fix","scenario":"Install setroubleshoot, reproduce a denial, and use sealert to get a step-by-step suggested fix.","hints":[],"steps":["dnf install -y setroubleshoot-server","# reproduce the denial","sealert -a /var/log/audit/audit.log | less"],"verify":["you can read the suggested commands and apply the correct one"]}]},{"day":55,"course":"RH134","title":"Advanced SELinux: contexts, ports, booleans and confined users","objective":"Manage custom file contexts, port labels, booleans and SELinux user mappings.","questions":[{"type":"mcq","q":"What is the difference between chcon and semanage fcontext + restorecon?","options":["chcon changes the label now but is lost on relabel; semanage records it permanently, restorecon applies it","They are identical","chcon is permanent","semanage is temporary"],"answer":0,"explain":"For anything that must survive a relabel, always use semanage fcontext."},{"type":"mcq","q":"A file-context rule like `'/web(/.*)?'` uses:","options":["A regular expression so the type applies to the directory and everything under it","A shell glob only","An exact path only","A UUID"],"answer":0,"explain":"The `(/.*)?` suffix covers the directory itself and all contents."},{"type":"mcq","q":"To let a service listen on a non-standard port under SELinux, you:","options":["Add the port to the correct type, e.g. semanage port -a -t http_port_t -p tcp 8888","Disable SELinux","chmod the port","Edit /etc/services only"],"answer":0,"explain":"If the port is already labeled another type, use -m to modify it."},{"type":"mcq","q":"What does `semanage boolean -l -C` show?","options":["Only the booleans you have changed from their default","Every boolean","Only httpd booleans","Port labels"],"answer":0,"explain":"Handy for reviewing your customizations."},{"type":"mcq","q":"SELinux confined users (user_u, staff_u, sysadm_u) control:","options":["What a Linux login is allowed to do at the SELinux level, beyond normal permissions","File ownership","Disk quotas","Network routes"],"answer":0,"explain":"semanage login maps a Linux user to an SELinux user."},{"type":"mcq","q":"Which command maps the Linux user \"operator\" to the SELinux user staff_u?","options":["semanage login -a -s staff_u operator","usermod -Z staff_u operator","semanage user -a operator","chcon -u staff_u operator"],"answer":0,"explain":"See current mappings with `semanage login -l`."},{"type":"mcq","q":"After adding many fcontext rules, which single command applies default labels to a whole tree?","options":["restorecon -Rv /path","chcon -R /path","relabel /path","semanage relabel /path"],"answer":0,"explain":"restorecon reads the fcontext database and sets each file to its defined type."},{"type":"cmd","q":"Add a permanent rule so /web and everything under it is labeled httpd_sys_content_t.","accept":["semanage fcontext -a -t httpd_sys_content_t '/web(/.*)?'"],"explain":"Then apply it with `restorecon -Rv /web`."},{"type":"cmd","q":"Let SELinux allow a service to listen on TCP port 8888 as an http port.","accept":["semanage port -a -t http_port_t -p tcp 8888"],"explain":"Check with `semanage port -l | grep 8888`."},{"type":"cmd","q":"List every SELinux boolean related to httpd with its current value.","accept":["getsebool -a | grep httpd","semanage boolean -l | grep httpd"],"explain":"Toggle persistently with `setsebool -P <boolean> on`."}],"labs":[{"title":"Custom web root on a custom port (full stack)","scenario":"Serve /web/index.html on port 8888 in enforcing mode: fix the file context, the port label, and the firewall.","hints":[],"steps":["mkdir -p /web && echo \"custom\" > /web/index.html","sed -i 's/^Listen .*/Listen 8888/' /etc/httpd/conf/httpd.conf","sed -i 's#^DocumentRoot .*#DocumentRoot \"/web\"#' /etc/httpd/conf/httpd.conf","semanage fcontext -a -t httpd_sys_content_t '/web(/.*)?' && restorecon -Rv /web","semanage port -a -t http_port_t -p tcp 8888","firewall-cmd --permanent --add-port=8888/tcp && firewall-cmd --reload","systemctl restart httpd"],"verify":["curl http://localhost:8888/ returns \"custom\""]},{"title":"Confine a user with SELinux","scenario":"Create a user \"guestx\", map them to the restrictive user_u SELinux user, and show that the mapping applies.","hints":[],"steps":["useradd guestx && echo 'Rhcsa@2026' | passwd --stdin guestx","semanage login -a -s user_u guestx","semanage login -l | grep guestx"],"verify":["su - guestx -c 'id -Z' shows user_u:...  (a confined context)"]},{"title":"Review and reset your SELinux customizations","scenario":"List all the fcontext rules, port labels and booleans you have changed, then remove one custom fcontext rule and relabel.","hints":[],"steps":["semanage fcontext -l -C","semanage port -l -C","semanage boolean -l -C","semanage fcontext -d '/web(/.*)?' && restorecon -Rv /web"],"verify":["semanage fcontext -l -C no longer lists the /web rule"]},{"title":"Boolean-driven feature","scenario":"Enable httpd to connect to the network and to read user home directories, persistently, and verify.","hints":[],"steps":["setsebool -P httpd_can_network_connect on","setsebool -P httpd_enable_homedirs on","getsebool httpd_can_network_connect httpd_enable_homedirs"],"verify":["both booleans report \"on\" and survive a reboot"]}]},{"day":56,"course":"RH134","title":"Advanced SELinux: services, containers and relabeling","objective":"Apply SELinux to real services and containers, and relabel a filesystem.","questions":[{"type":"mcq","q":"Why does moving a file with `mv` often break a service under SELinux?","options":["mv preserves the file's original context instead of the destination's default","mv deletes the SELinux label","mv always sets httpd_sys_content_t","mv disables SELinux"],"answer":0,"explain":"cp (without -a) or restorecon gives the file the destination's correct type."},{"type":"mcq","q":"What does `restorecon -Rv /path` do that chcon does not?","options":["It sets each file to the type defined by the fcontext policy (surviving relabels)","It changes ownership","It is temporary","It disables SELinux"],"answer":0,"explain":"restorecon is policy-driven; chcon is a manual, non-persistent override."},{"type":"mcq","q":"How do you trigger a full filesystem relabel on the next boot?","options":["touch /.autorelabel  (then reboot)","setenforce relabel","restorecon /boot","semodule -R"],"answer":0,"explain":"The system relabels everything and removes the flag; it can take a while."},{"type":"mcq","q":"In `podman run -v /data:/data:Z`, what does the :Z do?","options":["Relabels the volume with a private container context so the container can access it","Makes it read-only","Encrypts the volume","Shares it with every container"],"answer":0,"explain":"Lowercase :z labels it as shared among containers; :Z is private to one."},{"type":"mcq","q":"Rootless containers rely on SELinux type ______ to confine container processes.","options":["container_t (with content typically container_file_t)","unconfined_t","httpd_t","init_t"],"answer":0,"explain":"SELinux adds a strong isolation layer on top of namespaces."},{"type":"mcq","q":"Which tool checks whether a path currently matches its policy-defined context?","options":["matchpathcon (or `restorecon -n -v` for a dry run)","getenforce","semodule -l","ausearch"],"answer":0,"explain":"It shows the expected label so you can spot mismatches."},{"type":"cmd","q":"Dry-run a relabel of /var/www to see what restorecon WOULD change, without changing anything.","accept":["restorecon -Rnv /var/www"],"explain":"-n means \"no change\"; drop it to actually apply the labels."},{"type":"cmd","q":"Show the policy-defined (default) context for the path /web/index.html.","accept":["matchpathcon /web/index.html"],"explain":"Compare it to the actual label from `ls -Z` to find mismatches."},{"type":"cmd","q":"Run a container mounting /srv/data with a private SELinux relabel.","accept":["podman run -v /srv/data:/data:Z ..."],"explain":":Z relabels the host directory to container_file_t for that container."}],"labs":[{"title":"Move vs copy and fix the label","scenario":"Show how mv breaks a web file's context while cp/restorecon fixes it.","hints":[],"steps":["echo A > /root/a.html; echo B > /root/b.html","mv /root/a.html /var/www/html/          # keeps admin_home_t","cp /root/b.html /var/www/html/          # gets correct type","ls -Z /var/www/html/*.html","restorecon -v /var/www/html/a.html      # fix the moved one"],"verify":["both files now have httpd_sys_content_t"]},{"title":"Persistent SELinux for a container volume","scenario":"Run a rootless container that serves content from a host directory, using the correct SELinux volume label, and make the host label permanent.","hints":[],"steps":["mkdir -p /srv/webdata && echo \"container page\" > /srv/webdata/index.html","semanage fcontext -a -t container_file_t '/srv/webdata(/.*)?'","restorecon -Rv /srv/webdata","podman run -d --name web -p 8080:80 -v /srv/webdata:/usr/share/nginx/html:Z nginx 2>/dev/null || echo \"(pull nginx first)\""],"verify":["ls -Z /srv/webdata shows container_file_t; curl localhost:8080 works"]},{"title":"Full filesystem relabel","scenario":"Schedule and perform a full relabel (as you would after fixing widespread context damage), then confirm it ran.","hints":[],"steps":["touch /.autorelabel","systemctl reboot","# system relabels during boot, then removes /.autorelabel","ls -l /.autorelabel 2>/dev/null || echo \"relabel done, flag cleared\""],"verify":["getenforce is Enforcing and contexts are correct"]},{"title":"Audit a directory's contexts","scenario":"For /var/www, dry-run restorecon to list any files whose label does not match policy, then fix only those.","hints":[],"steps":["restorecon -Rnv /var/www          # lists mismatches without changing them","restorecon -Rv /var/www           # apply the fixes"],"verify":["a second dry run (restorecon -Rnv /var/www) reports nothing to change"]}]},{"day":57,"course":"RH134","title":"Containers: images and registries","objective":"Find, inspect and retrieve container images with podman and skopeo.","questions":[{"type":"mcq","q":"What is Podman?","options":["A daemonless tool to run and manage OCI containers, largely drop-in compatible with Docker","A hypervisor for virtual machines","A package manager","A systemd replacement"],"answer":0,"explain":"Podman needs no background daemon and can run rootless, which the RHCSA exam favors."},{"type":"mcq","q":"Which file controls which registries Podman searches for unqualified image names?","options":["/etc/containers/registries.conf","/etc/docker/daemon.json","/etc/podman.conf","~/.registries"],"answer":0,"explain":"The unqualified-search-registries list decides where a bare name like \"nginx\" is looked up."},{"type":"mcq","q":"What does `skopeo inspect docker://registry.access.redhat.com/ubi9/ubi` do?","options":["Shows an image's metadata (layers, labels, digest) WITHOUT pulling it","Pulls and runs the image","Deletes the image","Builds the image"],"answer":0,"explain":"skopeo works on remote images directly, so you can inspect before downloading."},{"type":"mcq","q":"A fully qualified image name looks like:","options":["registry.access.redhat.com/ubi9/ubi:latest","ubi","ubi9-latest","/images/ubi9"],"answer":0,"explain":"It is registry/namespace/name:tag. Using the full name avoids ambiguity."},{"type":"mcq","q":"Where does a rootless user's pulled images get stored?","options":["Under ~/.local/share/containers/storage","/var/lib/docker","/etc/containers","/tmp"],"answer":0,"explain":"Rootful storage is /var/lib/containers/storage; each rootless user has their own."},{"type":"mcq","q":"What does an image \"tag\" represent?","options":["A specific version/label of an image (e.g. :latest, :9.3)","The image owner","The registry name","The container ID"],"answer":0,"explain":"Pin a real version tag for reproducibility; :latest can change under you."},{"type":"cmd","q":"Search the configured registries for images named \"ubi9\".","accept":["podman search ubi9","podman search registry.access.redhat.com/ubi9"],"explain":"Results depend on your registries.conf search list."},{"type":"cmd","q":"Pull the Red Hat UBI 9 base image.","accept":["podman pull registry.access.redhat.com/ubi9/ubi"],"explain":"Confirm afterward with `podman images`."},{"type":"cmd","q":"List the container images stored locally.","accept":["podman images","podman image ls"],"explain":"Shows repository, tag, image ID, and size."},{"type":"cmd","q":"Inspect a remote image's metadata without downloading it.","accept":["skopeo inspect docker://registry.access.redhat.com/ubi9/ubi"],"explain":"Add `--config` to see the runtime config; great for checking before a pull."}],"labs":[{"title":"Configure a registry and pull (exam-style)","scenario":"Make registry.access.redhat.com a searchable registry, search for ubi9, pull the ubi image, and confirm it is stored locally.","hints":[],"steps":["grep -n unqualified-search-registries /etc/containers/registries.conf","# ensure \"registry.access.redhat.com\" is in the list (edit if needed)","podman search ubi9 | head","podman pull registry.access.redhat.com/ubi9/ubi"],"verify":["podman images | grep ubi9"]},{"title":"Inspect an image before and after pulling","scenario":"Compare inspecting an image remotely with skopeo versus locally with podman.","hints":[],"steps":["skopeo inspect docker://registry.access.redhat.com/ubi9/ubi | head -30","podman pull registry.access.redhat.com/ubi9/ubi","podman inspect registry.access.redhat.com/ubi9/ubi | head -30"],"verify":["you can read the image's labels and digest both ways"]},{"title":"Log in to a registry","scenario":"Log in to a container registry with your credentials, then confirm the stored login.","hints":[],"steps":["podman login registry.redhat.io","# enter username + token/password","cat ${XDG_RUNTIME_DIR}/containers/auth.json 2>/dev/null | head"],"verify":["podman login --get-login registry.redhat.io shows your user"]},{"title":"Copy an image between locations with skopeo","scenario":"Use skopeo to copy an image into local container storage without running it.","hints":[],"steps":["skopeo copy docker://registry.access.redhat.com/ubi9/ubi containers-storage:ubi9-local","podman images | grep ubi9-local"],"verify":["the image appears in local storage under the new name"]}]},{"day":58,"course":"RH134","title":"Containers: running and managing","objective":"Run, list, stop, start, inspect and remove containers.","questions":[{"type":"mcq","q":"Which command runs a container in the background and names it?","options":["podman run -d --name web <image>","podman start web","podman create web","podman exec web"],"answer":0,"explain":"-d detaches (daemon-like); --name gives it a stable name."},{"type":"mcq","q":"What does `podman ps` show by default?","options":["Only currently running containers","All containers, running or stopped","Only images","Only pods"],"answer":0,"explain":"Add -a to include stopped containers."},{"type":"mcq","q":"How do you get an interactive shell inside a running container named web?","options":["podman exec -it web bash","podman run web bash","podman attach web sh","podman shell web"],"answer":0,"explain":"-i keeps stdin open, -t allocates a terminal."},{"type":"mcq","q":"What does `-p 8080:80` do in podman run?","options":["Maps host port 8080 to container port 80","Runs 8080 containers","Limits CPU to 80%","Sets a timeout"],"answer":0,"explain":"Reach the service at http://host:8080."},{"type":"mcq","q":"Which command shows a container's logs?","options":["podman logs web","podman cat web","podman journal web","podman ps web"],"answer":0,"explain":"Add -f to follow the logs live."},{"type":"mcq","q":"A stopped container still exists until you:","options":["Remove it with podman rm (or run with --rm to auto-remove on exit)","Reboot","Delete the image","Stop it again"],"answer":0,"explain":"`podman ps -a` lists stopped containers taking up space."},{"type":"mcq","q":"What does `podman inspect web` provide?","options":["Detailed JSON about the container (mounts, network, env, state)","Only the logs","Only the image name","A shell"],"answer":0,"explain":"Filter with `--format '{{.State.Status}}'` for one field."},{"type":"cmd","q":"Run an nginx container in the background named web, mapping host port 8080 to 80.","accept":["podman run -d --name web -p 8080:80 nginx","podman run -d --name web -p 8080:80 docker.io/library/nginx"],"explain":"Test it with `curl http://localhost:8080`."},{"type":"cmd","q":"List all containers including stopped ones.","accept":["podman ps -a","podman ps --all"],"explain":"Running-only is just `podman ps`."},{"type":"cmd","q":"Stop the running container named web.","accept":["podman stop web"],"explain":"Start it again with `podman start web`; restart with `podman restart web`."},{"type":"cmd","q":"Remove the container named web (it must be stopped first, or use force).","accept":["podman rm web","podman rm -f web"],"explain":"-f stops and removes in one step."}],"labs":[{"title":"Full container lifecycle (exam-style)","scenario":"Run a named nginx container with a port mapping, verify it serves, exec in to look around, read its logs, stop it, start it, then remove it.","hints":[],"steps":["podman run -d --name web -p 8080:80 nginx","curl -s http://localhost:8080 | head -3","podman exec -it web bash -c 'ls /usr/share/nginx/html'","podman logs web | tail","podman stop web && podman start web","podman rm -f web"],"verify":["podman ps -a shows no \"web\" container remaining"]},{"title":"Run a one-shot command in a container","scenario":"Run a UBI container that prints the OS release, then removes itself automatically.","hints":[],"steps":["podman run --rm registry.access.redhat.com/ubi9/ubi cat /etc/os-release"],"verify":["the command output appears and `podman ps -a` shows no leftover container"]},{"title":"Set environment and inspect it","scenario":"Run a container with a custom environment variable and confirm it is set inside.","hints":[],"steps":["podman run -d --name envtest -e GREETING=hello registry.access.redhat.com/ubi9/ubi sleep 300","podman exec envtest printenv GREETING","podman inspect envtest --format '{{.Config.Env}}'"],"verify":["the container sees GREETING=hello"]},{"title":"Interactive container","scenario":"Start an interactive UBI container, create a file inside it, exit, and observe the container has stopped.","hints":[],"steps":["podman run -it --name shelltest registry.access.redhat.com/ubi9/ubi bash","# inside: echo hi > /tmp/note.txt ; cat /tmp/note.txt ; exit","podman ps -a | grep shelltest      # Exited"],"verify":["you understand the container stops when its main process exits"]}]},{"day":59,"course":"RH134","title":"Containers: persistent storage and environment","objective":"Attach host storage to containers with correct SELinux labels.","questions":[{"type":"mcq","q":"Why does data written inside a container usually disappear when the container is removed?","options":["The container's writable layer is ephemeral; only mounted volumes persist","Podman encrypts it","The disk is read-only","SELinux deletes it"],"answer":0,"explain":"Persistent data must live on a mounted host directory or named volume."},{"type":"mcq","q":"Which podman option bind-mounts a host directory into a container?","options":["-v /host/path:/container/path","-m /host:/container","--disk /host:/container","-p /host:/container"],"answer":0,"explain":"-p is for ports; -v (or --volume) is for storage."},{"type":"mcq","q":"On an SELinux-enforcing host, what does the :Z suffix on a volume do?","options":["Relabels the host directory with a private container context so the container can access it","Makes it read-only","Encrypts it","Shares it publicly"],"answer":0,"explain":"Without :Z (or :z), SELinux typically denies the container access to the host files."},{"type":"mcq","q":"The difference between :z and :Z on a volume is:","options":[":z labels it shared among containers; :Z labels it private to one container",":z is read-only, :Z is read-write","They are identical",":Z disables SELinux"],"answer":0,"explain":"Use :Z when only one container should use the directory."},{"type":"mcq","q":"A \"named volume\" (podman volume create) differs from a bind mount because it:","options":["Is managed by Podman under its storage, not a specific host path you choose","Cannot persist data","Is always read-only","Requires root"],"answer":0,"explain":"Bind mounts point at an exact host directory; named volumes are Podman-managed."},{"type":"mcq","q":"Which permanent SELinux type should a host directory served by a container have?","options":["container_file_t","httpd_sys_content_t","default_t","admin_home_t"],"answer":0,"explain":"Set it with semanage fcontext + restorecon so it survives a relabel (better than relying on :Z alone)."},{"type":"cmd","q":"Run a container mounting host /srv/web into /usr/share/nginx/html with a private SELinux relabel.","accept":["podman run -d --name web -p 8080:80 -v /srv/web:/usr/share/nginx/html:Z nginx"],"explain":":Z relabels /srv/web to container_file_t for this container."},{"type":"cmd","q":"Create a Podman-managed named volume called appdata.","accept":["podman volume create appdata"],"explain":"Inspect it with `podman volume inspect appdata`; list with `podman volume ls`."},{"type":"cmd","q":"Permanently label the host directory /srv/web for container use.","accept":["semanage fcontext -a -t container_file_t '/srv/web(/.*)?'"],"explain":"Then apply it with `restorecon -Rv /srv/web`."}],"labs":[{"title":"Persistent web content (exam-style)","scenario":"Serve content from host /srv/web through an nginx container so the page survives removing and recreating the container.","hints":[],"steps":["mkdir -p /srv/web && echo \"Hello from the host\" > /srv/web/index.html","semanage fcontext -a -t container_file_t '/srv/web(/.*)?' && restorecon -Rv /srv/web","podman run -d --name web -p 8080:80 -v /srv/web:/usr/share/nginx/html:Z nginx","curl -s http://localhost:8080","podman rm -f web","podman run -d --name web2 -p 8080:80 -v /srv/web:/usr/share/nginx/html:Z nginx"],"verify":["curl http://localhost:8080 still shows \"Hello from the host\""]},{"title":"Use a named volume","scenario":"Create a named volume, mount it in a container, write data, remove the container, and confirm the data persists in a new container.","hints":[],"steps":["podman volume create appdata","podman run --rm -v appdata:/data registry.access.redhat.com/ubi9/ubi bash -c 'echo persisted > /data/file.txt'","podman run --rm -v appdata:/data registry.access.redhat.com/ubi9/ubi cat /data/file.txt"],"verify":["the second container reads \"persisted\" written by the first"]},{"title":"Prove the SELinux label matters","scenario":"Mount a host dir WITHOUT :Z and observe the denial, then fix it with the label.","hints":[],"steps":["mkdir -p /srv/nolabel && echo test > /srv/nolabel/index.html","podman run -d --name bad -p 8081:80 -v /srv/nolabel:/usr/share/nginx/html nginx","curl -s http://localhost:8081 | head        # likely 403 / denied","ausearch -m AVC -ts recent | tail","podman rm -f bad","podman run -d --name good -p 8081:80 -v /srv/nolabel:/usr/share/nginx/html:Z nginx"],"verify":["curl http://localhost:8081 now serves the file"]},{"title":"Inspect a container's mounts","scenario":"Run a container with a bind mount and use inspect to confirm the mount source, destination and mode.","hints":[],"steps":["podman run -d --name m -v /srv/web:/data:Z registry.access.redhat.com/ubi9/ubi sleep 300","podman inspect m --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Mode}}){{end}}'"],"verify":["you can read the mount details from inspect"]}]},{"day":60,"course":"RH134","title":"Containers: building images from a Containerfile","objective":"Write a Containerfile and build a custom image with podman build.","questions":[{"type":"mcq","q":"What is a Containerfile?","options":["A text file of instructions (FROM, RUN, COPY, CMD...) that defines how to build an image","A running container","A storage volume","A registry config"],"answer":0,"explain":"It is the same format as a Dockerfile; Podman reads either name."},{"type":"mcq","q":"The first instruction in a Containerfile is normally:","options":["FROM <base image>","RUN","CMD","COPY"],"answer":0,"explain":"FROM sets the base image every later layer builds on."},{"type":"mcq","q":"What is the difference between CMD and ENTRYPOINT?","options":["ENTRYPOINT sets the fixed executable; CMD sets default arguments that are easy to override","They are identical","CMD runs at build time","ENTRYPOINT copies files"],"answer":0,"explain":"A common pattern is ENTRYPOINT for the program and CMD for default args."},{"type":"mcq","q":"RUN vs CMD in a Containerfile:","options":["RUN executes during the BUILD (creating a layer); CMD runs when the container STARTS","Both run at build time","Both run at start time","RUN runs at start, CMD at build"],"answer":0,"explain":"Use RUN to install software; use CMD/ENTRYPOINT to define the runtime process."},{"type":"mcq","q":"Which instruction copies files from your build context into the image?","options":["COPY","ADD only for URLs","MOVE","IMPORT"],"answer":0,"explain":"COPY src dest; ADD can also fetch URLs/untar, but COPY is preferred for clarity."},{"type":"mcq","q":"What does `podman build -t myapp:1.0 .` do?","options":["Builds an image tagged myapp:1.0 from the Containerfile in the current directory","Runs a container","Pushes to a registry","Deletes an image"],"answer":0,"explain":"The trailing \".\" is the build context directory."},{"type":"cmd","q":"Build an image tagged webapp:1.0 from the Containerfile in the current directory.","accept":["podman build -t webapp:1.0 .","podman build -t webapp:1.0 -f Containerfile ."],"explain":"Confirm with `podman images | grep webapp`."},{"type":"cmd","q":"Show the history/layers of the image webapp:1.0.","accept":["podman history webapp:1.0"],"explain":"Each Containerfile instruction that changes the filesystem creates a layer."},{"type":"mcq","q":"Which instruction sets an environment variable baked into the image?","options":["ENV KEY=value","SET KEY=value","EXPORT KEY=value","VAR KEY=value"],"answer":0,"explain":"ENV values are present at both later build steps and runtime."}],"labs":[{"title":"Build a custom web image (exam-style)","scenario":"Write a Containerfile based on UBI that installs a tiny web server or copies an index page, then build and run it.","hints":[],"steps":["mkdir -p ~/build && cd ~/build","echo \"<h1>Purva's container</h1>\" > index.html","cat > Containerfile <<'EOF'","FROM registry.access.redhat.com/ubi9/ubi","RUN dnf install -y httpd && dnf clean all","COPY index.html /var/www/html/index.html","EXPOSE 80","CMD [\"/usr/sbin/httpd\",\"-DFOREGROUND\"]","EOF","podman build -t webapp:1.0 .","podman run -d --name mysite -p 8080:80 webapp:1.0"],"verify":["curl -s http://localhost:8080 shows \"Purva's container\""]},{"title":"Understand build layers","scenario":"Build an image, then use history and inspect to see its layers and configured command.","hints":[],"steps":["cd ~/build && podman build -t webapp:1.0 .","podman history webapp:1.0","podman inspect webapp:1.0 --format '{{.Config.Cmd}}'"],"verify":["you can list the layers and the default command"]},{"title":"ENV and CMD in practice","scenario":"Write a small Containerfile that sets an ENV variable and a CMD that prints it, then build and run to confirm.","hints":[],"steps":["mkdir -p ~/envbuild && cd ~/envbuild","cat > Containerfile <<'EOF'","FROM registry.access.redhat.com/ubi9/ubi","ENV WHO=Purva","CMD echo \"Hello $WHO\"","EOF","podman build -t hello:1.0 .","podman run --rm hello:1.0"],"verify":["the container prints \"Hello Purva\""]},{"title":"Tag and re-tag an image","scenario":"Build an image, add a second tag, and push (or save) it.","hints":[],"steps":["cd ~/build && podman build -t webapp:1.0 .","podman tag webapp:1.0 webapp:latest","podman images | grep webapp","podman save -o /root/webapp.tar webapp:1.0"],"verify":["both tags exist and the image is saved to a tarball"]}]},{"day":61,"course":"RH134","title":"Containers: running as a systemd service","objective":"Configure a rootless container to start automatically at boot with Quadlet.","questions":[{"type":"mcq","q":"On RHEL 10, the current recommended way to run a container under systemd is:","options":["A Quadlet unit (a .container file) that systemd generates a service from","Editing /etc/rc.local","podman generate systemd (now the older method)","A cron @reboot job"],"answer":0,"explain":"Quadlet files live in ~/.config/containers/systemd/ (rootless) or /etc/containers/systemd/ (rootful)."},{"type":"mcq","q":"For a ROOTLESS container service to keep running after the user logs out (and start at boot), you must:","options":["Enable lingering for that user with loginctl enable-linger <user>","Run it as root","Add it to /etc/fstab","Disable SELinux"],"answer":0,"explain":"Without linger, user services stop when the user's last session ends."},{"type":"mcq","q":"A Quadlet file named webapp.container produces a systemd service called:","options":["webapp.service","webapp.container.service","container-webapp","webapp.timer"],"answer":0,"explain":"systemctl --user start webapp.service starts it; the name matches the file's base name."},{"type":"mcq","q":"Which command must you run after creating or editing a Quadlet unit?","options":["systemctl --user daemon-reload (rootless) so systemd regenerates the service","podman restart","semanage reload","firewall-cmd --reload"],"answer":0,"explain":"For rootful units in /etc/containers/systemd/, use `systemctl daemon-reload`."},{"type":"mcq","q":"In a Quadlet [Container] section, which key maps a host port to the container?","options":["PublishPort=8080:80","Ports=8080:80","Expose=8080","Map=8080:80"],"answer":0,"explain":"Other common keys: Image=, Volume=, Environment=."},{"type":"mcq","q":"The older `podman generate systemd --new --name web --files` command:","options":["Generates a systemd unit file for an existing container (still seen on RHEL 9)","Builds an image","Starts a pod","Removes a service"],"answer":0,"explain":"RHEL 10 favors Quadlet, but knowing generate systemd is still useful."},{"type":"cmd","q":"Enable lingering for the current user so rootless services run at boot.","accept":["loginctl enable-linger $(whoami)","loginctl enable-linger $USER"],"explain":"Check with `loginctl show-user $USER | grep Linger`."},{"type":"cmd","q":"Reload the user systemd manager after adding a Quadlet unit.","accept":["systemctl --user daemon-reload"],"explain":"Then `systemctl --user start <name>.service`."},{"type":"cmd","q":"Enable and start a rootless user service named webapp now.","accept":["systemctl --user enable --now webapp.service"],"explain":"For Quadlet-generated services, `enable` may be implicit via [Install]; start is what matters."}],"labs":[{"title":"Rootless container as a service with Quadlet (exam-style)","scenario":"As a regular user, create a Quadlet unit that runs an nginx container on port 8080, enable lingering, and make it start at boot.","hints":[],"steps":["loginctl enable-linger $USER","mkdir -p ~/.config/containers/systemd","cat > ~/.config/containers/systemd/webapp.container <<'EOF'","[Container]","Image=docker.io/library/nginx:latest","PublishPort=8080:80","[Install]","WantedBy=default.target","EOF","systemctl --user daemon-reload","systemctl --user start webapp.service"],"verify":["systemctl --user status webapp.service is active; curl http://localhost:8080 works; survives reboot"]},{"title":"Persistent storage in a Quadlet unit","scenario":"Extend your Quadlet unit to serve content from host ~/webroot with the correct SELinux label.","hints":[],"steps":["mkdir -p ~/webroot && echo \"quadlet page\" > ~/webroot/index.html","# add to the [Container] section:  Volume=%h/webroot:/usr/share/nginx/html:Z","systemctl --user daemon-reload && systemctl --user restart webapp.service"],"verify":["curl http://localhost:8080 shows \"quadlet page\" and it persists across restarts"]},{"title":"Legacy method: generate systemd","scenario":"For an existing running container, generate a systemd unit the older way and enable it as a user service.","hints":[],"steps":["podman run -d --name legacyweb -p 8081:80 nginx","mkdir -p ~/.config/systemd/user","podman generate systemd --new --name legacyweb --files","mv container-legacyweb.service ~/.config/systemd/user/","systemctl --user daemon-reload && systemctl --user enable --now container-legacyweb.service"],"verify":["systemctl --user is-active container-legacyweb.service is active"]},{"title":"Verify a service survives reboot","scenario":"Confirm your rootless container service comes back after a reboot (thanks to linger).","hints":[],"steps":["loginctl show-user $USER | grep Linger      # Linger=yes","systemctl --user is-enabled webapp.service 2>/dev/null || echo \"started via Quadlet\"","sudo reboot","# after login:","systemctl --user status webapp.service"],"verify":["the container is running again after the reboot without you starting it"]}]},{"day":62,"course":"RH134","title":"Containers: management, pods and troubleshooting","objective":"Consolidate container skills: pods, auto-update, cleanup and troubleshooting.","questions":[{"type":"mcq","q":"What is a Podman \"pod\"?","options":["A group of containers that share networking (like a Kubernetes pod)","A storage volume","A registry","A single image"],"answer":0,"explain":"Containers in a pod reach each other on localhost and share published ports."},{"type":"mcq","q":"Which command removes all stopped containers, unused images and networks to reclaim space?","options":["podman system prune","podman clean","podman gc","podman rm --old"],"answer":0,"explain":"Add -a to also remove unused images; it prompts before deleting."},{"type":"mcq","q":"`podman stats` shows:","options":["Live CPU, memory and I/O usage per container","The image layers","The logs","The registries"],"answer":0,"explain":"Useful for spotting a runaway container."},{"type":"mcq","q":"How do you copy a file from a running container to the host?","options":["podman cp web:/etc/nginx/nginx.conf ./nginx.conf","podman get web /etc/nginx/nginx.conf","podman pull web:/etc","podman export web"],"answer":0,"explain":"`podman cp` works in both directions, like docker cp."},{"type":"mcq","q":"A container keeps exiting immediately. The best first troubleshooting step is:","options":["Check its logs with podman logs <name>","Reboot the host","Delete the image","Disable SELinux"],"answer":0,"explain":"The logs usually show the crash reason (bad config, missing file, permission)."},{"type":"mcq","q":"`podman inspect` with `--format` is used to:","options":["Extract a specific field (like the IP or state) from a container's JSON","Edit the container","Restart it","Build an image"],"answer":0,"explain":"e.g. `--format '{{.NetworkSettings.IPAddress}}'`."},{"type":"mcq","q":"What does `podman auto-update` do (with a label on the container)?","options":["Checks the registry and restarts the container if a newer image is available","Updates the host OS","Rebuilds all images","Deletes old containers"],"answer":0,"explain":"It pairs with a systemd timer for hands-off image updates."},{"type":"cmd","q":"Create a pod named webpod that publishes host port 8080.","accept":["podman pod create --name webpod -p 8080:80"],"explain":"Then run containers with `--pod webpod`."},{"type":"cmd","q":"Show live resource usage for all running containers.","accept":["podman stats","podman stats --no-stream"],"explain":"--no-stream prints one snapshot instead of a live view."},{"type":"cmd","q":"Copy /etc/os-release out of the running container \"web\" to the current directory.","accept":["podman cp web:/etc/os-release ./os-release"],"explain":"Works while the container is running or stopped."}],"labs":[{"title":"Build a two-container pod (exam-plus)","scenario":"Create a pod publishing port 8080, run a web container inside it, and confirm it is reachable and that both share the pod's network.","hints":[],"steps":["podman pod create --name webpod -p 8080:80","podman run -d --pod webpod --name web nginx","podman pod ps","curl -s http://localhost:8080 | head -3"],"verify":["podman ps shows the container in webpod and the site responds"]},{"title":"Troubleshoot a crashing container","scenario":"Deliberately run a container with a bad command, read the logs to find why it exits, then fix it.","hints":[],"steps":["podman run -d --name broken registry.access.redhat.com/ubi9/ubi /bin/nosuchcommand","podman ps -a | grep broken        # Exited (127)","podman logs broken                # shows \"no such file or directory\"","podman rm broken","podman run -d --name fixed registry.access.redhat.com/ubi9/ubi sleep 300"],"verify":["podman ps shows \"fixed\" running; you diagnosed the failure from logs"]},{"title":"Clean up container resources","scenario":"List everything using space, then prune stopped containers and unused images safely.","hints":[],"steps":["podman ps -a; podman images; podman volume ls","podman container prune -f","podman image prune -a -f","podman system df"],"verify":["podman system df shows reclaimed space"]},{"title":"Extract and edit a config from a container","scenario":"Copy a config file out of a running container, inspect the container's IP, and copy an edited file back in.","hints":[],"steps":["podman run -d --name web nginx","podman cp web:/etc/nginx/nginx.conf ./nginx.conf","podman inspect web --format '{{.NetworkSettings.IPAddress}}'","# edit nginx.conf locally, then:","podman cp ./nginx.conf web:/etc/nginx/nginx.conf"],"verify":["the file is copied both ways and you retrieved the container IP"]}]},{"day":63,"course":"RH134","title":"Networking: advanced NetworkManager","objective":"Manage profiles, multiple addresses, routes and device behaviour with nmcli.","questions":[{"type":"mcq","q":"Where does NetworkManager on RHEL 9/10 store connection profiles by default?","options":["/etc/NetworkManager/system-connections/ as .nmconnection keyfiles","/etc/sysconfig/network-scripts/ifcfg-*","/etc/network/interfaces","/etc/netplan/"],"answer":0,"explain":"The old ifcfg format still works but keyfiles are the default; run `nmcli con reload` after hand-editing."},{"type":"mcq","q":"What does the `+` prefix do in `nmcli con mod eth0 +ipv4.addresses 10.0.0.5/24`?","options":["Appends to the list property without removing existing values","Replaces the whole list","Removes that address","Sets it only temporarily"],"answer":0,"explain":"Use `-` to remove one item; no prefix replaces the entire list."},{"type":"mcq","q":"A change made with `nmcli con mod` takes effect when you:","options":["Reactivate the connection (nmcli con up <name>)","Reboot only","Restart sshd","Save the file"],"answer":0,"explain":"Editing over SSH and changing the IP drops your session; use the console."},{"type":"mcq","q":"Which property makes a connection come up automatically at boot?","options":["connection.autoconnect yes","ipv4.method auto","connection.startup on","device.autostart yes"],"answer":0,"explain":"Check it with `nmcli -f connection.autoconnect con show <name>`."},{"type":"mcq","q":"How do you add a static route \"reach 192.168.50.0/24 via 192.168.1.254\" to a profile?","options":["nmcli con mod eth0 +ipv4.routes \"192.168.50.0/24 192.168.1.254\"","ip route add only","nmcli route add eth0 192.168.50.0/24","nmcli con mod eth0 gateway 192.168.50.0"],"answer":0,"explain":"This route persists in the profile, unlike a bare `ip route add`."},{"type":"mcq","q":"What does `ipv4.route-metric` control?","options":["The priority of this connection's routes (lower wins) when multiple paths exist","The MTU","The DNS order","The DHCP lease time"],"answer":0,"explain":"Useful when a host has two uplinks and you prefer one."},{"type":"cmd","q":"Show all connection profiles NetworkManager knows about.","accept":["nmcli con show","nmcli connection show"],"explain":"`nmcli device status` shows devices and which profile each uses."},{"type":"cmd","q":"Add a second IPv4 address 10.0.0.5/24 to the profile \"eth0\" without removing the first.","accept":["nmcli con mod eth0 +ipv4.addresses 10.0.0.5/24"],"explain":"Apply it with `nmcli con up eth0`."},{"type":"cmd","q":"Create a brand-new static connection profile \"lab\" on device eth1.","accept":["nmcli con add con-name lab type ethernet ifname eth1 ipv4.addresses 192.168.99.10/24 ipv4.method manual"],"explain":"Add `ipv4.gateway` and `ipv4.dns` as the task requires."},{"type":"cmd","q":"Reload connection files after editing a keyfile by hand.","accept":["nmcli con reload"],"explain":"Then `nmcli con up <name>` to apply."}],"labs":[{"title":"Multi-homed host (exam-plus)","scenario":"Give one interface two IPv4 addresses, a static route to a remote subnet, and make it all persist and autoconnect. Verify after a reboot.","hints":[],"steps":["nmcli con mod eth0 +ipv4.addresses 10.0.0.5/24","nmcli con mod eth0 +ipv4.routes \"192.168.50.0/24 192.168.1.254\"","nmcli con mod eth0 connection.autoconnect yes","nmcli con up eth0"],"verify":["ip -br a; ip route | grep 192.168.50; reboot and re-check"]},{"title":"Switch between two profiles on one NIC","scenario":"Create a static profile and keep the DHCP one; switch between them and confirm the active address each time.","hints":[],"steps":["nmcli con add con-name static-lab type ethernet ifname eth0 ipv4.addresses 172.16.0.10/24 ipv4.method manual","nmcli con up static-lab && ip -br a","nmcli con up \"System eth0\" && ip -br a"],"verify":["nmcli con show --active shows which profile is live each time"]},{"title":"Prefer one uplink with route metrics","scenario":"On a host with two connections, set route metrics so one is preferred, and confirm the default route uses it.","hints":[],"steps":["nmcli con mod primary ipv4.route-metric 100","nmcli con mod backup ipv4.route-metric 200","nmcli con up primary; nmcli con up backup"],"verify":["ip route shows the default via the lower-metric (primary) connection"]},{"title":"Inspect a profile in detail","scenario":"Show all IPv4 settings of a connection and the DNS it applies.","hints":[],"steps":["nmcli -f ipv4 con show eth0","nmcli dev show eth0 | grep -i dns","cat /etc/resolv.conf"],"verify":["you can read the profile's addresses, gateway, routes and DNS"]}]},{"day":64,"course":"RH134","title":"Networking: link aggregation (bonding)","objective":"Combine NICs into a bond for redundancy or throughput.","questions":[{"type":"mcq","q":"What is network bonding?","options":["Combining two or more NICs into one logical interface for redundancy or bandwidth","Splitting one NIC into many","A firewall feature","A DNS technique"],"answer":0,"explain":"On RHEL 9/10 use bonding; the older \"teaming\" (teamd) was removed."},{"type":"mcq","q":"Which bond mode gives simple failover with one active NIC at a time?","options":["active-backup (mode 1)","balance-rr (mode 0)","802.3ad (mode 4)","broadcast (mode 3)"],"answer":0,"explain":"active-backup needs no special switch support; 802.3ad (LACP) needs a configured switch."},{"type":"mcq","q":"What does the miimon bond option do?","options":["Sets how often (ms) to check link state for failover","Sets the IP address","Sets the MTU","Sets the DNS server"],"answer":0,"explain":"e.g. miimon=100 checks every 100 ms."},{"type":"mcq","q":"In a bond, the member interfaces are called:","options":["Ports (formerly \"slaves\"), controlled by the bond (the \"controller\")","Bridges","VLANs","Zones"],"answer":0,"explain":"Each port is its own connection profile with the bond as its controller/master."},{"type":"mcq","q":"Which file shows a bond's live status and active port?","options":["/proc/net/bonding/bond0","/etc/bond0.conf","/sys/bond0","/var/log/bond0"],"answer":0,"explain":"It lists the mode, each port's link state, and the currently active port."},{"type":"mcq","q":"Why use active-backup mode for a server with two switches?","options":["It survives a switch or cable failure with no special switch config","It doubles throughput automatically","It encrypts traffic","It is required for DNS"],"answer":0,"explain":"Redundancy without LACP; throughput bonding (802.3ad) needs switch support."},{"type":"cmd","q":"Create a bond interface bond0 in active-backup mode with miimon 100.","accept":["nmcli con add type bond con-name bond0 ifname bond0 bond.options \"mode=active-backup,miimon=100\""],"explain":"Give it an IP with `ipv4.addresses`/`ipv4.method manual` as the task requires."},{"type":"cmd","q":"Add the NIC eth1 as a port of bond0.","accept":["nmcli con add type ethernet con-name bond0-port1 ifname eth1 master bond0"],"explain":"Repeat for eth2 as bond0-port2; the ports have no IP of their own."},{"type":"cmd","q":"Show the live status and active port of bond0.","accept":["cat /proc/net/bonding/bond0"],"explain":"Also `nmcli device status` shows the bond and its ports."}],"labs":[{"title":"Build a redundant bond (exam-plus)","scenario":"Create bond0 (active-backup, miimon=100) with a static IP, add two NICs as ports, bring it up, and verify failover status.","hints":[],"steps":["nmcli con add type bond con-name bond0 ifname bond0 bond.options \"mode=active-backup,miimon=100\" ipv4.addresses 192.168.100.20/24 ipv4.method manual","nmcli con add type ethernet con-name bond0-p1 ifname eth1 master bond0","nmcli con add type ethernet con-name bond0-p2 ifname eth2 master bond0","nmcli con up bond0","cat /proc/net/bonding/bond0"],"verify":["ip -br a shows bond0 with the IP; the bonding file lists two ports and one active"]},{"title":"Test bond failover","scenario":"Bring down the currently active port and confirm the bond fails over to the other, keeping connectivity.","hints":[],"steps":["grep -i 'Currently Active' /proc/net/bonding/bond0","nmcli con down bond0-p1","cat /proc/net/bonding/bond0      # active port switched to p2","ping -c3 192.168.100.1"],"verify":["connectivity survives; the active port changed"]},{"title":"Persist and reboot-test the bond","scenario":"Ensure the bond and both ports autoconnect and survive a reboot.","hints":[],"steps":["nmcli -f connection.autoconnect con show bond0","nmcli con mod bond0 connection.autoconnect yes","reboot"],"verify":["after reboot: ip -br a shows bond0 up with two ports"]},{"title":"Inspect bond configuration","scenario":"Show the bond's options and each port's controller relationship.","hints":[],"steps":["nmcli -f bond.options con show bond0","nmcli -f connection.master,connection.slave-type con show bond0-p1"],"verify":["you can read the mode/miimon and confirm the ports belong to bond0"]}]},{"day":65,"course":"RH134","title":"Networking: advanced firewalld","objective":"Use zones, rich rules, masquerading and port forwarding.","questions":[{"type":"mcq","q":"A firewalld \"zone\" represents:","options":["A trust level with its own rules, bound to interfaces or source addresses","A DNS domain","A subnet mask","A VLAN"],"answer":0,"explain":"Common zones: public, trusted, drop, internal, dmz."},{"type":"mcq","q":"What does a rich rule let you do that a simple service/port rule cannot?","options":["Match on source address, log, rate-limit, and accept/reject/drop with fine control","Only open a port","Only close a port","Change the default zone"],"answer":0,"explain":"Rich rules combine source, service/port, action and logging in one rule."},{"type":"mcq","q":"What does `firewall-cmd --add-masquerade` enable?","options":["Source NAT, so traffic from an internal network is translated to the host's address","A new zone","Port 80 only","DNS forwarding"],"answer":0,"explain":"Needed when the host routes traffic for a private network to the internet."},{"type":"mcq","q":"A firewalld port-forward rule sends traffic arriving on one port to:","options":["Another port (and optionally another host) — e.g. 80 -> 8080","The default gateway","The DNS server","Nowhere"],"answer":0,"explain":"Use `--add-forward-port=port=80:proto=tcp:toport=8080`."},{"type":"mcq","q":"Which command permanently rejects SSH only from 192.168.50.0/24?","options":["firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" source address=\"192.168.50.0/24\" service name=\"ssh\" reject'","firewall-cmd --remove-service=ssh","firewall-cmd --add-port=22/tcp","firewall-cmd --block ssh"],"answer":0,"explain":"`man firewalld.richlanguage` has copyable examples for the exam."},{"type":"mcq","q":"What is the difference between \"reject\" and \"drop\" in a rule?","options":["reject replies that the connection is refused; drop silently discards it","They are identical","drop replies; reject is silent","reject is faster"],"answer":0,"explain":"drop makes the host appear offline to that source."},{"type":"cmd","q":"Add a rich rule that logs and drops all traffic from 10.0.0.66.","accept":["firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" source address=\"10.0.0.66\" log prefix=\"DROP66 \" level=\"info\" drop'"],"explain":"Reload after; check /var/log/messages or the journal for the log prefix."},{"type":"cmd","q":"Enable masquerading (source NAT) in the current zone permanently.","accept":["firewall-cmd --permanent --add-masquerade"],"explain":"Then `firewall-cmd --reload`."},{"type":"cmd","q":"Forward incoming TCP port 80 to port 8080 on this host.","accept":["firewall-cmd --permanent --add-forward-port=port=80:proto=tcp:toport=8080"],"explain":"Requires masquerade for forwarding to another host."},{"type":"cmd","q":"Put the source 192.168.10.0/24 into the trusted zone permanently.","accept":["firewall-cmd --permanent --zone=trusted --add-source=192.168.10.0/24"],"explain":"`--get-active-zones` shows which sources/interfaces map to which zone."}],"labs":[{"title":"Zone-based access control (exam-plus)","scenario":"Put your management subnet in the \"internal\" zone with ssh allowed, keep \"public\" for everything else with only http, and verify.","hints":[],"steps":["firewall-cmd --permanent --zone=internal --add-source=192.168.10.0/24 --add-service=ssh","firewall-cmd --permanent --zone=public --add-service=http","firewall-cmd --reload","firewall-cmd --get-active-zones"],"verify":["firewall-cmd --zone=internal --list-all and --zone=public --list-all match the intent"]},{"title":"Rich rule with logging","scenario":"Reject SSH from one subnet with a logged rich rule, test from that subnet, and read the log.","hints":[],"steps":["firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" source address=\"192.168.50.0/24\" service name=\"ssh\" log prefix=\"SSH-REJ \" level=\"info\" reject'","firewall-cmd --reload","# from a host in 192.168.50.0/24:  ssh <this-host>   -> refused","journalctl | grep 'SSH-REJ' | tail"],"verify":["the connection is rejected and logged"]},{"title":"Port forwarding","scenario":"Make the host accept web traffic on port 80 but serve it from a service on 8080, using firewalld.","hints":[],"steps":["firewall-cmd --permanent --add-masquerade","firewall-cmd --permanent --add-forward-port=port=80:proto=tcp:toport=8080","firewall-cmd --reload","# run something listening on 8080, then:","curl -s http://localhost:80 | head"],"verify":["traffic to :80 is served by the :8080 service"]},{"title":"Save runtime rules and audit","scenario":"Add a couple of runtime-only rules, make them permanent, and produce a full audit of every zone.","hints":[],"steps":["firewall-cmd --add-service=https        # runtime only","firewall-cmd --runtime-to-permanent","firewall-cmd --list-all-zones | less"],"verify":["the https rule persists and you have a full zone audit"]}]},{"day":66,"course":"RH134","title":"Networking: nftables","objective":"Understand and write basic nftables rulesets (the modern firewall backend).","questions":[{"type":"mcq","q":"What is nftables?","options":["The modern Linux packet-filtering framework that replaces iptables (and backs firewalld)","A DNS server","A routing daemon","A container tool"],"answer":0,"explain":"On RHEL, firewalld uses the nftables backend by default."},{"type":"mcq","q":"In nftables, the top-level container of chains is a:","options":["Table (with a family such as inet, ip, ip6)","Zone","Bridge","Socket"],"answer":0,"explain":"A table holds chains; chains hold rules."},{"type":"mcq","q":"A base chain must declare its:","options":["Type, hook (input/forward/output), and priority","IP address","DNS server","MTU"],"answer":0,"explain":"e.g. `type filter hook input priority 0; policy drop;`"},{"type":"mcq","q":"Which command shows the entire active nftables ruleset?","options":["nft list ruleset","nft show all","nft dump","nftables --list"],"answer":0,"explain":"Save it to /etc/nftables.conf to make it persistent via the nftables service."},{"type":"mcq","q":"How do you make an nftables ruleset load at boot on RHEL?","options":["Put it in /etc/nftables.conf (or an included file) and enable nftables.service","Add it to /etc/fstab","Put it in crontab","Nothing; it is automatic"],"answer":0,"explain":"`systemctl enable --now nftables` loads /etc/sysconfig/nftables.conf includes."},{"type":"mcq","q":"Why generally NOT mix raw nftables rules with firewalld on the same host?","options":["firewalld manages its own nftables rules; hand rules can conflict or be overwritten","nftables is slower","It is illegal","They never conflict"],"answer":0,"explain":"Pick one manager per host; for the RHCSA, firewalld is the expected tool."},{"type":"cmd","q":"Show the complete active nftables ruleset.","accept":["nft list ruleset"],"explain":"With firewalld running, you will see the firewalld-generated tables here."},{"type":"cmd","q":"Create a new table named filter in the inet family.","accept":["nft add table inet filter"],"explain":"inet covers both IPv4 and IPv6."},{"type":"cmd","q":"Add an input base chain that drops by default to the inet filter table.","accept":["nft add chain inet filter input '{ type filter hook input priority 0; policy drop; }'"],"explain":"Then add accept rules for loopback, established traffic and SSH."},{"type":"cmd","q":"List the ruleset of just the inet filter table.","accept":["nft list table inet filter"],"explain":"Useful to review one table without the whole ruleset."}],"labs":[{"title":"Build a minimal nftables firewall (lab, non-firewalld host)","scenario":"On a test host NOT using firewalld, build a small ruleset: default-drop input, allow loopback, established, and SSH; then verify.","hints":[],"steps":["nft add table inet filter","nft add chain inet filter input '{ type filter hook input priority 0; policy drop; }'","nft add rule inet filter input iif lo accept","nft add rule inet filter input ct state established,related accept","nft add rule inet filter input tcp dport 22 accept","nft list ruleset"],"verify":["you can still SSH in and other ports are dropped"]},{"title":"Persist an nftables ruleset","scenario":"Save your working ruleset to /etc/nftables.conf and enable it at boot.","hints":[],"steps":["nft list ruleset > /etc/nftables.conf","# ensure the file starts with: #!/usr/sbin/nft -f  and  flush ruleset","systemctl enable --now nftables","systemctl reboot"],"verify":["after reboot: nft list ruleset shows your rules"]},{"title":"See what firewalld generates","scenario":"On a firewalld host, view the nftables rules firewalld created, to understand the relationship.","hints":[],"steps":["systemctl is-active firewalld","nft list ruleset | head -40","firewall-cmd --list-all"],"verify":["you can see firewalld's rules expressed as nftables"]},{"title":"Add and delete a rule by handle","scenario":"Add a rule, list with handles, then delete that specific rule by its handle.","hints":[],"steps":["nft add rule inet filter input tcp dport 8080 accept","nft -a list table inet filter        # shows # handle N","nft delete rule inet filter input handle <N>"],"verify":["the 8080 rule is gone; the rest remain"]}]},{"day":67,"course":"RH134","title":"Networking: bridges, VLANs and routing","objective":"Create bridges and VLAN interfaces and manage static routing.","questions":[{"type":"mcq","q":"A software bridge (br0) is commonly used to:","options":["Connect virtual machines/containers to the physical network as if on the same switch","Encrypt traffic","Replace DNS","Speed up disks"],"answer":0,"explain":"VMs attach to the bridge and appear on the LAN directly."},{"type":"mcq","q":"A VLAN interface (eth0.10) lets one physical NIC:","options":["Carry multiple isolated networks tagged with 802.1Q VLAN IDs","Double its speed","Act as a router only","Run DHCP"],"answer":0,"explain":"The switch port must be a trunk allowing that VLAN."},{"type":"mcq","q":"Which nmcli command creates VLAN 10 on device eth0?","options":["nmcli con add type vlan con-name vlan10 ifname eth0.10 dev eth0 id 10","nmcli con add type ethernet vlan 10","nmcli vlan add eth0 10","nmcli con mod eth0 vlan 10"],"answer":0,"explain":"The interface name convention is device.vlanid (eth0.10)."},{"type":"mcq","q":"A static route added with `ip route add` (not via nmcli) is:","options":["Lost on reboot / connection restart unless stored in the profile","Permanent","Encrypted","Applied to all hosts"],"answer":0,"explain":"Persist routes with `nmcli con mod ... +ipv4.routes`."},{"type":"mcq","q":"Policy routing with `ip rule` lets you:","options":["Choose a routing table based on source address or other selectors","Encrypt packets","Change the hostname","Filter ports"],"answer":0,"explain":"Advanced multi-uplink setups use multiple routing tables plus ip rule."},{"type":"mcq","q":"To let a Linux host forward packets between networks you must:","options":["Enable IP forwarding (net.ipv4.ip_forward=1) persistently","Add a DNS record","Open port 53","Disable SELinux"],"answer":0,"explain":"Set it in /etc/sysctl.d/ and apply with `sysctl --system`."},{"type":"cmd","q":"Create a bridge br0 with nmcli.","accept":["nmcli con add type bridge con-name br0 ifname br0"],"explain":"Then attach a NIC: `nmcli con add type ethernet con-name br0-port ifname eth1 master br0`."},{"type":"cmd","q":"Create VLAN 20 on eth0 with a static IP.","accept":["nmcli con add type vlan con-name vlan20 ifname eth0.20 dev eth0 id 20 ipv4.addresses 192.168.20.5/24 ipv4.method manual"],"explain":"Bring it up with `nmcli con up vlan20`."},{"type":"cmd","q":"Enable IPv4 forwarding right now (runtime).","accept":["sysctl -w net.ipv4.ip_forward=1"],"explain":"Persist it in /etc/sysctl.d/99-forward.conf with `net.ipv4.ip_forward=1`."},{"type":"cmd","q":"Add a persistent static route to 10.10.0.0/16 via 192.168.1.254 on profile eth0.","accept":["nmcli con mod eth0 +ipv4.routes \"10.10.0.0/16 192.168.1.254\""],"explain":"Apply with `nmcli con up eth0`; verify with `ip route`."}],"labs":[{"title":"Create a bridge for VMs (exam-plus)","scenario":"Build br0, attach a physical NIC to it, give the bridge a static IP, and confirm it carries the IP instead of the NIC.","hints":[],"steps":["nmcli con add type bridge con-name br0 ifname br0 ipv4.addresses 192.168.1.30/24 ipv4.gateway 192.168.1.1 ipv4.method manual","nmcli con add type ethernet con-name br0-port ifname eth1 master br0","nmcli con up br0","ip -br a"],"verify":["br0 holds the IP; eth1 is a port of the bridge; connectivity works"]},{"title":"VLAN interface","scenario":"Create VLAN 30 on eth0 with its own subnet and verify tagging works to the gateway.","hints":[],"steps":["nmcli con add type vlan con-name vlan30 ifname eth0.30 dev eth0 id 30 ipv4.addresses 192.168.30.5/24 ipv4.method manual","nmcli con up vlan30","ip -d link show eth0.30 | grep -i vlan","ping -c2 192.168.30.1"],"verify":["the vlan interface exists, is tagged 30, and reaches its gateway"]},{"title":"Turn a host into a router","scenario":"Enable persistent IP forwarding and add the routes so a host bridges two subnets, then confirm forwarding is on.","hints":[],"steps":["echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-forward.conf","sysctl --system","sysctl net.ipv4.ip_forward","firewall-cmd --permanent --add-masquerade && firewall-cmd --reload"],"verify":["net.ipv4.ip_forward = 1 and traffic can route between the two attached subnets"]},{"title":"Persistent static routing","scenario":"Add two persistent routes to a profile and confirm they appear in the routing table after reactivation.","hints":[],"steps":["nmcli con mod eth0 +ipv4.routes \"10.10.0.0/16 192.168.1.254\"","nmcli con mod eth0 +ipv4.routes \"172.16.0.0/12 192.168.1.253\"","nmcli con up eth0","ip route | grep -E '10.10|172.16'"],"verify":["both routes are present and survive a reboot"]}]},{"day":68,"course":"RH134","title":"Networking: troubleshooting and diagnostics","objective":"Diagnose connectivity, ports, DNS and performance methodically.","questions":[{"type":"mcq","q":"What is a sound order for troubleshooting \"I can't reach a server\"?","options":["Link -> IP/route -> gateway -> DNS -> the remote port/service","DNS first, always","Reboot first","Reinstall the NIC driver"],"answer":0,"explain":"Work up the stack: is the link up, do I have an IP and route, can I reach the gateway, does the name resolve, is the port open?"},{"type":"mcq","q":"Which command shows listening TCP/UDP ports with the owning process?","options":["ss -tulpn","netstat -r","ip route","dig"],"answer":0,"explain":"t=TCP, u=UDP, l=listening, p=process, n=numeric."},{"type":"mcq","q":"`ping` succeeds to an IP but a website fails by name. The likely problem is:","options":["DNS resolution","The cable","The default route","The firewall on your host"],"answer":0,"explain":"Test with `dig <name>` or `getent hosts <name>`."},{"type":"mcq","q":"Which tool combines traceroute and ping to show per-hop loss over time?","options":["mtr","ss","ethtool","nmcli"],"answer":0,"explain":"mtr is excellent for spotting a flaky hop."},{"type":"mcq","q":"`ethtool eth0` is used to check:","options":["Link speed, duplex and whether the link is detected on a NIC","DNS servers","Firewall rules","Routes"],"answer":0,"explain":"A half-duplex or down link explains many \"slow/no network\" issues."},{"type":"mcq","q":"Where do you look for NetworkManager errors during troubleshooting?","options":["journalctl -u NetworkManager","/var/log/dns","/etc/hosts","dmesg only"],"answer":0,"explain":"Add `-b` for this boot, `-f` to follow live while you reactivate a connection."},{"type":"mcq","q":"`getent hosts server1` is useful because it:","options":["Resolves a name using the system's full nsswitch order (files + DNS), like real apps do","Only queries DNS","Only reads /etc/hosts","Pings the host"],"answer":0,"explain":"It reflects what applications actually see, unlike a raw DNS query."},{"type":"cmd","q":"Show all interfaces, their state and IPs in one short line each.","accept":["ip -br a","ip -br addr"],"explain":"`ip -br link` shows just link state; great for a quick health check."},{"type":"cmd","q":"Show the routing table including the default gateway.","accept":["ip route","ip route show"],"explain":"The default route line (`default via ...`) is the gateway."},{"type":"cmd","q":"Test whether TCP port 443 is open on a remote host without extra tools.","accept":["nc -zv 192.168.1.50 443","timeout 3 bash -c 'echo > /dev/tcp/192.168.1.50/443 && echo open'"],"explain":"`nc -z` scans without sending data; authorized targets only."},{"type":"cmd","q":"Follow NetworkManager's log live while you reactivate a connection.","accept":["journalctl -u NetworkManager -f"],"explain":"In another terminal run `nmcli con up <name>` and watch the messages."}],"labs":[{"title":"Methodical connectivity triage (exam-plus)","scenario":"A host cannot reach an internal server by name. Work the stack: check link, IP/route, gateway, DNS, then the remote port, and identify the failing layer.","hints":[],"steps":["ip -br a; ip -br link            # link + IP","ip route                          # default route present?","ping -c2 $(ip route | awk '/default/{print $3}')   # gateway reachable?","getent hosts server1              # does the name resolve?","nc -zv server1 22                 # is the service port open?"],"verify":["you can state which layer is broken and the fix"]},{"title":"DNS troubleshooting","scenario":"Diagnose a name that will not resolve: check the resolver, query directly, and confirm the search domain.","hints":[],"steps":["cat /etc/resolv.conf","dig server1.example.com +short","getent hosts server1.example.com","nmcli dev show | grep -i dns"],"verify":["you can tell whether it is a resolver, record, or search-domain problem"]},{"title":"Port and service check","scenario":"Find what is listening locally, then verify a remote host's port is reachable from here.","hints":[],"steps":["ss -tulpn","ss -tulpn | grep :443","nc -zv 192.168.1.50 443"],"verify":["you know which local ports listen and whether the remote port is open"]},{"title":"Capture and read traffic for a stubborn issue","scenario":"On an authorized host, capture a few packets of a failing connection to see where it stops.","hints":[],"steps":["sudo tcpdump -i eth0 -n host 192.168.1.50 and port 443 -c 20","# look for SYN with no SYN-ACK (blocked/no service) vs RST (refused)"],"verify":["you can interpret the handshake to locate the failure"]},{"title":"Link-layer check","scenario":"Confirm a NIC's link, speed and duplex, and review recent driver/link messages.","hints":[],"steps":["ethtool eth0 | grep -Ei 'speed|duplex|link detected'","journalctl -k | grep -i eth0 | tail"],"verify":["you can confirm the physical link is healthy or spot a flapping NIC"]}]}]},{"id":"secplus","name":"CompTIA Security+ (SY0-701)","exam":"CompTIA Security+ · SY0-701","short":"Security+","days":[{"day":1,"course":"1 Concepts","title":"The CIA triad and security goals","objective":"Compare and contrast the core security concepts that every other topic builds on.","questions":[{"type":"mcq","q":"What does the \"C\" in the CIA triad stand for?","options":["Confidentiality — data is seen only by those authorized","Control","Compliance","Continuity"],"answer":0,"explain":"CIA = Confidentiality, Integrity, Availability. It is the foundation of every security decision."},{"type":"mcq","q":"Encrypting a hard drive primarily protects which part of the CIA triad?","options":["Confidentiality","Integrity","Availability","Authentication"],"answer":0,"explain":"Encryption stops unauthorized reading. Hashing protects integrity; backups and redundancy protect availability."},{"type":"mcq","q":"A hash value is used to verify that a file has not changed. Which goal is this?","options":["Integrity","Confidentiality","Availability","Non-repudiation"],"answer":0,"explain":"If the hash still matches, the data is intact. A changed byte changes the hash."},{"type":"mcq","q":"Which concept ensures a sender cannot later deny sending a message?","options":["Non-repudiation","Confidentiality","Availability","Authorization"],"answer":0,"explain":"Digital signatures provide non-repudiation because only the sender holds the private key."},{"type":"mcq","q":"A DDoS attack most directly threatens which security goal?","options":["Availability","Confidentiality","Integrity","Authentication"],"answer":0,"explain":"Flooding a service so real users cannot reach it is an availability attack."},{"type":"mcq","q":"What is the difference between authentication and authorization?","options":["Authentication proves who you are; authorization decides what you may do","They are the same","Authorization proves identity; authentication grants access","Authentication is only for administrators"],"answer":0,"explain":"You authenticate (log in), then the system authorizes (checks permissions)."},{"type":"mcq","q":"Which term describes the assurance that a system or data is available when needed?","options":["Availability","Integrity","Confidentiality","Accounting"],"answer":0,"explain":"Achieved with redundancy, backups, failover and DDoS protection."},{"type":"mcq","q":"In AAA, what does the third A (Accounting) provide?","options":["A record of what a user did, for auditing","Faster authentication","Automatic authorization","Anti-malware"],"answer":0,"explain":"Authentication, Authorization, Accounting — logs and audit trails are the accounting piece."},{"type":"cmd","q":"On Linux, generate a SHA-256 hash of the file report.pdf to check its integrity.","accept":["sha256sum report.pdf"],"explain":"Compare the value later; a single changed bit produces a completely different hash."}],"labs":[{"title":"Prove integrity with hashing","scenario":"Create a file, hash it, change one character, and hash it again to see the value change completely.","hints":[],"steps":["echo \"salary: 50000\" > payroll.txt","sha256sum payroll.txt","sed -i 's/50000/90000/' payroll.txt","sha256sum payroll.txt"],"verify":["the two hashes are completely different"]},{"title":"Map controls to the CIA triad","scenario":"For each control, write down which CIA goal it mainly serves: full-disk encryption, RAID, a load balancer, a digital signature, a firewall rule blocking a port, a daily backup.","hints":["One control can serve more than one goal, but pick the primary."],"steps":["# encryption -> Confidentiality","# RAID / load balancer / backup -> Availability","# digital signature / file hash -> Integrity (and signatures add non-repudiation)"],"verify":["you can justify each mapping in one sentence"]},{"title":"Spot the goal being attacked","scenario":"For each scenario name the CIA goal harmed: (a) ransomware encrypts your files, (b) an attacker reads your email, (c) a hacker alters a bank balance.","hints":[],"steps":["# (a) Availability (you can't reach your data) -- and Confidentiality if copied","# (b) Confidentiality","# (c) Integrity"],"verify":["you can explain each choice"]}]},{"day":2,"course":"1 Concepts","title":"Security control types","objective":"Categorise controls by type (technical, managerial, operational, physical) and function (preventive, detective, corrective, etc.).","questions":[{"type":"mcq","q":"A firewall is which control TYPE?","options":["Technical (also called logical)","Managerial","Physical","Operational"],"answer":0,"explain":"Technical controls are enforced by technology. A security policy is managerial; a guard is physical."},{"type":"mcq","q":"A written security policy is which control type?","options":["Managerial (administrative)","Technical","Physical","Compensating"],"answer":0,"explain":"Managerial controls are the policies and procedures that direct the security program."},{"type":"mcq","q":"Security guards, fences and locks are which control type?","options":["Physical","Technical","Managerial","Detective"],"answer":0,"explain":"Physical controls protect the tangible world — buildings, hardware, people."},{"type":"mcq","q":"A backup is which control FUNCTION?","options":["Corrective — it restores after an incident","Preventive","Deterrent","Detective"],"answer":0,"explain":"Corrective controls fix or recover. Backups let you recover from ransomware or hardware failure."},{"type":"mcq","q":"Motion-sensor lights and warning signs are which control function?","options":["Deterrent — they discourage an attacker from trying","Preventive","Corrective","Detective"],"answer":0,"explain":"A deterrent influences behaviour; a preventive control actually blocks the action."},{"type":"mcq","q":"Which control function is an intrusion DETECTION system (IDS)?","options":["Detective","Preventive","Corrective","Deterrent"],"answer":0,"explain":"An IDS alerts you that something happened. An IPS that blocks it is preventive."},{"type":"mcq","q":"What is a compensating control?","options":["An alternative control used when the primary control is not feasible","A control that pays for damages","A physical control only","A control that replaces all others permanently"],"answer":0,"explain":"Example: if you cannot patch a legacy server, you isolate it on its own VLAN as
