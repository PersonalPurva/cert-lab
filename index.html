 removing the first one.","hints":[],"steps":["nmcli con mod \"<profile>\" +ipv4.addresses 10.0.0.11/24","nmcli con up \"<profile>\""],"verify":["ip -br a"]},{"title":"Local name resolution","scenario":"Add node1 and node2 (short and full names) to /etc/hosts on both machines. Resolve and ping by name.","hints":[],"steps":["echo '192.168.122.11 node1.lab.example.com node1' >> /etc/hosts","echo '192.168.122.12 node2.lab.example.com node2' >> /etc/hosts","getent hosts node2"],"verify":["ping -c 2 node2"]}]},{"day":17,"course":"RH124","title":"Networking: IPv6, DNS and troubleshooting","objective":"Configure IPv6 addresses, name resolution and network services at boot.","questions":[{"type":"cmd","q":"Give connection eth0 the static IPv6 address fd00:10::10/64 with the manual method.","accept":["nmcli con mod eth0 ipv6.addresses fd00:10::10/64 ipv6.method manual","nmcli connection modify eth0 ipv6.addresses fd00:10::10/64 ipv6.method manual","nmcli con mod eth0 ipv6.method manual ipv6.addresses fd00:10::10/64"],"explain":"Add `ipv6.gateway fd00:10::1` if the task gives a gateway, then `nmcli con up eth0`."},{"type":"mcq","q":"What is the IPv6 loopback address?","options":["::1","127.0.0.1","fe80::1","::"],"answer":0,"explain":"`::` on its own means the all-zero (unspecified) address."},{"type":"mcq","q":"Addresses beginning with fe80:: are what kind of IPv6 address?","options":["Link-local, created automatically on every IPv6 interface","Global addresses routed on the internet","Multicast addresses","Loopback addresses"],"answer":0,"explain":"Your static address shows as \"scope global\" in `ip a` next to the fe80:: link-local one."}],"labs":[]},{"day":18,"course":"RH124","title":"RPM and DNF packages","objective":"Install and remove RPM software packages; query the RPM database.","questions":[{"type":"cmd","q":"Find which installed package owns the file /etc/ssh/sshd_config.","accept":["rpm -qf /etc/ssh/sshd_config","dnf provides /etc/ssh/sshd_config"],"explain":"`rpm -qf` only looks at installed packages; `dnf provides` also searches repositories."},{"type":"cmd","q":"List the configuration files that belong to the chrony package.","accept":["rpm -qc chrony"],"explain":"-qc lists config files, -qd docs, -ql all files, -qi package info."},{"type":"cmd","q":"Find which package provides the semanage command, even if it is not installed yet.","accept":["dnf provides semanage","dnf provides */semanage","dnf provides '*/semanage'","dnf whatprovides semanage","yum provides semanage"],"explain":"The answer is policycoreutils-python-utils. You will need it for SELinux tasks."},{"type":"mcq","q":"What is the advantage of `dnf install ./pkg.rpm` over `rpm -ivh pkg.rpm`?","options":["dnf also installs the dependencies from the enabled repositories","rpm cannot install local files","dnf skips the signature check","There is no difference"],"answer":0,"explain":"rpm only reports missing dependencies and stops."},{"type":"cmd","q":"List every installed package with \"http\" in its name.","accept":["rpm -qa | grep http","rpm -qa '*http*'","dnf list installed | grep http"],"explain":"rpm -qa prints every installed package."},{"type":"mcq","q":"What does `dnf history undo 12` do?","options":["Reverses the changes made by transaction 12","Deletes history entry 12","Repeats transaction 12","Shows the details of transaction 12"],"answer":0,"explain":"`dnf history` lists transactions and `dnf history info 12` shows one."},{"type":"cmd","q":"Install the package group \"Development Tools\".","accept":["dnf group install \"Development Tools\"","dnf group install 'Development Tools'","dnf groupinstall \"Development Tools\"","yum groupinstall \"Development Tools\""],"explain":"`dnf group list` shows the available groups."},{"type":"mcq","q":"What happens to the running kernel when `dnf update` installs a newer kernel?","options":["The new kernel is added next to the old ones and used after a reboot","The old kernel is removed immediately","The system reboots automatically","Kernels are never updated by dnf"],"answer":0,"explain":"Kernels are \"install-only\" packages, so you can boot an older one from GRUB if the new one fails."},{"type":"cmd","q":"Remove the httpd package.","accept":["dnf remove httpd","dnf erase httpd","yum remove httpd"],"explain":"dnf also removes packages that depend on httpd. Read the list before confirming."}],"labs":[{"title":"Query the RPM database","scenario":"Answer with rpm commands only: which package owns /usr/bin/ls, which files does openssh-server install, where are its config files, and when was it installed?","hints":[],"steps":["rpm -qf /usr/bin/ls","rpm -ql openssh-server","rpm -qc openssh-server","rpm -qi openssh-server | grep -i 'install date'"],"verify":["rpm -q openssh-server"]},{"title":"Install from a local RPM file","scenario":"Download the tree package as an .rpm file into /root/rpms without installing it. Inspect the file, then install it from the local file.","hints":[],"steps":["mkdir -p /root/rpms && cd /root/rpms","dnf download tree","rpm -qip tree-*.rpm","rpm -qlp tree-*.rpm","dnf install -y ./tree-*.rpm"],"verify":["rpm -q tree && tree -L 1 /etc | head"]},{"title":"Use dnf history","scenario":"Install the packages zsh and tmux in one transaction, find that transaction in the history, then undo it.","hints":[],"steps":["dnf install -y zsh tmux","dnf history","dnf history info last","dnf history undo last -y"],"verify":["rpm -q zsh tmux"]},{"title":"Work with package groups","scenario":"List the available groups, show what \"Development Tools\" contains, and install it.","hints":[],"steps":["dnf group list","dnf group info \"Development Tools\"","dnf group install -y \"Development Tools\""],"verify":["rpm -q gcc make"]}]},{"day":19,"course":"RH124","title":"Repositories and Flatpak","objective":"Configure access to RPM repositories and Flatpak repositories; install and remove Flatpak packages.","questions":[{"type":"mcq","q":"Where do DNF repository definitions go?","options":["/etc/yum.repos.d/ in files ending in .repo","/etc/dnf/repos/","/etc/dnf/dnf.conf only","/var/lib/dnf/repos/"],"answer":0,"explain":"Every file in /etc/yum.repos.d/ ending in `.repo` is read. The file name does not matter."},{"type":"mcq","q":"Which set of lines is enough for a working repository section?","options":["[id], name, baseurl, enabled=1 and gpgcheck (0 or 1 with a gpgkey)","[id] and enabled=1 only","name and mirrorlist only","baseurl and priority only"],"answer":0,"explain":"A typo in baseurl is the most common exam mistake. Test with `dnf repolist` and install a package."},{"type":"cmd","q":"Add a repository for http://repo.lab.example.com/BaseOS with dnf config-manager.","accept":["dnf config-manager --add-repo http://repo.lab.example.com/BaseOS","dnf config-manager --add-repo=http://repo.lab.example.com/BaseOS"],"explain":"It writes a new .repo file. If the task asks for gpgcheck=0, edit the file afterwards."},{"type":"cmd","q":"List the enabled repositories.","accept":["dnf repolist","dnf repolist enabled","yum repolist"],"explain":"`dnf repolist all` includes the disabled ones."},{"type":"mcq","q":"What is the baseurl for a BaseOS repository on a DVD mounted at /mnt/iso?","options":["file:///mnt/iso/BaseOS","/mnt/iso/BaseOS","iso:///mnt/iso/BaseOS","file://mnt/iso/BaseOS"],"answer":0,"explain":"`file://` plus the absolute path `/mnt/iso/...` gives three slashes."},{"type":"cmd","q":"Add the Flathub remote only if it is not already configured.","accept":["flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo","flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo"],"explain":"In the exam, use the remote name and URL the task gives you."},{"type":"cmd","q":"List the configured Flatpak remotes.","accept":["flatpak remotes","flatpak remote-list"],"explain":"`flatpak remote-ls <remote>` lists the apps a remote offers."},{"type":"cmd","q":"Install the app org.gnome.Calculator from the flathub remote.","accept":["flatpak install flathub org.gnome.Calculator","flatpak install -y flathub org.gnome.Calculator"],"explain":"`flatpak list` shows installed apps; `flatpak run <app-id>` starts one."},{"type":"mcq","q":"Where does `flatpak install` put apps if you do not pass --user?","options":["System-wide, for all users (needs admin rights)","Only in your home directory","In /opt/flatpak for root only","In /tmp until the next reboot"],"answer":0,"explain":"`--user` installs just for you, under ~/.local/share/flatpak."},{"type":"cmd","q":"Uninstall the org.gnome.Calculator Flatpak app.","accept":["flatpak uninstall org.gnome.Calculator","flatpak uninstall -y org.gnome.Calculator"],"explain":"`flatpak uninstall --unused` removes runtimes that no app needs any more."}],"labs":[{"title":"Local repository from the RHEL ISO","scenario":"Attach the RHEL 10 ISO to your VM. Mount it permanently at /mnt/iso and create /etc/yum.repos.d/local.repo with BaseOS and AppStream repositories from it. Install httpd from it to prove it works.","hints":[],"steps":["mkdir /mnt/iso","echo '/dev/sr0  /mnt/iso  iso9660  ro,defaults  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a","vim /etc/yum.repos.d/local.repo","# [BaseOS]","# name=BaseOS","# baseurl=file:///mnt/iso/BaseOS","# enabled=1","# gpgcheck=0","#","# [AppStream]","# name=AppStream","# baseurl=file:///mnt/iso/AppStream","# enabled=1","# gpgcheck=0","dnf clean all"],"verify":["dnf repolist","dnf install -y httpd"]},{"title":"Network repositories (exam style)","scenario":"On node2, publish the ISO over HTTP by linking /mnt/iso into /var/www/html/rhel10. Then on node1, configure repos BaseOS and AppStream pointing to http://node2/rhel10/BaseOS and http://node2/rhel10/AppStream.","hints":[],"steps":["# node2:","dnf install -y httpd && systemctl enable --now httpd","mkdir -p /var/www/html/rhel10 && mount --bind /mnt/iso /var/www/html/rhel10","firewall-cmd --permanent --add-service=http && firewall-cmd --reload","# node1:","vim /etc/yum.repos.d/exam.repo","# [BaseOS]","# name=BaseOS","# baseurl=http://node2/rhel10/BaseOS","# enabled=1","# gpgcheck=0","# (same block for [AppStream] with /AppStream)"],"verify":["dnf repolist && dnf install -y tree"]},{"title":"Flatpak end to end","scenario":"Install the flatpak package, add the Flathub remote, search for a calculator app, install it system-wide, list installed apps, and uninstall it. (Needs internet on the VM.)","hints":[],"steps":["dnf install -y flatpak","flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo","flatpak search calculator","flatpak install -y flathub org.gnome.Calculator","flatpak list","flatpak uninstall -y org.gnome.Calculator"],"verify":["flatpak remotes"]},{"title":"Enable and disable repositories","scenario":"Disable the AppStream repo, see that httpd can no longer be found, then enable it again. Also try a single command that ignores it only once.","hints":[],"steps":["dnf config-manager --set-disabled AppStream","dnf info httpd","dnf config-manager --set-enabled AppStream","dnf --disablerepo=AppStream info httpd"],"verify":["dnf repolist all"]}]},{"day":20,"course":"RH124","title":"Archives and secure file transfer","objective":"Archive, compress, unpack and uncompress files with tar, gzip and bzip2; securely transfer files between systems.","questions":[{"type":"cmd","q":"Create the gzip-compressed archive /root/etc.tar.gz of /etc.","accept":["tar -czf /root/etc.tar.gz /etc","tar czf /root/etc.tar.gz /etc","tar -czvf /root/etc.tar.gz /etc","tar -zcf /root/etc.tar.gz /etc","tar -zcvf /root/etc.tar.gz /etc"],"explain":"c = create, z = gzip, f = file name, v = list files as they are added."},{"type":"cmd","q":"Create the bzip2-compressed archive /root/local.tar.bz2 of /usr/local.","accept":["tar -cjf /root/local.tar.bz2 /usr/local","tar cjf /root/local.tar.bz2 /usr/local","tar -cjvf /root/local.tar.bz2 /usr/local","tar -jcf /root/local.tar.bz2 /usr/local","tar -jcvf /root/local.tar.bz2 /usr/local"],"explain":"j = bzip2. The bzip2 package must be installed."},{"type":"mcq","q":"Which tar option compresses with xz?","options":["-J","-x","-X","-z"],"answer":0,"explain":"Summary: -z gzip (.gz), -j bzip2 (.bz2), -J xz (.xz)."},{"type":"cmd","q":"List the contents of /root/etc.tar.gz without extracting it.","accept":["tar -tzf /root/etc.tar.gz","tar -tf /root/etc.tar.gz","tar tf /root/etc.tar.gz","tar -tvf /root/etc.tar.gz","tar -tzvf /root/etc.tar.gz"],"explain":"Modern tar detects the compression when reading, so -z is optional here."},{"type":"cmd","q":"Extract /root/etc.tar.gz into the existing directory /tmp/restore.","accept":["tar -xzf /root/etc.tar.gz -C /tmp/restore","tar -xf /root/etc.tar.gz -C /tmp/restore","tar xf /root/etc.tar.gz -C /tmp/restore","tar -xvf /root/etc.tar.gz -C /tmp/restore","tar -xzvf /root/etc.tar.gz -C /tmp/restore"],"explain":"`-C` changes to that directory before extracting."},{"type":"mcq","q":"tar prints \"Removing leading '/' from member names\". What does that mean?","options":["Paths are stored relative, so extracting never overwrites the original location by accident","The archive is damaged","Files in / were skipped","You must run tar as root"],"answer":0,"explain":"When you extract, the files go under your current directory (or the -C directory)."},{"type":"cmd","q":"Copy /etc/hosts into /tmp on serverb, logging in as root over SSH.","accept":["scp /etc/hosts root@serverb:/tmp","scp /etc/hosts root@serverb:/tmp/"],"explain":"Reverse the arguments to copy from the remote host. Add `-r` for directories."},{"type":"mcq","q":"What does a trailing slash on the source mean in `rsync -av /var/www/ serverb:/backup/www`?","options":["The contents of /var/www are copied into /backup/www, not the www directory itself","It is ignored","Only hidden files are copied","rsync deletes files on the target"],"answer":0,"explain":"Without the slash you get /backup/www/www."},{"type":"mcq","q":"What does `gzip notes.txt` do?","options":["Replaces notes.txt with the compressed notes.txt.gz","Creates notes.txt.gz and keeps notes.txt","Creates a tar archive","Compresses the whole directory"],"answer":0,"explain":"Use `gunzip notes.txt.gz` to reverse it, or `gzip -k` to keep the original."}],"labs":[{"title":"Compare compression types","scenario":"Archive /etc three times, with gzip, bzip2 and xz, into /root/backups. Compare the sizes and check each file's type.","hints":[],"steps":["mkdir -p /root/backups","tar -czf /root/backups/etc.tar.gz /etc","tar -cjf /root/backups/etc.tar.bz2 /etc","tar -cJf /root/backups/etc.tar.xz /etc","ls -lh /root/backups"],"verify":["file /root/backups/*"]},{"title":"Backup archive (exam classic)","scenario":"Create /root/backup.tar.bz2 containing /usr/local, compressed with bzip2. Confirm it is valid and lists the expected files.","hints":[],"steps":["tar -cjf /root/backup.tar.bz2 /usr/local"],"verify":["file /root/backup.tar.bz2","tar -tjf /root/backup.tar.bz2 | head"]},{"title":"Restore a single file","scenario":"From /root/backups/etc.tar.gz, restore only etc/hosts into /tmp/restore, and compare it with the live file.","hints":[],"steps":["mkdir -p /tmp/restore","tar -xzf /root/backups/etc.tar.gz -C /tmp/restore etc/hosts"],"verify":["diff /tmp/restore/etc/hosts /etc/hosts && echo identical"]},{"title":"Move files between nodes","scenario":"Copy /root/backup.tar.bz2 from node1 to /tmp on node2 with scp. Sync /etc/yum.repos.d/ from node1 into /root/repos-copy on node2 with rsync. Use sftp to download /etc/hostname from node2.","hints":[],"steps":["scp /root/backup.tar.bz2 root@node2:/tmp/","rsync -av /etc/yum.repos.d/ root@node2:/root/repos-copy/","sftp root@node2      # then: get /etc/hostname   and   bye"],"verify":["ssh root@node2 'ls -l /tmp/backup.tar.bz2 /root/repos-copy'"]}]},{"day":21,"course":"RH124","title":"Accessing file systems and users on consoles","objective":"Mount and inspect file systems; log in and switch users in multi-user targets.","questions":[{"type":"cmd","q":"List all block devices with their filesystem types and UUIDs.","accept":["lsblk -f","lsblk --fs"],"explain":"`lsblk` alone shows sizes and mount points."},{"type":"cmd","q":"Show free space on mounted filesystems in human-readable units, including the filesystem type.","accept":["df -hT","df -Th"],"explain":"`df` reports filesystems; `du` reports what files use."},{"type":"cmd","q":"Show the total disk space used by /var/log.","accept":["du -sh /var/log"],"explain":"-s summary, -h human-readable. `du -h --max-depth=1 /var` lists subdirectories."},{"type":"cmd","q":"Mount /dev/vdb1 on /mnt/data for now (not permanently).","accept":["mount /dev/vdb1 /mnt/data"],"explain":"For a permanent mount, add a line to /etc/fstab."},{"type":"mcq","q":"`umount /mnt/data` says \"target is busy\". What is the usual cause?","options":["A process, maybe your own shell, is using files or has its working directory there","The filesystem is damaged","The disk is full","Only root can unmount"],"answer":0,"explain":"`cd` out of it, then find other users with `lsof /mnt/data` or `fuser -vm /mnt/data`."},{"type":"cmd","q":"Show the UUID of /dev/vdb1.","accept":["blkid /dev/vdb1","lsblk -f /dev/vdb1","lsblk -no UUID /dev/vdb1"],"explain":"Use the UUID in /etc/fstab. It does not change if disks are renamed."},{"type":"mcq","q":"On a text-only system in multi-user.target, how do you reach a second login console?","options":["Press Ctrl+Alt+F2 (F2 to F6 give more consoles)","Press Ctrl+Shift+T","Run `console 2`","Consoles only exist in graphical.target"],"answer":0,"explain":"In a VM, send the key combination from the VM window's menu."},{"type":"mcq","q":"Which command shows who is logged in and what each person is running?","options":["w","id","last -x","whoami"],"answer":0,"explain":"`who` is shorter, `last` shows past logins."},{"type":"mcq","q":"What is the difference between `sudo -i` and `su -`?","options":["sudo -i asks for your own password and needs sudo rights; su - asks for root's password","They are identical","su - only works for regular users","sudo -i does not give a login shell"],"answer":0,"explain":"Both give a root login shell. Type `exit` to return to your own user."}],"labs":[{"title":"Explore storage usage","scenario":"Show all disks and partitions, see which filesystems are mounted and how full they are, and save the 5 largest directories under /var to /root/var-usage.txt.","hints":[],"steps":["lsblk -f","df -hT","du -h --max-depth=1 /var 2>/dev/null | sort -rh | head -6 > /root/var-usage.txt"],"verify":["cat /root/var-usage.txt"]},{"title":"Mount an ISO image","scenario":"Download or copy an ISO file (the RHEL ISO works) and mount it read-only through a loop device at /mnt/image. Browse it, then unmount it.","hints":[],"steps":["mkdir -p /mnt/image","mount -o loop,ro /path/to/file.iso /mnt/image","ls /mnt/image","umount /mnt/image"],"verify":["findmnt /mnt/image || echo unmounted"]},{"title":"Busy mount point","scenario":"Mount something at /mnt/image, cd into it from a second terminal, and try to unmount it. Find the process that blocks it, fix it, and unmount.","hints":[],"steps":["umount /mnt/image          # target is busy","fuser -vm /mnt/image","lsof /mnt/image","# leave the directory in the other terminal (cd ~), then:","umount /mnt/image"],"verify":["findmnt /mnt/image || echo unmounted"]},{"title":"Log in and switch users on text consoles","scenario":"Switch the system to multi-user.target for now. Log in as harry on tty2, become root with su -, check who is logged in, then return to graphical.target if you have a desktop.","hints":[],"steps":["systemctl isolate multi-user.target","# Ctrl+Alt+F2, log in as harry","su -","w","exit","systemctl isolate graphical.target"],"verify":["systemctl get-default"]}]},{"day":22,"course":"RH134","title":"Shell scripts: basics","objective":"Process script inputs ($1, $2, etc.) and process the output of shell commands within scripts.","questions":[{"type":"mcq","q":"What should the first line of a bash script be?","options":["#!/bin/bash","#bash","!#/bin/bash","//bin/bash"],"answer":0,"explain":"This \"shebang\" line tells the kernel which interpreter runs the file."},{"type":"cmd","q":"Make script.sh executable for everyone.","accept":["chmod +x script.sh","chmod a+x script.sh","chmod 755 script.sh"],"explain":"Run it as `./script.sh`, or put it in /usr/local/bin so it's on the PATH."},{"type":"mcq","q":"Inside a script, what are $1, $# and $@?","options":["The first argument, the number of arguments, and all arguments","The script name, the PID, and the exit code","The first line, the line count, and all lines","The user, the group, and the home directory"],"answer":0,"explain":"$0 is the script's own name. Quote \"$@\" so arguments with spaces stay intact."},{"type":"mcq","q":"What does $? contain?","options":["The exit status of the last command (0 means success)","The PID of the last background job","The number of arguments","The current user's UID"],"answer":0,"explain":"Check it right after the command, because every command overwrites it."},{"type":"cmd","q":"Store the output of the `hostname` command in a variable named host.","accept":["host=$(hostname)","host=`hostname`"],"explain":"Prefer $( ); it nests cleanly and is easier to read."},{"type":"mcq","q":"What happens with `count = 5` in bash?","options":["An error: bash tries to run a command named count","count is set to 5","count is set to \" 5\"","It compares count with 5"],"answer":0,"explain":"Assignments must have no spaces around the =."},{"type":"mcq","q":"What is the difference between \"$HOME\" and '$HOME'?","options":["Double quotes expand the variable; single quotes keep the text literally","Single quotes expand it; double quotes do not","Both expand it","Neither expands it"],"answer":0,"explain":"Use double quotes around variables to keep spaces intact and still expand them."},{"type":"cmd","q":"Print the number of arguments that were passed to the script.","accept":["echo $#","echo \"$#\""],"explain":"Useful for checking that the user passed what the script needs."},{"type":"mcq","q":"What does `exit 1` do in a script?","options":["Ends the script immediately with exit status 1 (failure)","Skips the next line","Restarts the script","Logs out the user"],"answer":0,"explain":"By convention, 0 means success and anything else means an error."}],"labs":[{"title":"Your first system-info script","scenario":"Write /usr/local/bin/sysinfo that prints the hostname, kernel version, uptime and the number of logged-in users. Every user must be able to run it.","hints":[],"steps":["vim /usr/local/bin/sysinfo","# #!/bin/bash","# echo \"Host:   $(hostname)\"","# echo \"Kernel: $(uname -r)\"","# echo \"Uptime: $(uptime -p)\"","# echo \"Users:  $(who | wc -l)\"","chmod 755 /usr/local/bin/sysinfo"],"verify":["sysinfo"]},{"title":"A script with arguments","scenario":"Write /usr/local/bin/greet that prints \"Hello, NAME\" for its first argument. With no argument, print \"Usage: greet NAME\" to stderr and exit with status 1.","hints":[],"steps":["vim /usr/local/bin/greet","# #!/bin/bash","# if [ $# -eq 0 ]; then","#   echo \"Usage: greet NAME\" >&2","#   exit 1","# fi","# echo \"Hello, $1\"","chmod 755 /usr/local/bin/greet"],"verify":["greet Purva; greet; echo \"exit code: $?\""]},{"title":"Use command output in a script","scenario":"Write /root/diskcheck.sh that reads how full / is (as a number) and prints \"WARNING\" if it is over 80, otherwise \"OK\".","hints":[],"steps":["vim /root/diskcheck.sh","# #!/bin/bash","# used=$(df --output=pcent / | tail -1 | tr -dc '0-9')","# if [ \"$used\" -gt 80 ]; then echo \"WARNING: / is ${used}% full\"; else echo \"OK: / is ${used}% full\"; fi","chmod 700 /root/diskcheck.sh"],"verify":["/root/diskcheck.sh"]},{"title":"Dated backups","scenario":"Write /root/backup-etc.sh that creates /root/backups/etc-YYYY-MM-DD.tar.gz using today's date, and prints the archive size.","hints":[],"steps":["vim /root/backup-etc.sh","# #!/bin/bash","# mkdir -p /root/backups","# file=/root/backups/etc-$(date +%F).tar.gz","# tar -czf \"$file\" /etc 2>/dev/null","# du -h \"$file\"","chmod 700 /root/backup-etc.sh"],"verify":["/root/backup-etc.sh && ls /root/backups"]}]},{"day":23,"course":"RH134","title":"Shell scripts: conditions and loops","objective":"Conditionally execute code and use looping constructs to process files and command-line input.","questions":[{"type":"mcq","q":"Which test is true when `file` exists and is a regular file?","options":["[ -f file ]","[ -e -r file ]","[ -d file ]","[ file ]"],"answer":0,"explain":"-e exists (any type), -f regular file, -d directory, -r readable, -x executable, -s not empty."},{"type":"mcq","q":"Which is the correct numeric comparison \"a is greater than 5\"?","options":["[ \"$a\" -gt 5 ]","[ \"$a\" > 5 ]","[ $a gt 5 ]","[ \"$a\" => 5 ]"],"answer":0,"explain":"Numbers: -eq -ne -lt -le -gt -ge. Strings: = and !=. Inside [ ], `>` means redirection."},{"type":"cmd","q":"Write a one-line for loop that prints the numbers 1 to 5.","accept":["for i in {1..5}; do echo $i; done","for i in $(seq 1 5); do echo $i; done","for i in 1 2 3 4 5; do echo $i; done","for i in {1..5}; do echo \"$i\"; done"],"explain":"Loops can also go over files (`for f in /etc/*.conf`) or command output."},{"type":"mcq","q":"What does `while read line; do echo \"$line\"; done < users.txt` do?","options":["Reads users.txt one line at a time into $line","Reads the whole file into one variable","Waits for the user to type a line","Only reads the first line"],"answer":0,"explain":"This is the safe way to process a list of names from a file."},{"type":"mcq","q":"When is `[ -z \"$1\" ]` true?","options":["When $1 is empty or not given","When $1 is zero","When $1 is a file with size zero","When $1 is a directory"],"answer":0,"explain":"`-n` is the opposite: true when the string is not empty."},{"type":"mcq","q":"In `cmd1 && cmd2 || cmd3`, when does cmd3 run?","options":["When cmd1 fails, or when cmd1 succeeds and cmd2 fails","Only when cmd1 succeeds","Always","Never"],"answer":0,"explain":"&& runs the next command on success, || on failure. For clear logic, use if/then/else."},{"type":"cmd","q":"Using the test brackets, print \"yes\" only if /etc/hosts is readable.","accept":["[ -r /etc/hosts ] && echo yes","test -r /etc/hosts && echo yes","[[ -r /etc/hosts ]] && echo yes"],"explain":"`test` and `[ ]` are the same builtin."},{"type":"mcq","q":"Which if statement has correct syntax?","options":["if [ \"$x\" = \"yes\" ]; then echo ok; fi","if [$x = yes] then echo ok fi","if ( $x == yes ) { echo ok }","if [ \"$x\" = \"yes\" ] echo ok; end"],"answer":0,"explain":"Spaces inside the brackets are required. Close with `fi`."},{"type":"mcq","q":"Which word ends a case block?","options":["esac","end","done","fi"],"answer":0,"explain":"case is spelled backwards; each branch ends with `;;`."}],"labs":[{"title":"SGID file finder (exam style)","scenario":"Write /usr/local/bin/mysearch that finds regular files under /usr that are smaller than 10 MiB and have the SGID bit set, and saves the list to /root/myfiles.","hints":[],"steps":["vim /usr/local/bin/mysearch","# #!/bin/bash","# find /usr -type f -size -10M -perm -2000 > /root/myfiles 2>/dev/null","chmod 755 /usr/local/bin/mysearch","mysearch"],"verify":["cat /root/myfiles"]},{"title":"Create users from a list","scenario":"Put the names alice, bob and carol in /root/newusers.txt, one per line. Write a script that creates each user who does not exist yet, sets the password \"Change@123\", and forces a password change at first login.","hints":[],"steps":["printf 'alice\\nbob\\ncarol\\n' > /root/newusers.txt","vim /root/mkusers.sh","# #!/bin/bash","# while read u; do","#   if id \"$u\" &>/dev/null; then echo \"$u exists\"; continue; fi","#   useradd \"$u\"","#   echo 'Change@123' | passwd --stdin \"$u\" >/dev/null","#   chage -d 0 \"$u\"","#   echo \"$u created\"","# done < /root/newusers.txt","bash /root/mkusers.sh"],"verify":["id alice; chage -l bob | head -2"]},{"title":"Argument-driven script","scenario":"Write /root/switch.sh: with argument \"all\" print \"All users\"; with \"none\" print \"No users\"; with anything else, or nothing, print \"Usage: switch.sh all|none\" and exit 2.","hints":[],"steps":["vim /root/switch.sh","# #!/bin/bash","# if [ \"$1\" = \"all\" ]; then echo \"All users\"","# elif [ \"$1\" = \"none\" ]; then echo \"No users\"","# else echo \"Usage: switch.sh all|none\" >&2; exit 2","# fi","chmod 755 /root/switch.sh"],"verify":["/root/switch.sh all; /root/switch.sh none; /root/switch.sh x; echo $?"]},{"title":"Batch rename with a loop","scenario":"In /tmp/rename create file1.txt to file5.txt. Write a loop that renames every .txt file there to .bak.","hints":[],"steps":["mkdir -p /tmp/rename && touch /tmp/rename/file{1..5}.txt","for f in /tmp/rename/*.txt; do mv \"$f\" \"${f%.txt}.bak\"; done"],"verify":["ls /tmp/rename"]}]},{"day":24,"course":"RH134","title":"Scheduling with at and cron","objective":"Schedule tasks using at and cron.","questions":[{"type":"cmd","q":"Schedule `date >> /tmp/date.txt` to run once, 5 minutes from now, with at.","accept":["echo \"date >> /tmp/date.txt\" | at now + 5 minutes","echo 'date >> /tmp/date.txt' | at now + 5 minutes","echo \"date >> /tmp/date.txt\" | at now +5 minutes","echo \"date >> /tmp/date.txt\" | at now + 5 min"],"explain":"Other time forms: `at 16:30`, `at 9am tomorrow`, `at noon + 2 days`."},{"type":"cmd","q":"List your pending at jobs.","accept":["atq","at -l"],"explain":"`at -c N` prints the full script of job N."},{"type":"cmd","q":"Delete at job number 3.","accept":["atrm 3","at -d 3"],"explain":"The atd service must be running for at jobs to run."},{"type":"mcq","q":"What is the order of the five time fields in a crontab line?","options":["minute, hour, day of month, month, day of week","hour, minute, day of month, month, day of week","minute, hour, month, day of month, day of week","second, minute, hour, day, month"],"answer":0,"explain":"Tip: `cat /etc/crontab` shows a reminder diagram of the fields."},{"type":"mcq","q":"What does `*/10 * * * *` mean?","options":["Every 10 minutes","At 10 minutes past every hour","Every 10 hours","On the 10th of every month"],"answer":0,"explain":"`10 * * * *` would be minute 10 of every hour."},{"type":"mcq","q":"What does `30 14 * * 1-5` mean?","options":["At 14:30, Monday to Friday","At 14:30 on days 1 to 5 of the month","Every 30 minutes from 14:00 to 17:00","At 30 minutes past 2 AM, Monday to Friday"],"answer":0,"explain":"Day of week: 0 or 7 = Sunday, 1 = Monday ... 6 = Saturday."},{"type":"cmd","q":"As root, edit the crontab of user natasha.","accept":["crontab -e -u natasha","crontab -u natasha -e"],"explain":"Never edit files in /var/spool/cron by hand."},{"type":"cmd","q":"As root, list natasha's cron jobs.","accept":["crontab -l -u natasha","crontab -u natasha -l"],"explain":"`crontab -r` deletes the whole crontab. Be careful."},{"type":"mcq","q":"How are lines in /etc/crontab and /etc/cron.d/* different from a user crontab?","options":["They have an extra field, the user name, before the command","They use seconds instead of minutes","They cannot use */N","They only run at boot"],"answer":0,"explain":"Example: `30 2 * * 0  root  /usr/local/bin/backup.sh`."}],"labs":[{"title":"Cron jobs for a user (exam classic)","scenario":"For natasha: run `/bin/echo hello` every day at 14:23, and run `logger \"EX200 in progress\"` every 2 minutes. Make sure the second one works by checking the logs.","hints":[],"steps":["crontab -e -u natasha","# 23 14 * * * /bin/echo hello","# */2 * * * * logger \"EX200 in progress\"","systemctl is-active crond"],"verify":["crontab -l -u natasha","sleep 130; grep 'EX200 in progress' /var/log/messages"]},{"title":"One-time job with at","scenario":"Schedule `touch /tmp/at-test` to run in 2 minutes. Look at the queue and the job's full script, then wait and check that the file appears.","hints":[],"steps":["systemctl enable --now atd","echo \"touch /tmp/at-test\" | at now + 2 minutes","atq","at -c <job-number> | tail -3"],"verify":["sleep 125; ls -l /tmp/at-test"]},{"title":"System cron job","scenario":"Every Sunday at 02:30, as root, archive /etc into /root/backups/weekly-etc.tar.gz. Use a file in /etc/cron.d.","hints":[],"steps":["echo '30 2 * * 0 root tar -czf /root/backups/weekly-etc.tar.gz /etc' > /etc/cron.d/weekly-etc","chmod 644 /etc/cron.d/weekly-etc"],"verify":["cat /etc/cron.d/weekly-etc"]},{"title":"Control who may use cron","scenario":"Stop harry from using crontab, test it, then allow him again.","hints":[],"steps":["echo harry >> /etc/cron.deny","su - harry -c 'crontab -l'     # \"You (harry) are not allowed...\"","sed -i '/^harry$/d' /etc/cron.deny"],"verify":["su - harry -c 'crontab -l'     # \"no crontab for harry\""]}]},{"day":25,"course":"RH134","title":"systemd timers and temporary files","objective":"Schedule tasks using systemd timer units; manage temporary files.","questions":[{"type":"mcq","q":"Which unit files do you need for a systemd timer job?","options":["A .timer unit and a .service unit with the same name","Only a .timer unit","A .cron unit","A .service unit with a Schedule= line"],"answer":0,"explain":"The timer starts the matching service. You can point it elsewhere with Unit=."},{"type":"mcq","q":"What does `OnCalendar=*-*-* 02:00:00` mean?","options":["Every day at 02:00","Every 2 hours","On the 2nd of every month","2 minutes after boot"],"answer":0,"explain":"Format: DayOfWeek Year-Month-Day Hour:Minute:Second. `daily` means `*-*-* 00:00:00`."},{"type":"cmd","q":"List all timers with their next and last run times.","accept":["systemctl list-timers","systemctl list-timers --all"],"explain":"`--all` also shows inactive timers."},{"type":"cmd","q":"Check which times the calendar expression \"Mon..Fri *-*-* 09:00\" matches.","accept":["systemd-analyze calendar \"Mon..Fri *-*-* 09:00\"","systemd-analyze calendar 'Mon..Fri *-*-* 09:00'"],"explain":"It prints the normalized form and the next time it will fire."},{"type":"mcq","q":"What does `Persistent=true` do in a timer?","options":["If the system was off at the scheduled time, the job runs soon after the next boot","The timer can never be disabled","The job keeps running forever","The timer survives `systemctl daemon-reload`"],"answer":0,"explain":"This is similar to what anacron does for cron."},{"type":"mcq","q":"Which target should a timer's [Install] section name?","options":["WantedBy=timers.target","WantedBy=multi-user.target","WantedBy=default.target","WantedBy=cron.target"],"answer":0,"explain":"Then `systemctl enable --now name.timer`. Enable the timer, not the service."},{"type":"cmd","q":"Enable and start backup.timer now.","accept":["systemctl enable --now backup.timer"],"explain":"Check it with `systemctl list-timers backup.timer`."},{"type":"mcq","q":"What does `OnBootSec=15min` mean in a timer?","options":["Run the service 15 minutes after the system boots","Run every 15 minutes","Boot the system every 15 minutes","Wait 15 minutes before the service stops"],"answer":0,"explain":"Pair it with `OnUnitActiveSec=1h` to keep repeating every hour after that."},{"type":"mcq","q":"What does the tmpfiles.d line `d /run/myapp 0755 root root 1d` do?","options":["Creates the directory at boot and removes files in it older than 1 day","Deletes /run/myapp after 1 day","Makes /run/myapp read-only for 1 day","Creates a file named 1d"],"answer":0,"explain":"Apply it now with `systemd-tmpfiles --create`; clean with `systemd-tmpfiles --clean`."}],"labs":[{"title":"Daily backup with a timer","scenario":"Create a oneshot service etc-backup.service that runs `tar -czf /root/backups/etc-timer.tar.gz /etc`, and a timer that runs it every day at 02:00, even if the machine was off then. Enable the timer.","hints":[],"steps":["vim /etc/systemd/system/etc-backup.service","# [Unit]","# Description=Back up /etc","# [Service]","# Type=oneshot","# ExecStart=/usr/bin/tar -czf /root/backups/etc-timer.tar.gz /etc","vim /etc/systemd/system/etc-backup.timer","# [Unit]","# Description=Daily /etc backup","# [Timer]","# OnCalendar=*-*-* 02:00:00","# Persistent=true","# [Install]","# WantedBy=timers.target","mkdir -p /root/backups","systemctl daemon-reload","systemctl enable --now etc-backup.timer"],"verify":["systemctl list-timers etc-backup.timer","systemctl start etc-backup.service && ls -l /root/backups/etc-timer.tar.gz"]},{"title":"Repeating timer after boot","scenario":"Create a timer that runs a service writing the date to /var/log/tick.log 1 minute after boot and then every 5 minutes.","hints":[],"steps":["vim /etc/systemd/system/tick.service","# [Service]","# Type=oneshot","# ExecStart=/bin/sh -c 'date >> /var/log/tick.log'","vim /etc/systemd/system/tick.timer","# [Timer]","# OnBootSec=1min","# OnUnitActiveSec=5min","# [Install]","# WantedBy=timers.target","systemctl daemon-reload && systemctl enable --now tick.timer"],"verify":["systemctl list-timers tick.timer; cat /var/log/tick.log"]},{"title":"Convert a cron job into a timer","scenario":"natasha's cron job runs `logger \"EX200 in progress\"` every 2 minutes. Create a system timer that does the same thing, then check the journal.","hints":[],"steps":["vim /etc/systemd/system/ex200log.service","# [Service]","# Type=oneshot","# ExecStart=/usr/bin/logger \"EX200 in progress (timer)\"","vim /etc/systemd/system/ex200log.timer","# [Timer]","# OnCalendar=*:0/2","# [Install]","# WantedBy=timers.target","systemctl daemon-reload && systemctl enable --now ex200log.timer"],"verify":["journalctl --since \"-5min\" | grep 'EX200 in progress (timer)'"]},{"title":"Temporary files with systemd-tmpfiles","scenario":"Make systemd create /run/practice (mode 0750, root:root) at every boot and clean out files older than 30 seconds. Test the cleanup.","hints":[],"steps":["echo 'd /run/practice 0750 root root 30s' > /etc/tmpfiles.d/practice.conf","systemd-tmpfiles --create /etc/tmpfiles.d/practice.conf","touch /run/practice/oldfile","sleep 35","systemd-tmpfiles --clean /etc/tmpfiles.d/practice.conf"],"verify":["ls -la /run/practice"]}]},{"day":26,"course":"RH134","title":"Tuning profiles and process priority","objective":"Manage tuning profiles and adjust process scheduling.","questions":[{"type":"cmd","q":"Show which tuned profile is active.","accept":["tuned-adm active"],"explain":"If it says no profile, check that the tuned service is running."},{"type":"cmd","q":"Show the profile that tuned recommends for this machine.","accept":["tuned-adm recommend"],"explain":"On a VM it usually recommends virtual-guest."},{"type":"cmd","q":"Switch to the virtual-guest profile.","accept":["tuned-adm profile virtual-guest"],"explain":"The choice is saved and survives reboots while the tuned service is enabled."},{"type":"cmd","q":"List all available tuned profiles.","accept":["tuned-adm list"],"explain":"Profiles live in /usr/lib/tuned/; custom ones go in /etc/tuned/."},{"type":"mcq","q":"What is the range of nice values?","options":["-20 (highest priority) to 19 (lowest priority)","0 to 100","-19 to 20","1 to 99"],"answer":0,"explain":"A higher nice value means the process is \"nicer\" to others and gets less CPU."},{"type":"mcq","q":"What nice value does a new process get by default?","options":["0","10","-20","19"],"answer":0,"explain":"It inherits the nice value of its parent, usually 0."},{"type":"mcq","q":"Who can lower a process's nice value (give it higher priority)?","options":["Only root","The process owner","Any member of wheel without sudo","Anyone"],"answer":0,"explain":"Regular users can only raise the nice value of their own processes."},{"type":"cmd","q":"Start `sha1sum /dev/zero` in the background with a nice value of 10.","accept":["nice -n 10 sha1sum /dev/zero &","nice -n 10 sha1sum /dev/zero","nice -10 sha1sum /dev/zero &"],"explain":"`nice -10` means +10. For a negative value you need `nice -n -10`."},{"type":"cmd","q":"Change the nice value of PID 1234 to 5.","accept":["renice -n 5 -p 1234","renice -n 5 1234","renice 5 -p 1234","renice 5 1234"],"explain":"In top, press r and enter the PID and the new value."},{"type":"mcq","q":"Which column shows the nice value in `top` and in `ps -o`?","options":["NI","PR","NV","S"],"answer":0,"explain":"`ps -o pid,ni,comm` shows it. PR in top is the kernel priority derived from it."}],"labs":[{"title":"Set the recommended tuning profile (exam classic)","scenario":"Install and enable tuned if needed, then apply the profile it recommends, and confirm it.","hints":[],"steps":["dnf install -y tuned","systemctl enable --now tuned","tuned-adm recommend","tuned-adm profile $(tuned-adm recommend)"],"verify":["tuned-adm active","tuned-adm verify"]},{"title":"See nice values in action","scenario":"Run two `sha1sum /dev/zero` processes pinned to CPU 0, one with nice 0 and one with nice 19. Compare their %CPU in top, then kill both.","hints":[],"steps":["taskset -c 0 sha1sum /dev/zero &","taskset -c 0 nice -n 19 sha1sum /dev/zero &","ps -o pid,ni,%cpu,comm -C sha1sum","top        # watch %CPU, then q","pkill sha1sum"],"verify":["pgrep sha1sum || echo done"]},{"title":"Change priority of a running process","scenario":"Start `sleep 3000` as harry. As root, set its nice value to -5, then to 10. As harry, try to set it back to 0 and read the error.","hints":[],"steps":["su - harry -c 'sleep 3000 &'","renice -n -5 -p $(pgrep -u harry sleep)","renice -n 10 -p $(pgrep -u harry sleep)","su - harry -c \"renice -n 0 -p $(pgrep -u harry sleep)\"   # Permission denied"],"verify":["ps -o pid,ni,user,comm -p $(pgrep -u harry sleep)"]},{"title":"Switch profiles and back","scenario":"Apply throughput-performance, check it, apply powersave, then return to the recommended profile.","hints":[],"steps":["tuned-adm profile throughput-performance && tuned-adm active","tuned-adm profile powersave && tuned-adm active","tuned-adm profile $(tuned-adm recommend)"],"verify":["tuned-adm active"]}]},{"day":27,"course":"RH134","title":"SELinux modes and contexts","objective":"Set enforcing and permissive modes; list and identify SELinux file and process contexts.","questions":[{"type":"cmd","q":"Show the current SELinux mode.","accept":["getenforce","sestatus"],"explain":"Enforcing, Permissive or Disabled."},{"type":"cmd","q":"Switch SELinux to permissive mode until the next reboot.","accept":["setenforce 0","setenforce Permissive"],"explain":"`setenforce 1` switches back to enforcing."},{"type":"mcq","q":"Where is the SELinux mode set persistently?","options":["The SELINUX= line in /etc/selinux/config","/etc/sysconfig/selinux-mode","/etc/default/grub only","/etc/selinux/semanage.conf"],"answer":0,"explain":"The exam requires enforcing unless the task says otherwise. Leave it enforcing."},{"type":"mcq","q":"Can `setenforce` turn SELinux off completely?","options":["No, it only switches between enforcing and permissive","Yes, with setenforce disabled","Yes, with setenforce -1","Only as root in rescue mode"],"answer":0,"explain":"Fully disabling needs a reboot. On RHEL 9 and later it is done with the `selinux=0` kernel argument."},{"type":"cmd","q":"Show the SELinux contexts of the files in /var/www/html.","accept":["ls -Z /var/www/html","ls -lZ /var/www/html"],"explain":"Web content should have the type httpd_sys_content_t."},{"type":"cmd","q":"Show the SELinux contexts of the running httpd processes.","accept":["ps -eZ | grep httpd","ps axZ | grep httpd","ps -efZ | grep httpd","ps auxZ | grep httpd"],"explain":"Apache processes run as the type httpd_t."},{"type":"mcq","q":"Which part of a context does the targeted policy mostly check?","options":["The type, such as httpd_sys_content_t","The user, such as system_u","The role, such as object_r","The level, such as s0"],"answer":0,"explain":"Rules say which process types may access which file types."},{"type":"mcq","q":"What is the format of an SELinux context?","options":["user:role:type:level","type:user:role","owner:group:mode","role:type:user:level"],"answer":0,"explain":"Example: system_u:object_r:httpd_sys_content_t:s0."},{"type":"mcq","q":"What happens to an action the policy would deny, in permissive mode?","options":["It is allowed, but the denial is still logged","It is blocked and logged","It is blocked silently","Nothing is logged at all"],"answer":0,"explain":"Permissive mode is useful for troubleshooting, not as a fix."},{"type":"mcq","q":"Where are SELinux AVC denials logged?","options":["/var/log/audit/audit.log","/var/log/selinux.log","/var/log/secure","/etc/selinux/log"],"answer":0,"explain":"Search them with `ausearch -m AVC`."}],"labs":[{"title":"Switch SELinux modes","scenario":"Check the current mode, switch to permissive, confirm, switch back to enforcing, and confirm the persistent setting is enforcing.","hints":[],"steps":["getenforce","setenforce 0 && getenforce","setenforce 1 && getenforce","grep ^SELINUX= /etc/selinux/config"],"verify":["sestatus"]},{"title":"Read contexts of files and processes","scenario":"Show the contexts of /etc/shadow, /var/www/html, /home/student and /tmp, of the sshd and httpd processes, and of your own shell.","hints":[],"steps":["ls -Z /etc/shadow","ls -dZ /var/www/html /home/student /tmp","ps -eZ | grep -E 'sshd|httpd'","id -Z"],"verify":["ls -dZ /var/www/html | grep httpd_sys_content_t"]},{"title":"Moving vs copying keeps different contexts","scenario":"Create a.html and b.html in /root. Move a.html and copy b.html into /var/www/html. Compare their contexts, see why a.html would give a 403 error, and fix it.","hints":[],"steps":["echo A > /root/a.html; echo B > /root/b.html","mv /root/a.html /var/www/html/","cp /root/b.html /var/www/html/","ls -Z /var/www/html/*.html      # a.html keeps admin_home_t","restorecon -v /var/www/html/a.html"],"verify":["ls -Z /var/www/html/*.html"]},{"title":"Boot once in permissive mode","scenario":"Reboot and, at the GRUB menu, add `enforcing=0` to the kernel line for this boot only. Check the mode, then reboot normally and check again.","hints":[],"steps":["# at GRUB: press e, go to the line starting with linux, add enforcing=0, press Ctrl+X","getenforce       # Permissive","systemctl reboot"],"verify":["getenforce       # Enforcing"]}]},{"day":28,"course":"RH134","title":"SELinux: file contexts, booleans and ports","objective":"Restore default file contexts, use Boolean settings, and manage SELinux port labels.","questions":[{"type":"cmd","q":"Add a persistent rule so /web and everything under it gets the type httpd_sys_content_t.","accept":["semanage fcontext -a -t httpd_sys_content_t '/web(/.*)?'","semanage fcontext -a -t httpd_sys_content_t \"/web(/.*)?\""],"explain":"This only adds the rule. Then apply it with restorecon."},{"type":"cmd","q":"Apply the default contexts to /web recursively and show what changes.","accept":["restorecon -Rv /web","restorecon -R -v /web","restorecon -vR /web"],"explain":"restorecon sets each file to what the policy rules say it should be."},{"type":"mcq","q":"What is the difference between chcon and semanage fcontext?","options":["chcon changes the label now but a relabel or restorecon undoes it; semanage fcontext records the rule permanently","chcon is permanent; semanage is temporary","They are identical","chcon only works on directories"],"answer":0,"explain":"In the exam, always use semanage fcontext plus restorecon."},{"type":"cmd","q":"Show all SELinux booleans with \"httpd\" in their name and their current values.","accept":["getsebool -a | grep httpd","semanage boolean -l | grep httpd"],"explain":"`semanage boolean -l` also shows a short description of each one."},{"type":"cmd","q":"Turn on the boolean httpd_enable_homedirs permanently.","accept":["setsebool -P httpd_enable_homedirs on","setsebool -P httpd_enable_homedirs 1"],"explain":"Without -P the change is lost at the next reboot."},{"type":"cmd","q":"Allow httpd to listen on TCP port 82 as far as SELinux is concerned.","accept":["semanage port -a -t http_port_t -p tcp 82"],"explain":"If the port already has another type, use -m instead of -a."},{"type":"cmd","q":"List the SELinux port types that contain \"http\".","accept":["semanage port -l | grep http"],"explain":"http_port_t covers 80, 443, 488, 8008, 8009 and 8443 by default."},{"type":"mcq","q":"Which package provides the semanage command?","options":["policycoreutils-python-utils","selinux-policy-targeted","setroubleshoot-server","libselinux-utils"],"answer":0,"explain":"getenforce and setenforce come from libselinux-utils; sealert from setroubleshoot-server."},{"type":"mcq","q":"Which command shows recent AVC denials from the audit log?","options":["ausearch -m AVC -ts recent","journalctl -u selinux","grep denied /var/log/messages -A5 only","sestatus -v"],"answer":0,"explain":"`sealert -a /var/log/audit/audit.log` explains each denial and suggests a fix."}],"labs":[{"title":"Custom web root (exam classic)","scenario":"Serve /web/index.html with Apache by pointing DocumentRoot at /web. Make it work in enforcing mode with a persistent SELinux rule.","hints":[],"steps":["mkdir /web && echo \"custom root\" > /web/index.html","vim /etc/httpd/conf/httpd.conf     # DocumentRoot \"/web\"  and  <Directory \"/web\"> ... Require all granted","semanage fcontext -a -t httpd_sys_content_t '/web(/.*)?'","restorecon -Rv /web","systemctl restart httpd"],"verify":["curl http://localhost/","ls -Zd /web /web/index.html"]},{"title":"Web server on a non-standard port (exam classic)","scenario":"Make httpd listen on port 82 and serve its content there. Fix SELinux and the firewall so http://node1:82 works from node2.","hints":[],"steps":["vim /etc/httpd/conf/httpd.conf     # Listen 82","systemctl restart httpd            # fails: cannot bind to port 82","semanage port -a -t http_port_t -p tcp 82","firewall-cmd --permanent --add-port=82/tcp && firewall-cmd --reload","systemctl enable --now httpd"],"verify":["curl http://node1:82      # run on node2","semanage port -l | grep ^http_port_t"]},{"title":"Use a boolean","scenario":"Let httpd make outgoing network connections (needed by apps that call a backend), permanently. List the booleans you changed from the defaults.","hints":[],"steps":["getsebool httpd_can_network_connect","setsebool -P httpd_can_network_connect on"],"verify":["getsebool httpd_can_network_connect","semanage boolean -l -C"]},{"title":"Read and fix a denial","scenario":"Create /var/www/html/bad.html in /root and move it into place so it gets the wrong context. Request it, find the denial in the audit log, read the sealert advice, and fix it.","hints":[],"steps":["echo bad > /root/bad.html && mv /root/bad.html /var/www/html/","curl http://localhost/bad.html          # 403 Forbidden","ausearch -m AVC -ts recent","dnf install -y setroubleshoot-server","sealert -a /var/log/audit/audit.log | less","restorecon -v /var/www/html/bad.html"],"verify":["curl http://localhost/bad.html"]}]},{"day":29,"course":"RH134","title":"Partitions on GPT disks","objective":"List, create and delete partitions on GPT disks; mount file systems at boot by UUID or label.","questions":[{"type":"cmd","q":"Write a new GPT partition table to /dev/vdb with parted.","accept":["parted /dev/vdb mklabel gpt","parted -s /dev/vdb mklabel gpt"],"explain":"This wipes the existing partition table. Only run it on an empty disk."},{"type":"cmd","q":"With parted, create a partition named data on /dev/vdb from 1MiB to 1025MiB with an xfs hint.","accept":["parted /dev/vdb mkpart data xfs 1MiB 1025MiB","parted -s /dev/vdb mkpart data xfs 1MiB 1025MiB","parted /dev/vdb mkpart data 1MiB 1025MiB"],"explain":"On GPT, the first argument of mkpart is the partition name. The fs type is only a hint; you still need mkfs."},{"type":"mcq","q":"Why start the first partition at 1MiB?","options":["It keeps partitions aligned and leaves room for the GPT header","Partitions cannot start at 0","The bootloader needs exactly 1MiB","It makes the partition faster to format"],"answer":0,"explain":"Always use MiB units in parted for alignment."},{"type":"cmd","q":"Show the partition table of /dev/vdb.","accept":["parted /dev/vdb print","fdisk -l /dev/vdb","gdisk -l /dev/vdb","lsblk /dev/vdb"],"explain":"`lsblk` is the quickest way to see all disks and partitions at once."},{"type":"mcq","q":"After creating a partition, which command waits until its device file (/dev/vdb1) exists?","options":["udevadm settle","partprobe --wait","sync","systemctl daemon-reload"],"answer":0,"explain":"Scripts use it before running mkfs on the new partition."},{"type":"cmd","q":"Format /dev/vdb1 with XFS.","accept":["mkfs.xfs /dev/vdb1","mkfs -t xfs /dev/vdb1"],"explain":"Add `-f` to overwrite an existing filesystem."},{"type":"mcq","q":"What is the order of the six fields in /etc/fstab?","options":["device, mount point, filesystem type, options, dump, fsck order","mount point, device, type, options, fsck order, dump","device, type, mount point, options, dump, fsck order","UUID, label, mount point, type, options, dump"],"answer":0,"explain":"Example: `UUID=1b2c... /data xfs defaults 0 0`."},{"type":"mcq","q":"Why use UUID= in /etc/fstab instead of /dev/vdb1?","options":["Device names can change between boots, but the UUID stays the same","/dev names are not allowed in fstab","UUIDs mount faster","The exam forbids device names"],"answer":0,"explain":"Get it with `blkid` or `lsblk -f`. LABEL= works too when the filesystem has a label."},{"type":"cmd","q":"Mount everything in /etc/fstab that is not mounted yet, without rebooting.","accept":["mount -a"],"explain":"If it prints nothing, your new lines are fine. Run `findmnt --verify` for a deeper check."},{"type":"mcq","q":"What does `parted /dev/vdb set 1 lvm on` do?","options":["Marks partition 1 as an LVM partition","Creates a physical volume on partition 1","Adds partition 1 to a volume group","Formats partition 1"],"answer":0,"explain":"The flag only sets the type. You still need `pvcreate`."}],"labs":[{"title":"GPT partition mounted by UUID (exam classic)","scenario":"On the second disk, create a GPT label and a 1 GiB partition. Format it with XFS and mount it at /mnt/data at every boot using its UUID.","hints":[],"steps":["lsblk","parted -s /dev/vdb mklabel gpt","parted -s /dev/vdb mkpart data xfs 1MiB 1025MiB","udevadm settle","mkfs.xfs /dev/vdb1","mkdir -p /mnt/data","blkid /dev/vdb1","echo 'UUID=<uuid-from-blkid>  /mnt/data  xfs  defaults  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["findmnt /mnt/data","reboot, then df -h /mnt/data"]},{"title":"ext4 partition mounted by label","scenario":"Create a second partition of 500 MiB, format it ext4 with the label BACKUP, and mount it at /backup at boot using LABEL=.","hints":[],"steps":["parted -s /dev/vdb mkpart backup ext4 1025MiB 1525MiB","udevadm settle","mkfs.ext4 -L BACKUP /dev/vdb2","mkdir -p /backup","echo 'LABEL=BACKUP  /backup  ext4  defaults  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["lsblk -f /dev/vdb","findmnt /backup"]},{"title":"Delete a partition safely","scenario":"Remove the /backup partition: unmount it, remove its fstab line, delete the partition, and confirm the system still boots cleanly.","hints":[],"steps":["umount /backup","vim /etc/fstab            # delete the LABEL=BACKUP line","systemctl daemon-reload","parted /dev/vdb rm 2"],"verify":["lsblk /dev/vdb","mount -a && echo \"fstab OK\""]},{"title":"Partition with fdisk instead of parted","scenario":"On a spare disk, use fdisk interactively to create a GPT label and one 200 MiB partition of type \"Linux filesystem\".","hints":[],"steps":["fdisk /dev/vdc","# g  (new GPT label)","# n  (new partition), accept number and first sector, last sector: +200M","# p  (print)   w  (write)"],"verify":["lsblk /dev/vdc"]}]},{"day":30,"course":"RH134","title":"Swap space","objective":"Add swap non-destructively and activate it at boot.","questions":[{"type":"cmd","q":"Initialize /dev/vdb2 as swap space.","accept":["mkswap /dev/vdb2"],"explain":"mkswap prints the new UUID."},{"type":"cmd","q":"Turn on the swap on /dev/vdb2 now.","accept":["swapon /dev/vdb2"],"explain":"`swapoff /dev/vdb2` turns it off again."},{"type":"cmd","q":"Show the active swap areas.","accept":["swapon --show","swapon -s","cat /proc/swaps","free -h"],"explain":"`free -h` shows total swap; `swapon --show` lists each area with its priority."},{"type":"mcq","q":"Which /etc/fstab line activates a swap partition at boot?","options":["UUID=<uuid>  none  swap  defaults  0 0","UUID=<uuid>  /swap  xfs  defaults  0 0","UUID=<uuid>  swap  swapon  auto  1 1","/swap  UUID=<uuid>  swap  on  0 0"],"answer":0,"explain":"The mount point field is `none` or `swap`; both work."},{"type":"cmd","q":"Activate all swap areas listed in /etc/fstab.","accept":["swapon -a"],"explain":"Use this to test your fstab line without rebooting."},{"type":"mcq","q":"A task says \"add swap non-destructively\". What does that mean?","options":["Add new swap without deleting or damaging any existing partitions, data or swap","Replace the existing swap with a bigger one","Use a swap file only","Resize the root filesystem to make room"],"answer":0,"explain":"Use free space on the disk and keep existing swap active."},{"type":"mcq","q":"How do you make the kernel use one swap area before another?","options":["Give it a higher pri=N value in its fstab options","List it first in fstab","Make it larger","Put it on a faster disk; nothing else matters"],"answer":0,"explain":"Example options field: `pri=10`. Higher numbers are used first."},{"type":"mcq","q":"Which parted filesystem type hint do you use for a swap partition?","options":["linux-swap","swap","xfs","raw"],"answer":0,"explain":"Example: `parted /dev/vdb mkpart swap1 linux-swap 1025MiB 1537MiB`."},{"type":"mcq","q":"Can a logical volume be used as swap?","options":["Yes: create the LV, run mkswap on it, and add it to fstab","No, swap must be a partition","Only if it uses all of the VG","Only with a swap file on top"],"answer":0,"explain":"Example: `mkswap /dev/vgdata/swaplv`."}],"labs":[{"title":"Add a swap partition (exam classic)","scenario":"Add a 512 MiB swap partition on the second disk without touching existing partitions or swap. It must be active after reboot.","hints":[],"steps":["parted -s /dev/vdb mkpart swap1 linux-swap 1025MiB 1537MiB","udevadm settle","mkswap /dev/vdb2","echo 'UUID=<uuid-from-mkswap>  none  swap  defaults  0 0' >> /etc/fstab","swapon -a"],"verify":["swapon --show","reboot, then free -h"]},{"title":"Swap on a logical volume","scenario":"In an existing volume group, create a 256 MiB LV named swaplv, make it swap, and activate it at boot.","hints":[],"steps":["lvcreate -n swaplv -L 256M vgdata","mkswap /dev/vgdata/swaplv","echo '/dev/vgdata/swaplv  none  swap  defaults  0 0' >> /etc/fstab","swapon -a"],"verify":["swapon --show"]},{"title":"Swap priorities","scenario":"Give the partition swap priority 10 and the LV swap priority 5 in /etc/fstab. Reactivate both and check the order.","hints":[],"steps":["vim /etc/fstab        # options: pri=10 on the partition line, pri=5 on the LV line","swapoff -a && swapon -a"],"verify":["swapon --show"]},{"title":"Swap file","scenario":"Create a 256 MiB swap file /swapfile with safe permissions, activate it, and add it to fstab.","hints":[],"steps":["dd if=/dev/zero of=/swapfile bs=1M count=256","chmod 600 /swapfile","mkswap /swapfile","swapon /swapfile","echo '/swapfile  none  swap  defaults  0 0' >> /etc/fstab"],"verify":["swapon --show"]}]},{"day":31,"course":"RH134","title":"LVM: physical volumes, groups and volumes","objective":"Create and remove physical volumes, assign them to volume groups, create and delete logical volumes.","questions":[{"type":"cmd","q":"Initialize /dev/vdb1 as an LVM physical volume.","accept":["pvcreate /dev/vdb1"],"explain":"Check it with `pvs`."},{"type":"cmd","q":"Create the volume group vgdata from /dev/vdb1 with a physical extent size of 16 MiB.","accept":["vgcreate -s 16M vgdata /dev/vdb1","vgcreate -s 16m vgdata /dev/vdb1"],"explain":"`-s` sets the extent size. Without it you get 4 MiB."},{"type":"cmd","q":"Create a 500 MiB logical volume named lvdata in vgdata.","accept":["lvcreate -n lvdata -L 500M vgdata","lvcreate -L 500M -n lvdata vgdata","lvcreate --name lvdata --size 500M vgdata"],"explain":"`-L` takes a size; `-l` takes a number of extents."},{"type":"cmd","q":"Create a logical volume lvqa of exactly 60 extents in vgdata.","accept":["lvcreate -n lvqa -l 60 vgdata","lvcreate -l 60 -n lvqa vgdata"],"explain":"If the task gives extents, use -l. If it gives a size, use -L."},{"type":"mcq","q":"What is the default physical extent size?","options":["4 MiB","1 MiB","16 MiB","32 MiB"],"answer":0,"explain":"`vgdisplay` shows it as \"PE Size\"."},{"type":"mcq","q":"A VG has an extent size of 16 MiB. How big is an LV of 60 extents?","options":["960 MiB","60 MiB","600 MiB","1 GiB"],"answer":0,"explain":"Size = extents x extent size = 60 x 16 MiB."},{"type":"mcq","q":"Which two paths point to the LV lvdata in vgdata?","options":["/dev/vgdata/lvdata and /dev/mapper/vgdata-lvdata","/dev/lvdata and /dev/vgdata","/dev/lvm/lvdata and /dev/dm-lvdata","/dev/vgdata-lvdata and /dev/mapper/lvdata"],"answer":0,"explain":"Both work in /etc/fstab. LVs keep their names, so they are stable like UUIDs."},{"type":"cmd","q":"Show details of the volume group vgdata, including its extent size.","accept":["vgdisplay vgdata","vgs -o +vg_extent_size vgdata"],"explain":"`pvs`, `vgs` and `lvs` give short summaries."},{"type":"cmd","q":"Create an LV named lvrest in vgdata that uses all remaining free space.","accept":["lvcreate -n lvrest -l 100%FREE vgdata","lvcreate -l 100%FREE -n lvrest vgdata"],"explain":"`-l 50%VG` would take half of the whole VG."},{"type":"mcq","q":"In what order do you remove an LVM setup completely?","options":["Unmount, remove the fstab line, lvremove, vgremove, pvremove","pvremove, vgremove, lvremove, then unmount","vgremove first, it removes everything","Just delete the partition"],"answer":0,"explain":"Removing things underneath a mounted filesystem leads to errors and data loss."}],"labs":[{"title":"LV with a given extent size (exam classic)","scenario":"Create volume group qagroup with 16 MiB extents. In it, create LV qa with 60 extents, format it ext4, and mount it at /mnt/qa at every boot.","hints":[],"steps":["parted -s /dev/vdb mkpart lvm1 1537MiB 3585MiB && parted -s /dev/vdb set 3 lvm on","udevadm settle","pvcreate /dev/vdb3","vgcreate -s 16M qagroup /dev/vdb3","lvcreate -n qa -l 60 qagroup","mkfs.ext4 /dev/qagroup/qa","mkdir -p /mnt/qa","echo '/dev/qagroup/qa  /mnt/qa  ext4  defaults  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["lvs qagroup; vgdisplay qagroup | grep 'PE Size'","df -h /mnt/qa"]},{"title":"Two disks, one volume group","scenario":"Make PVs from two partitions (or two small disks), combine them into VG labvg, and create two LVs: web (300 MiB, XFS at /srv/web) and db (200 MiB, ext4 at /srv/db), both mounted at boot.","hints":[],"steps":["pvcreate /dev/vdc1 /dev/vdd1","vgcreate labvg /dev/vdc1 /dev/vdd1","lvcreate -n web -L 300M labvg && mkfs.xfs /dev/labvg/web","lvcreate -n db -L 200M labvg && mkfs.ext4 /dev/labvg/db","mkdir -p /srv/web /srv/db","echo '/dev/labvg/web /srv/web xfs defaults 0 0' >> /etc/fstab","echo '/dev/labvg/db /srv/db ext4 defaults 0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["lvs labvg; df -h /srv/web /srv/db"]},{"title":"Read the LVM status","scenario":"Use pvs, vgs, lvs and their display versions to answer: how much free space does each VG have, which PVs belong to which VG, and what is each VG's extent size?","hints":[],"steps":["pvs; vgs; lvs","pvdisplay /dev/vdb3","vgdisplay qagroup","lvdisplay /dev/qagroup/qa"],"verify":["vgs -o vg_name,vg_size,vg_free,vg_extent_size"]},{"title":"Tear down an LVM stack","scenario":"Completely remove labvg and its PVs, leaving the system booting cleanly.","hints":[],"steps":["umount /srv/web /srv/db","vim /etc/fstab             # delete the two labvg lines","systemctl daemon-reload","lvremove -y /dev/labvg/web /dev/labvg/db","vgremove labvg","pvremove /dev/vdc1 /dev/vdd1"],"verify":["pvs; vgs","mount -a && echo \"fstab OK\""]}]},{"day":32,"course":"RH134","title":"LVM: extending volumes","objective":"Extend existing logical volumes and add new logical volumes non-destructively.","questions":[{"type":"cmd","q":"Grow /dev/vgdata/lvdata by 200 MiB and grow its filesystem in the same command.","accept":["lvextend -r -L +200M /dev/vgdata/lvdata","lvextend -L +200M -r /dev/vgdata/lvdata","lvextend --resizefs -L +200M /dev/vgdata/lvdata","lvresize -r -L +200M /dev/vgdata/lvdata"],"explain":"`-r` runs the right grow tool for XFS or ext4 after the LV grows."},{"type":"cmd","q":"Grow the mounted XFS filesystem at /mnt/data to fill its (already extended) LV.","accept":["xfs_growfs /mnt/data"],"explain":"xfs_growfs takes the mount point. XFS grows while mounted."},{"type":"cmd","q":"Grow the ext4 filesystem on /dev/vgdata/lvdb to fill its LV.","accept":["resize2fs /dev/vgdata/lvdb"],"explain":"resize2fs takes the device. ext4 can grow while mounted."},{"type":"mcq","q":"Can an XFS filesystem be made smaller?","options":["No, XFS can only grow","Yes, with xfs_growfs -s","Yes, but only when unmounted","Yes, with lvreduce -r"],"answer":0,"explain":"To shrink XFS you must back up, recreate the filesystem smaller, and restore. ext4 can shrink while unmounted."},{"type":"cmd","q":"Add the physical volume /dev/vdc1 to the volume group vgdata.","accept":["vgextend vgdata /dev/vdc1"],"explain":"Run `pvcreate /dev/vdc1` first if it is not a PV yet (vgextend can also do it for you)."},{"type":"mcq","q":"A task says: \"Resize LV vo to 230 MiB (anything from 217 to 243 MiB is fine)\". The extent size is 16 MiB. What does `lvextend -L 230M` give?","options":["240 MiB, because LVM rounds up to a whole number of extents (15)","Exactly 230 MiB","224 MiB, rounded down","An error, because 230 is not a multiple of 16"],"answer":0,"explain":"230 / 16 = 14.4, rounded up to 15 extents = 240 MiB, which is inside the allowed range."},{"type":"mcq","q":"What is the difference between `lvextend -L 1G` and `lvextend -L +1G`?","options":["-L 1G sets the total size to 1 GiB; -L +1G adds 1 GiB to the current size","They are identical","-L 1G adds 1 GiB; -L +1G sets 1 GiB","-L +1G is not valid syntax"],"answer":0,"explain":"Read the task carefully: \"resize to\" is an absolute size, \"grow by\" is relative."},{"type":"mcq","q":"You grew the LV but `df -h` still shows the old size. Why?","options":["The filesystem was not grown; run xfs_growfs or resize2fs, or use lvextend -r next time","df caches sizes until reboot","The VG needs to be reactivated","You must remount with the grow option"],"answer":0,"explain":"The LV and the filesystem are separate layers."},{"type":"cmd","q":"Move all data off the PV /dev/vdb1 onto the other PVs in its volume group.","accept":["pvmove /dev/vdb1"],"explain":"The VG needs enough free space on its other PVs. It can run while mounted."},{"type":"mcq","q":"After pvmove, which command removes /dev/vdb1 from vgdata?","options":["vgreduce vgdata /dev/vdb1","pvremove vgdata /dev/vdb1","vgremove /dev/vdb1","lvremove /dev/vdb1"],"answer":0,"explain":"Then `pvremove /dev/vdb1` wipes its LVM label."}],"labs":[{"title":"Resize a logical volume (exam classic)","scenario":"Setup: create VG vgexam (16 MiB extents) and LV vo of 176 MiB with XFS mounted at /mnt/vo, with a test file inside. Task: resize vo to 230 MiB (217 to 243 MiB is fine) without losing data.","hints":[],"steps":["vgcreate -s 16M vgexam /dev/vdb4      # setup, on a spare partition or disk","lvcreate -n vo -L 176M vgexam && mkfs.xfs /dev/vgexam/vo","mkdir -p /mnt/vo && mount /dev/vgexam/vo /mnt/vo && echo keep > /mnt/vo/data.txt","# the task itself:","lvextend -r -L 230M /dev/vgexam/vo"],"verify":["lvs vgexam; df -h /mnt/vo","cat /mnt/vo/data.txt"]},{"title":"Volume group out of space","scenario":"Try to grow an LV beyond the VG's free space and read the error. Add a new PV to the VG, then grow the LV and its filesystem by 500 MiB.","hints":[],"steps":["lvextend -r -L +5G /dev/vgexam/vo        # Insufficient free space","pvcreate /dev/vdc1","vgextend vgexam /dev/vdc1","lvextend -r -L +500M /dev/vgexam/vo"],"verify":["vgs vgexam; df -h /mnt/vo"]},{"title":"Shrink an ext4 volume","scenario":"Create a 400 MiB ext4 LV with a file on it, mounted at /mnt/shrink. Shrink it to 200 MiB safely and check the file.","hints":[],"steps":["lvcreate -n shrink -L 400M vgexam && mkfs.ext4 /dev/vgexam/shrink","mkdir -p /mnt/shrink && mount /dev/vgexam/shrink /mnt/shrink && echo safe > /mnt/shrink/f.txt","umount /mnt/shrink","lvreduce -r -L 200M /dev/vgexam/shrink","mount /dev/vgexam/shrink /mnt/shrink"],"verify":["lvs vgexam; cat /mnt/shrink/f.txt"]},{"title":"Replace a physical volume","scenario":"Move all extents off one PV in vgexam, take it out of the VG, and wipe its LVM label, while the LVs stay mounted.","hints":[],"steps":["pvs","pvmove /dev/vdb4","vgreduce vgexam /dev/vdb4","pvremove /dev/vdb4"],"verify":["pvs; df -h /mnt/vo"]}]},{"day":33,"course":"RH134","title":"XFS, ext4 and VFAT file systems","objective":"Create, mount, unmount and use VFAT, ext4 and XFS file systems.","questions":[{"type":"cmd","q":"Create a VFAT filesystem on /dev/vdb5.","accept":["mkfs.vfat /dev/vdb5","mkfs -t vfat /dev/vdb5","mkfs.fat /dev/vdb5"],"explain":"mkfs.vfat comes from the dosfstools package."},{"type":"mcq","q":"Which package provides mkfs.vfat?","options":["dosfstools","vfat-utils","e2fsprogs","xfsprogs"],"answer":0,"explain":"e2fsprogs gives mkfs.ext4 and resize2fs; xfsprogs gives mkfs.xfs and xfs_growfs."},{"type":"mcq","q":"How do file ownership and permissions work on a VFAT filesystem?","options":["VFAT stores none; they come from mount options such as uid=, gid= and umask=","Exactly like XFS","Only root can ever write to VFAT","They are stored in an extended attribute"],"answer":0,"explain":"chmod and chown on VFAT files fail or have no lasting effect."},{"type":"cmd","q":"Mount /dev/vdb5 at /mnt/usb so that the user with UID 2000 owns all files.","accept":["mount -o uid=2000 /dev/vdb5 /mnt/usb","mount -t vfat -o uid=2000 /dev/vdb5 /mnt/usb"],"explain":"In fstab: `UUID=ABCD-1234 /mnt/usb vfat uid=2000,gid=2000 0 0`."},{"type":"cmd","q":"Set the label DATA on the unmounted XFS filesystem /dev/vdb1.","accept":["xfs_admin -L DATA /dev/vdb1"],"explain":"Or set it when you create it: `mkfs.xfs -L DATA /dev/vdb1`."},{"type":"cmd","q":"Set the label BACKUP on the ext4 filesystem /dev/vdb2.","accept":["e2label /dev/vdb2 BACKUP","tune2fs -L BACKUP /dev/vdb2"],"explain":"`fatlabel /dev/vdb5 NAME` does the same for VFAT."},{"type":"mcq","q":"What does the UUID of a VFAT filesystem look like in blkid?","options":["A short form such as 1A2B-3C4D","A long form such as 6f1e...-...-...","VFAT has no UUID","The same as the partition number"],"answer":0,"explain":"Copy it exactly into fstab: `UUID=1A2B-3C4D`."},{"type":"cmd","q":"Show the geometry of the XFS filesystem mounted at /mnt/data.","accept":["xfs_info /mnt/data"],"explain":"For ext4, use `tune2fs -l /dev/...` or `dumpe2fs -h /dev/...`."},{"type":"mcq","q":"Which filesystem does RHEL use by default?","options":["XFS","ext4","Btrfs","VFAT"],"answer":0,"explain":"Btrfs is not supported on RHEL."},{"type":"mcq","q":"Which fstab option lets the system finish booting even if this device is missing?","options":["nofail","noauto","defaults","_netdev"],"answer":0,"explain":"`noauto` means \"don't mount at boot at all\"; `nofail` means \"try, but don't stop the boot on failure\"."}],"labs":[{"title":"VFAT file system mounted at boot","scenario":"Create a 300 MiB partition, format it VFAT, and mount it at /mnt/vfat at every boot using its UUID.","hints":[],"steps":["parted -s /dev/vdb mkpart win fat32 3585MiB 3885MiB","udevadm settle","mkfs.vfat /dev/vdb5","mkdir -p /mnt/vfat","blkid /dev/vdb5            # UUID=\"XXXX-XXXX\"","echo 'UUID=XXXX-XXXX  /mnt/vfat  vfat  defaults  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["findmnt /mnt/vfat"]},{"title":"Mount by label everywhere","scenario":"Give your XFS, ext4 and VFAT filesystems labels (DATA, BACKUP, WINDATA) and change their fstab lines to use LABEL=. Test with mount -a and a reboot.","hints":[],"steps":["umount /mnt/data && xfs_admin -L DATA /dev/vdb1","e2label /dev/vdb2 BACKUP","umount /mnt/vfat && fatlabel /dev/vdb5 WINDATA","vim /etc/fstab            # LABEL=DATA ..., LABEL=BACKUP ..., LABEL=WINDATA ...","systemctl daemon-reload && mount -a"],"verify":["lsblk -f"]},{"title":"Mount options in practice","scenario":"Remount /mnt/data read-only and try to create a file. Remount it read-write. Mount /mnt/vfat with uid=harry's UID and check file ownership.","hints":[],"steps":["mount -o remount,ro /mnt/data","touch /mnt/data/x          # Read-only file system","mount -o remount,rw /mnt/data","umount /mnt/vfat && mount -o uid=$(id -u harry) /dev/vdb5 /mnt/vfat","touch /mnt/vfat/test && ls -l /mnt/vfat"],"verify":["findmnt -o TARGET,OPTIONS /mnt/data /mnt/vfat"]},{"title":"XFS vs ext4 resizing","scenario":"On two LVs (one XFS, one ext4), grow both by 100 MiB. Then try to shrink the XFS one and read the error.","hints":[],"steps":["lvextend -r -L +100M /dev/vgexam/vo","lvextend -r -L +100M /dev/vgexam/shrink","lvreduce -r -L -50M /dev/vgexam/vo        # fails: XFS cannot shrink"],"verify":["lvs vgexam"]}]},{"day":34,"course":"RH134","title":"Mounting NFS file systems","objective":"Mount and unmount NFS network file systems.","questions":[{"type":"cmd","q":"Mount the NFS export node2:/shares/docs on /mnt/docs for now.","accept":["mount -t nfs node2:/shares/docs /mnt/docs","mount node2:/shares/docs /mnt/docs"],"explain":"The mount point must exist first."},{"type":"mcq","q":"Which /etc/fstab line mounts that export at boot?","options":["node2:/shares/docs  /mnt/docs  nfs  defaults,_netdev  0 0","/mnt/docs  node2:/shares/docs  nfs  defaults  0 0","UUID=node2:/shares/docs  /mnt/docs  nfs  defaults  1 2","nfs://node2/shares/docs  /mnt/docs  auto  defaults  0 0"],"answer":0,"explain":"Use `0 0` for dump and fsck; there is nothing local to check."},{"type":"mcq","q":"What does the `_netdev` mount option tell the system?","options":["The filesystem needs the network, so mount it after the network is up","Mount it over any network device","Never mount it at boot","Use NFSv3"],"answer":0,"explain":"systemd usually detects NFS as a network filesystem anyway, but _netdev makes it explicit."},{"type":"cmd","q":"List the exports that node2 offers.","accept":["showmount -e node2"],"explain":"showmount needs the server's mountd and rpc-bind reachable. With NFSv4-only servers, mount `node2:/` and browse instead."},{"type":"mcq","q":"Which package provides the NFS client tools?","options":["nfs-utils","nfs-client","autofs","rpcbind-client"],"answer":0,"explain":"It is usually installed already. Check with `rpm -q nfs-utils`."},{"type":"mcq","q":"Which NFS version does RHEL use by default when mounting?","options":["NFSv4 (the newest one both sides support)","NFSv2","NFSv3","SMB 3"],"answer":0,"explain":"Force one with `-o nfsvers=4.2` or `-o vers=3` if a task asks."},{"type":"cmd","q":"Show the NFS filesystems that are mounted right now.","accept":["findmnt -t nfs4","findmnt -t nfs,nfs4","mount -t nfs4","df -hT -t nfs4"],"explain":"`findmnt` also shows the mount options that were used."},{"type":"mcq","q":"On an NFS server, which file lists the directories it shares?","options":["/etc/exports","/etc/nfs.conf","/etc/fstab","/etc/exports.nfs"],"answer":0,"explain":"Example line: `/shares/docs 192.168.122.0/24(rw,sync)`."},{"type":"cmd","q":"On the server, re-read /etc/exports and apply the changes.","accept":["exportfs -r","exportfs -ra","exportfs -arv"],"explain":"`exportfs -v` lists what is exported now."},{"type":"mcq","q":"Which firewalld services must the server allow for NFSv4 plus showmount?","options":["nfs, rpc-bind and mountd","http and https","nfs only, for everything","samba"],"answer":0,"explain":"nfs alone is enough for NFSv4 mounts; showmount needs the other two."}],"labs":[{"title":"Build an NFS server on node2","scenario":"On node2, share /shares/docs (read-write) and /rhome with your lab subnet. Create remote user home directories /rhome/remoteuser1 and /rhome/remoteuser2 owned by UIDs 5001 and 5002. Open the firewall.","hints":[],"steps":["dnf install -y nfs-utils","mkdir -p /shares/docs /rhome/remoteuser1 /rhome/remoteuser2","chown 5001:5001 /rhome/remoteuser1; chown 5002:5002 /rhome/remoteuser2","echo '/shares/docs 192.168.122.0/24(rw,sync)' >> /etc/exports","echo '/rhome 192.168.122.0/24(rw,sync)' >> /etc/exports","systemctl enable --now nfs-server","exportfs -rv","firewall-cmd --permanent --add-service={nfs,rpc-bind,mountd} && firewall-cmd --reload"],"verify":["exportfs -v"]},{"title":"Mount NFS at boot on node1","scenario":"Mount node2:/shares/docs at /mnt/docs on node1 so it comes back after every reboot.","hints":[],"steps":["showmount -e node2","mkdir -p /mnt/docs","echo 'node2:/shares/docs  /mnt/docs  nfs  defaults,_netdev  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["findmnt /mnt/docs","touch /mnt/docs/from-node1 && ls -l /mnt/docs"]},{"title":"Read-only NFS mount","scenario":"Mount the same export read-only at /mnt/docs-ro and confirm you cannot write to it.","hints":[],"steps":["mkdir -p /mnt/docs-ro","mount -t nfs -o ro node2:/shares/docs /mnt/docs-ro","touch /mnt/docs-ro/x         # Read-only file system"],"verify":["findmnt -o TARGET,OPTIONS /mnt/docs-ro"]},{"title":"Troubleshoot an NFS mount","scenario":"On node2, remove the nfs service from the firewall and try to mount from node1. Read the error, then fix it. Next, mount a path that is not exported and read that error too.","hints":[],"steps":["firewall-cmd --remove-service=nfs          # on node2, runtime only","mount -t nfs node2:/shares/docs /mnt/docs  # hangs, then times out","firewall-cmd --add-service=nfs             # on node2","mount -t nfs node2:/wrong /mnt/docs        # access denied / No such file"],"verify":["mount -a && findmnt /mnt/docs"]}]},{"day":35,"course":"RH134","title":"Automounting with autofs","objective":"Configure autofs.","questions":[{"type":"mcq","q":"Which package and service provide automounting?","options":["autofs","automount-nfs","nfs-automount","systemd-autofsd"],"answer":0,"explain":"`dnf install autofs` then `systemctl enable --now autofs`."},{"type":"mcq","q":"Where do you add your own master map entries on RHEL?","options":["In a file ending in .autofs under /etc/auto.master.d/","In /etc/fstab with the auto option","In /etc/autofs.conf","In /etc/exports"],"answer":0,"explain":"Example /etc/auto.master.d/shares.autofs: `/shares  /etc/auto.shares`."},{"type":"mcq","q":"The master map has `/shares  /etc/auto.shares` and the map has `work  -rw,sync  node2:/shares/work`. Where is the export mounted?","options":["At /shares/work, the first time something accesses it","At /work at boot","At /shares at boot","At /etc/auto.shares/work"],"answer":0,"explain":"This is an indirect map: the key (work) becomes a subdirectory of /shares."},{"type":"mcq","q":"In the map line `*  -rw,sync  node2:/rhome/&`, what does `&` stand for?","options":["The key that was requested, such as the user name","The current user","All exports on node2","A wildcard for any character"],"answer":0,"explain":"Accessing /rhome/remoteuser1 mounts node2:/rhome/remoteuser1."},{"type":"mcq","q":"How is a direct map listed in the master map?","options":["/-  /etc/auto.direct","/direct  /etc/auto.direct","*  /etc/auto.direct","direct:/etc/auto.direct"],"answer":0,"explain":"In a direct map, each key is a full path, e.g. `/mnt/docs  -ro  node2:/shares/docs`."},{"type":"cmd","q":"Enable and start the autofs servic
