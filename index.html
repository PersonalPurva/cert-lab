 a compensating control."},{"type":"mcq","q":"A door lock is which control function?","options":["Preventive","Detective","Corrective","Compensating"],"answer":0,"explain":"It prevents unauthorized entry. A camera that records entry would be detective."}],"labs":[{"title":"Classify controls two ways","scenario":"For each item give both its TYPE and its FUNCTION: antivirus software, a CCTV camera, an incident-response plan, a bollard, encryption, a re-imaging procedure.","hints":[],"steps":["# antivirus -> Technical / Preventive (and Detective)","# CCTV -> Physical / Detective (Deterrent when visible)","# IR plan -> Managerial / Corrective","# bollard -> Physical / Preventive (Deterrent)","# encryption -> Technical / Preventive","# re-imaging -> Operational / Corrective"],"verify":["you can defend each pair"]},{"title":"Choose a compensating control","scenario":"A vendor app requires an outdated TLS version you cannot fix. List three compensating controls to reduce the risk.","hints":[],"steps":["# isolate the server on its own VLAN with strict firewall rules","# put it behind a reverse proxy that terminates modern TLS","# increase monitoring/logging and restrict who can reach it"],"verify":["each control reduces exposure without changing the app"]}]},{"day":3,"course":"1 Concepts","title":"Change management and zero trust","objective":"Explain the importance of change management and the zero-trust model.","questions":[{"type":"mcq","q":"Why does security care about change management?","options":["Unplanned or untracked changes are a top cause of outages and new vulnerabilities","It slows attackers down directly","It replaces the need for backups","It is only about software licensing"],"answer":0,"explain":"Formal change control means changes are reviewed, approved, tested and reversible."},{"type":"mcq","q":"What is a \"rollback plan\" in change management?","options":["A documented way to undo a change if it causes problems","A plan to attack a rolled-out system","A backup schedule","A list of approved vendors"],"answer":0,"explain":"Never deploy a change you cannot back out of."},{"type":"mcq","q":"In the zero-trust model, what is the core principle?","options":["Never trust, always verify — every request is authenticated and authorized regardless of location","Trust everything inside the firewall","Trust remote users more than local users","Encrypt nothing internally"],"answer":0,"explain":"Zero trust removes the idea of a trusted internal network."},{"type":"mcq","q":"In zero-trust terms, what is the Policy Enforcement Point (PEP)?","options":["The component that actually allows or blocks the request","The database of user passwords","The place policies are written","The VPN concentrator"],"answer":0,"explain":"The Policy Decision Point (PDP) decides; the PEP enforces the decision."},{"type":"mcq","q":"What does \"least privilege\" mean?","options":["Give each user or process only the access it needs to do its job","Give admins access to everything","Remove all access by default forever","Only apply to service accounts"],"answer":0,"explain":"It limits the damage a compromised account can do."},{"type":"mcq","q":"What is microsegmentation?","options":["Dividing the network into small zones so a breach in one cannot spread freely","Making network cables shorter","Splitting a hard disk into partitions","Using smaller subnets for Wi-Fi only"],"answer":0,"explain":"It supports zero trust by limiting lateral movement."},{"type":"mcq","q":"Why is a \"maintenance window\" used?","options":["To make disruptive changes at a planned low-impact time with approvals in place","To let attackers in safely","To avoid documenting changes","To disable logging temporarily"],"answer":0,"explain":"Changes outside approved windows are a red flag."},{"type":"cmd","q":"On Linux, show the last changes made to a Git-tracked config repo (change history).","accept":["git log --oneline","git log"],"explain":"Version control is a simple, powerful change-management tool for configs."}],"labs":[{"title":"Design a change request","scenario":"Write a one-page change request to upgrade a production web server's TLS: include purpose, risk, backout/rollback plan, test plan, and approval step.","hints":[],"steps":["# Purpose: enable TLS 1.3, disable TLS 1.0/1.1","# Risk: old clients may fail; mitigation: notify + test","# Rollback: keep old config file, restore + restart on failure","# Test: staging server first, then curl -v to confirm TLS 1.3","# Approval: change advisory board sign-off, maintenance window"],"verify":["the request could actually be approved and reversed"]},{"title":"Apply least privilege","scenario":"On a Linux box, find a service running as root that should not, and describe how to run it as a dedicated low-privilege user instead.","hints":[],"steps":["ps -eo user,comm | sort | uniq -c | sort -rn | head","# create a service account:  useradd -r -s /sbin/nologin appsvc","# set the unit's User=appsvc and restrict its file permissions"],"verify":["the service no longer needs root"]}]},{"day":4,"course":"2 Threats","title":"Threat actors and motivations","objective":"Compare threat actors, their attributes and motivations.","questions":[{"type":"mcq","q":"Which threat actor typically has the most resources and patience?","options":["Nation-state (APT)","Script kiddie","Hacktivist","Insider by accident"],"answer":0,"explain":"Advanced Persistent Threats are well-funded and pursue long-term goals like espionage."},{"type":"mcq","q":"A \"script kiddie\" is best described as:","options":["An unskilled attacker using tools written by others","A government cyber unit","A malicious insider","An ethical hacker"],"answer":0,"explain":"Low skill, low resources, but still dangerous with off-the-shelf tools."},{"type":"mcq","q":"What primarily motivates a hacktivist?","options":["A political or social cause","Financial gain only","Nation-state espionage","Nothing; it is random"],"answer":0,"explain":"Hacktivists deface sites or leak data to make a statement."},{"type":"mcq","q":"Which term describes a trusted employee who intentionally causes harm?","options":["Malicious insider","Script kiddie","APT","Shadow IT"],"answer":0,"explain":"Insiders are dangerous because they already have access and knowledge."},{"type":"mcq","q":"What is \"shadow IT\"?","options":["Hardware or software used inside an organization without IT approval","A hacking group","A backup data center","Malware that hides in shadows"],"answer":0,"explain":"Shadow IT (like an unapproved cloud app) creates unmanaged risk."},{"type":"mcq","q":"Which attacker attribute describes whether they are inside or outside the organization?","options":["Internal vs external","Sophistication","Funding","Intent"],"answer":0,"explain":"Actor attributes include internal/external, resources/funding, and level of sophistication."},{"type":"mcq","q":"An organized crime group's usual motivation is:","options":["Financial gain","Political protest","Curiosity","Improving security"],"answer":0,"explain":"They run ransomware and fraud operations for money."},{"type":"mcq","q":"What is threat intelligence used for?","options":["Understanding likely attackers and their techniques to prepare defenses","Attacking competitors","Replacing firewalls","Encrypting backups"],"answer":0,"explain":"Feeds and reports (e.g., MITRE ATT&CK) map real-world adversary behavior."}],"labs":[{"title":"Build a threat-actor profile","scenario":"For your own scenario (a small online shop), list the two most likely threat actors, their motivation, capability, and one control that raises their cost.","hints":[],"steps":["# e.g. organized crime -> money -> ransomware -> offline backups + MFA","# e.g. script kiddie -> notoriety -> automated scans -> patching + WAF"],"verify":["each actor has a matching control"]},{"title":"Explore MITRE ATT&CK","scenario":"Open attack.mitre.org and pick one technique (e.g., Phishing). Note its ID, one detection idea, and one mitigation.","hints":["You can browse it read-only; no account needed."],"steps":["# e.g. T1566 Phishing -> detect: email gateway + user reports","#                    -> mitigate: user training, link rewriting, MFA"],"verify":["you can name a real technique ID and a defense"]}]},{"day":5,"course":"2 Threats","title":"Social engineering","objective":"Explain common social-engineering techniques and why they work.","questions":[{"type":"mcq","q":"What is phishing?","options":["Fraudulent messages that trick users into revealing data or clicking malicious links","A network scanning tool","A type of firewall","Encryption of email"],"answer":0,"explain":"Phishing is the most common initial attack vector."},{"type":"mcq","q":"\"Spear phishing\" differs from phishing because it is:","options":["Targeted at a specific person or organization with personalized detail","Sent to millions randomly","Only done by phone","Always harmless"],"answer":0,"explain":"Whaling is spear phishing aimed at executives (\"big fish\")."},{"type":"mcq","q":"An attacker calls pretending to be IT support to get a password. This is:","options":["Vishing (voice phishing)","Smishing","Tailgating","Watering hole"],"answer":0,"explain":"Smishing uses SMS; vishing uses voice calls."},{"type":"mcq","q":"Following an employee through a secure door without badging in is:","options":["Tailgating","Phishing","Pretexting","Shoulder surfing"],"answer":0,"explain":"A physical social-engineering attack. Mantraps and turnstiles reduce it."},{"type":"mcq","q":"What is \"pretexting\"?","options":["Inventing a believable scenario to gain trust and information","Sending malware","Guessing passwords","Physical theft"],"answer":0,"explain":"\"I'm from the bank's fraud team...\" is a pretext."},{"type":"mcq","q":"Which principle explains why urgency works in scams (\"Act now or your account closes\")?","options":["Urgency/scarcity pressure that bypasses careful thinking","Least privilege","Non-repudiation","Defense in depth"],"answer":0,"explain":"Attackers exploit authority, urgency, familiarity, and fear."},{"type":"mcq","q":"A \"watering hole\" attack means:","options":["Compromising a website the target group is known to visit","Poisoning a water supply","Flooding a network","Stealing a laptop"],"answer":0,"explain":"The attacker waits for victims at a site they trust."},{"type":"mcq","q":"What is the best single defense against social engineering?","options":["Security-awareness training combined with verification procedures","A faster firewall","Longer passwords only","Disabling email"],"answer":0,"explain":"People are the target, so people must be trained and given a way to verify."}],"labs":[{"title":"Analyze a phishing email","scenario":"Take a suspicious email (real or sample) and list five red flags an analyst would flag.","hints":[],"steps":["# mismatched sender domain, generic greeting, urgent threat,","# link text not matching the real URL (hover to check),","# unexpected attachment, spelling errors, request for credentials"],"verify":["you found at least five indicators"]},{"title":"Inspect a link safely","scenario":"Without clicking, reveal where a shortened or masked link really points, using the terminal.","hints":["curl -sI follows headers; use -L to see redirects, but stop before loading content."],"steps":["curl -sI \"https://example.com/login\" | head","# or expand a shortener:  curl -sI https://bit.ly/xxxx | grep -i location"],"verify":["you can state the real destination host"]},{"title":"Report-and-verify drill","scenario":"Write the 3-step procedure a user should follow when they suspect a phishing message.","hints":[],"steps":["# 1. Do not click or reply","# 2. Report it (phishing button / security@company)","# 3. Verify any request through a known official channel"],"verify":["the steps stop the attack and preserve evidence"]}]},{"day":6,"course":"2 Threats","title":"Malware types","objective":"Compare types of malware and how they spread.","questions":[{"type":"mcq","q":"What defines a virus versus a worm?","options":["A virus needs a host file/user action to spread; a worm self-propagates across networks","A worm needs a host; a virus spreads itself","They are identical","A virus only affects Windows"],"answer":0,"explain":"Worms spread on their own (e.g., across a LAN); viruses attach to files."},{"type":"mcq","q":"Ransomware primarily does what?","options":["Encrypts or locks data and demands payment to restore access","Steals passwords silently","Mines cryptocurrency","Sends spam only"],"answer":0,"explain":"Best defenses: offline/immutable backups, patching, MFA, least privilege."},{"type":"mcq","q":"A \"Trojan\" is malware that:","options":["Disguises itself as legitimate software to trick the user into running it","Replicates across networks automatically","Is always a browser add-on","Cannot be removed"],"answer":0,"explain":"Named after the Trojan horse — it looks useful but carries a payload."},{"type":"mcq","q":"Software that secretly records keystrokes is a:","options":["Keylogger","Rootkit","Worm","Logic bomb"],"answer":0,"explain":"It captures passwords and messages. It can be software or hardware."},{"type":"mcq","q":"A rootkit is dangerous mainly because it:","options":["Hides itself and gains privileged, persistent control of the OS","Only shows pop-up ads","Cannot survive a reboot","Is easy to detect"],"answer":0,"explain":"Rootkits operate at a low level, hiding processes and files from tools."},{"type":"mcq","q":"A \"logic bomb\" triggers when:","options":["A specific condition or time is met (e.g., a date, or a user being deleted)","The computer starts","Any file is opened","The network is idle"],"answer":0,"explain":"A disgruntled admin might set code to fire after they are removed from payroll."},{"type":"mcq","q":"Fileless malware is hard to detect because it:","options":["Runs in memory using legitimate tools (like PowerShell) rather than dropping a file","Has no code at all","Only affects printers","Is written in assembly"],"answer":0,"explain":"Living-off-the-land techniques abuse built-in binaries."},{"type":"mcq","q":"What is a botnet?","options":["A network of compromised devices controlled by an attacker","A robot vacuum network","A backup system","A type of firewall"],"answer":0,"explain":"Bots (zombies) take orders from a command-and-control (C2) server, often for DDoS."},{"type":"cmd","q":"On Linux, hash a suspicious binary so you can check it against threat-intel feeds.","accept":["sha256sum suspicious.bin","md5sum suspicious.bin"],"explain":"Submit the hash (not the file) to a reputation service like an IOC lookup."}],"labs":[{"title":"Malware indicator triage","scenario":"You find these on a host: a new scheduled task, a process with no file on disk, outbound traffic to a strange IP every 60s, and a renamed powershell.exe. Match each to a malware behavior.","hints":[],"steps":["# scheduled task -> persistence","# process with no file -> fileless / in-memory","# beacon every 60s -> C2 / botnet check-in","# renamed powershell -> living-off-the-land evasion"],"verify":["each indicator maps to a technique"]},{"title":"Safe static look at a file","scenario":"Without executing it, gather basic facts about a suspicious file: type, size, and readable strings.","hints":[],"steps":["file suspicious.bin","ls -l suspicious.bin","strings suspicious.bin | head -40"],"verify":["you can describe the file without running it"]}]},{"day":7,"course":"2 Threats","title":"Password and application attacks","objective":"Explain password attacks, injection and other application attacks.","questions":[{"type":"mcq","q":"A brute-force password attack:","options":["Tries every possible combination until one works","Uses a list of common passwords only","Reads the password from memory","Requires the hash file"],"answer":0,"explain":"A dictionary attack uses a wordlist; brute force is exhaustive; both are slower with strong hashes and lockouts."},{"type":"mcq","q":"What is a dictionary attack?","options":["Trying passwords from a list of likely words/leaked passwords","Attacking the dictionary app","A physical attack","Encrypting a wordlist"],"answer":0,"explain":"Wordlists like rockyou.txt are common in labs."},{"type":"mcq","q":"Why does \"salting\" a password hash help?","options":["It adds random data so identical passwords hash differently, defeating precomputed tables","It makes the password shorter","It encrypts the password reversibly","It speeds up logins"],"answer":0,"explain":"Salt defeats rainbow tables and stops attackers from seeing duplicate passwords."},{"type":"mcq","q":"SQL injection works by:","options":["Inserting malicious SQL through input that the app runs against its database","Flooding the database with traffic","Guessing the DB password","Encrypting the database"],"answer":0,"explain":"Parameterized queries (prepared statements) are the main defense."},{"type":"mcq","q":"Cross-site scripting (XSS) allows an attacker to:","options":["Run malicious script in another user's browser via a vulnerable web page","Read the server's disk directly","Crash the database","Bypass the firewall physically"],"answer":0,"explain":"Output encoding and a Content Security Policy mitigate XSS."},{"type":"mcq","q":"A \"pass-the-hash\" attack means:","options":["Authenticating with a stolen password hash without cracking it","Sharing a hash publicly","Hashing a password twice","Salting a hash"],"answer":0,"explain":"It abuses how some protocols accept the hash as proof of identity."},{"type":"mcq","q":"What is credential stuffing?","options":["Reusing username/password pairs leaked from one site against many others","Filling a form with junk","Brute forcing one account","Stuffing a hash with salt"],"answer":0,"explain":"It works because people reuse passwords; MFA stops most of it."},{"type":"mcq","q":"A race condition (TOCTOU) vulnerability is:","options":["A flaw where the state changes between the time of check and time of use","A slow network","A CPU overheating","Two users logging in at once safely"],"answer":0,"explain":"Attackers exploit the tiny window between a check and an action."},{"type":"cmd","q":"On Linux, generate a bcrypt-style password hash to see how modern hashing looks.","accept":["openssl passwd -6 'MyP@ss'","openssl passwd -6"],"explain":"-6 is SHA-512 crypt with a random salt; note the different output each run."}],"labs":[{"title":"Compare hash strength","scenario":"Hash the same password with an old fast algorithm and a modern salted one; explain which is harder to crack and why.","hints":[],"steps":["echo -n \"password123\" | md5sum","openssl passwd -6 \"password123\"","openssl passwd -6 \"password123\"    # note: different salt -> different output"],"verify":["you can explain salting and slow hashing"]},{"title":"Prevent SQL injection (concept lab)","scenario":"Given the unsafe query   \"SELECT * FROM users WHERE name='\" + input + \"'\"   rewrite it as a parameterized query and explain why it stops injection.","hints":[],"steps":["# unsafe: input   ' OR '1'='1   returns all rows","# safe (pseudo):  db.query(\"SELECT * FROM users WHERE name = ?\", [input])","# the input is treated as data, never as SQL code"],"verify":["the injection payload no longer changes the query logic"]},{"title":"Account-lockout defense","scenario":"Describe the settings that turn a brute-force attack from easy to impractical.","hints":[],"steps":["# long complex passphrase or MFA","# account lockout after N failed attempts","# rate limiting / progressive delay","# slow salted hashing (bcrypt/argon2) server-side"],"verify":["an attacker cannot try enough guesses in time"]}]},{"day":8,"course":"2 Threats","title":"Network attacks","objective":"Explain common network-based attacks.","questions":[{"type":"mcq","q":"A man-in-the-middle (on-path) attack lets an attacker:","options":["Intercept and possibly alter traffic between two parties","Only slow the network","Encrypt all traffic","Physically cut a cable"],"answer":0,"explain":"Defenses: TLS everywhere, certificate validation, and secure Wi-Fi."},{"type":"mcq","q":"ARP poisoning is used to:","options":["Trick devices into sending traffic to the attacker on a local network","Poison DNS records globally","Flood a web server","Crack Wi-Fi passwords"],"answer":0,"explain":"The attacker maps their MAC to another host's IP. Dynamic ARP inspection helps."},{"type":"mcq","q":"DNS poisoning (spoofing) results in:","options":["Users being sent to a malicious IP for a legitimate domain name","Slower DNS only","Encrypted DNS","A physical attack"],"answer":0,"explain":"DNSSEC and using trusted resolvers reduce it."},{"type":"mcq","q":"A SYN flood is a type of:","options":["Denial-of-service attack that exhausts a server's half-open connections","Password attack","Injection attack","Phishing"],"answer":0,"explain":"SYN cookies and rate limiting mitigate it."},{"type":"mcq","q":"What is a \"distributed\" denial of service (DDoS)?","options":["A DoS launched from many compromised sources at once","A DoS from one PC","A backup failure","A slow disk"],"answer":0,"explain":"A botnet amplifies the flood; cloud scrubbing services help absorb it."},{"type":"mcq","q":"Rogue access point vs evil twin: the evil twin specifically:","options":["Impersonates a legitimate AP's name (SSID) to trick users into connecting","Is any unauthorized AP","Is a wired switch","Only affects Ethernet"],"answer":0,"explain":"Both are dangerous; the evil twin mimics a trusted network."},{"type":"mcq","q":"A replay attack succeeds when:","options":["Captured valid data (like an auth token) is resent to impersonate a user","The network is replayed on video","A backup is restored","DNS is poisoned"],"answer":0,"explain":"Timestamps, nonces and session tokens prevent replay."},{"type":"mcq","q":"DNS over HTTPS (DoH) mainly improves:","options":["Privacy/integrity of DNS queries by encrypting them","Web page speed only","Password strength","Physical security"],"answer":0,"explain":"It stops on-path snooping and tampering of DNS lookups."},{"type":"cmd","q":"On Linux, capture the first 20 packets on interface eth0 to inspect traffic (authorized lab only).","accept":["sudo tcpdump -i eth0 -c 20","tcpdump -i eth0 -c 20"],"explain":"Only capture on networks you own or are authorized to test."}],"labs":[{"title":"Read a capture for plaintext","scenario":"On your own lab network, capture traffic to an HTTP (not HTTPS) test site and show why HTTPS matters.","hints":[],"steps":["sudo tcpdump -i eth0 -A -c 50 'tcp port 80'","# observe that HTTP headers and data are readable"],"verify":["you can see plaintext over HTTP and explain how TLS fixes it"]},{"title":"Detect ARP spoofing","scenario":"Show your ARP table and explain what a duplicated MAC for two IPs (or the gateway MAC changing) would indicate.","hints":[],"steps":["ip neigh","arp -a","# two IPs sharing one MAC, or the gateway's MAC suddenly changing = possible ARP poisoning"],"verify":["you can spot a suspicious ARP entry"]}]},{"day":9,"course":"2 Threats","title":"Vulnerabilities and the attack surface","objective":"Explain hardware, software and cloud vulnerabilities.","questions":[{"type":"mcq","q":"A \"zero-day\" vulnerability is one that:","options":["Has no patch available because the vendor does not yet know or has not fixed it","Is 24 hours old exactly","Only affects new hardware","Is always low risk"],"answer":0,"explain":"Defense relies on layered controls and behavior-based detection."},{"type":"mcq","q":"What is the difference between a vulnerability and an exploit?","options":["A vulnerability is the weakness; an exploit is the code/technique that abuses it","They are the same","An exploit is the fix","A vulnerability is always exploited"],"answer":0,"explain":"A vulnerability with no working exploit is lower (but not zero) risk."},{"type":"mcq","q":"\"Patch management\" reduces risk by:","options":["Applying vendor updates that fix known vulnerabilities in a controlled way","Deleting old files","Encrypting disks","Blocking all ports"],"answer":0,"explain":"Unpatched systems are one of the most common breach causes."},{"type":"mcq","q":"A buffer overflow happens when:","options":["A program writes more data than a memory buffer can hold, corrupting adjacent memory","The network buffer is full","The disk is full","Too many users log in"],"answer":0,"explain":"It can let an attacker run their own code. Modern OSes use ASLR/DEP to mitigate."},{"type":"mcq","q":"\"Legacy\" systems are risky because they:","options":["No longer receive security updates and may run outdated protocols","Are always slower","Cost more to run","Cannot be networked"],"answer":0,"explain":"If they cannot be replaced, isolate them (compensating control)."},{"type":"mcq","q":"Misconfiguration is dangerous because it:","options":["Leaves systems exposed even when the software itself is secure (e.g., open S3 bucket)","Only affects hardware","Is not exploitable","Is a type of malware"],"answer":0,"explain":"Secure baselines and configuration reviews catch these."},{"type":"mcq","q":"A supply-chain attack targets:","options":["A trusted vendor/component to reach that vendor's many customers","Only the delivery trucks","One end user","The power grid only"],"answer":0,"explain":"Example: malware inserted into a software update."},{"type":"mcq","q":"What is \"TTPs\" in threat analysis?","options":["Tactics, Techniques and Procedures — how an adversary operates","Trusted Third Parties","Transport Test Protocols","Time To Patch"],"answer":0,"explain":"TTPs (from MITRE ATT&CK) help defenders anticipate behavior."},{"type":"cmd","q":"On Linux, list installed packages so you can check them against a vulnerability list.","accept":["rpm -qa","dpkg -l"],"explain":"Feed the versions into a scanner or CVE lookup to find known issues."}],"labs":[{"title":"Reduce your attack surface","scenario":"On a Linux server, list listening services and disable one that is not needed.","hints":[],"steps":["ss -tulpn","systemctl disable --now <unneeded-service>","ss -tulpn        # confirm the port is gone"],"verify":["fewer ports are open than before"]},{"title":"Prioritize with CVSS (concept)","scenario":"Two findings: (a) CVSS 9.8 internet-facing RCE, (b) CVSS 4.3 local info-leak on an isolated box. Which do you patch first and why?","hints":[],"steps":["# (a) first: higher severity AND exposed to the internet","# (b) later: low severity and not reachable by attackers"],"verify":["you can justify prioritizing by severity + exposure"]}]},{"day":10,"course":"3 Architecture","title":"Secure network design","objective":"Compare architecture concepts: segmentation, DMZ, defense in depth.","questions":[{"type":"mcq","q":"What is a DMZ (screened subnet)?","options":["A network zone between the internet and the internal LAN for public-facing servers","A demilitarized country","A backup site","A VPN protocol"],"answer":0,"explain":"Web/email servers sit in the DMZ so a breach there does not directly reach the LAN."},{"type":"mcq","q":"\"Defense in depth\" means:","options":["Using multiple layers of controls so one failure does not cause a breach","One very strong firewall","Only physical security","Encrypting once"],"answer":0,"explain":"If one layer fails, others still protect the asset."},{"type":"mcq","q":"A VLAN provides:","options":["Logical segmentation of a switch into separate broadcast domains","Faster internet","Wireless encryption","A VPN tunnel"],"answer":0,"explain":"VLANs separate traffic (e.g., guests from staff) without extra cabling."},{"type":"mcq","q":"What does a jump server (bastion host) do?","options":["Provides a single, hardened, monitored entry point to manage internal systems","Speeds up jumps between websites","Backs up data","Replaces the firewall"],"answer":0,"explain":"Admins connect to the jump host first; direct admin access elsewhere is blocked."},{"type":"mcq","q":"Which describes an air-gapped system?","options":["A system physically isolated from other networks","A system with extra RAM","A cloud VM","A wireless-only host"],"answer":0,"explain":"Used for the most sensitive systems; data crosses only via strict manual processes."},{"type":"mcq","q":"A proxy server placed between users and the internet can:","options":["Filter, cache and log outbound web requests","Replace the router","Encrypt disks","Assign IP addresses"],"answer":0,"explain":"A forward proxy controls client access; a reverse proxy protects servers."},{"type":"mcq","q":"What is a \"honeypot\"?","options":["A decoy system designed to attract and study attackers","A backup server","A password vault","A type of firewall"],"answer":0,"explain":"It has no production value, so any interaction is suspicious."},{"type":"mcq","q":"Network Access Control (NAC) enforces:","options":["Health/identity checks before a device is allowed onto the network","Faster DNS","Disk encryption","Web filtering"],"answer":0,"explain":"A device failing posture checks can be quarantined to a remediation VLAN."},{"type":"cmd","q":"On Linux, view the routing table to understand how traffic leaves this host.","accept":["ip route","ip route show"],"explain":"Segmentation and gateways show up here as different routes."}],"labs":[{"title":"Segment a small network (design)","scenario":"Design VLANs for a small office: staff, guests, servers, IoT cameras. State which segments may talk to which.","hints":[],"steps":["# VLAN10 staff, VLAN20 guests (internet only), VLAN30 servers, VLAN40 IoT","# guests -> internet only; IoT -> no internet, no staff; staff -> servers on needed ports"],"verify":["no segment has more access than it needs"]},{"title":"Build a host firewall baseline","scenario":"On a Linux server, allow only SSH and HTTPS inbound and confirm.","hints":[],"steps":["firewall-cmd --permanent --add-service=ssh --add-service=https","firewall-cmd --permanent --set-target=DROP --zone=public 2>/dev/null || true","firewall-cmd --reload","firewall-cmd --list-all"],"verify":["only 22 and 443 are reachable"]}]},{"day":11,"course":"3 Architecture","title":"Cloud and virtualization security","objective":"Summarize secure cloud and virtualization concepts.","questions":[{"type":"mcq","q":"In the cloud shared-responsibility model, who secures the physical data center?","options":["The cloud provider","The customer","Both equally always","No one"],"answer":0,"explain":"The customer always owns their data and access; the split depends on IaaS/PaaS/SaaS."},{"type":"mcq","q":"In IaaS, patching the guest operating system is usually:","options":["The customer's responsibility","The provider's responsibility","Automatic and no one's job","Illegal"],"answer":0,"explain":"IaaS gives you the VM; you secure the OS and apps."},{"type":"mcq","q":"What is a CASB?","options":["A Cloud Access Security Broker that enforces policy between users and cloud apps","A cloud backup service","A billing tool","A hypervisor"],"answer":0,"explain":"It gives visibility and control over SaaS usage (including shadow IT)."},{"type":"mcq","q":"\"VM escape\" is dangerous because it:","options":["Lets code break out of a guest VM to the hypervisor/host","Deletes a VM","Slows the VM","Copies a VM legally"],"answer":0,"explain":"It breaks the isolation that virtualization relies on."},{"type":"mcq","q":"What does \"infrastructure as code\" (IaC) improve for security?","options":["Consistent, reviewable, version-controlled configuration of infrastructure","Faster CPUs","Cheaper storage","Physical security"],"answer":0,"explain":"Misconfigurations can be caught in code review before deployment."},{"type":"mcq","q":"A \"container\" differs from a VM because it:","options":["Shares the host kernel and packages just the app and its dependencies","Includes a full separate OS kernel","Cannot be networked","Is always more secure"],"answer":0,"explain":"Containers are lighter but share the kernel, so kernel isolation matters."},{"type":"mcq","q":"Which is a key control for securing cloud storage buckets?","options":["Blocking public access and enforcing least-privilege IAM policies","Making them public for speed","Disabling encryption","Removing logging"],"answer":0,"explain":"Public buckets are a classic breach source."},{"type":"mcq","q":"Serverless (functions) shifts more responsibility to the provider but you still own:","options":["Your code and its permissions/secrets","The hypervisor","The physical network","The data center power"],"answer":0,"explain":"Over-privileged functions and hard-coded secrets are the common risks."},{"type":"cmd","q":"With the AWS CLI, list S3 buckets to review what exists (authorized account only).","accept":["aws s3 ls"],"explain":"Then check each bucket's public-access and policy settings."}],"labs":[{"title":"Classify cloud responsibilities","scenario":"For SaaS, PaaS and IaaS, state who patches the OS, who secures the app, and who owns the data.","hints":[],"steps":["# IaaS: customer patches OS + app; provider does hardware/hypervisor","# PaaS: provider patches OS/runtime; customer secures app + data","# SaaS: provider does almost all; customer manages data + access/config","# data + identity: ALWAYS the customer"],"verify":["you can fill the responsibility matrix"]},{"title":"Harden a container image (concept)","scenario":"List four things you would change to harden a Dockerfile that currently runs as root and installs everything.","hints":[],"steps":["# use a minimal base image","# create and run as a non-root user (USER appsvc)","# install only needed packages, pin versions","# scan the image for CVEs before push; don't bake in secrets"],"verify":["the image is smaller, non-root, and scanned"]}]},{"day":12,"course":"3 Architecture","title":"Cryptography concepts","objective":"Compare symmetric/asymmetric crypto, hashing and PKI basics.","questions":[{"type":"mcq","q":"Symmetric encryption uses:","options":["The same key to encrypt and decrypt","A public and a private key","No key","A hash"],"answer":0,"explain":"Fast (e.g., AES) but you must share the key securely."},{"type":"mcq","q":"Asymmetric encryption uses:","options":["A public key to encrypt and a matching private key to decrypt","One shared secret","A salt only","A hash function"],"answer":0,"explain":"RSA and ECC are examples. Slower, so often used to exchange a symmetric key."},{"type":"mcq","q":"To send a confidential message to Bob, Alice encrypts with:","options":["Bob's public key (only Bob's private key can decrypt)","Bob's private key","Alice's public key","A shared password automatically"],"answer":0,"explain":"Anyone can hold the public key; only Bob holds the private key."},{"type":"mcq","q":"A digital signature is created by:","options":["Encrypting a hash of the message with the sender's private key","Encrypting with the receiver's public key","Hashing with a salt only","Sharing a symmetric key"],"answer":0,"explain":"The receiver verifies with the sender's public key — proving integrity and origin."},{"type":"mcq","q":"What does a Certificate Authority (CA) do?","options":["Issues and vouches for digital certificates that bind a public key to an identity","Encrypts all internet traffic","Stores passwords","Runs the DNS"],"answer":0,"explain":"Browsers trust certificates signed by trusted CAs."},{"type":"mcq","q":"Hashing is different from encryption because it is:","options":["One-way — you cannot reverse a hash back to the original","Reversible with a key","Only for passwords","The same as encoding"],"answer":0,"explain":"Hashing verifies integrity; encryption protects confidentiality (and is reversible with the key)."},{"type":"mcq","q":"\"Perfect forward secrecy\" ensures:","options":["A compromised long-term key does not expose past session keys","Passwords are never stored","Certificates never expire","Backups are encrypted"],"answer":0,"explain":"Each session uses ephemeral keys (e.g., ECDHE)."},{"type":"mcq","q":"What is the purpose of a certificate's CRL or OCSP?","options":["To check whether a certificate has been revoked before trusting it","To speed up TLS","To store the private key","To encrypt email"],"answer":0,"explain":"A revoked (e.g., stolen) certificate must not be trusted even if unexpired."},{"type":"cmd","q":"Create a self-signed certificate and key for a lab web server.","accept":["openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes"],"explain":"Self-signed is fine for labs; production uses a trusted CA."}],"labs":[{"title":"Encrypt and decrypt a file (symmetric)","scenario":"Use OpenSSL to encrypt a file with AES, then decrypt it, proving symmetric crypto works.","hints":[],"steps":["openssl enc -aes-256-cbc -salt -pbkdf2 -in secret.txt -out secret.enc","openssl enc -d -aes-256-cbc -pbkdf2 -in secret.enc -out secret.dec","diff secret.txt secret.dec && echo \"match\""],"verify":["the decrypted file equals the original"]},{"title":"Sign and verify (asymmetric)","scenario":"Generate a key pair, sign a file, and verify the signature.","hints":[],"steps":["openssl genpkey -algorithm RSA -out priv.pem","openssl rsa -in priv.pem -pubout -out pub.pem","openssl dgst -sha256 -sign priv.pem -out doc.sig document.txt","openssl dgst -sha256 -verify pub.pem -signature doc.sig document.txt"],"verify":["verification prints \"Verified OK\""]},{"title":"Inspect a real certificate","scenario":"View the certificate a website presents and note its issuer, validity dates, and key size.","hints":[],"steps":["openssl s_client -connect example.com:443 -servername example.com </dev/null 2>/dev/null | openssl x509 -noout -issuer -dates -subject"],"verify":["you can read the issuer and expiry"]}]},{"day":13,"course":"3 Architecture","title":"Identity and access management","objective":"Explain IAM, authentication factors and access-control models.","questions":[{"type":"mcq","q":"The three authentication factor categories are:","options":["Something you know, something you have, something you are","Password, PIN, passphrase","Name, email, phone","Read, write, execute"],"answer":0,"explain":"Add location (\"somewhere you are\") and behavior as extra factors."},{"type":"mcq","q":"Multi-factor authentication (MFA) requires factors from:","options":["Two or more DIFFERENT categories","Two passwords","The same category twice","One factor only"],"answer":0,"explain":"A password + PIN is still one category (\"know\"), so it is not true MFA."},{"type":"mcq","q":"In RBAC, access is granted based on:","options":["The user's role/job function","The individual user only","The time of day only","Attributes like location"],"answer":0,"explain":"Role-Based Access Control scales better than assigning rights per user."},{"type":"mcq","q":"ABAC grants access based on:","options":["Attributes (user, resource, action, environment) evaluated by policy","Roles only","Mandatory labels only","The user's password length"],"answer":0,"explain":"Attribute-Based Access Control is flexible (e.g., \"managers, on the corporate network, during work hours\")."},{"type":"mcq","q":"In Mandatory Access Control (MAC), access decisions are:","options":["Enforced by the system using labels/clearances, not changeable by users","Set by each file owner","Based on job role only","Optional"],"answer":0,"explain":"SELinux is a MAC implementation. Users cannot override the labels."},{"type":"mcq","q":"Discretionary Access Control (DAC) means:","options":["The resource owner decides who gets access","The system decides using labels","No one can change access","Only admins have access"],"answer":0,"explain":"Standard Linux file permissions (chmod) are DAC."},{"type":"mcq","q":"Single Sign-On (SSO) improves security by:","options":["Letting users authenticate once to reach many services, reducing password reuse","Removing the need for passwords entirely","Making one account admin of all","Disabling MFA"],"answer":0,"explain":"Federation (SAML/OIDC) enables SSO across organizations."},{"type":"mcq","q":"What is the principle behind \"just-in-time\" (JIT) privileged access?","options":["Elevated rights are granted only when needed and for a limited time","Admins keep rights forever","Access is granted at midnight","Everyone is an admin"],"answer":0,"explain":"It shrinks the window an attacker can abuse standing privileges."},{"type":"cmd","q":"On Linux, show which groups a user belongs to (their role memberships).","accept":["id student","groups student"],"explain":"Group membership is how RBAC is often implemented on Linux."}],"labs":[{"title":"Enforce MFA thinking","scenario":"For each login method, say whether it is true MFA: (a) password + SMS code, (b) password + security question, (c) fingerprint + hardware token, (d) PIN + password.","hints":[],"steps":["# (a) MFA (know + have)","# (b) NOT MFA (know + know)","# (c) MFA (are + have)","# (d) NOT MFA (know + know)"],"verify":["you can classify each correctly"]},{"title":"Implement least-privilege roles","scenario":"On a Linux host, create a \"backupops\" group, add a user, and give that group (not the user) read access to /var/backups.","hints":[],"steps":["groupadd backupops","usermod -aG backupops student","chgrp -R backupops /var/backups && chmod -R g+rX /var/backups"],"verify":["the user gets access only through the role/group"]},{"title":"Time-based access (concept)","scenario":"Describe how you would restrict a contractor account so it only works Mon-Fri 9-5 and expires in 30 days.","hints":[],"steps":["# account expiry:  chage -E $(date -d +30days +%F) contractor","# time restrictions via PAM (pam_time) or the IdP's conditional access policy"],"verify":["the account self-expires and is time-bound"]}]},{"day":14,"course":"4 Operations","title":"Hardening and secure baselines","objective":"Apply hardening techniques to systems and endpoints.","questions":[{"type":"mcq","q":"\"Hardening\" a system means:","options":["Reducing its attack surface by removing/disabling unneeded features and tightening config","Installing more software","Adding more users","Making it faster"],"answer":0,"explain":"Fewer services, fewer accounts, stricter settings = smaller attack surface."},{"type":"mcq","q":"A secure \"baseline\" is:","options":["A defined, approved secure configuration that systems are built and checked against","The slowest setting","The default install","A backup image only"],"answer":0,"explain":"Tools compare live systems to the baseline and flag drift."},{"type":"mcq","q":"Disabling unused services helps because:","options":["Every running service is a potential entry point","It saves electricity only","It is required by law","It speeds up the GUI"],"answer":0,"explain":"Close ports and stop daemons you do not need."},{"type":"mcq","q":"Why change default credentials during hardening?","options":["Default usernames/passwords are publicly known and widely attacked","To make login harder for admins","It is optional and cosmetic","Defaults are encrypted"],"answer":0,"explain":"Default creds on routers, cameras and databases are a top breach cause."},{"type":"mcq","q":"Application allow-listing (whitelisting) means:","options":["Only approved programs may run; everything else is blocked","Blocking a list of bad programs","Allowing all downloads","A firewall rule for websites"],"answer":0,"explain":"It is stronger than block-listing but needs maintenance."},{"type":"mcq","q":"Full-disk encryption on a laptop protects mainly against:","options":["Data theft if the device is lost or stolen","Network attacks","Phishing","DDoS"],"answer":0,"explain":"BitLocker/LUKS make the disk unreadable without the key."},{"type":"mcq","q":"What is \"configuration drift\"?","options":["Systems gradually diverging from the approved secure baseline over time","Hardware aging","Network latency","A cloud billing term"],"answer":0,"explain":"Automated config management (Ansible, etc.) corrects drift."},{"type":"mcq","q":"A host-based firewall differs from a network firewall because it:","options":["Runs on and protects a single host","Protects the whole subnet","Is always hardware","Cannot be configured"],"answer":0,"explain":"Defense in depth uses both."},{"type":"cmd","q":"On Linux, list every service set to start at boot so you can disable extras.","accept":["systemctl list-unit-files --type=service --state=enabled"],"explain":"Disable what you do not need with systemctl disable --now."}],"labs":[{"title":"Build a hardening checklist","scenario":"Write a 6-item hardening checklist for a new Linux server, then apply two of the items.","hints":[],"steps":["# 1 update all packages  2 disable unused services  3 SSH: no root, keys only","# 4 host firewall: default deny inbound  5 change defaults  6 enable logging/auditd","dnf update -y","systemctl disable --now cups avahi-daemon 2>/dev/null || true"],"verify":["two items are actually applied"]},{"title":"Verify against a baseline","scenario":"Use a script to check three baseline rules: root SSH disabled, firewall running, and no empty-password accounts.","hints":[],"steps":["grep -i '^PermitRootLogin no' /etc/ssh/sshd_config* 2>/dev/null && echo OK-ssh","systemctl is-active firewalld && echo OK-fw","awk -F: '($2==\"\"){print $1\" has empty password\"}' /etc/shadow"],"verify":["all three checks pass or you can fix the failures"]}]},{"day":15,"course":"4 Operations","title":"Monitoring, logging and SIEM","objective":"Use logs and security monitoring to detect issues.","questions":[{"type":"mcq","q":"What does a SIEM do?","options":["Collects, correlates and alerts on security events from many sources","Encrypts disks","Replaces firewalls","Backs up data"],"answer":0,"explain":"Security Information and Event Management centralizes logs for detection and investigation."},{"type":"mcq","q":"\"Log aggregation\" means:","options":["Gathering logs from many systems into one central place","Deleting old logs","Encrypting one log","Writing logs faster"],"answer":0,"explain":"Central logs survive even if an attacker wipes a host's local logs."},{"type":"mcq","q":"Why keep time synchronized (NTP) across systems?","options":["So log timestamps line up, making correlation and investigation possible","To save power","To speed up the CPU","It is only cosmetic"],"answer":0,"explain":"Skewed clocks make it nearly impossible to reconstruct an incident timeline."},{"type":"mcq","q":"What is an IoC (Indicator of Compromise)?","options":["An artifact (hash, IP, domain, filename) that suggests a system was breached","A firewall rule","A backup file","A user role"],"answer":0,"explain":"Threat feeds share IoCs so defenders can search their environment."},{"type":"mcq","q":"\"False positive\" in an alert means:","options":["The tool alerted, but nothing malicious actually happened","The tool missed a real attack","The alert was correct","A user typed the wrong password"],"answer":0,"explain":"A false negative is worse: a real attack that produced no alert."},{"type":"mcq","q":"NetFlow / flow data is useful because it:","options":["Records who talked to whom, when and how much — without full packet contents","Stores every file","Decrypts TLS","Replaces the firewall"],"answer":0,"explain":"Great for spotting beaconing and data exfiltration patterns."},{"type":"mcq","q":"What is \"alert fatigue\"?","options":["Analysts becoming desensitized by too many (often low-value) alerts","A tired firewall","A slow SIEM","A backup failure"],"answer":0,"explain":"Tuning rules and prioritizing reduces missed real alerts."},{"type":"mcq","q":"A SOAR platform adds what to a SOC?","options":["Automation and orchestration of repetitive response tasks (playbooks)","More manual work","Disk encryption","Physical guards"],"answer":0,"explain":"Security Orchestration, Automation and Response speeds up containment."},{"type":"cmd","q":"On Linux, follow the auth log live to watch login events during an investigation.","accept":["journalctl -f -u sshd","tail -f /var/log/secure"],"explain":"Watch for repeated failures or logins at odd hours."}],"labs":[{"title":"Hunt failed logins","scenario":"On a Linux host, count failed SSH logins and list the top source IPs.","hints":[],"steps":["journalctl -u sshd --since today | grep -i 'failed password' | wc -l","journalctl -u sshd --since today | grep -oE 'from [0-9.]+' | sort | uniq -c | sort -rn | head"],"verify":["you can name the noisiest source IP"]},{"title":"Centralize a log (concept + practice)","scenario":"Explain why central logging matters, then forward this host's logs to a file that an attacker on the host cannot easily reach, and confirm entries arrive.","hints":[],"steps":["# central logging survives host compromise and enables correlation","logger \"SIEM test event from $(hostname)\"","journalctl -n 5 | grep 'SIEM test event'"],"verify":["the test event is recorded"]},{"title":"Write a simple detection rule","scenario":"Describe a detection rule for \"possible brute force\": 10+ failed SSH logins from one IP in 5 minutes, then what response it should trigger.","hints":[],"steps":["# condition: count(failed_ssh by src_ip, 5min) >= 10","# response: alert SOC + auto-block the IP (firewall) for 1 hour"],"verify":["the rule has a clear condition and action"]}]},{"day":16,"course":"4 Operations","title":"Firewalls, IDS/IPS and network security tools","objective":"Configure and interpret common security appliances.","questions":[{"type":"mcq","q":"What is the difference between an IDS and an IPS?","options":["An IDS detects and alerts; an IPS can also block the traffic inline","An IPS only alerts","They are identical","An IDS is hardware only"],"answer":0,"explain":"IPS sits inline and can drop packets; IDS observes a copy and warns."},{"type":"mcq","q":"A \"next-generation firewall\" (NGFW) adds what over a traditional firewall?","options":["Application awareness, IPS, and often user identity and TLS inspection","Only faster ports","Just NAT","Physical locks"],"answer":0,"explain":"It filters by application and content, not just port/IP."},{"type":"mcq","q":"A stateful firewall differs from a stateless one because it:","options":["Tracks the state of connections and allows return traffic automatically","Blocks everything","Ignores connection state","Only works on Wi-Fi"],"answer":0,"explain":"Stateless filters each packet in isolation; stateful understands sessions."},{"type":"mcq","q":"A WAF specifically protects:","options":["Web applications from attacks like SQL injection and XSS","The whole network at layer 3","Wireless clients","Physical doors"],"answer":0,"explain":"A Web Application Firewall inspects HTTP requests."},{"type":"mcq","q":"Signature-based detection catches:","options":["Known threats matching a defined pattern","Only brand-new attacks","Physical intrusions","Encrypted traffic content"],"answer":0,"explain":"Anomaly/behavior-based detection is needed for unknown (zero-day) threats."},{"type":"mcq","q":"A network \"tap\" or SPAN port is used to:","options":["Copy traffic to a monitoring/IDS tool without disrupting it","Block traffic","Encrypt traffic","Assign IPs"],"answer":0,"explain":"It feeds the IDS a mirror of the traffic."},{"type":"mcq","q":"\"Fail-closed\" vs \"fail-open\" for a security device: fail-closed means:","options":["If the device fails, traffic is blocked (security over availability)","Traffic flows freely on failure","The device restarts","Nothing changes"],"answer":0,"explain":"Choose based on whether availability or security matters more for that link."},{"type":"mcq","q":"Port security on a switch limits:","options":["Which/how many MAC addresses may use a switch port","Internet bandwidth","The number of VLANs","Wi-Fi channels"],"answer":0,"explain":"It helps stop rogue devices and MAC flooding."},{"type":"cmd","q":"Scan your own lab host to see which TCP ports are open (authorized use only).","accept":["nmap localhost","nmap 127.0.0.1"],"explain":"Only scan systems you own or are authorized to test."}],"labs":[{"title":"Read firewall logs","scenario":"On a Linux host with firewalld, enable logging of denied packets and generate one, then find it.","hints":[],"steps":["firewall-cmd --set-log-denied=all","firewall-cmd --reload","# from another host, hit a closed port, then:","journalctl | grep -i 'FINAL_REJECT\\|denied' | tail"],"verify":["a blocked connection appears in the log"]},{"title":"Tune a noisy rule (concept)","scenario":"An IDS fires 500 alerts/day for a benign internal scanner. Describe how to reduce the noise without going blind.","hints":[],"steps":["# add a tuned exception for the scanner's known IP + scan signature","# keep alerting if that IP does something outside its normal pattern","# document the exception so it can be reviewed"],"verify":["real threats from that host would still alert"]}]},{"day":17,"course":"4 Operations","title":"Incident response","objective":"Apply the incident-response process and its phases.","questions":[{"type":"mcq","q":"What is the correct order of the incident-response phases (NIST)?","options":["Preparation, Detection & Analysis, Containment, Eradication & Recovery, Lessons Learned","Detection, Preparation, Recovery, Containment","Containment, Preparation, Detection, Recovery","Recovery, Lessons Learned, Detection, Preparation"],"answer":0,"explain":"Preparation comes first; lessons learned closes the loop."},{"type":"mcq","q":"\"Containment\" aims to:","options":["Stop the incident from spreading while preserving evidence","Delete all affected systems immediately","Notify the press","Restore backups first"],"answer":0,"explain":"Isolate hosts, block C2, disable accounts — but keep evidence intact."},{"type":"mcq","q":"Eradication means:","options":["Removing the threat (malware, backdoors, compromised accounts) from the environment","Turning off logging","Paying a ransom","Buying new hardware"],"answer":0,"explain":"After eradication comes recovery (restoring clean systems)."},{"type":"mcq","q":"Why is a \"lessons learned\" meeting important?","options":["It improves future preparation and prevents repeat incidents","It assigns blame","It is legally required to skip","It restores data"],"answer":0,"explain":"Update playbooks, controls, and training based on what happened."},{"type":"mcq","q":"A \"runbook\" or \"playbook\" is:","options":["A step-by-step procedure for responding to a specific incident type","A list of passwords","A backup schedule","A network diagram only"],"answer":0,"explain":"Playbooks make response fast and consistent."},{"type":"mcq","q":"\"Tabletop exercise\" means:","options":["A discussion-based drill walking through a hypothetical incident","A live attack on production","A physical penetration test","A backup restore test"],"answer":0,"explain":"It tests the plan and people without touching real systems."},{"type":"mcq","q":"During an incident, who typically declares the incident and coordinates?","options":["The incident commander / IR lead","Any user","The attacker","The auditor"],"answer":0,"explain":"Clear roles prevent chaos during response."},{"type":"mcq","q":"Why avoid immediately powering off a compromised machine?","options":["You may lose volatile evidence in RAM (running processes, keys, connections)","It voids the warranty","It is faster to leave on","Nothing is lost"],"answer":0,"explain":"Consider isolating from the network first, then capture memory if needed."},{"type":"cmd","q":"On Linux, quickly capture the current network connections and processes for evidence.","accept":["ss -tulpanE","ss -tulpan"],"explain":"Also grab `ps aux` and running services before changing anything."}],"labs":[{"title":"Run a mini IR","scenario":"A workstation is beaconing to a bad IP. Walk through the five phases in one line each for this case.","hints":[],"steps":["# Prep: playbook + contacts ready","# Detect/Analyze: confirm beacon in flow logs, identify process","# Contain: isolate host from network, block IP at firewall","# Eradicate/Recover: remove malware/persistence, re-image, restore data","# Lessons: how did it get in? add control + training"],"verify":["each phase has a concrete action for this case"]},{"title":"Preserve volatile evidence","scenario":"On a suspect Linux host, collect volatile data in the right order (most volatile first) without rebooting.","hints":[],"steps":["date; uptime","ss -tulpan > /root/ir-connections.txt","ps aux > /root/ir-processes.txt","who > /root/ir-users.txt","# then image memory/disk with proper tools before shutdown"],"verify":["you captured connections and processes before touching the disk"]},{"title":"Order of volatility","scenario":"List the order you would collect evidence from most to least volatile.","hints":[],"steps":["# 1 CPU registers/cache  2 RAM  3 network state/connections","# 4 running processes  5 disk  6 remote logs / backups  7 archival media"],"verify":["your order matches order-of-volatility"]}]},{"day":18,"course":"4 Operations","title":"Digital forensics","objective":"Apply forensic concepts: chain of custody, acquisition, integrity.","questions":[{"type":"mcq","q":"\"Chain of custody\" documents:","options":["Who handled evidence, when, and what they did — to keep it admissible","The network path of an attack","The order of firewall rules","A backup rotation"],"answer":0,"explain":"A broken chain of custody can make evidence unusable in court."},{"type":"mcq","q":"Why hash evidence before and after acquisition?","options":["To prove the copy is identical to the original and was not altered","To encrypt it","To compress it","To speed up analysis"],"answer":0,"explain":"Matching hashes demonstrate integrity of the forensic image."},{"type":"mcq","q":"What is a \"write blocker\"?","options":["A device/tool that lets you read a drive without changing it","A firewall","A password","A backup tool"],"answer":0,"explain":"It preserves the original evidence during acquisition."},{"type":"mcq","q":"\"Legal hold\" means:","options":["Preserving relevant data because litigation or investigation is anticipated","Deleting data on a schedule","Encrypting all data","Holding a suspect"],"answer":0,"explain":"Normal deletion/retention is suspended for the relevant data."},{"type":"mcq","q":"Which is the best practice for forensic analysis?","options":["Work on a verified copy (image), never the original evidence","Analyze the live original","Reformat and re-scan","Delete logs first"],"answer":0,"explain":"You keep the original pristine and analyze the image."},{"type":"mcq","q":"\"Order of volatility\" tells you to collect first:","options":["The most volatile data (RAM, network state) before it disappears","The least volatile data","Backups first","Nothing; order does not matter"],"answer":0,"explain":"Data in memory vanishes on power loss."},{"type":"mcq","q":"e-Discovery refers to:","options":["Identifying and producing electronic evidence for legal proceedings","Finding new websites","A vulnerability scanner","A backup type"],"answer":0,"explain":"It ties into legal hold and data retention."},{"type":"mcq","q":"Metadata in a file can reveal:","options":["Author, timestamps, GPS, device info useful in an investigation","Only the file size","Nothing useful","The encryption key"],"answer":0,"explain":"Timestamps and authorship often matter in forensics."},{"type":"cmd","q":"Create a verified image of a file/partition and record its hash for the evidence log.","accept":["sha256sum evidence.img"],"explain":"Record the hash immediately after imaging; re-verify before analysis."}],"labs":[{"title":"Practice evidence integrity","scenario":"Image a small file, hash the original and the copy, and show they match; then log it as a chain-of-custody entry.","hints":[],"steps":["sha256sum original.dat > custody.log","cp original.dat evidence.copy","sha256sum evidence.copy >> custody.log","# add: date, collector name, source, method to custody.log"],"verify":["both hashes match and the log has who/when/what"]},{"title":"Extract file metadata","scenario":"Pull timestamps and metadata from a file as an investigator would.","hints":[],"steps":["stat suspicious.jpg","# if available: exiftool suspicious.jpg  (author, GPS, camera, timestamps)"],"verify":["you can report at least three metadata fields"]},{"title":"Write a chain-of-custody form","scenario":"Draft the fields a chain-of-custody form must contain.","hints":[],"steps":["# case ID, item description, collected by, date/time, location","# hash value, transferred to (name/sig), reason, storage location"],"verify":["the form would survive a courtroom challenge"]}]},{"day":19,"course":"4 Operations","title":"Resilience, backups and recovery","objective":"Apply resilience and recovery concepts (RTO, RPO, backup types).","questions":[{"type":"mcq","q":"What does RTO (Recovery Time Objective) define?","options":["The maximum acceptable time to restore a service after an outage","How much data you can lose","The backup size","The encryption strength"],"answer":0,"explain":"RTO = \"how fast must we be back?\""},{"type":"mcq","q":"What does RPO (Recovery Point Objective) define?","options":["The maximum acceptable amount of data loss, measured in time","How fast you recover","The number of backups","The uptime percentage"],"answer":0,"explain":"RPO = \"how much data can we afford to lose?\" It drives backup frequency."},{"type":"mcq","q":"A full backup:","options":["Copies all selected data every time","Copies only changes since the last full","Copies changes since any backup","Is stored only in RAM"],"answer":0,"explain":"Simple to restore but large and slow."},{"type":"mcq","q":"An incremental backup copies:","options":["Only data changed since the last backup of any type","Everything each time","Changes since the last full only","Nothing"],"answer":0,"explain":"Fast backups, but restore needs the full plus every increment in order."},{"type":"mcq","q":"A differential backup copies:","options":["All changes since the last FULL backup","Only changes since the last backup","Everything each time","The OS only"],"answer":0,"explain":"Restore needs just the full plus the latest differential."},{"type":"mcq","q":"The \"3-2-1\" backup rule means:","options":["3 copies, on 2 different media, with 1 copy off-site","3 backups per day","2 admins, 1 key","3-2-1 countdown to delete"],"answer":0,"explain":"A modern variant adds \"1 offline/immutable\" to survive ransomware."},{"type":"mcq","q":"High availability (HA) is achieved with:","options":["Redundancy and failover so service continues if a component fails","A single powerful server","Daily backups only","Encryption"],"answer":0,"explain":"Clusters, load balancers, and redundant power/network provide HA."},{"type":"mcq","q":"Why test backups regularly?","options":["An untested backup may be corrupt or incomplete when you need it","To use disk space","It is not necessary","To slow the network"],"answer":0,"explain":"\"You don't have a backup until you've restored it.\""},{"type":"cmd","q":"On Linux, create a compressed, dated backup of /etc for safekeeping.","accept":["tar -czf /backup/etc-$(date +%F).tar.gz /etc"],"explain":"Store a copy off-site and test the restore."}],"labs":[{"title":"Choose RTO/RPO","scenario":"For an online store's order database, propose an RTO and RPO and the backup strategy that meets them.","hints":[],"steps":["# RPO 15 min -> transaction log backups every 15 min (or replication)","# RTO 1 hr -> warm standby + tested restore runbook"],"verify":["the backup frequency matches the RPO"]},{"title":"Backup and verify restore","scenario":"Back up a directory, delete a file, and restore just that file to prove the backup works.","hints":[],"steps":["tar -czf /tmp/docs.tar.gz ~/docs","rm ~/docs/important.txt","tar -xzf /tmp/docs.tar.gz -C / home/$USER/docs/important.txt 2>/dev/null || tar -xzf /tmp/docs.tar.gz -C ~ --strip-components=1 docs/important.txt","ls ~/docs/important.txt"],"verify":["the file is restored from backup"]},{"title":"Plan for ransomware resilience","scenario":"List the backup properties that let you recover from ransomware without paying.","hints":[],"steps":["# off-site + offline/immutable copy attackers can't reach or encrypt","# versioned backups (restore to a point before infection)","# tested restores + documented RTO"],"verify":["the plan survives an attacker with domain admin"]}]},{"day":20,"course":"3 Architecture","title":"Secure protocols and services","objective":"Select secure protocols and replace insecure ones.","questions":[{"type":"mcq","q":"Which protocol securely replaces Telnet for remote administration?","options":["SSH (port 22)","FTP","HTTP","SNMPv1"],"answer":0,"explain":"Telnet sends everything in plaintext; SSH is encrypted."},{"type":"mcq","q":"HTTPS uses which protocol to encrypt web traffic?","options":["TLS","SSLv2","Telnet","SMTP"],"answer":0,"explain":"Modern HTTPS uses TLS 1.2/1.3; SSL is deprecated."},{"type":"mcq","q":"Which is the secure way to transfer files?","options":["SFTP or FTPS (encrypted), not plain FTP","FTP on port 21","TFTP","Telnet"],"answer":0,"explain":"SFTP runs over SSH; FTPS adds TLS to FTP."},{"type":"mcq","q":"Which protocol secures email transport between servers?","options":["SMTP with STARTTLS (SMTPS)","Plain SMTP on 25 only","POP3 without TLS","Telnet"],"answer":0,"explain":"Also use IMAPS/POP3S for clients, and SPF/DKIM/DMARC for authenticity."},{"type":"mcq","q":"SNMPv3 improves on earlier versions by adding:","options":["Authentication and encryption","Faster polling only","More OIDs","Nothing"],"answer":0,"explain":"SNMPv1/v2c send community strings in plaintext."},{"type":"mcq","q":"DNSSEC provides:","options":["Integrity/authenticity of DNS records via digital signatures","Encryption of DNS queries","Faster lookups","Password protection"],"answer":0,"explain":"It stops forged records; DoH/DoT add confidentiality."},{"type":"mcq","q":"Which port does HTTPS use by default?","options":["443","80","22","25"],"answer":0,"explain":"80 = HTTP, 22 = SSH, 25 = SMTP, 443 = HTTPS."},{"type":"mcq","q":"LDAPS secures directory queries by:","options":["Wrapping LDAP in TLS","Using a longer password","Running on UDP","Disabling authentication"],"answer":0,"explain":"Plain LDAP (389) exposes directory traffic; LDAPS uses 636."},{"type":"cmd","q":"Test whether a mail server offers STARTTLS encryption.","accept":["openssl s_client -starttls smtp -connect mail.example.com:587"],"explain":"If TLS negotiates, the server supports encrypted mail transport."}],"labs":[{"title":"Replace insecure services","scenario":"For a legacy setup using Telnet, FTP, and HTTP, name the secure replacement and the port for each.","hints":[],"steps":["# Telnet(23) -> SSH(22)","# FTP(21) -> SFTP(22) or FTPS(990/explicit)","# HTTP(80) -> HTTPS(443) with TLS 1.2+"],"verify":["each insecure service has a secure, encrypted replacement"]},{"title":"Verify TLS version and ciphers","scenario":"Check which TLS versions and ciphers a web server accepts and flag any weak ones.","hints":[],"steps":["openssl s_client -connect example.com:443 -tls1_2 </dev/null 2>/dev/null | grep -i protocol","nmap --script ssl-enum-ciphers -p 443 example.com"],"verify":["you can state whether TLS 1.0/1.1 are (insecurely) enabled"]}]},{"day":21,"course":"3 Architecture","title":"Wireless and mobile security","objective":"Secure wireless networks and mobile/endpoint devices.","questions":[{"type":"mcq","q":"Which is the strongest common Wi-Fi security standard?","options":["WPA3","WEP","WPA","Open"],"answer":0,"explain":"WEP is broken; WPA2 is okay; WPA3 is current best (SAE handshake)."},{"type":"mcq","q":"Why is WEP considered insecure?","options":["Its weak RC4/IV design lets attackers recover the key quickly","It is too slow","It uses AES","It requires a password"],"answer":0,"explain":"WEP should never be used; it can be cracked in minutes."},{"type":"mcq","q":"WPA2-Enterprise differs from WPA2-Personal by using:","options":["802.1X/RADIUS for per-user authentication instead of a shared passphrase","A longer shared password","No encryption","A hidden SSID only"],"answer":0,"explain":"Enterprise gives each user unique credentials and easy revocation."},{"type":"mcq","q":"Hiding the SSID (network name) provides:","options":["Very little real security (it is easily discovered)","Strong encryption","Per-user authentication","MAC filtering"],"answer":0,"explain":"It is \"security by obscurity,\" not a real control."},{"type":"mcq","q":"What is MDM (Mobile Device Management) used for?","options":["Enforcing security policy on mobile devices (encryption, PIN, remote wipe)","Making phones faster","A wireless protocol","A backup app only"],"answer":0,"explain":"MDM/UEM manages and secures fleets of devices."},{"type":"mcq","q":"\"BYOD\" introduces risk because:","options":["Personal devices are outside full corporate control yet access company data","Company devices are unmanaged","It bans mobile devices","It only affects servers"],"answer":0,"explain":"Containerization separates work and personal data on BYOD."},{"type":"mcq","q":"A captive portal is:","options":["A web page that forces authentication/acceptance before granting network access","A firewall","A VPN","A rogue AP"],"answer":0,"explain":"Common on guest Wi-Fi; not a strong security control by itself."},{"type":"mcq","q":"Remote wipe is important because:","options":["A lost/stolen device's data can be erased to prevent exposure","It speeds up the phone","It backs up data","It blocks Wi-Fi"],"answer":0,"explain":"Paired with full-device encryption and a screen lock."},{"type":"cmd","q":"Scan for nearby Wi-Fi networks and their security type (your own area, lawful use).","accept":["nmcli device wifi list"],"explain":"Note which networks still use WEP/WPA vs WPA2/WPA3."}],"labs":[{"title":"Secure a home/office AP (checklist)","scenario":"Write the settings you would apply to a wireless router to secure it.","hints":[],"steps":["# WPA3 (or WPA2-AES) with a long passphrase","# change default admin password; disable WPS","# update firmware; disable remote admin","# separate guest network (VLAN) for visitors/IoT"],"verify":["a war-driver gains nothing easy"]},{"title":"Enterprise Wi-Fi design (concept)","scenario":"Explain how WPA2/WPA3-Enterprise authenticates a user and why it beats a shared key for a company.","hints":[],"steps":["# client -> AP -> RADIUS (802.1X/EAP) validates the user's own credentials/cert","# unique creds: revoke one user without changing everyone's password"],"verify":["you can describe the 802.1X flow at a high level"]}]},{"day":22,"course":"4 Operations","title":"Data protection and DLP","objective":"Classify data and apply protection controls.","questions":[{"type":"mcq","q":"Data classification (public, internal, confidential, restricted) exists to:","options":["Apply the right level of protection based on sensitivity","Make data bigger","Speed up storage","Delete old data"],"answer":0,"explain":"You spend the strongest controls on the most sensitive data."},{"type":"mcq","q":"\"Data at rest\" refers to:","options":["Data stored on disk/media (protected mainly by encryption)","Data moving across a network","Data being processed in RAM","Deleted data"],"answer":0,"explain":"At rest = storage; in transit = network; in use = memory/processing."},{"type":"mcq","q":"\"Data in transit\" is best protected by:","options":["Encryption such as TLS","Full-disk encryption","Shredding","Access logging only"],"answer":0,"explain":"TLS/IPsec protect data as it crosses the network."},{"type":"mcq","q":"What does a DLP system do?","options":["Detects and blocks sensitive data from leaving the organization","Encrypts backups","Scans for malware only","Manages passwords"],"answer":0,"explain":"Data Loss Prevention inspects email, uploads, and endpoints for regulated data."},{"type":"mcq","q":"\"Tokenization\" protects data by:","options":["Replacing sensitive values with non-sensitive tokens mapped in a secure vault","Encrypting the whole disk","Hashing passwords","Compressing files"],"answer":0,"explain":"Common for payment card data; the real value never leaves the vault."},{"type":"mcq","q":"\"Data masking\" is used to:","options":["Hide parts of data (e.g., show only last 4 digits) for non-privileged views","Delete data","Encrypt backups","Speed up queries"],"answer":0,"explain":"Useful in test environments and customer-service screens."},{"type":"mcq","q":"A data \"owner\" is responsible for:","options":["Classifying the data and deciding who may access it","Running the servers","Physically storing the disks","Only backups"],"answer":0,"explain":"The custodian implements the controls the owner defines."},{"type":"mcq","q":"\"Right to be forgotten\" comes from which kind of regulation?","options":["Privacy regulation (e.g., GDPR)","A firewall standard","An encryption algorithm","A backup policy"],"answer":0,"explain":"Data-subject rights require you to locate and delete personal data on request."},{"type":"cmd","q":"Find files that may contain card numbers before they leak (simple DLP-style scan).","accept":["grep -rEl '[0-9]{4}[- ]?[0-9]{4}[- ]?[0-9]{4}[- ]?[0-9]{4}' /data"],"explain":"A real DLP tool adds validation (Luhn check) and context."}],"labs":[{"title":"Classify and label data","scenario":"For a folder with an HR salary sheet, a public brochure, and a customer list, assign a classification and one control each.","hints":[],"steps":["# salary sheet -> Confidential -> encrypt + restrict to HR group","# brochure -> Public -> integrity check, no confidentiality needed","# customer list -> Restricted (PII) -> encrypt, DLP, access logging"],"verify":["each item's controls match its sensitivity"]},{"title":"Protect data three ways","scenario":"Demonstrate protection for data at rest, in transit, and in use (conceptually) on one file.","hints":[],"steps":["# at rest: encrypt with LUKS/openssl","# in transit: send over scp/TLS, never plain FTP","# in use: restrict process privileges + memory, limit who can open it"],"verify":["you addressed all three states"]}]},{"day":23,"course":"1 Concepts","title":"Physical security","objective":"Apply physical security controls.","questions":[{"type":"mcq","q":"A mantrap (access control vestibule) prevents:","options":["Tailgating, by allowing one person through at a time","Network attacks","Malware","Phishing"],"answer":0,"explain":"Two interlocking doors stop a second person slipping in."},{"type":"mcq","q":"Why place security cameras (CCTV) at entrances?","options":["To deter and to detect/record who enters","To encrypt data","To speed up entry","To replace locks"],"answer":0,"explain":"Visible cameras deter; recordings provide detective evidence."},{"type":"mcq","q":"A bollard is used to:","options":["Physically block vehicles from ramming a building","Filter network traffic","Authenticate users","Store keys"],"answer":0,"explain":"Physical, preventive control against vehicle attacks."},{"type":"mcq","q":"\"Faraday cage\" protects against:","options":["Electromagnetic signals entering or leaving (eavesdropping/interference)","Fire","Flooding","Power loss"],"answer":0,"explain":"Used for shielding sensitive equipment and preventing signal leakage."},{"type":"mcq","q":"Biometric access control is which authentication factor?","options":["Something you are","Something you know","Something you have","Somewhere you are"],"answer":0,"explain":"Fingerprints, iris, face. Watch for false accept/reject rates."},{"type":"mcq","q":"A \"proximity badge\" is which factor?","options":["Something you have","Something you know","Something you are","Somewhere you are"],"answer":0,"explain":"Combine with a PIN (know) for MFA at the door."},{"type":"mcq","q":"Why use security lighting and clear sightlines?","options":["They deter intruders and improve camera/guard effectiveness","They encrypt data","They speed up Wi-Fi","They are decorative only"],"answer":0,"explain":"Environmental design (CPTED) reduces hiding spots."},{"type":"mcq","q":"A \"honeyfile\" or honeytoken is:","options":["A decoy file/credential that alerts defenders when touched","A backup file","An encryption key","A firewall log"],"answer":0,"explain":"Any access to it strongly implies an intruder."}],"labs":[{"title":"Design layered physical security","scenario":"For a small server room, list controls from the perimeter inward (defense in depth).","hints":[],"steps":["# perimeter: fence, gate, lighting, cameras","# building: badge + PIN door, reception, visitor logs","# server room: mantrap, separate badge, camera, locked racks","# rack: locked cabinet, asset tags"],"verify":["each layer backs up the others"]},{"title":"FAR vs FRR (concept)","scenario":"Explain false acceptance rate and false rejection rate and which is worse for a high-security door.","hints":[],"steps":["# FAR: wrongly admits an impostor (security risk)","# FRR: wrongly rejects a valid user (annoyance)","# high security: tune to lower FAR even if FRR rises"],"verify":["you can state the trade-off"]}]},{"day":24,"course":"5 Program","title":"Governance, policies and standards","objective":"Summarize governance, policies, standards and frameworks.","questions":[{"type":"mcq","q":"What is the difference between a policy and a procedure?","options":["A policy states what/why (high level); a procedure states step-by-step how","They are identical","A procedure is higher level","A policy is technical only"],"answer":0,"explain":"Standards and guidelines sit between them."},{"type":"mcq","q":"An Acceptable Use Policy (AUP) defines:","options":["How employees may use company systems and data","The backup schedule","Firewall rules","Encryption algorithms"],"answer":0,"explain":"Users typically sign it during onboarding."},{"type":"mcq","q":"A \"standard\" (vs a policy) is:","options":["A mandatory specific rule that supports a policy (e.g., \"AES-256 for encryption\")","An optional suggestion","A high-level goal","A legal contract"],"answer":0,"explain":"Guidelines are recommended, not mandatory; standards are mandatory."},{"type":"mcq","q":"What is a security framework used for?","options":["A structured set of best practices to build and measure a security program","Encrypting disks","Blocking ports","Writing malware"],"answer":0,"explain":"Examples: NIST CSF, ISO 27001, CIS Controls."},{"type":"mcq","q":"\"Separation of duties\" prevents fraud by:","options":["Requiring more than one person to complete a sensitive task","Giving one admin all power","Encrypting logs","Backing up daily"],"answer":0,"explain":"No single person can both request and approve a payment, for example."},{"type":"mcq","q":"\"Mandatory vacation\" and \"job rotation\" are controls that:","options":["Help detect fraud and reduce dependence on one person","Improve morale only","Are unrelated to security","Replace backups"],"answer":0,"explain":"Fraud often surfaces when the usual person is away."},{"type":"mcq","q":"Onboarding and offboarding processes matter because:","options":["They ensure access is granted correctly and fully removed when someone leaves","They are HR-only concerns","They speed up hiring","They are optional"],"answer":0,"explain":"Orphaned accounts of ex-employees are a major risk."},{"type":"mcq","q":"What is \"due care\" vs \"due diligence\"?","options":["Due diligence is investigating/planning; due care is acting on it responsibly","They are the same","Due care is only legal","Due diligence means ignoring risk"],"answer":0,"explain":"Diligence = doing your homework; care = the ongoing responsible action."}],"labs":[{"title":"Write an access-control policy snippet","scenario":"Draft three policy statements for user account management (creation, review, removal).","hints":[],"steps":["# Accounts are created only via approved onboarding tickets with manager sign-off.","# Access is reviewed quarterly; unused/excess access is revoked.","# Accounts are disabled within 1 hour of termination."],"verify":["each statement is enforceable and auditable"]},{"title":"
