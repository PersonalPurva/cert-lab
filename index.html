e.","accept":["systemctl enable --now autofs"],"explain":"After editing maps later, `systemctl reload autofs` is enough."},{"type":"mcq","q":"Should you create /shares/work yourself for an indirect map?","options":["No; autofs creates it when it is accessed","Yes, or the mount fails","Yes, with mode 777","Only on the NFS server"],"answer":0,"explain":"You create nothing under the base directory. autofs owns it."},{"type":"mcq","q":"`ls /shares` shows nothing, but `ls /shares/work` works. Why?","options":["Indirect map keys are only mounted, and shown, when accessed","The map is broken","autofs is stopped","The share is empty"],"answer":0,"explain":"`cd /shares/work` triggers the mount. Then `ls /shares` shows it until it times out."},{"type":"mcq","q":"The task: \"remoteuser1's home /rhome/remoteuser1 is automounted from node2:/rhome/remoteuser1\". Which map line is right in /etc/auto.rhome?","options":["remoteuser1  -rw,sync  node2:/rhome/remoteuser1","/rhome/remoteuser1  node2:/rhome/remoteuser1","remoteuser1  node2:/rhome","*  -rw  /rhome/remoteuser1"],"answer":0,"explain":"Plus the master entry `/rhome  /etc/auto.rhome`."}],"labs":[{"title":"Automount a remote home directory (exam classic)","scenario":"Create user remoteuser1 (UID 5001) on node1 with home /rhome/remoteuser1 but no local home created. Configure autofs so /rhome/remoteuser1 is mounted read-write from node2:/rhome/remoteuser1.","hints":[],"steps":["useradd -u 5001 -d /rhome/remoteuser1 -M remoteuser1","echo 'Rhcsa@2026' | passwd --stdin remoteuser1","dnf install -y autofs","echo '/rhome  /etc/auto.rhome' > /etc/auto.master.d/rhome.autofs","echo 'remoteuser1  -rw,sync  node2:/rhome/remoteuser1' > /etc/auto.rhome","systemctl enable --now autofs"],"verify":["su - remoteuser1 -c 'pwd; touch ~/hello; ls -l'","findmnt /rhome/remoteuser1"]},{"title":"Wildcard map for every remote user","scenario":"Change the rhome map so any user under /rhome gets their own export automatically. Add remoteuser2 (UID 5002) and test both.","hints":[],"steps":["echo '*  -rw,sync  node2:/rhome/&' > /etc/auto.rhome","systemctl reload autofs","useradd -u 5002 -d /rhome/remoteuser2 -M remoteuser2"],"verify":["ls /rhome/remoteuser1 /rhome/remoteuser2","findmnt -t nfs4"]},{"title":"Direct map","scenario":"Automount node2:/shares/docs read-only at exactly /mnt/autodocs using a direct map.","hints":[],"steps":["echo '/-  /etc/auto.direct' > /etc/auto.master.d/direct.autofs","echo '/mnt/autodocs  -ro  node2:/shares/docs' > /etc/auto.direct","systemctl reload autofs"],"verify":["ls /mnt/autodocs && findmnt /mnt/autodocs"]},{"title":"Debug autofs","scenario":"Break the rhome map by misspelling the server name. Try to access a home, read the autofs messages in the journal, and fix it.","hints":[],"steps":["sed -i 's/node2/nodee2/' /etc/auto.rhome && systemctl reload autofs","ls /rhome/remoteuser1       # No such file or directory","journalctl -u autofs -n 20","sed -i 's/nodee2/node2/' /etc/auto.rhome && systemctl reload autofs"],"verify":["ls /rhome/remoteuser1"]}]},{"day":36,"course":"RH134","title":"Boot targets","objective":"Boot, reboot and shut down normally; boot into different targets manually; configure the default target.","questions":[{"type":"cmd","q":"Show the default boot target.","accept":["systemctl get-default"],"explain":"Usually graphical.target or multi-user.target."},{"type":"cmd","q":"Make the system boot into text mode (no desktop) by default.","accept":["systemctl set-default multi-user.target"],"explain":"This changes the /etc/systemd/system/default.target symlink."},{"type":"cmd","q":"Switch to multi-user.target now, without rebooting.","accept":["systemctl isolate multi-user.target"],"explain":"isolate stops everything not needed by that target."},{"type":"mcq","q":"Which target gives a root shell with basic services and all local filesystems mounted, for repairs?","options":["rescue.target","emergency.target","multi-user.target","graphical.target"],"answer":0,"explain":"Both rescue and emergency ask for the root password."},{"type":"mcq","q":"What does emergency.target give you?","options":["A minimal root shell with only the root filesystem mounted, read-only","A full desktop in safe mode","The same as rescue.target","A network-only shell"],"answer":0,"explain":"Use it when rescue.target itself fails, e.g. because of a bad fstab line."},{"type":"mcq","q":"How do you boot into rescue.target once, from the GRUB menu?","options":["Press e, add systemd.unit=rescue.target to the line starting with linux, then Ctrl+X","Choose \"rescue\" from the BIOS menu","Press r at the GRUB menu","Run systemctl rescue before rebooting"],"answer":0,"explain":"The change applies to that boot only."},{"type":"mcq","q":"What is the order of the RHEL boot process?","options":["Firmware, GRUB2, kernel and initramfs, systemd, default target","GRUB2, firmware, systemd, kernel","Kernel, GRUB2, systemd, firmware","systemd, kernel, GRUB2, target"],"answer":0,"explain":"Knowing the order tells you where to intervene for each problem."},{"type":"cmd","q":"Reboot the system cleanly.","accept":["systemctl reboot","reboot","shutdown -r now"],"explain":"In the exam, reboot at least once at the end to prove everything persists."},{"type":"cmd","q":"Schedule a power off in 10 minutes.","accept":["shutdown -h +10","shutdown +10","shutdown -P +10"],"explain":"`shutdown -c` cancels it."},{"type":"mcq","q":"What is default.target?","options":["A symlink that points to the target the system boots into","A special target that runs first","The same as basic.target","A file you edit with vim"],"answer":0,"explain":"Check it with `ls -l /etc/systemd/system/default.target`."}],"labs":[{"title":"Change the default target","scenario":"Make the system boot to multi-user.target, reboot and confirm you get a text login, then set it back to graphical.target if you use a desktop.","hints":[],"steps":["systemctl set-default multi-user.target","systemctl reboot","systemctl get-default","systemctl set-default graphical.target"],"verify":["ls -l /etc/systemd/system/default.target"]},{"title":"Boot into rescue mode once","scenario":"Reboot, and from the GRUB menu boot into rescue.target. Log in with the root password, check which target is active, then continue to the normal target.","hints":[],"steps":["# at GRUB: e, add systemd.unit=rescue.target to the linux line, Ctrl+X","systemctl list-units --type=target --state=active","systemctl default"],"verify":["systemctl is-active multi-user.target"]},{"title":"Use the emergency target","scenario":"Boot into emergency.target from GRUB. Check how the root filesystem is mounted, remount it read-write, then reboot.","hints":[],"steps":["# at GRUB: e, add systemd.unit=emergency.target, Ctrl+X","findmnt /                    # ro","mount -o remount,rw /","systemctl reboot"],"verify":["systemctl get-default"]},{"title":"Explore targets","scenario":"List all active targets, list what multi-user.target wants, and find which target the system is in right now.","hints":[],"steps":["systemctl list-units --type=target","systemctl list-dependencies multi-user.target | head -30","systemctl is-active graphical.target multi-user.target"],"verify":["who -r"]}]},{"day":37,"course":"RH134","title":"Resetting root and repairing boot problems","objective":"Interrupt the boot process to gain system access; fix boot problems.","questions":[{"type":"mcq","q":"What is the first step to reset a lost root password with rd.break?","options":["Reboot, press e at the GRUB menu, and add rd.break to the end of the line starting with linux","Boot into rescue.target and run passwd","Log in as a normal user and edit /etc/shadow","Boot from the network"],"answer":0,"explain":"rd.break stops inside the initramfs before the real root filesystem takes over."},{"type":"mcq","q":"In the rd.break shell, how is the real root filesystem mounted?","options":["Read-only at /sysroot","Read-write at /","Not mounted at all","Read-write at /mnt/sysimage"],"answer":0,"explain":"So the first command is to remount it read-write."},{"type":"cmd","q":"In the rd.break shell, remount /sysroot read-write.","accept":["mount -o remount,rw /sysroot"],"explain":"Next: `chroot /sysroot`."},{"type":"cmd","q":"Change your root directory to /sysroot.","accept":["chroot /sysroot"],"explain":"Now paths like /etc/shadow point at the real system."},{"type":"mcq","q":"Why do you run `touch /.autorelabel` after `passwd root`?","options":["The new /etc/shadow has no correct SELinux label; the next boot relabels the filesystem","It tells GRUB to boot normally","It saves the new password","It clears the rd.break setting"],"answer":0,"explain":"Skipping it can mean nobody can log in after the reboot. The relabel takes a few minutes."},{"type":"mcq","q":"At the GRUB editor, which keys boot the edited entry?","options":["Ctrl+X","Enter","F10 only","Esc"],"answer":0,"explain":"Esc throws away your edits and goes back to the menu."},{"type":"mcq","q":"A bad line in /etc/fstab stops the boot. Where do you usually land?","options":["Emergency mode, asking for the root password","The graphical login","A kernel panic","The GRUB menu"],"answer":0,"explain":"Enter the root password, then fix the file."},{"type":"mcq","q":"In emergency mode after a bad fstab line, how is / mounted?","options":["Read-only, so you run mount -o remount,rw / before editing","Read-write","Not at all","As tmpfs"],"answer":0,"explain":"Then fix /etc/fstab, run systemctl daemon-reload and mount -a."},{"type":"mcq","q":"Which fstab option stops a missing, non-essential disk from blocking the boot?","options":["nofail","noauto,ro","errors=continue","x-systemd.skip"],"answer":0,"explain":"Use it for disks that may not be there. In the exam, follow what the task asks."},{"type":"cmd","q":"After fixing /etc/fstab in emergency mode, make systemd read the new version.","accept":["systemctl daemon-reload"],"explain":"Then `mount -a` to test it before you reboot."}],"labs":[{"title":"Reset the root password (exam classic)","scenario":"Pretend you lost the root password. Interrupt the boot and set it to \"Redhat@2026\", making sure SELinux labels are fixed. Log in as root afterwards.","hints":[],"steps":["# reboot; at GRUB press e","# at the end of the line starting with linux add:  rd.break    then Ctrl+X","mount -o remount,rw /sysroot","chroot /sysroot","passwd root","touch /.autorelabel","exit","exit          # the system relabels and reboots"],"verify":["log in as root with the new password"]},{"title":"Recover from a broken fstab","scenario":"Add a line to /etc/fstab with a wrong UUID for /mnt/data. Reboot and fix the system from emergency mode.","hints":[],"steps":["vim /etc/fstab          # change one character of the /mnt/data UUID","systemctl reboot        # boot stops in emergency mode","# enter the root password","mount -o remount,rw /","vim /etc/fstab          # correct the UUID (check with blkid)","systemctl daemon-reload && mount -a","systemctl reboot"],"verify":["findmnt /mnt/data"]},{"title":"Speed drill: root reset","scenario":"Repeat the root password reset three times. Time yourself and aim for under 4 minutes, including the relabel reboot.","hints":[],"steps":["# same steps as the root reset task, from memory"],"verify":["log in as root each time"]},{"title":"Boot with a non-essential disk missing","scenario":"Add nofail to the /mnt/docs NFS line or a spare disk line, shut down, detach that disk (or stop node2), and boot. The system must reach its normal target.","hints":[],"steps":["vim /etc/fstab          # options: defaults,nofail","systemctl poweroff      # detach the disk or stop node2, then power on"],"verify":["systemctl is-system-running"]}]},{"day":38,"course":"RH134","title":"The bootloader","objective":"Modify the system bootloader.","questions":[{"type":"cmd","q":"Show which kernel boots by default.","accept":["grubby --default-kernel"],"explain":"`grubby --default-index` shows its menu position."},{"type":"cmd","q":"Add the kernel argument console=ttyS0 to all installed kernels.","accept":["grubby --update-kernel=ALL --args=\"console=ttyS0\"","grubby --update-kernel=ALL --args=console=ttyS0","grubby --update-kernel ALL --args console=ttyS0"],"explain":"It takes effect at the next boot. Check with `cat /proc/cmdline` after rebooting."},{"type":"cmd","q":"Remove the argument quiet from all installed kernels.","accept":["grubby --update-kernel=ALL --remove-args=\"quiet\"","grubby --update-kernel=ALL --remove-args=quiet"],"explain":"Add it back with `--args=quiet`."},{"type":"mcq","q":"Which file sets how many seconds the GRUB menu waits?","options":["/etc/default/grub (GRUB_TIMEOUT)","/boot/grub2/grub.cfg only","/etc/grub.conf","/etc/sysconfig/kernel"],"answer":0,"explain":"Don't edit grub.cfg directly; it is generated."},{"type":"cmd","q":"Regenerate the GRUB configuration after editing /etc/default/grub.","accept":["grub2-mkconfig -o /boot/grub2/grub.cfg"],"explain":"On RHEL 9 and 10 this path is right for both BIOS and UEFI machines."},{"type":"cmd","q":"Show the details of every boot entry.","accept":["grubby --info=ALL","grubby --info ALL"],"explain":"It prints each kernel's index, path, arguments and title."},{"type":"cmd","q":"Make /boot/vmlinuz-6.12.0-55.el10.x86_64 the default kernel.","accept":["grubby --set-default /boot/vmlinuz-6.12.0-55.el10.x86_64","grubby --set-default=/boot/vmlinuz-6.12.0-55.el10.x86_64"],"explain":"Use a real path from `ls /boot/vmlinuz-*` on your system."},{"type":"mcq","q":"Where are the individual boot menu entries stored on RHEL 9 and 10?","options":["/boot/loader/entries/*.conf (Boot Loader Specification files)","/boot/grub2/menu.lst","/etc/grub.d/entries","/boot/efi/entries.txt"],"answer":0,"explain":"grubby edits these files for you."},{"type":"mcq","q":"You need an argument in only one boot, for testing. What do you do?","options":["Press e at the GRUB menu, add it to the linux line, and press Ctrl+X","Run grubby with --once","Edit /etc/default/grub and reboot","Add it to /proc/cmdline"],"answer":0,"explain":"Edits made at the menu are forgotten after that boot."}],"labs":[{"title":"Change the GRUB timeout","scenario":"Make the GRUB menu wait 10 seconds. Apply the change and confirm it after a reboot.","hints":[],"steps":["vim /etc/default/grub       # GRUB_TIMEOUT=10","grub2-mkconfig -o /boot/grub2/grub.cfg","systemctl reboot"],"verify":["grep -i timeout /boot/grub2/grub.cfg | head -3"]},{"title":"Add a kernel argument permanently","scenario":"Add `audit=1` to all installed kernels, reboot and confirm the running kernel has it.","hints":[],"steps":["grubby --update-kernel=ALL --args=\"audit=1\"","grubby --info=ALL | grep args","systemctl reboot"],"verify":["cat /proc/cmdline"]},{"title":"Choose the default kernel","scenario":"If more than one kernel is installed, make the older one the default, reboot into it, check with uname -r, then set the newest back as default.","hints":[],"steps":["grubby --info=ALL | grep -E '^index|^kernel'","grubby --set-default /boot/vmlinuz-<older-version>","systemctl reboot","uname -r","grubby --set-default /boot/vmlinuz-<newest-version>"],"verify":["grubby --default-kernel"]},{"title":"Remove a kernel argument","scenario":"Remove `audit=1` from all kernels again and confirm it is gone after a reboot.","hints":[],"steps":["grubby --update-kernel=ALL --remove-args=\"audit=1\"","systemctl reboot"],"verify":["cat /proc/cmdline"]}]},{"day":39,"course":"RH134","title":"firewalld","objective":"Restrict network access using firewalld and firewall-cmd.","questions":[{"type":"cmd","q":"Show everything configured in the default zone.","accept":["firewall-cmd --list-all"],"explain":"Add `--zone=NAME` to look at another zone."},{"type":"cmd","q":"Allow the http service permanently.","accept":["firewall-cmd --permanent --add-service=http","firewall-cmd --add-service=http --permanent"],"explain":"Then reload, or it is not active yet."},{"type":"cmd","q":"Make the permanent configuration active now.","accept":["firewall-cmd --reload"],"explain":"Reload replaces the running config with the permanent one."},{"type":"mcq","q":"What happens if you add a rule with --permanent and never reload?","options":["It is saved for the next boot but not active now","It is active now and after reboot","It is lost","firewalld restarts by itself"],"answer":0,"explain":"The opposite mistake: a rule without --permanent works now but disappears at reboot."},{"type":"cmd","q":"Open port 8080/tcp permanently.","accept":["firewall-cmd --permanent --add-port=8080/tcp","firewall-cmd --add-port=8080/tcp --permanent"],"explain":"Prefer a service name when one exists: `firewall-cmd --get-services`."},{"type":"cmd","q":"Show the default zone.","accept":["firewall-cmd --get-default-zone"],"explain":"`--get-active-zones` shows which interfaces and sources are in which zone."},{"type":"mcq","q":"What does `firewall-cmd --runtime-to-permanent` do?","options":["Saves the current running rules as the permanent configuration","Makes every rule temporary","Reloads from disk","Restarts firewalld"],"answer":0,"explain":"Useful if you tested rules without --permanent and they work."},{"type":"cmd","q":"Remove the cockpit service from the default zone permanently.","accept":["firewall-cmd --permanent --remove-service=cockpit","firewall-cmd --remove-service=cockpit --permanent"],"explain":"Then `firewall-cmd --reload`."},{"type":"mcq","q":"Which command permanently rejects SSH from 192.168.50.0/24 only?","options":["firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" source address=\"192.168.50.0/24\" service name=\"ssh\" reject'","firewall-cmd --permanent --block-ssh=192.168.50.0/24","firewall-cmd --permanent --remove-service=ssh --source=192.168.50.0/24","firewall-cmd --deny ssh from 192.168.50.0/24"],"answer":0,"explain":"`man firewalld.richlanguage` has examples you can copy during the exam."},{"type":"mcq","q":"Where are the predefined firewalld service definitions stored?","options":["/usr/lib/firewalld/services/*.xml","/etc/services only","/etc/firewalld/zones/","/var/lib/firewalld/"],"answer":0,"explain":"Custom services go in /etc/firewalld/services/."}],"labs":[{"title":"Allow web traffic","scenario":"On node1, allow HTTP and HTTPS permanently in the default zone. From node2, confirm you can reach the web server.","hints":[],"steps":["firewall-cmd --permanent --add-service=http --add-service=https","firewall-cmd --reload"],"verify":["firewall-cmd --list-services","curl http://node1        # from node2"]},{"title":"Ports and removing services","scenario":"Open 8080/tcp and 5353/udp permanently, remove the cockpit service, and check the result.","hints":[],"steps":["firewall-cmd --permanent --add-port=8080/tcp --add-port=5353/udp","firewall-cmd --permanent --remove-service=cockpit","firewall-cmd --reload"],"verify":["firewall-cmd --list-all"]},{"title":"Zones and sources","scenario":"Put node2's IP address in the trusted zone permanently, so node2 can reach every port on node1. Show the active zones.","hints":[],"steps":["firewall-cmd --permanent --zone=trusted --add-source=192.168.122.12","firewall-cmd --reload"],"verify":["firewall-cmd --get-active-zones","firewall-cmd --zone=trusted --list-all"]},{"title":"Rich rule","scenario":"Permanently reject SSH from node2's IP only, test it from node2, then remove the rule.","hints":[],"steps":["firewall-cmd --permanent --zone=trusted --remove-source=192.168.122.12","firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" source address=\"192.168.122.12\" service name=\"ssh\" reject'","firewall-cmd --reload","ssh node1          # from node2: Connection refused","firewall-cmd --permanent --remove-rich-rule='rule family=\"ipv4\" source address=\"192.168.122.12\" service name=\"ssh\" reject'","firewall-cmd --reload"],"verify":["firewall-cmd --list-rich-rules"]}]},{"day":40,"course":"RH134","title":"Network security end to end","objective":"Combine firewalld, SELinux port labels and service configuration.","questions":[{"type":"mcq","q":"To run sshd on port 2222 in enforcing mode, which steps are needed?","options":["Add Port 2222 to the sshd config, label 2222/tcp as ssh_port_t, open 2222/tcp in the firewall, restart sshd","Only change Port in the sshd config","Only open the firewall port","Disable SELinux and restart sshd"],"answer":0,"explain":"Three layers: the service config, SELinux and the firewall. Check all three."},{"type":"cmd","q":"Label TCP port 2222 as an SSH port for SELinux.","accept":["semanage port -a -t ssh_port_t -p tcp 2222"],"explain":"Check it with `semanage port -l | grep ssh`."},{"type":"mcq","q":"A service fails to start with \"Permission denied\" when binding to a new port. What is the likely cause?","options":["SELinux: the port is not labeled with the type the service is allowed to use","The firewall is blocking the port","The port is already open","The service needs a reboot"],"answer":0,"explain":"The firewall never stops a local service from starting. It only blocks incoming traffic."},{"type":"mcq","q":"A service works with curl on localhost but not from another machine. What should you check first?","options":["The firewall","SELinux file contexts","The service's unit file","DNS"],"answer":0,"explain":"Test with `curl http://node1:PORT` from node2 after each fix."},{"type":"cmd","q":"Show which process is listening on TCP port 2222.","accept":["ss -tlnp | grep 2222","ss -tulpn | grep 2222","ss -tlnp | grep :2222"],"explain":"No output means nothing is listening on that port."},{"type":"cmd","q":"Remove the SELinux ssh_port_t label from TCP port 2222.","accept":["semanage port -d -t ssh_port_t -p tcp 2222"],"explain":"Only ports you added can be deleted; built-in ones cannot."},{"type":"mcq","q":"`semanage port -a -t http_port_t -p tcp 8443` says the port is already defined. What do you do?","options":["Nothing if it already has the right type; otherwise use -m to modify it","Delete the SELinux policy","Use a different port","Run setenforce 0"],"answer":0,"explain":"Always check with `semanage port -l | grep 8443` first."},{"type":"mcq","q":"What is the difference between a firewalld service and a port?","options":["A service is a named set of ports (and helpers); a port is a single number and protocol","Services only work for TCP","Ports are permanent and services are not","There is no difference"],"answer":0,"explain":"`firewall-cmd --info-service=http` shows which ports a service opens."},{"type":"mcq","q":"In what order should you debug \"web page not reachable\"?","options":["Service running, listening port, local curl, firewall, SELinux (port and file contexts), then logs","Reboot first, then check SELinux","Disable the firewall and SELinux, then test","Reinstall the package"],"answer":0,"explain":"Never leave SELinux permissive or the firewall off as your \"fix\" in the exam."}],"labs":[{"title":"SSH on an extra port","scenario":"Make sshd listen on both 22 and 2222 on node1, with SELinux enforcing and the firewall on. Connect from node2 on port 2222.","hints":[],"steps":["vim /etc/ssh/sshd_config.d/60-port.conf      # Port 22 and Port 2222 on two lines","semanage port -a -t ssh_port_t -p tcp 2222","firewall-cmd --permanent --add-port=2222/tcp && firewall-cmd --reload","sshd -t && systemctl restart sshd"],"verify":["ss -tlnp | grep sshd","ssh -p 2222 student@node1 hostname       # from node2"]},{"title":"Fix a web server broken at every layer","scenario":"Run these setup commands, then make http://node1:8888/ show \"fixed\" from node2 without disabling SELinux or the firewall: `sed -i 's/^Listen .*/Listen 8888/' /etc/httpd/conf/httpd.conf; echo fixed > /root/index.html; mv /root/index.html /var/www/html/; systemctl stop httpd`","hints":[],"steps":["systemctl restart httpd                 # fails to bind to 8888","semanage port -a -t http_port_t -p tcp 8888","systemctl enable --now httpd","curl localhost:8888                     # 403: wrong file context","restorecon -v /var/www/html/index.html","firewall-cmd --permanent --add-port=8888/tcp && firewall-cmd --reload"],"verify":["curl http://node1:8888/                 # from node2: fixed"]},{"title":"Map services to port types","scenario":"Find which SELinux port type covers 3306/tcp, which covers 25/tcp, and which ports ssh_port_t includes.","hints":[],"steps":["semanage port -l | grep -w 3306","semanage port -l | grep -w 25","semanage port -l | grep ssh_port_t"],"verify":["semanage port -l -C          # only your local changes"]},{"title":"Lock the firewall down","scenario":"Allow only ssh and http in the default zone of node1 (remove everything else, including cockpit and dhcpv6-client if present), then make sure you can still SSH in.","hints":[],"steps":["firewall-cmd --list-services","firewall-cmd --permanent --remove-service=cockpit --remove-service=dhcpv6-client","firewall-cmd --permanent --add-service=ssh --add-service=http","firewall-cmd --reload"],"verify":["firewall-cmd --list-all","ssh node1 true && echo ssh-ok       # from node2"]}]},{"day":41,"course":"EX200","title":"Review: essential tools","objective":"Mixed exam-style practice on files, links, grep, find, archives and documentation.","questions":[{"type":"mcq","q":"A task says \"copy the file, preserving ownership, permissions and timestamps\". Which command fits?","options":["cp -a source dest","cp source dest","mv source dest","cp -r source dest"],"answer":0,"explain":"`-a` keeps ownership (as root), mode, timestamps, links and SELinux context."},{"type":"mcq","q":"A task asks for a hard link /root/fstab.hard to /etc/fstab. Which is correct?","options":["ln /etc/fstab /root/fstab.hard","ln -s /etc/fstab /root/fstab.hard","cp -l /root/fstab.hard /etc/fstab","ln /root/fstab.hard /etc/fstab"],"answer":0,"explain":"Check with `ls -li`: both names show the same inode number."},{"type":"mcq","q":"Which grep command keeps the exact lines of /etc/services that contain \"http\" at the start of a line?","options":["grep '^http' /etc/services","grep 'http$' /etc/services","grep -v '^http' /etc/services","grep -c '^http' /etc/services"],"answer":0,"explain":"Read whether the task wants lines, a count, or only words."},{"type":"cmd","q":"Create /root/logs.tar.xz containing /var/log, compressed with xz.","accept":["tar -cJf /root/logs.tar.xz /var/log","tar cJf /root/logs.tar.xz /var/log","tar -cJvf /root/logs.tar.xz /var/log"],"explain":"Check it with `file /root/logs.tar.xz`."},{"type":"cmd","q":"Find files under /etc larger than 1 MiB and list them with details.","accept":["find /etc -size +1M -ls","find /etc -type f -size +1M -ls","find /etc -size +1M -exec ls -l {} \\;"],"explain":"`-ls` prints ls-style details for each match."},{"type":"mcq","q":"Where can you find example configurations during the exam when you have no internet?","options":["man pages, `--help`, and /usr/share/doc","Red Hat's website","Your own notes","The exam proctor"],"answer":0,"explain":"Practise finding things with `man -k`, `man 5 ...` and `ls /usr/share/doc` now so it's fast on exam day."},{"type":"cmd","q":"Find which man pages mention \"autofs\" in their description.","accept":["man -k autofs","apropos autofs"],"explain":"`man 5 auto.master` has example map lines you can copy."},{"type":"mcq","q":"What is the safest way to redirect a command's output to a file only if the file does not already exist?","options":["Use `set -o noclobber`, then `>` refuses to overwrite existing files","Use `>>`","Use `2>`","Use `tee -a`"],"answer":0,"explain":"Most exam tasks just want `>`. Know the options anyway."}],"labs":[{"title":"Links and copies","scenario":"Create a hard link /root/fstab.hard and a symbolic link /root/fstab.soft, both to /etc/fstab. Copy /etc/hosts to /root/hosts.bak keeping all attributes. Show the inode numbers.","hints":[],"steps":["ln /etc/fstab /root/fstab.hard","ln -s /etc/fstab /root/fstab.soft","cp -a /etc/hosts /root/hosts.bak"],"verify":["ls -li /etc/fstab /root/fstab.hard /root/fstab.soft /root/hosts.bak"]},{"title":"Extract lines to a file","scenario":"Put every line of /etc/services that contains the word \"ftp\" into /root/ftp-lines, in the original order. Then put only the service names (first column) of those lines, without duplicates, into /root/ftp-names.","hints":[],"steps":["grep ftp /etc/services > /root/ftp-lines","grep ftp /etc/services | awk '{print $1}' | sort -u > /root/ftp-names"],"verify":["wc -l /root/ftp-lines; cat /root/ftp-names"]},{"title":"Find and copy by owner","scenario":"Create user jacques and give him files in /tmp and /var/tmp. Find all files owned by jacques and copy them into /root/found (create it).","hints":[],"steps":["useradd jacques","sudo -u jacques touch /tmp/j1 /var/tmp/j2","mkdir -p /root/found","find / -user jacques -type f -exec cp -a {} /root/found/ \\; 2>/dev/null"],"verify":["ls -l /root/found"]},{"title":"Archive with each compression","scenario":"Archive /etc/ssh into /root/ssh.tar.gz, /root/ssh.tar.bz2 and /root/ssh.tar.xz. Extract the bzip2 one into /tmp/sshcheck and compare it with the original.","hints":[],"steps":["tar -czf /root/ssh.tar.gz /etc/ssh","tar -cjf /root/ssh.tar.bz2 /etc/ssh","tar -cJf /root/ssh.tar.xz /etc/ssh","mkdir -p /tmp/sshcheck && tar -xjf /root/ssh.tar.bz2 -C /tmp/sshcheck"],"verify":["diff -r /etc/ssh /tmp/sshcheck/etc/ssh && echo same"]},{"title":"Documentation hunt against the clock","scenario":"In under 5 minutes, using only local docs, find: the fstab option that lets a mount fail without stopping the boot, the nmcli example for a static IP, and the rich-rule syntax to reject a source address.","hints":[],"steps":["man 5 fstab             # /nofail","man nmcli-examples      # /static","man firewalld.richlanguage   # /reject"],"verify":["you found all three from local documentation"]}]},{"day":42,"course":"EX200","title":"Review: users, groups and permissions","objective":"Mixed exam-style practice on accounts, aging, sudo, special permissions and ACLs.","questions":[{"type":"mcq","q":"A task says user \"manalo\" must have UID 3533 and password \"flectrag\". Which pair of commands does it?","options":["useradd -u 3533 manalo; echo flectrag | passwd --stdin manalo","useradd manalo -p flectrag -u 3533","usermod -u 3533 manalo; passwd manalo flectrag","adduser --uid 3533 --password flectrag manalo"],"answer":0,"explain":"`useradd -p` expects an already hashed password, so don't use it with plain text."},{"type":"mcq","q":"New users must get passwords that expire after 20 days. What do you change?","options":["PASS_MAX_DAYS 20 in /etc/login.defs","chage -M 20 for every existing user","/etc/default/useradd EXPIRE=20","/etc/shadow for root"],"answer":0,"explain":"Only future accounts are affected. Existing accounts keep their settings."},{"type":"mcq","q":"A shared directory must let group members delete only their own files. Which mode fits?","options":["3770 (SGID and sticky bit, rwx for owner and group)","2770","1777","0770"],"answer":0,"explain":"2 = SGID for group inheritance, 1 = sticky for \"delete only your own\"."},{"type":"cmd","q":"Allow members of the group admins to run any command as any user via sudo, with a password.","accept":["echo '%admins ALL=(ALL) ALL' > /etc/sudoers.d/admins","echo \"%admins ALL=(ALL) ALL\" > /etc/sudoers.d/admins"],"explain":"Then `visudo -c` to check the syntax."},{"type":"mcq","q":"A user's umask must give new files 640 and directories 750. Which umask?","options":["027","022","077","002"],"answer":0,"explain":"666-027 = 640 and 777-027 = 750."},{"type":"cmd","q":"Remove all ACL entries from /var/tmp/fstab.","accept":["setfacl -b /var/tmp/fstab"],"explain":"`setfacl -x u:natasha /var/tmp/fstab` removes just one entry."},{"type":"mcq","q":"Where do you put a umask for every user on the system?","options":["A script in /etc/profile.d/, such as /etc/profile.d/umask.sh","/etc/fstab","/etc/login.defs only affects this","/etc/skel/.umask"],"answer":0,"explain":"UMASK in /etc/login.defs affects home directories created by useradd and some login paths. A profile.d script covers shells."},{"type":"cmd","q":"Give new files created in /srv/team a default ACL granting user harry rwx.","accept":["setfacl -m d:u:harry:rwx /srv/team","setfacl -d -m u:harry:rwx /srv/team","setfacl -m default:u:harry:rwx /srv/team"],"explain":"Default ACLs only work on directories and apply to files created later."}],"labs":[{"title":"Account setup from a spec","scenario":"Create group \"developers\" with GID 5000. Create users dev1 and dev2 (secondary group developers), and user auditor with UID 4000 and no interactive shell. Set all passwords to \"Rhcsa@2026\". dev1 must change the password at first login.","hints":[],"steps":["groupadd -g 5000 developers","useradd -G developers dev1; useradd -G developers dev2","useradd -u 4000 -s /sbin/nologin auditor","for u in dev1 dev2 auditor; do echo 'Rhcsa@2026' | passwd --stdin $u; done","chage -d 0 dev1"],"verify":["id dev1; id dev2; id auditor; chage -l dev1 | head -1"]},{"title":"Team directory with SGID and sticky bit","scenario":"Create /srv/devshare owned by root:developers. Members can read, write and enter; others get nothing. New files belong to developers, and members can delete only their own files.","hints":[],"steps":["mkdir /srv/devshare","chown root:developers /srv/devshare","chmod 3770 /srv/devshare"],"verify":["ls -ld /srv/devshare      # drwxrws--T","su - dev1 -c 'touch /srv/devshare/f1'; su - dev2 -c 'rm /srv/devshare/f1'   # not permitted"]},{"title":"Password aging for existing and new users","scenario":"New users' passwords expire after 45 days with a 5-day warning. dev2's password expires after 30 days, and auditor's account expires on 2027-03-31.","hints":[],"steps":["sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS\\t45/; s/^PASS_WARN_AGE.*/PASS_WARN_AGE\\t5/' /etc/login.defs","chage -M 30 dev2","chage -E 2027-03-31 auditor"],"verify":["grep -E '^PASS_(MAX_DAYS|WARN_AGE)' /etc/login.defs","chage -l dev2; chage -l auditor"]},{"title":"Umask for one user","scenario":"New files created by dev1 must have mode 600 and new directories 700. It must survive logout.","hints":[],"steps":["echo 'umask 077' >> /home/dev1/.bashrc"],"verify":["su - dev1 -c 'touch f; mkdir d; ls -ld f d'"]},{"title":"Fix a permission problem","scenario":"Run this setup: `mkdir -p /data/reports && echo q1 > /data/reports/q1.txt && chmod 700 /data && chmod 644 /data/reports/q1.txt`. dev1 must be able to read q1.txt but not list or change anything else in /data. Find and fix the problem with the smallest change.","hints":[],"steps":["su - dev1 -c 'cat /data/reports/q1.txt'     # Permission denied","namei -l /data/reports/q1.txt","chmod o+x /data      # traverse only, no listing"],"verify":["su - dev1 -c 'cat /data/reports/q1.txt'; su - dev1 -c 'ls /data'   # read works, ls denied"]}]},{"day":43,"course":"EX200","title":"Review: storage I","objective":"Mixed exam-style practice on partitions, swap and creating LVM storage.","questions":[{"type":"mcq","q":"An exam disk already has partitions and a mounted filesystem. A task says to add a partition. What must you avoid?","options":["Creating a new partition table (mklabel) on that disk","Using parted","Starting the partition after the last one","Running udevadm settle"],"answer":0,"explain":"mklabel erases every existing partition on the disk."},{"type":"mcq","q":"Which command shows free space left on /dev/vdb in parted?","options":["parted /dev/vdb unit MiB print free","parted /dev/vdb free","lsblk --free /dev/vdb","df -h /dev/vdb"],"answer":0,"explain":"Start your new partition where the free space begins."},{"type":"mcq","q":"The task wants a 1 GiB LV \"exam\" and the VG uses 32 MiB extents. How many extents is that?","options":["32","1024","64","16"],"answer":0,"explain":"1024 MiB / 32 MiB = 32 extents. Using -L 1G gives the same result."},{"type":"cmd","q":"Create the volume group datavg from /dev/vdb3 and /dev/vdc1 with 8 MiB extents.","accept":["vgcreate -s 8M datavg /dev/vdb3 /dev/vdc1","vgcreate -s 8m datavg /dev/vdb3 /dev/vdc1"],"explain":"Both devices must be PVs, or vgcreate initializes them for you."},{"type":"mcq","q":"After adding a swap line to /etc/fstab, how do you test it without rebooting?","options":["swapon -a, then swapon --show","mount -a only","systemctl restart swap","free -h only"],"answer":0,"explain":"`mount -a` ignores swap entries."},{"type":"cmd","q":"Show the UUID of every block device in one command.","accept":["blkid","lsblk -f","lsblk -o NAME,UUID"],"explain":"Copy UUIDs carefully. A single wrong character stops the boot."},{"type":"mcq","q":"Which fstab line mounts an XFS logical volume by its device mapper path?","options":["/dev/mapper/datavg-exam  /exam  xfs  defaults  0 0","/dev/datavg:exam  /exam  xfs  defaults  0 0","LV=exam  /exam  xfs  defaults  0 0","datavg/exam  /exam  xfs  defaults  0 0"],"answer":0,"explain":"/dev/datavg/exam works too."},{"type":"mcq","q":"What should you always do after editing /etc/fstab, before rebooting?","options":["Run systemctl daemon-reload and mount -a (and swapon -a for swap) to test it","Nothing, reboot to test","Run fsck on every disk","Run grub2-mkconfig"],"answer":0,"explain":"A broken fstab found at boot means emergency mode."}],"labs":[{"title":"Add storage without touching existing data","scenario":"On a disk that already holds partitions, add a 400 MiB XFS partition mounted at /mnt/extra by UUID, and a 300 MiB swap partition active at boot. Existing partitions and swap must stay untouched.","hints":[],"steps":["parted /dev/vdb unit MiB print free","parted -s /dev/vdb mkpart extra xfs <start>MiB <start+400>MiB","parted -s /dev/vdb mkpart swap2 linux-swap <start+400>MiB <start+700>MiB","udevadm settle","mkfs.xfs /dev/vdbN && mkswap /dev/vdbM","mkdir -p /mnt/extra","# add both UUID lines to /etc/fstab","systemctl daemon-reload && mount -a && swapon -a"],"verify":["lsblk -f /dev/vdb; swapon --show; findmnt /mnt/extra"]},{"title":"LVM from scratch with extents","scenario":"Create VG examvg with 32 MiB extents on a new partition. Create LV exam of 20 extents, format it XFS, and mount it at /exam at boot.","hints":[],"steps":["pvcreate /dev/vdbN","vgcreate -s 32M examvg /dev/vdbN","lvcreate -n exam -l 20 examvg","mkfs.xfs /dev/examvg/exam","mkdir -p /exam","echo '/dev/examvg/exam  /exam  xfs  defaults  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["lvs examvg; df -h /exam       # 640 MiB"]},{"title":"LVM swap","scenario":"Add a 512 MiB swap LV in examvg that is active at boot.","hints":[],"steps":["lvcreate -n swap -L 512M examvg","mkswap /dev/examvg/swap","echo '/dev/examvg/swap  none  swap  defaults  0 0' >> /etc/fstab","swapon -a"],"verify":["swapon --show"]},{"title":"Reboot test","scenario":"Reboot and confirm every mount and swap area from today came back. If the boot fails, fix it from emergency mode.","hints":[],"steps":["systemctl reboot"],"verify":["findmnt /mnt/extra /exam; swapon --show"]}]},{"day":44,"course":"EX200","title":"Review: storage II","objective":"Mixed exam-style practice on extending storage, VFAT, NFS and autofs.","questions":[{"type":"mcq","q":"The task says \"extend the /exam filesystem to 900 MiB\". The VG has only 200 MiB free. What do you do first?","options":["Add a new PV to the VG with vgextend","Shrink the root filesystem","Recreate the LV bigger","Extend it by 200 MiB and stop"],"answer":0,"explain":"Read the whole task: it may also tell you which disk to use."},{"type":"mcq","q":"Why is `lvextend -r` safer in an exam than lvextend followed by a separate grow command?","options":["You cannot forget to grow the filesystem","It is faster","It works on unmounted XFS only","It skips rounding"],"answer":0,"explain":"Always confirm with `df -h` afterwards."},{"type":"cmd","q":"Mount node2:/shares/docs at /mnt/docs at boot. Write the fstab line.","accept":["echo 'node2:/shares/docs /mnt/docs nfs defaults,_netdev 0 0' >> /etc/fstab","node2:/shares/docs /mnt/docs nfs defaults,_netdev 0 0","node2:/shares/docs /mnt/docs nfs defaults 0 0"],"explain":"Test with `mount -a` and `findmnt /mnt/docs`."},{"type":"mcq","q":"For an autofs indirect map at /rhome, which directory must NOT contain pre-made subdirectories?","options":["/rhome","/etc/auto.master.d","/home","/mnt"],"answer":0,"explain":"autofs manages /rhome. Any leftovers there confuse the mounts."},{"type":"mcq","q":"autofs is configured but `cd /rhome/remoteuser1` fails. What do you check?","options":["That autofs is running, the map spelling, the export on the server, and the journal for autofs","Only SELinux","Only /etc/fstab","Reboot first"],"answer":0,"explain":"`showmount -e node2` confirms the export exists."},{"type":"cmd","q":"Format /dev/vdb6 as VFAT with the label USBDATA in one command.","accept":["mkfs.vfat -n USBDATA /dev/vdb6","mkfs.fat -n USBDATA /dev/vdb6"],"explain":"For VFAT the label option is -n; for XFS and ext4 it is -L."},{"type":"mcq","q":"What does \"configure systems to mount file systems at boot by UUID or label\" mean for your fstab lines?","options":["Use UUID= or LABEL= in the first field, not /dev/sdX or /dev/vdX","Use /dev/disk/by-path only","Add the uuid option","Mount with systemd units only"],"answer":0,"explain":"LVM paths like /dev/vg/lv are also stable; follow the wording of the task."},{"type":"mcq","q":"Which command confirms autofs actually mounted remoteuser1's home over NFS?","options":["findmnt /rhome/remoteuser1 (after accessing it)","systemctl status nfs","cat /etc/auto.rhome","ls /etc/auto.master.d"],"answer":0,"explain":"The mount shows as nfs4 with the server:path source."}],"labs":[{"title":"Grow storage with a new disk","scenario":"Grow /exam to 900 MiB total. The VG does not have enough space, so add a new PV from a spare disk first. Keep the data.","hints":[],"steps":["pvcreate /dev/vdc","vgextend examvg /dev/vdc","lvextend -r -L 900M /dev/examvg/exam"],"verify":["df -h /exam; vgs examvg"]},{"title":"VFAT with label, at boot","scenario":"Create a 200 MiB VFAT filesystem labeled USBDATA and mount it at /mnt/usbdata at boot using LABEL=.","hints":[],"steps":["parted -s /dev/vdb mkpart usb fat32 <start>MiB <start+200>MiB && udevadm settle","mkfs.vfat -n USBDATA /dev/vdbN","mkdir -p /mnt/usbdata","echo 'LABEL=USBDATA  /mnt/usbdata  vfat  defaults  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["findmnt /mnt/usbdata"]},{"title":"Static NFS mount","scenario":"Mount node2:/shares/docs at /mnt/docs persistently, and check that it survives a reboot.","hints":[],"steps":["mkdir -p /mnt/docs","echo 'node2:/shares/docs  /mnt/docs  nfs  defaults,_netdev  0 0' >> /etc/fstab","systemctl daemon-reload && mount -a"],"verify":["findmnt /mnt/docs"]},{"title":"autofs home directories from memory","scenario":"Without looking at earlier days, configure autofs so /rhome/remoteuser2 is mounted from node2:/rhome/remoteuser2 when remoteuser2 logs in.","hints":[],"steps":["dnf install -y autofs","echo '/rhome  /etc/auto.rhome' > /etc/auto.master.d/rhome.autofs","echo 'remoteuser2  -rw,sync  node2:/rhome/remoteuser2' > /etc/auto.rhome","systemctl enable --now autofs"],"verify":["su - remoteuser2 -c pwd; findmnt /rhome/remoteuser2"]}]},{"day":45,"course":"EX200","title":"Review: SELinux and the firewall","objective":"Mixed exam-style practice on SELinux contexts, booleans, ports and firewalld.","questions":[{"type":"mcq","q":"An exam task says \"the web server must serve files from /srv/web in enforcing mode\". Which two commands are essential?","options":["semanage fcontext -a -t httpd_sys_content_t '/srv/web(/.*)?' and restorecon -Rv /srv/web","chcon -t httpd_sys_content_t /srv/web and setenforce 0","setsebool -P httpd_srv on and restorecon /srv","chmod 777 /srv/web and setenforce 1"],"answer":0,"explain":"The semanage rule survives a relabel; chcon does not."},{"type":"mcq","q":"How do you find the correct file type to use for a service?","options":["Look at the context of its default directory, e.g. `ls -Zd /var/www/html`, or its _selinux man page","Guess the name","Use unconfined_t","Copy the type from /tmp"],"answer":0,"explain":"Install selinux-policy-doc to get pages like `man httpd_selinux`."},{"type":"cmd","q":"Show your local SELinux file-context customizations only.","accept":["semanage fcontext -l -C"],"explain":"-C lists only changes you made, which is handy for checking your work."},{"type":"mcq","q":"The exam system is in permissive mode at the start. What should you do?","options":["Set it to enforcing, now and in /etc/selinux/config, unless the task says otherwise","Leave it permissive to save time","Disable SELinux","Nothing; permissive is the same as enforcing"],"answer":0,"explain":"Tasks are graded with SELinux enforcing. Fix labels, don't turn SELinux off."},{"type":"mcq","q":"You add a firewall rule with --permanent and forget to reload. Graders reboot the system. Is the rule active after the reboot?","options":["Yes, permanent rules load at boot; but reload anyway so you can test now","No, it is lost","Only if SELinux is enforcing","Only if firewalld was restarted"],"answer":0,"explain":"A rule without --permanent is the one that disappears at reboot."},{"type":"cmd","q":"Allow the httpd daemon to read user home directories through a persistent boolean.","accept":["setsebool -P httpd_enable_homedirs on","setsebool -P httpd_enable_homedirs 1"],"explain":"Find booleans with `getsebool -a | grep httpd` or `semanage boolean -l | grep home`."},{"type":"mcq","q":"Which command lists firewalld's rules for every zone at once?","options":["firewall-cmd --list-all-zones","firewall-cmd --list-all","firewall-cmd --get-zones","iptables -L"],"answer":0,"explain":"--list-all shows only the default zone (or the one given with --zone)."},{"type":"mcq","q":"A service has the right file contexts and firewall, but still gets AVC denials for a network connection it makes. What is the likely fix?","options":["Turn on the matching boolean, e.g. httpd_can_network_connect, with -P","Relabel the whole filesystem","Add a firewall rule","Change the port"],"answer":0,"explain":"Booleans switch optional behaviour in the policy on or off."}],"labs":[{"title":"Web content in a custom directory","scenario":"Serve /srv/web (containing index.html with \"srv web\") as Apache's DocumentRoot in enforcing mode, reachable from node2.","hints":[],"steps":["mkdir -p /srv/web && echo \"srv web\" > /srv/web/index.html","vim /etc/httpd/conf/httpd.conf     # DocumentRoot \"/srv/web\" and <Directory \"/srv/web\"> Require all granted","semanage fcontext -a -t httpd_sys_content_t '/srv/web(/.*)?'","restorecon -Rv /srv/web","systemctl restart httpd","firewall-cmd --permanent --add-service=http && firewall-cmd --reload"],"verify":["curl http://node1/            # from node2"]},{"title":"SELinux port and firewall together","scenario":"Make httpd listen on 8989 as well as 80. Fix SELinux and the firewall so both ports work from node2.","hints":[],"steps":["echo 'Listen 8989' > /etc/httpd/conf.d/8989.conf","semanage port -a -t http_port_t -p tcp 8989","firewall-cmd --permanent --add-port=8989/tcp && firewall-cmd --reload","systemctl restart httpd"],"verify":["curl http://node1:8989/       # from node2"]},{"title":"Enforcing everywhere","scenario":"Set SELinux to permissive in both runtime and config (simulating a broken start state). Then fix it so it is enforcing now and after reboot.","hints":[],"steps":["setenforce 0; sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config","setenforce 1","sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config"],"verify":["getenforce; grep ^SELINUX= /etc/selinux/config"]},{"title":"Firewall by zone","scenario":"Change the default zone to \"home\", make sure ssh and http are allowed in it permanently, and confirm the interface is in that zone.","hints":[],"steps":["firewall-cmd --set-default-zone=home","firewall-cmd --permanent --zone=home --add-service=ssh --add-service=http","firewall-cmd --reload"],"verify":["firewall-cmd --get-active-zones; firewall-cmd --zone=home --list-services"]}]},{"day":46,"course":"EX200","title":"Review: boot, targets and the bootloader","objective":"Mixed exam-style practice on targets, root password reset and GRUB.","questions":[{"type":"mcq","q":"The exam starts and you do not know node2's root password. What is expected?","options":["Reset it by interrupting the boot (rd.break), usually as one of the tasks","Reinstall node2","Ask the proctor","Skip node2"],"answer":0,"explain":"Practise the reset until it takes under 4 minutes."},{"type":"mcq","q":"After the root reset, the system reboots for a long time. Why?","options":["SELinux is relabeling every file because of /.autorelabel","The password is being encrypted","It is running fsck","It is downloading updates"],"answer":0,"explain":"Let it finish. Don't power it off."},{"type":"cmd","q":"Make the system boot into graphical.target by default.","accept":["systemctl set-default graphical.target"],"explain":"Only if a desktop is installed; otherwise the target has nothing extra to start."},{"type":"mcq","q":"Where do you add a kernel argument for one boot only?","options":["At the GRUB menu: press e, edit the linux line, press Ctrl+X","In /etc/default/grub","With grubby --update-kernel=ALL","In /proc/cmdline"],"answer":0,"explain":"The other methods are permanent."},{"type":"cmd","q":"Add the argument crashkernel=256M to the default kernel only.","accept":["grubby --update-kernel=DEFAULT --args=\"crashkernel=256M\"","grubby --update-kernel=DEFAULT --args=crashkernel=256M","grubby --update-kernel=$(grubby --default-kernel) --args=\"crashkernel=256M\""],"explain":"ALL means every kernel; DEFAULT means only the default one."},{"type":"mcq","q":"What does `systemctl isolate rescue.target` do on a running system?","options":["Stops most services and drops to single-user rescue mode","Reboots into rescue mode","Sets rescue.target as default","Only lists rescue services"],"answer":0,"explain":"Do it from the console, not over SSH, because SSH stops."},{"type":"mcq","q":"GRUB_TIMEOUT was changed in /etc/default/grub but the menu still waits 5 seconds. Why?","options":["grub2-mkconfig was not run to regenerate grub.cfg","The file needs a reboot twice","SELinux blocks the change","GRUB_TIMEOUT must be in grub.cfg only"],"answer":0,"explain":"Run `grub2-mkconfig -o /boot/grub2/grub.cfg`."},{"type":"mcq","q":"Which log shows what happened during the current boot?","options":["journalctl -b","/var/log/boot.msg","dmesg -old","/boot/log"],"answer":0,"explain":"`journalctl -b -1` shows the previous boot if the journal is persistent."}],"labs":[{"title":"Root password reset under time pressure","scenario":"Set a timer for 5 minutes. Reset node2's root password to \"Exam@2026\", with SELinux relabel, and log in.","hints":[],"steps":["# GRUB: e, add rd.break, Ctrl+X","mount -o remount,rw /sysroot","chroot /sysroot","echo 'Exam@2026' | passwd --stdin root","touch /.autorelabel","exit; exit"],"verify":["log in as root with Exam@2026"]},{"title":"Default target and GRUB timeout","scenario":"Make node2 boot into multi-user.target by default and set the GRUB menu timeout to 7 seconds. Reboot to confirm both.","hints":[],"steps":["systemctl set-default multi-user.target","sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=7/' /etc/default/grub","grub2-mkconfig -o /boot/grub2/grub.cfg","systemctl reboot"],"verify":["systemctl get-default; grep ^GRUB_TIMEOUT /etc/default/grub"]},{"title":"Kernel argument on the default kernel","scenario":"Add `nomodeset` to the default kernel only. Reboot and confirm, then remove it.","hints":[],"steps":["grubby --update-kernel=DEFAULT --args=\"nomodeset\"","systemctl reboot","cat /proc/cmdline","grubby --update-kernel=DEFAULT --remove-args=\"nomodeset\""],"verify":["grubby --info=DEFAULT | grep args"]},{"title":"Rescue mode repair","scenario":"Break sshd by adding an invalid line to /etc/ssh/sshd_config.d/99-bad.conf, reboot into rescue.target from GRUB, find the error with journalctl and sshd -t, and fix it.","hints":[],"steps":["echo 'ThisIsNotValid yes' > /etc/ssh/sshd_config.d/99-bad.conf","# reboot, GRUB: e, add systemd.unit=rescue.target, Ctrl+X","sshd -t","rm /etc/ssh/sshd_config.d/99-bad.conf","systemctl default"],"verify":["systemctl is-active sshd"]}]},{"day":47,"course":"EX200","title":"Review: services, scheduling, logs, time and tuning","objective":"Mixed exam-style practice on operating running systems.","questions":[{"type":"mcq","q":"A task says \"the service must start automatically at boot\". Is `systemctl start` enough?","options":["No; it must also be enabled, e.g. systemctl enable --now","Yes","Only after a reboot","Only for network services"],"answer":0,"explain":"Graders often reboot first and then test."},{"type":"mcq","q":"Which cron line runs a job at 23:50 on the 1st and 15th of every month?","options":["50 23 1,15 * *","23 50 1,15 * *","50 23 * 1,15 *","50 23 * * 1,15"],"answer":0,"explain":"Lists use commas and ranges use a dash."},{"type":"cmd","q":"Show the date and time chrony last synchronized, and how far off the clock is.","accept":["chronyc tracking"],"explain":"\"System time\" shows the current offset."},{"type":"mcq","q":"The journal must survive reboots. Which step alone is enough when Storage=auto?","options":["Create /var/log/journal (then restart systemd-journald or reboot)","Install rsyslog","Run journalctl --flush without creating anything","Set SystemMaxUse=1G"],"answer":0,"explain":"Setting Storage=persistent works too. Pick one and verify with --list-boots after a reboot."},{"type":"cmd","q":"Kill the process with the highest CPU usage, given its PID is 4242, gracefully first.","accept":["kill 4242","kill -15 4242","kill -TERM 4242","kill -SIGTERM 4242"],"explain":"Only use -9 if it does not exit after SIGTERM."},{"type":"mcq","q":"Which command shows the reason a service failed to start?","options":["systemctl status name, then journalctl -u name","systemctl is-enabled name","ps aux | grep name only","cat /etc/services"],"answer":0,"explain":"status shows the last log lines; journalctl -u shows the whole history."},{"type":"cmd","q":"Schedule `/usr/local/bin/cleanup.sh` for user harry every Monday at 07:15 as a cron job, without an editor.","accept":["(crontab -l -u harry 2>/dev/null; echo \"15 7 * * 1 /usr/local/bin/cleanup.sh\") | crontab -u harry -","echo \"15 7 * * 1 /usr/local/bin/cleanup.sh\" | crontab -u harry -"],"explain":"`crontab -u harry -` reads the whole crontab from stdin. The first form keeps harry's existing jobs."},{"type":"mcq","q":"A task says \"set the tuning profile recommended by the system\". What must also be true for it to persist?","options":["The tuned service is enabled at boot","The profile is copied to /etc","SELinux is permissive","A reboot happens right away"],"answer":0,"explain":"`systemctl enable --now tuned` then `tuned-adm profile $(tuned-adm recommend)`."}],"labs":[{"title":"Service health check","scenario":"Make sure httpd, chronyd, sshd and crond are all running and enabled. Find any failed unit on the system and fix it or reset its state.","hints":[],"steps":["systemctl enable --now httpd chronyd sshd crond","systemctl --failed","systemctl status <failed-unit>; journalctl -u <failed-unit> -n 20","systemctl reset-failed"],"verify":["systemctl is-enabled httpd chronyd sshd crond; systemctl is-active httpd chronyd sshd crond"]},{"title":"Scheduling three ways","scenario":"For user natasha: a cron job that writes the date to /tmp/natasha-cron every 5 minutes. As root: an at job that writes \"done\" to /tmp/at-done in 3 minutes. And a systemd timer that runs `logger \"timer tick\"` every 15 minutes.","hints":[],"steps":["echo '*/5 * * * * date >> /tmp/natasha-cron' | crontab -u natasha -","echo 'echo done > /tmp/at-done' | at now + 3 minutes","# tick.service: [Service] Type=oneshot, ExecStart=/usr/bin/logger \"timer tick\"","# tick.timer:   [Timer] OnCalendar=*:0/15   [Install] WantedBy=timers.target","systemctl daemon-reload && systemctl enable --now tick.timer"],"verify":["crontab -l -u natasha; atq; systemctl list-timers tick.timer"]},{"title":"Logs and journal","scenario":"Make the journal persistent, then write a log line with priority local7.warning and find it both in /var/log/messages and in the journal.","hints":[],"steps":["mkdir -p /var/log/journal && systemctl restart systemd-journald","logger -p local7.warning \"RHCSA review day 47\""],"verify":["grep 'RHCSA review day 47' /var/log/messages","journalctl -p warning --since \"-5min\" | grep 'review day 47'"]},{"title":"Time and tuning together","scenario":"Configure chrony to use node2 (or a server you choose) and set the time zone to Asia/Kolkata. Apply the recommended tuned profile. Verify all three.","hints":[],"steps":["sed -i 's/^pool /#pool /' /etc/chrony.conf && echo 'server node2 iburst' >> /etc/chrony.conf","systemctl restart chronyd","timedatectl set-timezone Asia/Kolkata","systemctl enable --now tuned && tuned-adm profile $(tuned-adm recommend)"],"verify":["chronyc sources; timedatectl; tuned-adm active"]}]},{"day":48,"course":"EX200","title":"Review: networking and software","objective":"Mixed exam-style practice on IPv4, IPv6, hostnames, repositories and Flatpak.","questions":[{"type":"mcq","q":"The exam gives you IP, netmask, gateway, DNS and hostname for node1. Where do you usually do this task?","options":["On the console first, since SSH may drop when the address changes","Over SSH from node2","In /etc/sysconfig/network-scripts","In /etc/hosts only"],"answer":0,"explain":"After it works, you can use SSH for the rest."},{"type":"mcq","q":"What is a netmask of 255.255.255.0 in prefix notation?","options":["/24","/16","/8","/32"],"answer":0,"explain":"nmcli wants the prefix form: 192.168.1.10/24."},{"type":"cmd","q":"Set the hostname to server1.example.com permanently.","accept":["hostnamectl set-hostname server1.example.com","hostnamectl hostname server1.example.com"],"explain":"Check with `hostnamectl`."},{"type":"mcq","q":"Which nmcli property stops a profile from using DNS servers from DHCP?","options":["ipv4.ignore-auto-dns yes","ipv4.dns none","ipv4.never-default yes","ipv4.may-fail yes"],"answer":0,"explain":"Useful when a task gives you a fixed DNS server."},{"type":"cmd","q":"Add a second DNS server 8.8.8.8 to the connection \"eth0\" without removing the existing one.","accept":["nmcli con mod eth0 +ipv4.dns 8.8.8.8","nmcli connection modify eth0 +ipv4.dns 8.8.8.8"],"explain":"The `+` prefix appends to a list property; `-` removes an item."},{"type":"mcq","q":"The repo task gives only a URL. Which lines do you write in the .repo file at minimum?","options":["[id], name=, baseurl=URL, enabled=1, gpgcheck=0 (or 1 with the key the task gives)","Only baseurl=","mirrorlist= and metalink=","[main] and baseurl="],"answer":0,"explain":"Then run `dnf repolist` and install a package to prove it works."},{"type":"cmd","q":"Install the package from the local file /root/tree-2.1.0.rpm, resolving dependencies from the repos.","accept":["dnf install /root/tree-2.1.0.rpm","dnf install -y /root/tree-2.1.0.rpm","dnf localinstall /root/tree-2.1.0.rpm"],"explain":"Check with `rpm -q tree`."},{"type":"mcq","q":"Which command lists the apps a Flatpak remote offers?","options":["flatpak remote-ls <remote>","flatpak list --remote","flatpak search --all","flatpak remotes --apps"],"answer":0,"explain":"`flatpak list` shows only what is installed."}],"labs":[{"title":"Full network configuration","scenario":"On node1, configure a static IPv4 address, gateway and DNS from your lab subnet, add the IPv6 address fd00:10::11/64, set the hostname node1.lab.example.com, and make sure the connection starts at boot. Reboot and verify.","hints":[],"steps":["nmcli con mod \"<profile>\" ipv4.addresses 192.168.122.11/24 ipv4.gateway 192.168.122.1 ipv4.dns 192.168.122.1 ipv4.method manual","nmcli con mod \"<profile>\" ipv6.addresses fd00:10::11/64 ipv6.method manual","nmcli con mod \"<profile>\" connection.autoconnect yes","nmcli con up \"<profile>\"","hostnamectl set-hostname node1.lab.example.com"],"verify":["ip -br a; ip route; hostnamectl; cat /etc/resolv.conf"]},{"title":"Repositories from a URL","scenario":"Remove any existing repo files (back them up first), then configure BaseOS and AppStream from node2's HTTP share with gpgcheck disabled. Install tree to prove it works.","hints":[],"steps":["mkdir -p /root/repo-backup && mv /etc/yum.repos.d/*.repo /root/repo-backup/","vim /etc/yum.repos.d/exam.repo      # [BaseOS] and [AppStream] blocks with baseurl=http://node2/rhel10/...","dnf clean all && dnf repolist","dnf install -y tree"],"verify":["dnf repolist; rpm -q tree"]},{"title":"Flatpak remote and app","scenario":"Add the remote the task gives (use Flathub if you have internet), install one app system-wide, list it, and then remove it.","hints":[],"steps":["flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo","flatpak install -y flathub org.gnome.TextEditor","flatpak list --app","flatpak uninstall -y org.gnome.TextEditor"],"verify":["flatpak remotes"]},{"title":"Name resolution check","scenario":"Make node1 resolve node2 by name through /etc/hosts, and make sure the files are checked before DNS. Test both names.","hints":[],"steps":["echo '192.168.122.12 node2.lab.example.com node2' >> /etc/hosts","grep ^hosts /etc/nsswitch.conf     # files before dns"],"verify":["getent hosts node2 node2.lab.example.com"]}]},{"day":49,"course":"EX200","title":"Review: shell scripts","objective":"Mixed exam-style practice on script inputs, conditions, loops and command output.","questions":[{"type":"mcq","q":"A script must print an error and stop when no argument is given. Which test fits?","options":["if [ $# -eq 0 ]; then echo \"Usage: $0 arg\" >&2; exit 1; fi","if [ $1 ]; then exit; fi","if [ $# == none ]; then exit 1; fi","test $0 || exit"],"answer":0,"explain":"Send usage messages to stderr with >&2 and exit with a non-zero code."},{"type":"mcq","q":"What does `for f in /etc/*.conf; do echo $f; done` loop over?","options":["Every file in /etc ending in .conf","The contents of each .conf file","The lines of /etc/*.conf","Only the first .conf file"],"answer":0,"explain":"The shell expands the glob before the loop runs."},{"type":"cmd","q":"Inside a script, save today's date in YYYY-MM-DD format into the variable today.","accept":["today=$(date +%F)","today=$(date +%Y-%m-%d)","today=`date +%F`"],"explain":"Use it like `tar -czf /root/backup-$today.tar.gz /etc`."},{"type":"mcq","q":"A script is in /usr/local/bin with mode 644. Running `myscript` gives \"Permission denied\". Why?","options":["It is not executable; run chmod +x (e.g. 755)","/usr/local/bin is not on the PATH","The shebang is wrong","Only root can run scripts"],"answer":0,"explain":"Without the x bit, the shell cannot run it by name."},{"type":"cmd","q":"Loop over the lines of /root/hosts.txt (one host name per line) and ping each once.","accept":["while read h; do ping -c 1 $h; done < /root/hosts.txt","for h in $(cat /root/hosts.txt); do ping -c 1 $h; done","while read h; do ping -c 1 \"$h\"; done < /root/hosts.txt"],"explain":"The while-read form also handles lines with spaces correctly."},{"type":"mcq","q":"What does `$(( 5 + 3 ))` produce?","options":["8","5 + 3","53","An error"],"answer":0,"explain":"Bash arithmetic uses $(( )). Only whole numbers."},{"type":"mcq","q":"What does `2>/dev/null` inside a script do for `find / -name x 2>/dev/null`?","options":["Hides error messages so only real results reach the output","Hides the results","Saves errors to a file named null","Makes find run faster"],"answer":0,"explain":"The results still go to stdout, which you can redirect separately."},{"type":"mcq","q":"How do you check inside a script that a user exists before creating it?","options":["if id \"$u\" &>/dev/null; then ... fi","if [ -u $u ]; then ... fi","if grep $u; then ... fi","if user $u; then ... fi"],"answer":0,"explain":"id exits 0 if the user exists, 1 if not."}],"labs":[{"title":"Report script","scenario":"Write /usr/local/bin/sysreport that prints the hostname, the number of CPUs, total RAM in MiB, the root filesystem use %, and the number of running processes, one per line.","hints":[],"steps":["vim /usr/local/bin/sysreport","# #!/bin/bash","# echo \"Host: $(hostname)\"","# echo \"CPUs: $(nproc)\"","# echo \"RAM MiB: $(free -m | awk '/^Mem:/ {print $2}')\"","# echo \"Root use: $(df --output=pcent / | tail -1 | tr -d ' ')\"","# echo \"Processes: $(ps -e --no-headers | wc -l)\"","chmod 755 /usr/local/bin/sysreport"],"verify":["sysreport"]},{"title":"Script with argument checks","scenario":"Write /usr/local/bin/mkproject that takes a project name. It creates /srv/projects/NAME with subdirectories src, docs and tests. With no argument, print usage and exit 1. If the project exists, print \"exists\" and exit 2.","hints":[],"steps":["vim /usr/local/bin/mkproject","# #!/bin/bash","# [ $# -eq 0 ] && { echo \"Usage: mkproject NAME\" >&2; exit 1; }","# d=/srv/projects/$1","# [ -d \"$d\" ] && { echo \"exists\" >&2; exit 2; }","# mkdir -p \"$d\"/{src,docs,tests} && echo \"created $d\"","chmod 755 /usr/local/bin/mkproject"],"verify":["mkproject; echo $?; mkproject demo; mkproject demo; echo $?"]},{"title":"Loop over files with a condition","scenario":"Write a script that goes through every file in /etc/*.conf and prints the names of those larger than 5 KiB into /root/bigconf.txt.","hints":[],"steps":["vim /root/bigconf.sh","# #!/bin/bash","# > /root/bigconf.txt","# for f in /etc/*.conf; do","#   if [ $(stat -c %s \"$f\") -gt 5120 ]; then echo \"$f\" >> /root/bigconf.txt; fi","# done","bash /root/bigconf.sh"],"verify":["cat /root/bigconf.txt"]},{"title":"Process command output","scenario":"Write a script that lists every user with UID 1000 or higher from /etc/passwd as \"name (uid)\".","hints":[],"steps":["vim /root/listusers.sh","# #!/bin/bash","# while IFS=: read name x uid rest; do","#   [ \"$uid\" -ge 1000 ] && echo \"$name ($uid)\"","# done < /etc/passwd","bash /root/listusers.sh"],"verify":["bash /root/listusers.sh | head"]}]},{"day":50,"course":"EX200","title":"Exam day strategy","objective":"How to work through a full practical exam and not lose marks.","questions":[{"type":"mcq","q":"What should you do in the first few minutes of the exam?","options":["Read every task on both nodes, then start with networking, repos and the root reset","Start the storage tasks right away","Reboot both nodes","Write notes about each task on paper for 30 minutes"],"answer":0,"explain":"Networking and repos are needed by many later tasks."},{"type":"mcq","q":"What is the pass mark for EX200?","options":["210 out of 300","150 out of 300","250 out of 300","70 out of 100"],"answer":0,"explain":"Tasks are graded by what works after a reboot, not by the commands you typed."},{"type":"mcq","q":"Why reboot both nodes before the end of the exam?","options":["To prove every change persists and to catch a broken fstab while you can still fix it","The exam requires it to submit","To clear the logs","To save your work"],"answer":0,"explain":"Leave at least 15 minutes for the final reboot and fixes."},{"type":"mcq","q":"A task is taking too long. What is the best move?","options":["Move on and come back later; every task is worth points","Keep going until it is solved","Reboot and hope","Skip the rest of the exam"],"answer":0,"explain":"One stuck task should not cost you three easy ones."},{"type":"mcq","q":"Which change is the most dangerous to leave untested before a reboot?","options":["/etc/fstab","A cron job","A user account","A firewall rule"],"answer":0,"explain":"Test every fstab change with `systemctl daemon-reload && mount -a` right away."},{"type":"mcq","q":"The task says \"user sarah must not have access to an interactive shell\". Which check proves it?","options":["grep sarah /etc/passwd shows /sbin/nologin as the shell","id sarah","sarah is not in wheel","sarah has no password"],"answer":0,"explain":"Verify every task with a command, not by memory."},{"type":"mcq","q":"What should the SELinux mode be at the end of the exam?","options":["Enforcing, unless a task explicitly says otherwise","Permissive to avoid denials","Disabled","It does not matter"],"answer":0,"explain":"Fix contexts, ports and booleans instead."},{"type":"mcq","q":"Which is a good habit for every task?","options":["Do it, verify it with a command, and note it as done","Do all tasks, then verify at the end only","Only verify storage tasks","Never verify; there is no time"],"answer":0,"explain":"Short verify commands take seconds and catch typos."}],"labs":[{"title":"Exam-day checklist run","scenario":"Take one full practice exam from the Exams tab with the timer on. At the end, reboot both nodes and use each task's verify commands to score yourself honestly.","hints":[],"steps":["# Exams tab, pick an exam, press Start","# work node2 first if it needs a root reset, then networking and repos","# reboot both nodes at the 2 h 30 min mark and verify everything"],"verify":["your score is 210 or more"]},{"title":"Build your own verify script","scenario":"Write /root/verify.sh that prints PASS or FAIL for five checks of your choice (e.g. hostname, SELinux enforcing, a mount, a user, a firewall service). Run it after a reboot.","hints":[],"steps":["vim /root/verify.sh","# #!/bin/bash","# check() { if eval \"$2\" &>/dev/null; then echo \"PASS $1\"; else echo \"FAIL $1\"; fi; }","# check hostname '[ \"$(hostname)\" = node1.lab.example.com ]'","# check selinux '[ \"$(getenforce)\" = Enforcing ]'","# check mount 'findmnt /mnt/data'","# check user 'id natasha'","# check http 'firewall-cmd --list-services | grep -w http'","bash /root/verify.sh"],"verify":["bash /root/verify.sh | grep -c PASS"]},{"title":"Speed round","scenario":"From a fresh snapshot, and within 30 minutes: set the network and hostname, configure the repos, create two users and a group, make an SGID directory, create an LV and mount it at boot, and set the recommended tuned profile.","hints":[],"steps":["# use the earlier days' solutions only if you get stuck"],"verify":["reboot, then verify each item"]}]},{"day":51,"course":"RH134","title":"Advanced LVM: snapshots","objective":"Create, use and merge LVM snapshots to capture and roll back a logical volume.","questions":[{"type":"mcq","q":"What is an LVM snapshot?","options":["A point-in-time copy of a logical volume that only stores changed blocks","A full independent copy of the volume","A backup stored off the disk","A read-only clone that never changes"],"answer":0,"explain":"Snapshots use copy-on-write, so they start tiny and grow as the origin changes."},{"type":"mcq","q":"What happens if a snapshot's allocated space fills up completely?","options":["The snapshot becomes invalid (dropped) and can no longer be used","The origin volume is deleted","The system reboots","Nothing; it auto-extends forever"],"answer":0,"explain":"Size the snapshot for the expected amount of change, or enable auto-extend in lvm.conf."},{"type":"mcq","q":"Which command reverts an origin volume to its snapshot's state?","options":["lvconvert --merge /dev/vg/snap","lvrevert /dev/vg/snap","lvrestore /dev/vg/snap","lvcreate --rollback"],"answer":0,"explain":"If the origin is in use, the merge happens at the next activation/reboot."},{"type":"mcq","q":"In `lvs`, which columns tell you a snapshot's origin and how full it is?","options":["Origin and Data%","Attr and Size only","Move and Log","Meta% and Pool"],"answer":0,"explain":"Watch Data% — at 100% the snapshot is lost."},{"type":"mcq","q":"Why take a snapshot before a risky upgrade or edit?","options":["You can quickly roll the volume back to the pre-change state if it breaks","It speeds up the upgrade","It encrypts the volume","It is required by systemd"],"answer":0,"explain":"Snapshots are a fast local \"undo\" — not a replacement for real backups."},{"type":"mcq","q":"A snapshot is best used as a stable source for:","options":["Taking a consistent backup while the origin keeps changing","Permanent long-term storage","Growing the volume group","Swap space"],"answer":0,"explain":"Back up from the frozen snapshot, then remove it."},{"type":"cmd","q":"Create a 1 GiB snapshot named datasnap of the logical volume /dev/vgdata/lvdata.","accept":["lvcreate -s -n datasnap -L 1G /dev/vgdata/lvdata","lvcreate --snapshot -n datasnap -L 1G /dev/vgdata/lvdata"],"explain":"-s makes it a snapshot; the origin is the last argument."},{"type":"cmd","q":"Show all logical volumes including snapshots, with their origin and usage.","accept":["lvs -a -o +origin,data_percent","lvs -a"],"explain":"`lvs -a` reveals hidden internal volumes; add columns to see snapshot detail."},{"type":"cmd","q":"Merge the snapshot /dev/vgdata/datasnap back into its origin.","accept":["lvconvert --merge /dev/vgdata/datasnap"],"explain":"After merging, the snapshot is automatically removed."}],"labs":[{"title":"Snapshot, break, and roll back (exam-plus)","scenario":"On lvdata (mounted at /mnt/data with a file inside), take a snapshot, deliberately corrupt the data, then roll back using the snapshot and prove the file returned.","hints":[],"steps":["echo \"good version\" > /mnt/data/report.txt","lvcreate -s -n datasnap -L 1G /dev/vgdata/lvdata","echo \"corrupted\" > /mnt/data/report.txt","umount /mnt/data","lvconvert --merge /dev/vgdata/datasnap","mount /dev/vgdata/lvdata /mnt/data"],"verify":["cat /mnt/data/report.txt      # shows \"good version\""]},{"title":"Consistent backup from a snapshot","scenario":"Snapshot lvdata, mount the snapshot read-only, back it up with tar, then remove the snapshot.","hints":[],"steps":["lvcreate -s -n bsnap -L 500M /dev/vgdata/lvdata","mkdir -p /mnt/snap && mount -o ro /dev/vgdata/bsnap /mnt/snap","tar -czf /root/data-backup.tar.gz -C /mnt/snap .","umount /mnt/snap && lvremove -y /dev/vgdata/bsnap"],"verify":["tar -tzf /root/data-backup.tar.gz | head; lvs | grep -c bsnap   # 0 left"]},{"title":"Watch a snapshot fill up","scenario":"Create a small (100 MiB) snapshot, then write more than 100 MiB into the origin and observe the snapshot become invalid.","hints":[],"steps":["lvcreate -s -n tiny -L 100M /dev/vgdata/lvdata","dd if=/dev/zero of=/mnt/data/bigfile bs=1M count=200","lvs -a -o +data_percent      # tiny shows 100% then goes invalid","rm /mnt/data/bigfile"],"verify":["lvs shows the snapshot invalidated (Attr has an 'I'); you understand sizing"]}]},{"day":52,"course":"RH134","title":"Advanced LVM: thin, striped and RAID volumes","objective":"Build thin-provisioned, striped and mirrored/RAID logical volumes.","questions":[{"type":"mcq","q":"What is thin provisioning in LVM?","options":["Logical volumes can present more space than is physically allocated, using a shared thin pool","Volumes that are always exactly their physical size","A way to compress data","A read-only volume type"],"answer":0,"explain":"Space is consumed from the pool only as data is written."},{"type":"mcq","q":"What is the main risk of thin provisioning?","options":["Over-provisioning: if the pool fills, writes to any thin volume fail","It is slower to read","It cannot be snapshotted","It uses more disk immediately"],"answer":0,"explain":"Monitor the pool's Data% and Meta% and extend before it fills."},{"type":"mcq","q":"A striped logical volume (`--type striped -i 2`) improves:","options":["Performance, by spreading I/O across multiple physical volumes","Redundancy against disk failure","Encryption","Snapshot speed"],"answer":0,"explain":"Striping has no redundancy; losing one PV loses the volume."},{"type":"mcq","q":"Which LVM RAID type gives mirroring (redundancy) across two devices?","options":["raid1","raid0","striped","linear"],"answer":0,"explain":"raid1 keeps a full copy on each leg; it survives one device failing."},{"type":"mcq","q":"In `lvcreate --type raid5 -i 3`, what does -i specify?","options":["The number of data stripes (RAID 5 also adds one parity's worth of space)","The number of mirrors","The extent size","The snapshot size"],"answer":0,"explain":"RAID 5 needs at least 3 devices and tolerates one failure."},{"type":"mcq","q":"Which command shows the underlying devices and segment type of LVs?","options":["lvs -a -o +devices,segtype","pvscan","vgck","lvchange -a"],"answer":0,"explain":"It reveals which PVs each stripe/leg sits on."},{"type":"cmd","q":"Create a 1 GiB thin pool named tpool in volume group vgdata.","accept":["lvcreate --type thin-pool -L 1G -n tpool vgdata","lvcreate -L 1G -T vgdata/tpool"],"explain":"-T (or --type thin-pool) builds the pool that thin volumes draw from."},{"type":"cmd","q":"Create a 5 GiB thin volume named tvol from the thin pool vgdata/tpool.","accept":["lvcreate -V 5G -T vgdata/tpool -n tvol","lvcreate --virtualsize 5G --thin vgdata/tpool -n tvol"],"explain":"-V is the virtual size, which may exceed the pool's real size."},{"type":"cmd","q":"Create a striped LV named fast across 2 PVs, 1 GiB total, 64 KiB stripe size.","accept":["lvcreate --type striped -i 2 -I 64 -L 1G -n fast vgdata"],"explain":"-i = number of stripes (PVs), -I = stripe size in KiB."},{"type":"cmd","q":"Create a mirrored (raid1) LV named safe of 500 MiB in vgdata.","accept":["lvcreate --type raid1 -m 1 -L 500M -n safe vgdata"],"explain":"-m 1 means one mirror copy (two legs total)."}],"labs":[{"title":"Thin provisioning end to end","scenario":"In vgdata create a 1 GiB thin pool, a 4 GiB thin volume, format and mount it, and watch pool usage grow as you write.","hints":[],"steps":["lvcreate --type thin-pool -L 1G -n tpool vgdata","lvcreate -V 4G -T vgdata/tpool -n tvol","mkfs.xfs /dev/vgdata/tvol && mkdir -p /mnt/thin && mount /dev/vgdata/tvol /mnt/thin","dd if=/dev/zero of=/mnt/thin/f1 bs=1M count=300","lvs vgdata      # tpool Data% climbs toward 300 MiB used"],"verify":["df -h /mnt/thin shows 4G; lvs shows the pool is only partly used"]},{"title":"Build and inspect a RAID1 volume","scenario":"Create a raid1 LV across two PVs, format and mount it, then show its legs and sync status.","hints":[],"steps":["lvcreate --type raid1 -m 1 -L 500M -n safe vgdata","lvs -a -o +devices,segtype,sync_percent vgdata","mkfs.ext4 /dev/vgdata/safe && mkdir -p /mnt/safe && mount /dev/vgdata/safe /mnt/safe"],"verify":["lvs -a shows two rimage/rmeta legs and 100% sync"]},{"title":"Extend a thin pool before it fills","scenario":"Simulate a nearly full thin pool and extend the pool (not just the volume) to avoid write failures.","hints":[],"steps":["lvs vgdata      # note tpool Data%","lvextend -L +1G vgdata/tpool","lvs vgdata      # Data% drops as capacity grows"],"verify":["the pool has more free space and thin volumes keep working"]},{"title":"Compare striped vs linear (concept + build)","scenario":"Create one linear and one striped LV of the same size and explain when you would choose each.","hints":[],"steps":["lvcreate -L 500M -n lin vgdata","lvcreate --type striped -i 2 -I 64 -L 500M -n strp vgdata","lvs -a -o +segtype,devices vgdata"],"verify":["# linear = simple/flexible; striped = faster I/O, no redundancy"]}]},{"day":53,"course":"RH134","title":"Advanced storage: Stratis, VDO and recovery","objective":"Use Stratis pools, LVM-VDO dedup/compression, and recover LVM metadata.","questions":[{"type":"mcq","q":"What is Stratis?","options":["A local storage-management layer that builds pools and thin XFS filesystems on top of LVM/device-mapper","A network filesystem","A backup tool","A RAID controller"],"answer":0,"explain":"You manage it with the `stratis` command and the stratisd service."},{"type":"mcq","q":"How do you make a Stratis filesystem mount at boot in /etc/fstab?","options":["Add the x-systemd.requires=stratisd.service mount option","Use the noauto option","Nothing special is needed","Use _netdev"],"answer":0,"explain":"The device is not ready until stratisd runs, so the mount must wait for it."},{"type":"mc
