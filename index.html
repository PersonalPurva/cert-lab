<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux Cert Lab</title>
<meta name="description" content="Practice hub for RHCSA, Pentest+ and Security+ — daily questions, quizzes and hands-on labs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: single reading column; sticky header with course + mode tabs; terminal-styled cards. */
:root{
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#f4f2ee; --surface:#ffffff; --surface2:#faf8f4;
  --fg:#1c1a17; --muted:#6b6459; --faint:#938b7d;
  --border:#e0dbd1; --border2:#cfc8ba;
  --accent:#0f7a52; --accent-weak:#e2f2ea; --accent-ink:#0a5a3c;
  --good:#0f7a52; --good-weak:#e2f2ea;
  --bad:#c0392b; --bad-weak:#fbe9e7;
  --warn:#a86a12; --warn-weak:#fbefda;
  --term-bg:#1d2b26; --term-fg:#cfe8dd; --term-comment:#7fa394; --term-prompt:#5dd6a0;
  --shadow:0 1px 2px rgba(28,26,23,.06),0 4px 16px rgba(28,26,23,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130f; --surface:#1c1b17; --surface2:#211f1a;
  --fg:#ece7dd; --muted:#a49c8d; --faint:#7c7466;
  --border:#302d26; --border2:#403c33;
  --accent:#4ecb91; --accent-weak:#12271e; --accent-ink:#7fe0af;
  --good:#4ecb91; --good-weak:#12271e;
  --bad:#e8776a; --bad-weak:#2c1613;
  --warn:#d9a441; --warn-weak:#2a2010;
  --term-bg:#10201a; --term-fg:#cfe8dd; --term-comment:#6f9384; --term-prompt:#5dd6a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14130f; --surface:#1c1b17; --surface2:#211f1a;
  --fg:#ece7dd; --muted:#a49c8d; --faint:#7c7466;
  --border:#302d26; --border2:#403c33;
  --accent:#4ecb91; --accent-weak:#12271e; --accent-ink:#7fe0af;
  --good:#4ecb91; --good-weak:#12271e;
  --bad:#e8776a; --bad-weak:#2c1613;
  --warn:#d9a441; --warn-weak:#2a2010;
  --term-bg:#10201a; --term-fg:#cfe8dd; --term-comment:#6f9384; --term-prompt:#5dd6a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;
  font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
a{color:var(--accent-ink)}
h1,h2,h3{text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
code{font-family:var(--mono)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);
  border-bottom:1px solid var(--border);margin-bottom:18px}
.hrow{max-width:780px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.3px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.spacer{flex:1}
.selwrap{position:relative}
select.course{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--fg);
  background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:7px 30px 7px 11px;
  appearance:none;cursor:pointer;max-width:60vw}
.selwrap::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);
  color:var(--faint);pointer-events:none;font-size:11px}
.iconbtn{background:var(--surface);border:1px solid var(--border2);border-radius:8px;width:34px;height:34px;
  display:grid;place-items:center;color:var(--muted);font-size:15px;line-height:1}
.iconbtn:hover{color:var(--fg);border-color:var(--faint)}
.tabs{max-width:780px;margin:0 auto;padding:10px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:none;background:none;color:var(--muted);font-weight:600;font-size:13.5px;
  padding:8px 12px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}

/* generic card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--muted);background:var(--surface2)}
.pill.rh124{color:#b6512f;border-color:#e7c3b3;background:#fbeee7}
.pill.rh134{color:#2f6fb6;border-color:#b3cce7;background:#e7f0fb}
.pill.ex200{color:var(--accent-ink);border-color:var(--border2);background:var(--accent-weak)}
.pill.dom{color:var(--accent-ink);border-color:var(--border2);background:var(--accent-weak)}
.pill.dom.d2{color:#a15a1f;background:#fbeee2;border-color:#e8cdb0}
.pill.dom.d4{color:#8a3ea8;background:#f4e9fb;border-color:#ddc4ec}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.dom.d2{color:#e0a877;background:#2a1d10;border-color:#4a331c}
:root:not([data-theme="light"]) .pill.dom.d4{color:#cfa0e6;background:#211430;border-color:#3d2851}}
:root[data-theme="dark"] .pill.dom.d2{color:#e0a877;background:#2a1d10;border-color:#4a331c}
:root[data-theme="dark"] .pill.dom.d4{color:#cfa0e6;background:#211430;border-color:#3d2851}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.rh124{color:#e8a084;background:#2a1712;border-color:#4a2c20}
:root:not([data-theme="light"]) .pill.rh134{color:#8fbdf0;background:#121f2e;border-color:#26405c}}
:root[data-theme="dark"] .pill.rh124{color:#e8a084;background:#2a1712;border-color:#4a2c20}
:root[data-theme="dark"] .pill.rh134{color:#8fbdf0;background:#121f2e;border-color:#26405c}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border2);
  background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#08130d}}
:root[data-theme="dark"] .btn.primary{color:#08130d}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* terminal block */
.term{background:var(--term-bg);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;
  color:var(--term-fg);overflow-x:auto;line-height:1.7;white-space:pre;-webkit-overflow-scrolling:touch}
.term .cmt{color:var(--term-comment)}
.term .pr{color:var(--term-prompt);user-select:none}
.termcap{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0 0 6px;display:flex;gap:6px;align-items:center}

/* progress ring */
.ring{--p:0;width:44px;height:44px;border-radius:50%;flex:none;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--border) 0);
  display:grid;place-items:center}
.ring::before{content:"";width:34px;height:34px;border-radius:50%;background:var(--surface)}
.ring span{position:absolute;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-1px;line-height:1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:5px}

/* day grid */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daycard{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;
  display:flex;gap:11px;align-items:center;color:inherit}
.daycard:hover{border-color:var(--faint);box-shadow:var(--shadow)}
.daycard .dn{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600}
.daycard .dt{font-size:13px;font-weight:600;margin-top:2px;line-height:1.3}
.daycard.done{background:var(--accent-weak);border-color:var(--border2)}

/* question */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qtext{font-size:17px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--border2);border-radius:11px;padding:12px 14px;color:inherit;font-size:14.5px}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--faint);flex:none}
.opt.correct{border-color:var(--good);background:var(--good-weak)}
.opt.correct .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-weak)}
.opt.wrong .k{color:var(--bad)}
.opt:disabled{cursor:default}
.cmdin{width:100%;font-family:var(--mono);font-size:14px;padding:12px 14px;border-radius:11px;
  border:1.5px solid var(--border2);background:var(--surface2);color:var(--fg);margin-top:16px}
.cmdin:focus{outline:none;border-color:var(--accent)}
.cmdin.correct{border-color:var(--good);background:var(--good-weak)}
.cmdin.wrong{border-color:var(--bad);background:var(--bad-weak)}
.explain{margin-top:16px;border-left:3px solid var(--accent);background:var(--surface2);
  border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px}
.explain code{background:var(--accent-weak);padding:1px 5px;border-radius:5px;font-size:12.5px}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;font-family:var(--mono)}
.verdict.g{color:var(--good)} .verdict.b{color:var(--bad)}
.accepts{margin-top:10px;font-size:12.5px}
.accepts .a{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:4px 8px;margin:3px 4px 0 0;display:inline-block;color:var(--muted)}
.progbar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin:2px 0 0}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* labs */
.lab{margin-top:12px}
.lab .scenario{font-size:15px;line-height:1.55}
details.disc{margin-top:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
details.disc>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:13.5px;
  display:flex;align-items:center;gap:8px;color:var(--muted)}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
details.disc[open]>summary .chev{transform:rotate(90deg)}
details.disc[open]>summary{color:var(--fg);border-bottom:1px solid var(--border)}
details.disc .body{padding:6px 14px 14px}
.hintline{font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--border);color:var(--muted)}
.hintline:last-child{border:none}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;font-family:var(--mono)}
.check input{margin-top:3px;accent-color:var(--accent);flex:none}

/* daily / hero */
.hero{background:linear-gradient(150deg,var(--surface),var(--surface2));border:1px solid var(--border);
  border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.streakrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.flame{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-1px;color:var(--accent);line-height:1}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:12.5px;padding:9px 15px;
  border-radius:999px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
.sync{font-family:var(--mono);font-size:10.5px;color:var(--faint);display:inline-flex;align-items:center;gap:5px}
.sync .d{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.on .d{background:var(--good)}
.sync.local .d{background:var(--warn)}

.empty{text-align:center;color:var(--muted);padding:40px 16px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:15px;font-family:var(--mono);letter-spacing:-.2px}
hr.sep{border:none;border-top:1px solid var(--border);margin:22px 0}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.stat .n{font-size:20px}}
</style>

</head>
<body>
<header class="top">
  <div class="hrow">
    <div class="brand"><span class="dot"></span>Linux&nbsp;Cert&nbsp;Lab</div>
    <div class="spacer"></div>
    <div class="selwrap"><select class="course" id="courseSel"></select></div>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script id="course-data" type="application/json">{"courses":[{"id":"rhcsa","name":"RHCSA (EX200)","exam":"Red Hat Certified System Administrator · RHEL 10","short":"RHCSA","days":[{"day":1,"course":"RH124","title":"Shell basics and getting help","objective":"Access shell prompts, issue commands with correct syntax, and find answers in man, info and /usr/share/doc.","questions":[{"type":"mcq","q":"In the prompt `[student@servera ~]$`, what does the final `$` tell you?","options":["You are logged in as a regular (non-root) user","You are logged in as root","A command is still running in the background","SELinux is in enforcing mode"],"answer":0,"explain":"A `$` prompt means a normal user; `#` means root. Always glance at it before running admin commands."},{"type":"mcq","q":"Which command searches the short descriptions of all man pages for a keyword?","options":["man -k keyword","man -f keyword","info -s keyword","help keyword"],"answer":0,"explain":"`man -k` is the same as `apropos`. If it returns \"nothing appropriate\", build the index as root with `mandb`."},{"type":"mcq","q":"Which man section documents configuration file formats such as /etc/fstab?","options":["Section 5","Section 1","Section 8","Section 3"],"answer":0,"explain":"Section 1 = user commands, 5 = file formats, 8 = admin commands. Use `man 5 fstab`."},{"type":"cmd","q":"Open the manual page for the /etc/passwd file format (not the passwd command).","accept":["man 5 passwd"],"explain":"Without the section number, `man passwd` opens section 1, the command."},{"type":"mcq","q":"Where do packages usually install extra documentation such as example config files?","options":["/usr/share/doc","/etc/doc","/var/doc","/opt/doc"],"answer":0,"explain":"Look in `/usr/share/doc/<package>` for READMEs and examples. It is available during the exam."},{"type":"mcq","q":"Which keyboard shortcut searches backwards through your bash command history?","options":["Ctrl+R","Ctrl+H","Ctrl+B","Ctrl+L"],"answer":0,"explain":"Press Ctrl+R, type part of an old command, press Ctrl+R again to go further back, Enter to run it."},{"type":"cmd","q":"Show only the last 20 commands from your history.","accept":["history 20"],"explain":"`history` alone shows everything; `!N` reruns entry number N."},{"type":"mcq","q":"What does `!!` do in bash?","options":["Runs the previous command again","Repeats the last argument of the previous command","Inverts the exit code of the last command","Opens the history file in an editor"],"answer":0,"explain":"`!!` is the whole last command (handy as `sudo !!`). `!$` is only the last argument."},{"type":"cmd","q":"Find out whether `cd` is a shell builtin, an alias, or a program on disk.","accept":["type cd"],"explain":"`type` reports how bash resolves a name. Builtins have no separate man page; use `help cd`."},{"type":"mcq","q":"Inside a man page, how do you search forward for the word \"UID\"?","options":["Type /UID and press Enter, then n for the next match","Press Ctrl+F and type UID","Type :find UID","Press s and type UID"],"answer":0,"explain":"man uses the `less` pager: `/pattern` searches forward, `n` next match, `N` previous, `q` quit."}],"labs":[{"title":"Find answers only with the built-in documentation","scenario":"Without using the internet, find out: (1) which man section documents /etc/shadow, (2) which useradd option sets a specific UID, and (3) which commands have \"partition\" in their description.","hints":["`man -f name` lists every section that has a page with that name.","If `man -k` finds nothing, the index has not been built yet."],"steps":["man -f shadow","man 5 shadow","man useradd        # then type /UID and press n","man -k partition","sudo mandb         # only if man -k printed \"nothing appropriate\""],"verify":["man -k partition | head"]},{"title":"Practise history and shell shortcuts","scenario":"Run five different commands. Rerun the third one by its history number, reuse the last argument of a command with `!$`, find an old command with Ctrl+R, then save your whole history to ~/myhistory.txt.","hints":[],"steps":["history","!3","ls -ld /etc/ssh","cd !$","history > ~/myhistory.txt"],"verify":["tail ~/myhistory.txt"]}]},{"day":2,"course":"RH124","title":"Managing files and directories","objective":"Create, delete, copy and move files and directories; understand the filesystem hierarchy.","questions":[{"type":"mcq","q":"Where are system-wide configuration files kept on RHEL?","options":["/etc","/usr","/var","/opt"],"answer":0,"explain":"`/etc` holds configuration. `/usr` holds installed software, `/var` holds variable data such as logs."},{"type":"mcq","q":"Which directory holds data that changes while the system runs, such as logs, spools and caches?","options":["/var","/etc","/boot","/srv"],"answer":0,"explain":"Logs live in `/var/log`, for example `/var/log/messages` and `/var/log/secure`."},{"type":"mcq","q":"Which of these paths is absolute?","options":["/home/student/docs","../student/docs","./docs","docs/report.txt"],"answer":0,"explain":"An absolute path starts with `/` and works from any current directory."},{"type":"cmd","q":"Create the directory tree a/b/c in one command, creating missing parents.","accept":["mkdir -p a/b/c"],"explain":"Without `-p`, mkdir fails if `a` or `a/b` doesn't exist."},{"type":"cmd","q":"Copy the directory /etc/skel and everything inside it to /tmp/skelcopy.","accept":["cp -r /etc/skel /tmp/skelcopy","cp -R /etc/skel /tmp/skelcopy","cp -a /etc/skel /tmp/skelcopy"],"explain":"Directories need `-r`. `-a` (archive) also keeps permissions, ownership and timestamps."},{"type":"mcq","q":"What is the difference between `rmdir dir` and `rm -r dir`?","options":["rmdir only removes empty directories; rm -r removes the directory and its contents","rmdir asks for confirmation; rm -r never deletes hidden files","They are identical","rm -r only works as root"],"answer":0,"explain":"Use `rmdir` when you want a safety check that a directory is empty."},{"type":"mcq","q":"Which files does the glob `file?.txt` match?","options":["file1.txt and fileA.txt, but not file10.txt","file1.txt and file10.txt","Every file starting with \"file\"","Only a file literally named file?.txt"],"answer":0,"explain":"`?` matches exactly one character, `*` matches any number, `[abc]` matches one of a set."},{"type":"cmd","q":"Create report1.txt through report5.txt with a single touch command.","accept":["touch report{1..5}.txt"],"explain":"Brace expansion `{1..5}` expands to 1 2 3 4 5 before the command runs."},{"type":"mcq","q":"As a regular user with no aliases, what happens with `mv a.txt b.txt` when b.txt already exists?","options":["b.txt is overwritten without any prompt","mv refuses and prints an error","mv renames a.txt to b.txt.1","mv asks for confirmation"],"answer":0,"explain":"Use `mv -i` to be asked first. On RHEL, root has aliases `rm -i`, `cp -i` and `mv -i` set in /root/.bashrc."},{"type":"cmd","q":"Go back to the directory you were in just before the current one.","accept":["cd -"],"explain":"`cd -` toggles between your last two directories. `cd` alone goes home."}],"labs":[{"title":"File management workout","scenario":"As student, build ~/lab2 with subdirectories projects, archive and trash. Create notes1.txt to notes3.txt inside projects. Copy notes1.txt into archive, rename notes2.txt to draft.txt, move notes3.txt into trash, then delete the trash directory with everything in it.","hints":["Brace expansion saves typing for both mkdir and touch."],"steps":["mkdir -p ~/lab2/{projects,archive,trash}","touch ~/lab2/projects/notes{1..3}.txt","cp ~/lab2/projects/notes1.txt ~/lab2/archive/","mv ~/lab2/projects/notes2.txt ~/lab2/projects/draft.txt","mv ~/lab2/projects/notes3.txt ~/lab2/trash/","rm -r ~/lab2/trash"],"verify":["ls -R ~/lab2"]},{"title":"Tour the filesystem hierarchy","scenario":"Find where these live on your RHEL VM and note them down: the SSH server config file, the kernel image, the `ls` binary, the system log file, and the home directory of root.","hints":[],"steps":["ls /etc/ssh/","ls /boot/vmlinuz-*","which ls","ls -l /var/log/messages","echo ~root"],"verify":["ls -ld /etc/ssh /boot /usr/bin /var/log /root"]}]},{"day":3,"course":"RH124","title":"Links and finding files","objective":"Create hard and soft links, and locate files with find.","questions":[{"type":"mcq","q":"What is true about a hard link?","options":["It points to the same inode as the original file","It stores the path of the original file","It breaks when the original file is deleted","It can point to a directory"],"answer":0,"explain":"Hard links are extra names for the same inode. The data stays until the last name is removed."},{"type":"mcq","q":"What happens to a symbolic link when its target file is deleted?","options":["The link remains but is broken (dangling)","The link is deleted automatically","The link keeps a copy of the data","The link now points to /dev/null"],"answer":0,"explain":"A soft link stores a path. If nothing exists at that path, the link is broken. `ls -l` shows it in red."},{"type":"mcq","q":"Which of these can a hard link NOT do?","options":["Point to a directory or to a file on another filesystem","Point to a file in the same directory","Share the same inode as the original","Survive deleting the original name"],"answer":0,"explain":"Soft links can cross filesystems and point to directories; hard links cannot."},{"type":"cmd","q":"Create a symbolic link /root/hosts-link that points to /etc/hosts.","accept":["ln -s /etc/hosts /root/hosts-link"],"explain":"Order: `ln -s TARGET LINKNAME`. Leave out `-s` to make a hard link."},{"type":"cmd","q":"Find every file on the system owned by user natasha, hiding \"Permission denied\" errors.","accept":["find / -user natasha 2>/dev/null","find / -user natasha -type f 2>/dev/null"],"explain":"`2>/dev/null` discards error messages from directories you cannot read."},{"type":"mcq","q":"Which find test matches files larger than 100 MiB?","options":["-size +100M","-size 100M+","-bigger 100M","-size >100M"],"answer":0,"explain":"`+` means more than, `-` means less than. Units: k, M, G."},{"type":"cmd","q":"Find files under /etc that were modified in the last 2 days.","accept":["find /etc -mtime -2","find /etc -type f -mtime -2"],"explain":"`-mtime -2` = less than 2 days ago. Use `-mmin` for minutes."},{"type":"mcq","q":"In `find / -user harry -exec cp -a {} /root/harry/ \\;` what does `{}` stand for?","options":["Each path that find matched","The current directory","The user's home directory","The previous command's output"],"answer":0,"explain":"`\\;` ends the -exec command. find runs it once for every match, putting the path in place of `{}`."},{"type":"mcq","q":"What does the second column of `ls -l` output show for a file?","options":["The number of hard links to it","The inode number","The file size in blocks","The number of users who opened it"],"answer":0,"explain":"`ls -i` shows the inode number. A link count of 2 on a file means one extra hard link exists."},{"type":"cmd","q":"Find every file under /usr that has the SUID bit set.","accept":["find /usr -perm -4000","find /usr -perm -u+s","find /usr -type f -perm -4000","find /usr -perm /4000"],"explain":"`-perm -4000` means \"at least these bits\". `ls -l` shows SUID as an `s` in the owner execute slot."}],"labs":[{"title":"Hard links vs soft links","scenario":"In ~/linklab create original.txt containing \"version 1\". Make a hard link hard.txt and a soft link soft.txt. Compare inode numbers, delete original.txt, and see which link still shows the content.","hints":[],"steps":["mkdir ~/linklab && cd ~/linklab","echo \"version 1\" > original.txt","ln original.txt hard.txt","ln -s original.txt soft.txt","ls -li","rm original.txt","cat hard.txt       # still works","cat soft.txt       # No such file or directory"],"verify":["ls -li ~/linklab"]},{"title":"Find a user's files and copy them (exam classic)","scenario":"Create user harry and give him a few files in /tmp and his home. Then, as root, find every regular file owned by harry and copy it into /root/harryfiles, keeping permissions.","hints":["Create the destination directory before running find."],"steps":["useradd harry","sudo -u harry touch /tmp/harry1 /home/harry/notes","mkdir -p /root/harryfiles","find / -user harry -type f -exec cp -a {} /root/harryfiles/ \\; 2>/dev/null"],"verify":["ls -l /root/harryfiles"]}]},{"day":4,"course":"RH124","title":"Redirection and pipes","objective":"Use input-output redirection (>, >>, ","questions":[{"type":"mcq","q":"What does `2>` redirect?","options":["Standard error","Standard output","Standard input","Both output streams"],"answer":0,"explain":"File descriptors: 0 = stdin, 1 = stdout, 2 = stderr."},{"type":"mcq","q":"What does `command > out.txt 2>&1` do?","options":["Sends both standard output and standard error to out.txt","Sends only errors to out.txt","Appends to out.txt","Sends output to out.txt and errors to a file called 1"],"answer":0,"explain":"`2>&1` means \"send stderr to wherever stdout goes now\". The order matters."},{"type":"mcq","q":"With `command 2>&1 > file`, where do the errors go?","options":["To the terminal","To file","To /dev/null","Nowhere; bash reports a syntax error"],"answer":0,"explain":"Redirections are processed left to right. At the time of `2>&1`, stdout still pointed at the terminal."},{"type":"cmd","q":"Append the line \"hello\" to notes.txt without overwriting it.","accept":["echo hello >> notes.txt","echo \"hello\" >> notes.txt","echo 'hello' >> notes.txt"],"explain":"`>` truncates the file first. `>>` appends."},{"type":"cmd","q":"Search the whole filesystem for files named passwd, throwing away all error messages.","accept":["find / -name passwd 2>/dev/null"],"explain":"/dev/null discards everything written to it."},{"type":"mcq","q":"What does `tee` do?","options":["Copies its input to a file and to standard output at the same time","Splits a file into two parts","Joins two files side by side","Redirects errors to a file"],"answer":0,"explain":"Example: `ls -l | tee list.txt | wc -l` saves the listing and still counts it."},{"type":"cmd","q":"Save the output of `ls -l /etc` to /root/etc.txt and also show it on the screen.","accept":["ls -l /etc | tee /root/etc.txt"],"explain":"Use `tee -a` to append instead of overwrite."},{"type":"mcq","q":"In bash, what does `&> file` do?","options":["Redirects both stdout and stderr to file","Runs the command in the background and writes to file","Redirects only stderr to file","Appends stdout to file"],"answer":0,"explain":"`&> file` is short for `> file 2>&1`. Use `&>> file` to append both."},{"type":"mcq","q":"What does the pipe `|` connect?","options":["The stdout of the left command to the stdin of the right command","The stderr of the left command to the right command","Two files into one","The exit code of the left command to the right command"],"answer":0,"explain":"Errors are not piped unless you add `2>&1` first (or use `|&`)."},{"type":"cmd","q":"Count the number of lines in /etc/passwd.","accept":["wc -l /etc/passwd","wc -l < /etc/passwd","cat /etc/passwd | wc -l"],"explain":"Each line in /etc/passwd is one account, so this also counts accounts."}],"labs":[{"title":"Redirection practice","scenario":"Run `ls /etc /nonexistent` four ways: output only to ok.txt, errors only to err.txt, both to all.txt, and append a second run to all.txt. Check each file after every step.","hints":[],"steps":["cd ~ && ls /etc /nonexistent > ok.txt","ls /etc /nonexistent 2> err.txt","ls /etc /nonexistent &> all.txt","ls /etc /nonexistent >> all.txt 2>&1"],"verify":["wc -l ok.txt err.txt all.txt"]},{"title":"Build a pipeline","scenario":"Show the 5 largest files in /usr/bin with their sizes in human-readable form and save that list to /root/biggest.txt while also printing it.","hints":["`ls -lS` sorts by size, largest first."],"steps":["ls -lhS /usr/bin | head -n 6 | tee /root/biggest.txt","# head -n 6 because the first line of ls -l is the \"total\" line"],"verify":["cat /root/biggest.txt"]}]},{"day":5,"course":"RH124","title":"Editing and viewing text files","objective":"Create and edit text files with vim; read files with cat, less, head and tail.","questions":[{"type":"mcq","q":"In vim, how do you save the file and quit?","options":["Press Esc, then type :wq and Enter","Press Ctrl+S then Ctrl+Q","Type :q and Enter","Press Esc then type :x! twice"],"answer":0,"explain":"`:wq` writes and quits. `:x` or `ZZ` do the same but only write if the file changed."},{"type":"mcq","q":"In vim, how do you quit without saving your changes?","options":[":q!",":wq!",":exit","Ctrl+C"],"answer":0,"explain":"The `!` forces vim to discard changes."},{"type":"mcq","q":"In vim normal (command) mode, what does `dd` do?","options":["Deletes (cuts) the current line","Duplicates the current line","Deletes the whole file","Moves down two lines"],"answer":0,"explain":"`yy` copies a line, `p` pastes below, `u` undoes, `Ctrl+R` redoes."},{"type":"mcq","q":"Which vim keys jump to the last line and to the first line of the file?","options":["G for the last line, gg for the first","End and Home",":$ for the first line, :0 for the last","L and H"],"answer":0,"explain":"`:25` or `25G` jumps to line 25. `:set nu` shows line numbers."},{"type":"mcq","q":"How do you replace every \"foo\" with \"bar\" in the whole file in vim?","options":[":%s/foo/bar/g",":s/foo/bar",":replace foo bar","/foo/bar/g"],"answer":0,"explain":"`%` means every line, `g` means every match on each line. Add `c` to confirm each one."},{"type":"cmd","q":"Show only the first 5 lines of /etc/passwd.","accept":["head -n 5 /etc/passwd","head -5 /etc/passwd"],"explain":"`tail -n 5` shows the last 5 lines."},{"type":"cmd","q":"Watch /var/log/messages live as new lines are written to it.","accept":["tail -f /var/log/messages","sudo tail -f /var/log/messages"],"explain":"Stop following with Ctrl+C. `journalctl -f` does the same for the journal."},{"type":"mcq","q":"Which command opens an interactive vim lesson you can practise on?","options":["vimtutor","vim --help","man vim","vim -t"],"answer":0,"explain":"Doing `vimtutor` once takes about 30 minutes and covers everything needed for the exam."},{"type":"cmd","q":"Open /etc/services one screen at a time so you can scroll up and down and search.","accept":["less /etc/services"],"explain":"In `less`: Space = next page, b = back, /word = search, q = quit."},{"type":"mcq","q":"In vim, which key enters insert mode before the cursor, and which opens a new line below?","options":["i inserts before the cursor; o opens a new line below","a inserts before the cursor; O opens a line below","I inserts at the cursor; n opens a line below","Insert key only; there is no key for a new line"],"answer":0,"explain":"`a` appends after the cursor, `A` at the end of the line, `O` opens a line above."}],"labs":[{"title":"vim speed drill","scenario":"Copy /etc/services to ~/services.txt and open it in vim. Show line numbers, jump to line 100, delete 3 lines, go to the end of the file, add a line \"# edited by me\", replace every \"tcp\" with \"TCP\", then save and quit.","hints":[],"steps":["cp /etc/services ~/services.txt","vim ~/services.txt","# :set nu   ->  :100  ->  3dd  ->  G  ->  o  type the text  ->  Esc","# :%s/tcp/TCP/g   ->  :wq"],"verify":["tail -n 2 ~/services.txt","grep -c TCP ~/services.txt"]},{"title":"Read logs efficiently","scenario":"As root, show the first 10 and last 10 lines of /var/log/secure, open it in less and search for \"session opened\", then follow it live while you log in from a second terminal.","hints":[],"steps":["head /var/log/secure","tail /var/log/secure","less /var/log/secure      # then /session opened","tail -f /var/log/secure   # in another terminal: ssh student@localhost"],"verify":["grep -c 'session opened' /var/log/secure"]}]},{"day":6,"course":"RH124","title":"grep and regular expressions","objective":"Use grep and regular expressions to analyze text.","questions":[{"type":"cmd","q":"Show the lines of /etc/passwd that start with \"root\".","accept":["grep '^root' /etc/passwd","grep ^root /etc/passwd","grep \"^root\" /etc/passwd"],"explain":"`^` anchors the match to the start of the line."},{"type":"mcq","q":"Which regular expression matches lines that end with \"bash\"?","options":["bash$","^bash","bash^","$bash"],"answer":0,"explain":"`$` anchors to the end of the line. `^$` matches an empty line."},{"type":"mcq","q":"In a basic regular expression, what does `.` match?","options":["Any single character","A literal dot only","Zero or more characters","The end of the line"],"answer":0,"explain":"Escape it as `\\.` to match a real dot, for example `grep '\\.conf$'`."},{"type":"cmd","q":"Show all lines in /etc/ssh/sshd_config that are neither comments nor empty lines.","accept":["grep -v '^#' /etc/ssh/sshd_config | grep -v '^$'","grep -Ev '^(#|$)' /etc/ssh/sshd_config","grep -vE '^#|^$' /etc/ssh/sshd_config","grep -Ev '^#|^$' /etc/ssh/sshd_config"],"explain":"This is the quickest way to see what a config file really sets."},{"type":"mcq","q":"What does `grep -E 'cat|dog' file` print?","options":["Lines containing cat or dog","Lines containing cat followed by dog","Only the words cat and dog","Lines that contain neither word"],"answer":0,"explain":"`-E` turns on extended regex so `|`, `+`, `?` and `{n}` work without backslashes."},{"type":"cmd","q":"Count how many lines in /etc/passwd contain \"nologin\".","accept":["grep -c nologin /etc/passwd","grep -c 'nologin' /etc/passwd"],"explain":"`-c` prints a count instead of the lines."},{"type":"mcq","q":"What does `grep -w root` do differently from `grep root`?","options":["It only matches \"root\" as a whole word","It matches case-insensitively","It prints the word count","It searches recursively"],"answer":0,"explain":"With `-w`, \"rootkit\" and \"chroot\" no longer match."},{"type":"cmd","q":"Search every file under /etc for \"PermitRootLogin\" and show file names with line numbers.","accept":["grep -rn PermitRootLogin /etc","grep -rn 'PermitRootLogin' /etc","grep -nr PermitRootLogin /etc"],"explain":"`-r` recursive, `-n` line numbers, `-i` ignore case, `-l` file names only."},{"type":"mcq","q":"An exam task says: \"Save all lines containing ssh from /etc/services to /root/ssh.txt, in their original order.\" Which is correct?","options":["grep ssh /etc/services > /root/ssh.txt","grep ssh /etc/services | sort > /root/ssh.txt","grep -c ssh /etc/services > /root/ssh.txt","cat /etc/services | grep -v ssh > /root/ssh.txt"],"answer":0,"explain":"Don't sort or change the output unless the task asks. Check with `cat /root/ssh.txt`."},{"type":"mcq","q":"Which grep option makes the match case-insensitive?","options":["-i","-c","-v","-s"],"answer":0,"explain":"`grep -i error` matches Error, ERROR and error."}],"labs":[{"title":"Text hunting with grep","scenario":"Using /etc/passwd: list users whose shell is /bin/bash, count them, list accounts with UID 0, and save the non-login (nologin) account names to /root/nologin-users.txt.","hints":["Use `cut -d: -f1` to keep only the user name field."],"steps":["grep 'bash$' /etc/passwd","grep -c '/bin/bash$' /etc/passwd","grep ':x:0:' /etc/passwd","grep nologin /etc/passwd | cut -d: -f1 > /root/nologin-users.txt"],"verify":["cat /root/nologin-users.txt"]},{"title":"Regular expressions on a log","scenario":"As root, find in /var/log/secure every failed password line, count them, and print only unique source IP addresses. (Create failures first by trying a wrong password with `ssh wronguser@localhost`.)","hints":[],"steps":["ssh wronguser@localhost      # type a wrong password a few times","grep 'Failed password' /var/log/secure","grep -c 'Failed password' /var/log/secure","grep -Eo 'from [0-9.]+' /var/log/secure | sort -u"],"verify":["grep -Eo '([0-9]{1,3}\\.){3}[0-9]{1,3}' /var/log/secure | sort | uniq -c"]}]},{"day":7,"course":"RH124","title":"Local users and groups","objective":"Create, delete and modify local user accounts and groups.","questions":[{"type":"mcq","q":"How many colon-separated fields does each line in /etc/passwd have?","options":["7","5","9","4"],"answer":0,"explain":"name:password:UID:GID:comment:home:shell. The password field is `x` because the hash is in /etc/shadow."},{"type":"mcq","q":"Where are the password hashes stored?","options":["/etc/shadow","/etc/passwd","/etc/login.defs","/etc/security/passwd"],"answer":0,"explain":"/etc/shadow is readable only by root. It also stores password-aging fields."},{"type":"mcq","q":"On RHEL, which UID does the first regular user account get by default?","options":["1000","500","100","0"],"answer":0,"explain":"UID 0 is root, 1-999 are system accounts. The range comes from /etc/login.defs."},{"type":"cmd","q":"Create a user named harry with UID 2000.","accept":["useradd -u 2000 harry"],"explain":"Check with `id harry`."},{"type":"cmd","q":"Add the existing user natasha to the supplementary group sysmgrs without removing her other groups.","accept":["usermod -aG sysmgrs natasha","usermod -a -G sysmgrs natasha","gpasswd -a natasha sysmgrs"],"explain":"Always use `-a` with `-G`, or the other supplementary groups are removed."},{"type":"mcq","q":"What happens if you run `usermod -G sysmgrs natasha` (without -a)?","options":["natasha's supplementary groups are replaced by only sysmgrs","sysmgrs becomes natasha's primary group","sysmgrs is added to her existing groups","The command fails"],"answer":0,"explain":"`-g` changes the primary group; `-G` sets the full supplementary list."},{"type":"cmd","q":"Create the user sarah with a shell that does not allow interactive login.","accept":["useradd -s /sbin/nologin sarah","useradd -s /usr/sbin/nologin sarah"],"explain":"`/sbin/nologin` and `/usr/sbin/nologin` are the same file on RHEL."},{"type":"cmd","q":"Create a group named sysmgrs with GID 3000.","accept":["groupadd -g 3000 sysmgrs"],"explain":"Verify with `getent group sysmgrs`."},{"type":"mcq","q":"Which command deletes the user harry together with his home directory and mail spool?","options":["userdel -r harry","userdel harry","deluser --all harry","usermod -D harry"],"answer":0,"explain":"Without `-r`, the home directory stays on disk, owned by a now-unused UID."},{"type":"mcq","q":"What does the \"user private group\" scheme mean on RHEL?","options":["Each new user gets a primary group with the same name as the user","Every user joins the users group","Users cannot belong to more than one group","Only root can create groups"],"answer":0,"explain":"That's why `useradd harry` also creates a group called harry."}],"labs":[{"title":"Exam-style user setup","scenario":"Create group sysmgrs. Create users natasha and harry with sysmgrs as a supplementary group. Create user sarah with a non-interactive shell who is not a member of sysmgrs. Set the password of all three to \"Rhcsa@2026\".","hints":[],"steps":["groupadd sysmgrs","useradd -G sysmgrs natasha","useradd -G sysmgrs harry","useradd -s /sbin/nologin sarah","for u in natasha harry sarah; do echo 'Rhcsa@2026' | passwd --stdin $u; done"],"verify":["id natasha; id harry; id sarah","grep sarah /etc/passwd"]},{"title":"Modify accounts","scenario":"Change harry's comment to \"Harry Potter\", move his home to /home/hpotter (moving the files too), lock sarah's account, then unlock it again. Finally rename group sysmgrs to sysadmins and back.","hints":[],"steps":["usermod -c \"Harry Potter\" harry","usermod -d /home/hpotter -m harry","usermod -L sarah","grep sarah /etc/shadow      # a ! appears before the hash","usermod -U sarah","groupmod -n sysadmins sysmgrs","groupmod -n sysmgrs sysadmins"],"verify":["getent passwd harry","ls -ld /home/hpotter"]}]},{"day":8,"course":"RH124","title":"Passwords, aging and sudo","objective":"Change passwords and adjust password aging; configure privileged access.","questions":[{"type":"mcq","q":"What does `chage -M 90 harry` set?","options":["harry must change his password at most every 90 days","harry must wait 90 days before changing his password","harry's account expires in 90 days","harry gets a warning 90 days before expiry"],"answer":0,"explain":"-M max days, -m min days, -W warning days, -I inactive days, -E account expiry date."},{"type":"cmd","q":"Force harry to change his password at his next login.","accept":["chage -d 0 harry","passwd -e harry","passwd --expire harry"],"explain":"Setting the last-change date to 0 means the password counts as already expired."},{"type":"cmd","q":"Make natasha's account expire on 2026-12-31.","accept":["chage -E 2026-12-31 natasha","usermod -e 2026-12-31 natasha"],"explain":"The account (not just the password) stops working after this date."},{"type":"mcq","q":"Which file sets the default password-aging values for users created in the future?","options":["/etc/login.defs","/etc/default/useradd","/etc/shadow","/etc/security/pwquality.conf"],"answer":0,"explain":"Look for PASS_MAX_DAYS, PASS_MIN_DAYS and PASS_WARN_AGE."},{"type":"mcq","q":"You edit PASS_MAX_DAYS in /etc/login.defs. Which accounts does it affect?","options":["Only accounts created after the change","All existing accounts immediately","Only the root account","All accounts after a reboot"],"answer":0,"explain":"For existing users, run `chage` on each one."},{"type":"cmd","q":"Show the password-aging information for harry.","accept":["chage -l harry"],"explain":"It shows last change, expiry, min, max and warning days in readable form."},{"type":"cmd","q":"Set sarah's password to Secret123 without an interactive prompt.","accept":["echo Secret123 | passwd --stdin sarah","echo 'Secret123' | passwd --stdin sarah","echo \"Secret123\" | passwd --stdin sarah"],"explain":"`--stdin` is a RHEL passwd option; it's handy in scripts and exam tasks."},{"type":"mcq","q":"What is the safe way to edit sudo rules?","options":["Use visudo, or put a file in /etc/sudoers.d/ and check it with visudo -c","Edit /etc/sudoers directly with nano","Add the user to /etc/sudo.conf","Run sudo --edit-rules"],"answer":0,"explain":"visudo checks the syntax before saving. A broken sudoers file can lock everyone out of sudo."},{"type":"mcq","q":"Which sudoers line lets members of sysmgrs run any command as root without a password?","options":["%sysmgrs ALL=(ALL) NOPASSWD: ALL","sysmgrs ALL=(ALL) NOPASSWD: ALL","%sysmgrs ALL=NOPASSWD","@sysmgrs ALL=(root) ALL"],"answer":0,"explain":"`%` marks a group. Without the `%`, sudo treats the name as a user."},{"type":"mcq","q":"On RHEL, members of which group get full sudo access by default?","options":["wheel","admin","sudo","root"],"answer":0,"explain":"/etc/sudoers contains `%wheel ALL=(ALL) ALL`. Add a user with `usermod -aG wheel user`."},{"type":"mcq","q":"What is the difference between `su harry` and `su - harry`?","options":["`su -` starts a login shell with harry's full environment and home directory","`su -` does not ask for a password","`su` without the dash only works for root","There is no difference"],"answer":0,"explain":"Prefer `su -` so PATH and variables match the target user."}],"labs":[{"title":"Password policy task","scenario":"Make passwords of all NEW users expire after 30 days. For the existing user harry, set maximum password age to 60 days with a 7-day warning, and force him to change his password at next login. Make natasha's account expire on 2026-12-31.","hints":[],"steps":["vim /etc/login.defs          # PASS_MAX_DAYS 30","chage -M 60 -W 7 harry","chage -d 0 harry","chage -E 2026-12-31 natasha"],"verify":["grep ^PASS_MAX_DAYS /etc/login.defs","chage -l harry; chage -l natasha","useradd testuser && chage -l testuser | grep Maximum"]},{"title":"Configure privileged access","scenario":"Members of sysmgrs must run all commands as root without a password. User alex may only run `systemctl` as root (with a password). Use files in /etc/sudoers.d and check the syntax.","hints":[],"steps":["echo '%sysmgrs ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/sysmgrs","useradd alex","echo 'alex ALL=(root) /usr/bin/systemctl' > /etc/sudoers.d/alex","visudo -c"],"verify":["su - natasha -c 'sudo -n id'      # should print uid=0 with no password prompt","sudo -l -U alex"]}]},{"day":9,"course":"RH124","title":"Standard permissions","objective":"List, set and change ugo/rwx permissions and ownership.","questions":[{"type":"mcq","q":"What is `rwxr-x---` in octal?","options":["750","755","740","570"],"answer":0,"explain":"r=4, w=2, x=1 per group of three: 7 (rwx), 5 (r-x), 0 (---)."},{"type":"mcq","q":"What does the x (execute) permission mean on a directory?","options":["You can enter the directory and reach files inside it","You can run every script inside it","You can list its contents","You can delete it"],"answer":0,"explain":"r on a directory lets you list names; x lets you enter or traverse; w lets you create and delete entries (it needs x too)."},{"type":"mcq","q":"What permission do you need to delete a file?","options":["Write and execute on the directory that contains it","Write on the file itself","Read and write on the file","Execute on the file"],"answer":0,"explain":"Deleting changes the directory, not the file. The sticky bit changes this rule."},{"type":"cmd","q":"Add write permission for the group on report.txt using symbolic mode.","accept":["chmod g+w report.txt"],"explain":"Symbolic mode: who (u g o a), operator (+ - =), permissions (r w x)."},{"type":"cmd","q":"Set script.sh to rwxr-xr-x using octal mode.","accept":["chmod 755 script.sh","chmod 0755 script.sh"],"explain":"7 = rwx, 5 = r-x."},{"type":"cmd","q":"Make harry the owner and sysmgrs the group of /data in one command.","accept":["chown harry:sysmgrs /data"],"explain":"`chown :group file` changes only the group, same as `chgrp`."},{"type":"cmd","q":"Change the group of /shared and everything inside it to sysmgrs.","accept":["chgrp -R sysmgrs /shared","chown -R :sysmgrs /shared"],"explain":"`-R` applies the change recursively."},{"type":"mcq","q":"Who can change which user owns a file?","options":["Only root","The file owner","Any member of the file's group","Anyone with write permission"],"answer":0,"explain":"A regular owner can change the group, but only to a group they belong to."},{"type":"mcq","q":"In `ls -l` output `-rw-r--r--.`, what does the trailing `.` mean?","options":["The file has an SELinux context and no ACL","The file is hidden","The file is a hard link","The file is immutable"],"answer":0,"explain":"A `+` in that spot means the file has an ACL. Check with `getfacl`."},{"type":"cmd","q":"Remove all permissions for \"others\" on secret.txt without touching owner and group permissions.","accept":["chmod o= secret.txt","chmod o-rwx secret.txt"],"explain":"`=` with nothing after it sets that class to no permissions."}],"labs":[{"title":"Permissions workout","scenario":"Create /srv/project owned by harry and group sysmgrs. Owner: full access. Group: read and enter only. Others: nothing. Inside, create plan.txt readable and writable only by the owner. Test access as natasha and sarah.","hints":[],"steps":["mkdir /srv/project","chown harry:sysmgrs /srv/project","chmod 750 /srv/project","touch /srv/project/plan.txt && chown harry:sysmgrs /srv/project/plan.txt","chmod 600 /srv/project/plan.txt"],"verify":["ls -ld /srv/project; ls -l /srv/project","su - natasha -c 'ls /srv/project'   # works (group member)","su - harry -c 'cat /srv/project/plan.txt'"]},{"title":"Fix a script that will not run","scenario":"Create /usr/local/bin/hello.sh containing `echo Hello $USER`. Run it and read the error. Fix the permissions so every user can run it but only root can edit it.","hints":[],"steps":["echo 'echo Hello $USER' > /usr/local/bin/hello.sh","hello.sh             # Permission denied","chmod 755 /usr/local/bin/hello.sh"],"verify":["ls -l /usr/local/bin/hello.sh","su - harry -c hello.sh"]}]},{"day":10,"course":"RH124","title":"Special permissions, umask and ACLs","objective":"Manage default file permissions and diagnose and correct file permission problems.","questions":[{"type":"mcq","q":"What does the SGID bit do on a directory?","options":["New files created in it get the directory's group","Only the group owner may delete files in it","Files inside it run with group privileges","Group members get write access automatically"],"answer":0,"explain":"This is how you build shared team directories."},{"type":"mcq","q":"What does the sticky bit do on a directory such as /tmp?","options":["Users can only delete their own files, even with write permission on the directory","Files are never deleted at reboot","New files inherit the directory's owner","Only root can create files"],"answer":0,"explain":"/tmp shows `drwxrwxrwt`. In octal the sticky bit is 1, e.g. `chmod 1777`."},{"type":"cmd","q":"Set the SGID bit on /home/managers using symbolic mode.","accept":["chmod g+s /home/managers"],"explain":"Octal version: `chmod 2770 /home/managers` (2 = SGID, 4 = SUID, 1 = sticky)."},{"type":"mcq","q":"With umask 027, what permissions does a newly created regular file get?","options":["640 (rw-r-----)","750 (rwxr-x---)","027 (----w-rwx)","600 (rw-------)"],"answer":0,"explain":"Files start from 666, directories from 777, then the umask bits are removed: 666-027 = 640, 777-027 = 750."},{"type":"cmd","q":"Set the umask of your current shell so new files are 600 and new directories 700.","accept":["umask 077","umask 0077"],"explain":"Run `umask` with no argument to see the current value."},{"type":"mcq","q":"How do you make a user's umask survive logout and reboot?","options":["Put the umask command in that user's ~/.bashrc or ~/.bash_profile","Run umask as root","Add it to /etc/fstab","Set it with chmod on the home directory"],"answer":0,"explain":"For every user, use a script in /etc/profile.d/ instead."},{"type":"cmd","q":"Give user natasha read and write access to /var/tmp/fstab using an ACL.","accept":["setfacl -m u:natasha:rw /var/tmp/fstab","setfacl -m u:natasha:rw- /var/tmp/fstab","setfacl -m user:natasha:rw /var/tmp/fstab"],"explain":"View the result with `getfacl /var/tmp/fstab`."},{"type":"cmd","q":"Use an ACL so that user harry has no access at all to /var/tmp/fstab.","accept":["setfacl -m u:harry:--- /var/tmp/fstab","setfacl -m u:harry:- /var/tmp/fstab","setfacl -m u:harry:0 /var/tmp/fstab","setfacl -m user:harry:--- /var/tmp/fstab"],"explain":"A named-user ACL entry takes priority over the \"other\" permissions."},{"type":"mcq","q":"`ls -l /usr/bin/passwd` shows `-rwsr-xr-x`. What does the `s` mean?","options":["SUID: the program runs with the privileges of its owner (root)","The file is a socket","The file is sticky","The file is signed"],"answer":0,"explain":"This is how normal users can update /etc/shadow through passwd. A capital `S` means SUID is set but execute is not."},{"type":"mcq","q":"A user cannot open /data/reports/q1.txt even though the file is mode 644. What is the most likely cause?","options":["A parent directory is missing the x permission for that user","The file needs mode 777","The user needs to be in the wheel group","The file needs the sticky bit"],"answer":0,"explain":"Check every directory on the path, e.g. `namei -l /data/reports/q1.txt`. Also check ACLs and SELinux."}],"labs":[{"title":"Collaborative directory (exam classic)","scenario":"Create /home/managers. Group owner: sysmgrs. Members of sysmgrs get read, write and access; others get no access. Files created inside must automatically belong to sysmgrs.","hints":[],"steps":["mkdir /home/managers","chgrp sysmgrs /home/managers","chmod 2770 /home/managers"],"verify":["ls -ld /home/managers        # drwxrws---. root sysmgrs","su - natasha -c 'touch /home/managers/test && ls -l /home/managers'"]},{"title":"File ACLs (exam classic)","scenario":"Copy /etc/fstab to /var/tmp/fstab. Owner root, group root, not executable by anyone. natasha can read and write, harry has no access, everyone else can read.","hints":[],"steps":["cp /etc/fstab /var/tmp/fstab","chown root:root /var/tmp/fstab","chmod 644 /var/tmp/fstab","setfacl -m u:natasha:rw /var/tmp/fstab","setfacl -m u:harry:--- /var/tmp/fstab"],"verify":["getfacl /var/tmp/fstab","su - harry -c 'cat /var/tmp/fstab'     # Permission denied"]}]},{"day":11,"course":"RH124","title":"Processes and signals","objective":"Identify CPU and memory intensive processes and kill processes; manage jobs.","questions":[{"type":"mcq","q":"Which signal does `kill PID` send when you give no signal?","options":["SIGTERM (15)","SIGKILL (9)","SIGHUP (1)","SIGINT (2)"],"answer":0,"explain":"SIGTERM asks the program to exit cleanly. Use `kill -9` only when it refuses."},{"type":"mcq","q":"Which signal can a process NOT catch or ignore?","options":["SIGKILL (9)","SIGTERM (15)","SIGHUP (1)","SIGINT (2)"],"answer":0,"explain":"SIGKILL and SIGSTOP are handled by the kernel directly."},{"type":"cmd","q":"List all processes sorted by CPU usage, highest first.","accept":["ps aux --sort=-%cpu","ps aux --sort -%cpu","ps -eo pid,user,%cpu,cmd --sort=-%cpu"],"explain":"Use `--sort=-%mem` to sort by memory instead."},{"type":"cmd","q":"Kill every process owned by user harry.","accept":["pkill -u harry","killall -u harry","pkill -U harry"],"explain":"`pgrep -u harry` lists the PIDs first so you can see what will be killed."},{"type":"mcq","q":"In top, which key sorts processes by memory usage?","options":["M","P","k","m"],"answer":0,"explain":"P sorts by CPU, M by memory, k kills a PID, r renices, q quits."},{"type":"cmd","q":"Start `sleep 1000` as a background job.","accept":["sleep 1000 &"],"explain":"The shell prints the job number and PID. `jobs` lists background jobs."},{"type":"mcq","q":"What does Ctrl+Z do to the program running in the foreground?","options":["Stops (suspends) it; `bg` resumes it in the background","Kills it with SIGKILL","Moves it to the background while it keeps running","Logs you out"],"answer":0,"explain":"Ctrl+C sends SIGINT to end it. Ctrl+Z sends SIGTSTP to pause it."},{"type":"cmd","q":"Bring job number 1 back to the foreground.","accept":["fg %1","fg 1"],"explain":"`bg %1` resumes it in the background instead. `kill %1` sends it SIGTERM."},{"type":"mcq","q":"A process shows state `D` in ps. What does that mean?","options":["Uninterruptible sleep, usually waiting for disk or network I/O","It is a zombie","It is stopped","It is running on a CPU"],"answer":0,"explain":"R running, S sleeping, T stopped, Z zombie, D uninterruptible sleep."}],"labs":[{"title":"Find and stop CPU hogs","scenario":"Start three CPU-heavy processes with `sha1sum /dev/zero &`. Find them with ps sorted by CPU and with top. Kill one by PID with SIGTERM, and kill the other two by name.","hints":[],"steps":["for i in 1 2 3; do sha1sum /dev/zero & done","ps aux --sort=-%cpu | head -5","top          # press P, note a PID, press q","kill <PID>","pkill sha1sum"],"verify":["pgrep -l sha1sum || echo \"all gone\""]},{"title":"Find the biggest memory users","scenario":"Save the 5 processes using the most memory (with PID, user, %MEM and command) to /root/topmem.txt.","hints":[],"steps":["ps -eo pid,user,%mem,cmd --sort=-%mem | head -6 > /root/topmem.txt"],"verify":["cat /root/topmem.txt"]},{"title":"Job control drill","scenario":"Start `sleep 500` and `sleep 600` in the background and `sleep 700` in the foreground. Suspend the foreground job, resume it in the background, bring job 2 to the foreground and end it with Ctrl+C, then kill the rest by job number.","hints":[],"steps":["sleep 500 &","sleep 600 &","sleep 700          # then press Ctrl+Z","jobs","bg %3","fg %2             # then press Ctrl+C","kill %1 %3"],"verify":["jobs"]},{"title":"Pause and resume a process with signals","scenario":"As harry, start `sleep 900`. As root, stop it with SIGSTOP, confirm the state is T, resume it with SIGCONT, then kill it with SIGKILL.","hints":[],"steps":["su - harry -c 'sleep 900 &'","pgrep -u harry sleep","kill -SIGSTOP <PID>","ps -o pid,stat,cmd -p <PID>      # STAT shows T","kill -SIGCONT <PID>","kill -9 <PID>"],"verify":["pgrep -u harry sleep || echo stopped"]}]},{"day":12,"course":"RH124","title":"Controlling services with systemd","objective":"Start, stop and check services; configure automatic startup.","questions":[{"type":"cmd","q":"Start httpd now and also enable it at boot, in one command.","accept":["systemctl enable --now httpd","systemctl enable --now httpd.service","systemctl enable httpd --now"],"explain":"`enable` alone only affects the next boot. `--now` also starts it."},{"type":"mcq","q":"What does `systemctl mask atd` do?","options":["Links the unit to /dev/null so it cannot be started at all, even manually","Hides it from `systemctl list-units`","Disables it at boot but still allows manual start","Stops it and deletes its unit file"],"answer":0,"explain":"Undo with `systemctl unmask atd`."},{"type":"cmd","q":"Check whether sshd is enabled to start at boot.","accept":["systemctl is-enabled sshd","systemctl is-enabled sshd.service"],"explain":"`systemctl is-active sshd` tells you whether it's running now."},{"type":"cmd","q":"List all units that are in a failed state.","accept":["systemctl --failed","systemctl list-units --state=failed","systemctl list-units --failed"],"explain":"Then run `systemctl status <unit>` and `journalctl -u <unit>` for details."},{"type":"mcq","q":"What is the difference between `systemctl reload` and `systemctl restart`?","options":["reload tells the service to re-read its config without stopping; restart stops and starts it","reload also enables the service at boot","restart only works if reload fails","There is no difference"],"answer":0,"explain":"Not every service supports reload; `systemctl reload-or-restart` covers both cases."},{"type":"mcq","q":"You create or edit a unit file under /etc/systemd/system. What must you run next?","options":["systemctl daemon-reload","systemctl reboot","systemctl reset-failed","systemctl rescan"],"answer":0,"explain":"systemd caches unit files. daemon-reload makes it read them again."},{"type":"mcq","q":"Where should administrators put their own unit files and overrides?","options":["/etc/systemd/system","/usr/lib/systemd/system","/run/systemd/system","/var/lib/systemd"],"answer":0,"explain":"Package units live in /usr/lib/systemd/system. Files in /etc take priority. `systemctl edit unit` creates a drop-in override for you."},{"type":"cmd","q":"Stop the atd service and stop it starting at boot, in one command.","accept":["systemctl disable --now atd","systemctl disable --now atd.service","systemctl disable atd --now"],"explain":"Confirm with `systemctl status atd`."},{"type":"mcq","q":"`systemctl status sshd` shows \"Loaded: ... enabled; preset: enabled\" and \"Active: active (running)\". What does that mean?","options":["sshd is running now and will start at boot","sshd is running but will not start at boot","sshd starts at boot but is not running now","sshd is masked"],"answer":0,"explain":"\"enabled\" is the boot setting, \"active\" is the current state. They are separate."}],"labs":[{"title":"Install and run a web server","scenario":"Install httpd, start it and enable it at boot, allow HTTP through the firewall, put \"Hello RHCSA\" in /var/www/html/index.html and fetch it with curl.","hints":[],"steps":["dnf install -y httpd","systemctl enable --now httpd","firewall-cmd --permanent --add-service=http && firewall-cmd --reload","echo \"Hello RHCSA\" > /var/www/html/index.html"],"verify":["curl http://localhost","systemctl is-enabled httpd; systemctl is-active httpd"]},{"title":"Mask and unmask a service","scenario":"Mask atd, try to start it and read the error, then unmask it and make sure it is running and enabled.","hints":[],"steps":["systemctl mask atd","systemctl start atd       # Unit atd.service is masked.","systemctl unmask atd","systemctl enable --now atd"],"verify":["systemctl status atd --no-pager"]},{"title":"Explore units","scenario":"List all installed service unit files and their boot state, show what multi-user.target pulls in, and print the unit file of sshd.","hints":[],"steps":["systemctl list-unit-files --type=service","systemctl list-dependencies multi-user.target","systemctl cat sshd"],"verify":["systemctl list-units --type=service --state=running"]},{"title":"Write your own service","scenario":"Create /usr/local/bin/heartbeat.sh that writes \"alive\" to the journal every 30 seconds in a loop. Create heartbeat.service to run it, enable it at boot, and read its messages in the journal.","hints":[],"steps":["printf '#!/bin/bash\\nwhile true; do echo alive; sleep 30; done\\n' > /usr/local/bin/heartbeat.sh","chmod 755 /usr/local/bin/heartbeat.sh","vim /etc/systemd/system/heartbeat.service","# [Unit]","# Description=Heartbeat demo","# [Service]","# ExecStart=/usr/local/bin/heartbeat.sh","# [Install]","# WantedBy=multi-user.target","systemctl daemon-reload","systemctl enable --now heartbeat"],"verify":["journalctl -u heartbeat -n 5"]}]},{"day":13,"course":"RH124","title":"Configure and secure SSH","objective":"Access remote systems using SSH and configure key-based authentication.","questions":[{"type":"cmd","q":"Generate a new SSH key pair with the default settings.","accept":["ssh-keygen","ssh-keygen -t ed25519","ssh-keygen -t rsa"],"explain":"Keys are saved in ~/.ssh/. The .pub file is the public key you share."},{"type":"cmd","q":"Copy your public key to the account harry on host servera.","accept":["ssh-copy-id harry@servera"],"explain":"It appends your key to ~harry/.ssh/authorized_keys and sets safe permissions."},{"type":"mcq","q":"On the server, which file lists the public keys allowed to log in to an account?","options":["~/.ssh/authorized_keys","~/.ssh/known_hosts","/etc/ssh/ssh_known_hosts","~/.ssh/id_rsa"],"answer":0,"explain":"known_hosts on the client stores the server fingerprints you have accepted."},{"type":"mcq","q":"Which permissions does sshd expect on ~/.ssh and ~/.ssh/authorized_keys?","options":["700 on the directory and 600 on the file","755 and 644","777 and 666","750 and 640"],"answer":0,"explain":"If they are too open, sshd ignores the key (StrictModes) and falls back to a password."},{"type":"mcq","q":"How do you stop root from logging in over SSH?","options":["Set `PermitRootLogin no` in the sshd config, then reload sshd","Remove root from /etc/passwd","Set root's shell to nologin in /etc/ssh/ssh_config","Delete /root/.ssh"],"answer":0,"explain":"On RHEL 9 and 10 you can put the setting in a file under /etc/ssh/sshd_config.d/. /etc/ssh/ssh_config is the client config, not the server."},{"type":"cmd","q":"Check the sshd configuration for syntax errors before reloading.","accept":["sshd -t","/usr/sbin/sshd -t"],"explain":"No output means the syntax is valid. Then run `systemctl reload sshd`."},{"type":"cmd","q":"Run `hostname` on servera as student without opening an interactive shell.","accept":["ssh student@servera hostname","ssh student@servera 'hostname'"],"explain":"The command runs remotely and the output comes back to your terminal."},{"type":"mcq","q":"What is OpenSSH's built-in default for PermitRootLogin, which RHEL 9 and 10 use?","options":["prohibit-password: root can log in with a key but not with a password","yes","no","without-root"],"answer":0,"explain":"Exam tasks often need root password login between exam nodes, or a key. Read the task carefully."},{"type":"mcq","q":"Where are the SSH server's own host keys stored?","options":["/etc/ssh/ssh_host_*_key","~/.ssh/host_keys","/var/lib/sshd/keys","/etc/pki/ssh"],"answer":0,"explain":"If a host is reinstalled, its host key changes and clients warn you. Remove the old line with `ssh-keygen -R host`."}],"labs":[{"title":"Key-based login between two machines","scenario":"On node1 as student, generate a key pair and set up key-based login to student@node2. Confirm you can run a command on node2 with no password prompt.","hints":[],"steps":["ssh-keygen                 # press Enter for defaults","ssh-copy-id student@node2","ssh student@node2 hostname"],"verify":["ssh -o PasswordAuthentication=no student@node2 true && echo KEY-OK"]},{"title":"Harden the SSH server","scenario":"On node2: stop root logging in over SSH and stop password logins for everyone. Make sure your key login works BEFORE you reload sshd, then test both.","hints":["Settings in /etc/ssh/sshd_config.d/*.conf are read first, so the first value set wins."],"steps":["vim /etc/ssh/sshd_config.d/50-hardening.conf","# PermitRootLogin no","# PasswordAuthentication no","sshd -t && systemctl reload sshd"],"verify":["ssh root@node2              # Permission denied","ssh student@node2 true && echo still-ok"]},{"title":"Remote commands and quick copies","scenario":"From node1, save the output of `df -h` on node2 to /root/node2-disk.txt on node1, and copy node2's /etc/os-release into /tmp on node1 in one command each.","hints":[],"steps":["ssh root@node2 'df -h' > /root/node2-disk.txt","scp root@node2:/etc/os-release /tmp/"],"verify":["cat /root/node2-disk.txt; cat /tmp/os-release"]},{"title":"Use ssh-agent with a passphrase","scenario":"Create a second key ~/.ssh/lab_key with a passphrase, install it on node2, and load it into ssh-agent so you type the passphrase only once.","hints":[],"steps":["ssh-keygen -f ~/.ssh/lab_key","ssh-copy-id -i ~/.ssh/lab_key.pub student@node2","eval $(ssh-agent)","ssh-add ~/.ssh/lab_key","ssh -i ~/.ssh/lab_key student@node2 hostname"],"verify":["ssh-add -l"]}]},{"day":14,"course":"RH124","title":"System logs and the journal","objective":"Locate and interpret system log files and journals; preserve system journals.","questions":[{"type":"cmd","q":"Show journal entries for the sshd service only.","accept":["journalctl -u sshd","journalctl -u sshd.service"],"explain":"Add `-f` to follow, `-n 20` for the last 20 lines, `--since today` to limit time."},{"type":"cmd","q":"Show only messages of priority err or worse from the current boot.","accept":["journalctl -p err -b","journalctl -b -p err","journalctl -p 3 -b","journalctl -b -p 3"],"explain":"`-p` includes that level and everything more severe."},{"type":"cmd","q":"Show journal messages from the last hour.","accept":["journalctl --since \"1 hour ago\"","journalctl --since '1 hour ago'","journalctl --since -1h"],"explain":"You can also give dates: `--since \"2026-10-01 09:00\" --until \"2026-10-01 10:00\"`."},{"type":"mcq","q":"Which journald setting keeps the journal across reboots?","options":["Storage=persistent in /etc/systemd/journald.conf, then restart systemd-journald","Persistent=yes in /etc/rsyslog.conf","SystemMaxUse=0 in journald.conf","Enable the journal-persist service"],"answer":0,"explain":"With the default Storage=auto, the journal is only kept if /var/log/journal exists. Otherwise it stays in /run/log/journal and is lost at reboot."},{"type":"mcq","q":"Which file holds authentication and security messages on RHEL?","options":["/var/log/secure","/var/log/auth.log","/var/log/messages","/var/log/audit.log"],"answer":0,"explain":"/var/log/auth.log is the Debian and Ubuntu name. SELinux denials go to /var/log/audit/audit.log."},{"type":"cmd","q":"Send the test message \"hello from logger\" to syslog with priority user.notice.","accept":["logger -p user.notice \"hello from logger\"","logger -p user.notice 'hello from logger'","logger -p user.notice hello from logger"],"explain":"Check it with `tail /var/log/messages` or `journalctl -n 5`."},{"type":"mcq","q":"What does the rsyslog rule `authpriv.*  /var/log/secure` mean?","options":["Messages of every priority from the authpriv facility go to /var/log/secure","Only authpriv errors go to /var/log/secure","Everything except authpriv goes to /var/log/secure","/var/log/secure is private"],"answer":0,"explain":"Rule format: facility.priority followed by the target. Drop-in rules go in /etc/rsyslog.d/*.conf."},{"type":"mcq","q":"Which list orders syslog priorities from most to least severe?","options":["emerg, alert, crit, err, warning, notice, info, debug","debug, info, notice, warning, err, crit, alert, emerg","crit, emerg, alert, err, warning, info, notice, debug","err, warning, info, debug, notice, crit, alert, emerg"],"answer":0,"explain":"Numbers 0 to 7 in that same order."},{"type":"cmd","q":"List every boot the journal has records for.","accept":["journalctl --list-boots"],"explain":"Only the current boot is listed unless the journal is persistent. `journalctl -b -1` shows the previous boot."}],"labs":[{"title":"Preserve the journal (exam objective)","scenario":"Configure the journal so it survives reboots. Reboot, then prove that the previous boot's messages are still there.","hints":[],"steps":["vim /etc/systemd/journald.conf        # under [Journal]: Storage=persistent","systemctl restart systemd-journald","ls /var/log/journal/","systemctl reboot"],"verify":["journalctl --list-boots      # two or more boots listed","journalctl -b -1 -n 5"]},{"title":"Custom rsyslog rule","scenario":"Send messages of every facility at priority debug and above to a new file /var/log/messages-debug. Test it with logger.","hints":[],"steps":["echo '*.debug  /var/log/messages-debug' > /etc/rsyslog.d/debug.conf","systemctl restart rsyslog","logger -p user.debug \"Debug test from RHCSA practice\""],"verify":["tail -n 3 /var/log/messages-debug"]},{"title":"Investigate failed logins","scenario":"Make a few failed SSH logins to localhost, then use journalctl to show today's failed sshd attempts and count them.","hints":[],"steps":["ssh wronguser@localhost          # enter wrong passwords","journalctl -u sshd --since today | grep -i fail","journalctl -u sshd --since today | grep -ci 'failed password'"],"verify":["journalctl -u sshd -n 20 --no-pager"]},{"title":"Filter the journal by fields","scenario":"Show journal entries for UID 1000 only, then only entries from the sshd command, then one entry in full verbose form.","hints":[],"steps":["journalctl _UID=1000","journalctl _COMM=sshd","journalctl -n 1 -o verbose"],"verify":["journalctl _SYSTEMD_UNIT=sshd.service -n 3"]}]},{"day":15,"course":"RH124","title":"Time synchronization","objective":"Configure time service clients and time zones.","questions":[{"type":"cmd","q":"Show the current time, time zone and whether NTP sync is active.","accept":["timedatectl","timedatectl status"],"explain":"Look for \"System clock synchronized: yes\" and \"NTP service: active\"."},{"type":"cmd","q":"Set the system time zone to Asia/Kolkata.","accept":["timedatectl set-timezone Asia/Kolkata"],"explain":"This updates the /etc/localtime symlink."},{"type":"cmd","q":"List the available time zones that contain \"Asia\".","accept":["timedatectl list-timezones | grep Asia","timedatectl list-timezones | grep -i asia"],"explain":"`tzselect` asks you questions and suggests a zone name."},{"type":"mcq","q":"Which file configures the chrony NTP client on RHEL?","options":["/etc/chrony.conf","/etc/ntp.conf","/etc/chrony/chrony.conf","/etc/systemd/timesyncd.conf"],"answer":0,"explain":"RHEL uses chronyd. ntpd and timesyncd are not the RHEL defaults."},{"type":"mcq","q":"Which chrony.conf line syncs from classroom.example.com and speeds up the first sync?","options":["server classroom.example.com iburst","ntp classroom.example.com fast","pool classroom.example.com quick","sync classroom.example.com iburst"],"answer":0,"explain":"Use `server` for one host and `pool` for a pool name that resolves to many hosts."},{"type":"cmd","q":"Apply your chrony.conf changes.","accept":["systemctl restart chronyd","systemctl restart chronyd.service"],"explain":"Also make sure it starts at boot: `systemctl enable chronyd`."},{"type":"cmd","q":"Show the time sources chrony is using.","accept":["chronyc sources","chronyc sources -v"],"explain":"`-v` adds a legend that explains each column."},{"type":"mcq","q":"In `chronyc sources` output, what does `^*` before a server mean?","options":["It is the source chrony is currently synchronized to","The server cannot be reached","The server is too far off and was rejected","The server is a local reference clock"],"answer":0,"explain":"`^?` means not reachable yet. Wait a minute after a restart."},{"type":"mcq","q":"What does `timedatectl set-ntp true` do on RHEL?","options":["Enables and starts chronyd so the clock is synced over the network","Installs the NTP package","Syncs the time once and exits","Switches the time zone to UTC"],"answer":0,"explain":"`set-ntp false` stops and disables chronyd."}],"labs":[{"title":"Configure an NTP client (exam classic)","scenario":"Make node1 an NTP client of node2 (or of classroom.example.com in class). Remove the default pool line and confirm node1 syncs to it.","hints":[],"steps":["vim /etc/chrony.conf","# comment out:  pool 2.rhel.pool.ntp.org iburst","# add:          server node2 iburst","systemctl enable chronyd","systemctl restart chronyd"],"verify":["chronyc sources -v","timedatectl | grep synchronized"]},{"title":"Turn node2 into an NTP server","scenario":"Let node2 answer NTP requests from your lab subnet and open the firewall for it, so node1's client task has a server.","hints":[],"steps":["vim /etc/chrony.conf     # add: allow 192.168.122.0/24   (use your subnet)","# add: local stratum 10  (serve time even without internet)","systemctl restart chronyd","firewall-cmd --permanent --add-service=ntp && firewall-cmd --reload"],"verify":["chronyc clients      # run after node1 has synced"]},{"title":"Time zones and manual time","scenario":"Set the time zone to America/New_York, turn off NTP, set the clock to 2026-12-25 10:00:00, look at the result, then set the zone back to Asia/Kolkata and turn NTP on again.","hints":[],"steps":["timedatectl set-timezone America/New_York","timedatectl set-ntp false","timedatectl set-time \"2026-12-25 10:00:00\"","timedatectl","timedatectl set-timezone Asia/Kolkata","timedatectl set-ntp true"],"verify":["timedatectl"]}]},{"day":16,"course":"RH124","title":"Networking: IPv4 and hostname","objective":"Configure IPv4 addresses, hostname and hostname resolution with NetworkManager.","questions":[{"type":"cmd","q":"Show all connection profiles that NetworkManager knows about.","accept":["nmcli con show","nmcli connection show","nmcli c show","nmcli c s"],"explain":"`nmcli dev status` shows the devices and which profile each one uses."},{"type":"cmd","q":"Show the IP addresses on all interfaces.","accept":["ip a","ip addr","ip address","ip addr show","ip -br addr","ip -br a"],"explain":"`ip -br a` gives one short line per interface."},{"type":"mcq","q":"Where does NetworkManager on RHEL 9 and 10 store connection profiles?","options":["/etc/NetworkManager/system-connections/ as .nmconnection keyfiles","/etc/sysconfig/network-scripts/ifcfg-*","/etc/network/interfaces","/etc/netplan/*.yaml"],"answer":0,"explain":"ifcfg files are the old RHEL 8 format. After editing a keyfile by hand, run `nmcli con reload`."},{"type":"cmd","q":"On connection \"eth0\", set the static address 192.168.100.10/24 with gateway 192.168.100.1 and manual method.","accept":["nmcli con mod eth0 ipv4.addresses 192.168.100.10/24 ipv4.gateway 192.168.100.1 ipv4.method manual","nmcli connection modify eth0 ipv4.addresses 192.168.100.10/24 ipv4.gateway 192.168.100.1 ipv4.method manual","nmcli con mod eth0 ipv4.method manual ipv4.addresses 192.168.100.10/24 ipv4.gateway 192.168.100.1"],"explain":"Without `ipv4.method manual`, the profile may keep using DHCP."},{"type":"mcq","q":"When do settings changed with `nmcli con mod` take effect?","options":["When the connection is activated again, e.g. `nmcli con up eth0`","Immediately","Only after a reboot","After `systemctl restart sshd`"],"answer":0,"explain":"If you work over SSH and change the IP, your session drops. Use the console."},{"type":"cmd","q":"Set the hostname permanently to node1.lab.example.com.","accept":["hostnamectl set-hostname node1.lab.example.com","hostnamectl hostname node1.lab.example.com"],"explain":"This writes /etc/hostname. Check it with `hostnamectl` or `hostname`."},{"type":"mcq","q":"Which file maps host names to IP addresses locally, before DNS is asked?","options":["/etc/hosts","/etc/resolv.conf","/etc/hostname","/etc/networks"],"answer":0,"explain":"The lookup order is set by the `hosts:` line in /etc/nsswitch.conf."},{"type":"cmd","q":"Set DNS server 192.168.100.1 on connection eth0.","accept":["nmcli con mod eth0 ipv4.dns 192.168.100.1","nmcli connection modify eth0 ipv4.dns 192.168.100.1"],"explain":"NetworkManager then writes it to /etc/resolv.conf. Don't edit resolv.conf by hand."},{"type":"mcq","q":"Which command lists listening TCP and UDP ports with the process using each one?","options":["ss -tulpn","netstat -r","ip route","nmcli dev show"],"answer":0,"explain":"t = TCP, u = UDP, l = listening, p = process, n = numeric ports."}],"labs":[{"title":"Static IPv4 network (exam classic)","scenario":"On node1, configure the existing connection with IP 192.168.122.11/24, gateway 192.168.122.1 and DNS 192.168.122.1 (adjust to your lab subnet). Set the hostname to node1.lab.example.com. It must all survive a reboot.","hints":[],"steps":["nmcli con show","nmcli con mod \"<profile>\" ipv4.addresses 192.168.122.11/24 ipv4.gateway 192.168.122.1 ipv4.dns 192.168.122.1 ipv4.method manual connection.autoconnect yes","nmcli con up \"<profile>\"","hostnamectl set-hostname node1.lab.example.com"],"verify":["ip -br a; ip route; cat /etc/resolv.conf","reboot, then check again"]},{"title":"Create a new connection profile","scenario":"Create a profile \"static-lab\" for your interface with a static address, and keep the DHCP profile too. Switch between them and check the address each time.","hints":[],"steps":["nmcli con add con-name static-lab type ethernet ifname <dev> ipv4.addresses 192.168.122.50/24 ipv4.gateway 192.168.122.1 ipv4.dns 192.168.122.1 ipv4.method manual","nmcli con up static-lab","ip -br a","nmcli con up \"<dhcp-profile>\""],"verify":["nmcli con show --active"]},{"title":"Add a second IP address","scenario":"Add 10.0.0.11/24 as an extra address to your main profile without
